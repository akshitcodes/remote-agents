    if (accepted?.dispatch?.accepted && state.active === target) {
      const stillShowingDispatch = state.model === dispatch.model
        && state.effort === dispatch.effort
        && currentMode().key === dispatch.mode;
      if (stillShowingDispatch) {
        state.settingsTruth = {
          state: "accepted",
          sources: { model: "provider_accept", effort: "provider_accept", mode: "provider_accept" },
          message: "Requested settings accepted by provider",
        };
      } else {
        // The user changed the controls while the request was in flight. Keep
        // those newer values as a pending next-turn override after the server
        // marks the dispatched snapshot accepted.
        state.settingsTruth = { state: "override", sources: {}, message: "Current turn accepted · next override saved" };
        saveThreadSettings().catch((error) => chip("⚠️", "Could not save next-turn settings: " + error.message));
      }
      syncControls();
    }
    finishSendProgress();
    dropFailedSend(id);
    if (!state.providerAcceptedRequests.has(acceptanceKey)) { advanceThreadUserProgress(); }
    if (pendingEntry) {
      const at = state.pending.indexOf(pendingEntry);

      if (at >= 0) { state.pending.splice(at, 1); savePending(); }

      pendingEntry.chip?.remove();
    }
  } catch (e) {
    setBusy(false);

    // The provider's request-correlated turn_started event is authoritative.
    // If the HTTP response is subsequently lost, do not repaint an accepted
    // message as uncertain or offer an unsafe duplicate retry.
    if (state.providerAcceptedRequests.has(acceptanceKey)) {
      finishSendProgress();
      dropFailedSend(id);
      markSendFailed(bubble, null);
      if (pendingEntry) {
        const at = state.pending.indexOf(pendingEntry);
        if (at >= 0) { state.pending.splice(at, 1); savePending(); }
        pendingEntry.chip?.remove();
      }
      setBusy(true, { external: false });
      return;
    }

    failSendProgress(e);

    if (["model_unavailable", "effort_unavailable", "permission_mode_unavailable", "model_not_available", "effort_not_supported", "permission_mode_mismatch", "model_verification_failed", "provider_cli_incompatible", "provider_settings_unconfirmed"].includes(e.code)) {
      if (state.active === target) {
        state.settingsTruth = { state: "error", sources: {}, message: "Settings changed · refreshing…" };
        syncControls();
        // Refresh the controls from provider truth, but leave the failed message
        // visible for an explicit Retry/Cancel decision. Recovery must never
        // silently turn a rejected send into a later delivery.
        await loadThreadSettings(target, { flush: false });
      }
    }

    const deliveryMayBeAmbiguous = messageAttempted
      && (e.code === "delivery_uncertain" || !!e.reach || !!e.responseInvalid || !e.status || e.status >= 500);
    const retryId = deliveryMayBeAmbiguous ? null : id;
    const retry = () => {
      if (!retryId) {
        if (pendingEntry) {
          pendingEntry.retryWithNewId = false;
          pendingEntry.mayHaveDispatched = true;
          savePending();
          return checkPendingDelivery(pendingEntry);
        }

        const failed = state.failedSends.find((entry) => entry.requestId === id)
          ?? { provider: dispatch.provider, threadId, text, requestId: id, attachments, retryWithNewId: true };
        return checkStandaloneDelivery(failed, bubble);
      }

      if (pendingEntry) {
        pendingEntry.retryRequired = false;
        pendingEntry.mayHaveDispatched = false;
        savePending();
      }
      doSend(text, { attachments, bubble, requestId: retryId, pendingEntry });
    };

    if ((e.code === "thread_locked_elsewhere" || e.code === "turn_in_progress") && !pendingEntry) {
      const elsewhere = e.code === "thread_locked_elsewhere";
      const c = chip("⏳", elsewhere ? "Open elsewhere — queued until the thread is available" : "Another send won the race — queued behind the current turn");
      c.classList.add("pending");
      const queued = { text, attachments, requestId: id, bubble, chip: c, retryRequired: elsewhere };
      dropFailedSend(id);
      state.pending.push(queued);
      savePending();
      syncPendingActions(queued);
      if (elsewhere) {
        markSendFailed(bubble, () => doSend(text, { attachments, bubble, requestId: id, pendingEntry: queued }), {
          onDismiss: () => removePendingEntry(queued),
        });
        setLockStatus({ state: "elsewhere", label: "Open elsewhere" });
      } else {
        markSendFailed(bubble, null);
        setBusy(true, { external: true });
      }
    } else if (pendingEntry) {
      const label = pendingEntry.chip?.querySelector("span");

      if (e.code === "turn_in_progress") {
        pendingEntry.dispatching = false;
        pendingEntry.mayHaveDispatched = false;
        savePending();
        syncPendingActions(pendingEntry);
        if (label) { label.textContent = "Still working — queued behind the current turn"; }
        markSendFailed(bubble, null);
        setBusy(true, { external: true });
      } else {
        pendingEntry.dispatching = false;
        pendingEntry.retryRequired = true;
        pendingEntry.retryWithNewId = false;
        pendingEntry.mayHaveDispatched = deliveryMayBeAmbiguous;
        pendingEntry.errorMessage = cleanFailureReason(e.message);
        savePending();
        if (label) { label.textContent = pendingEntry.mayHaveDispatched ? "Delivery could not be confirmed — check the thread, then retry if needed" : "Not sent — tap Retry"; }
        markSendFailed(bubble, retry, {
          uncertain: pendingEntry.mayHaveDispatched,
          reason: pendingEntry.errorMessage,
          onDismiss: () => removePendingEntry(pendingEntry, { allowUncertain: true }),
        });
        syncPendingActions(pendingEntry);
      }
    } else if (e.code !== "thread_locked_elsewhere") {
      const uncertain = deliveryMayBeAmbiguous;
      recordFailedSend(threadId, text, id, activeProvider(), attachments, uncertain, e.message, baseline);
      markSendFailed(bubble, retry, {
        uncertain,
        reason: e.message,
        onDismiss: () => {
          dropFailedSend(id);
          bubble.remove();
        },
      });
      if (uncertain) {
        const failed = state.failedSends.find((entry) => entry.requestId === id);
        if (failed) {
          // Keep only an in-memory DOM association. The durable record remains
          // plain JSON, while a later provider acknowledgement can immediately
          // clear the exact optimistic bubble without waiting for a reload.
          failed.bubble = bubble;
          autoCheckStandaloneDelivery(failed, bubble, 1200);
        }
      }
    }

    if (!bubble) { chip("⚠️", "send failed: " + e.message); }

  }
}

function newRequestId() {
  return crypto.randomUUID?.() ?? (String(Date.now()) + Math.random().toString(16).slice(2));
}

function advanceThreadUserProgress() {
  const count = Number(state.threadUserProgress?.userCount);
  state.threadUserProgress = { userCount: Number.isSafeInteger(count) && count >= 0 ? count + 1 : 1, lastUserId: null };
}

function cleanFailureReason(value) {
  const text = String(value ?? "").trim();
  return text ? text.slice(0, 800) : null;
}

// Mark the message that failed, rather than dropping a warning further down the
// transcript — the thing that didn't send is the thing you tap to retry.
function markSendFailed(bubble, onRetry, { uncertain = false, onDismiss = null, reason = null } = {}) {
  if (!bubble) { return; }

  bubble.querySelector(".failed-actions")?.remove();
  bubble.querySelector(".failed-reason")?.remove();
  bubble.querySelector(".retry")?.remove(); // remove controls from pre-0.4.4 DOM
  bubble.classList.toggle("failed", !!onRetry || !!onDismiss);

  if (!onRetry && !onDismiss) { return; }

  if (reason) {
    const detail = document.createElement("div");
    detail.className = "failed-reason";
    detail.textContent = cleanFailureReason(reason);
    bubble.appendChild(detail);
  }

  const actions = document.createElement("div");
  actions.className = "failed-actions";
  if (onRetry) {
    const btn = document.createElement("button");
    btn.className = "retry";
    btn.title = uncertain ? "Check delivery without resending" : "Not sent — tap to retry";
    btn.textContent = uncertain ? "Check delivery" : "⟳ Retry";
    const originalText = btn.textContent;
    btn.onclick = async () => {
      btn.disabled = true;
      btn.textContent = uncertain ? "Checking…" : "⟳ Sending…";
      try {
        await onRetry();
      } finally {
        if (btn.isConnected && btn.disabled) {
          btn.disabled = false;
          btn.textContent = originalText;
        }
      }
    };
    actions.appendChild(btn);
  }
  if (onDismiss) {
    const dismiss = document.createElement("button");
    dismiss.type = "button";
    dismiss.className = "dismiss-failed";
    dismiss.textContent = uncertain ? "Dismiss" : "Cancel";
    dismiss.title = uncertain
      ? "Remove this recovery copy; this cannot recall a message that may already have reached the agent"
      : "Cancel this unsent message";
    dismiss.onclick = async () => {
      dismiss.disabled = true;
      try {
        await onDismiss();
      } finally {
        if (dismiss.isConnected) { dismiss.disabled = false; }
      }
    };
    actions.appendChild(dismiss);
  }
  bubble.appendChild(actions);
  scrollDown();
}

function setBusy(busy, { external = false, ownershipChecking = false, ownershipUnknown = false } = {}) {
  // A turn we streamed ourselves was rendered optimistically from live events.
  // The session file is the canonical record of it, and the watcher's trailing
  // read lands *after* the turn ends — at which point the guard that suppressed
  // file ops mid-turn no longer applies, so that content gets drawn a second
  // time. Reconcile against the file once the turn is over instead.
  const ownTurnEnding = state.busy && !state.externalTurn && !busy;

  if (!busy) {
    settleReasoning();
    settleActivityGroup();
    // Nothing is in flight, so nothing should be blinking — this also catches a
    // bubble orphaned by a turn that ended before it was drawn.
    clearCarets();
  }

  const previousOwnership = state.turnOwnership;
  state.busy = busy;
  state.turnOwnership = !busy
    ? "idle"
    : (ownershipChecking ? "checking" : (ownershipUnknown ? "unknown" : (external ? "external" : "bridge")));

  // A turn driven elsewhere (a terminal, an IDE, another device) reaches us by
  // re-reading the session file, not by streaming — so resync must stay allowed
  // for it, unlike a turn we are streaming ourselves.
  state.externalTurn = busy && external;

  // A message accepted while ownership was unknown stayed local. Route it only
  // after a canonical refresh proves which control primitive is safe.
  if (busy && ["checking", "unknown"].includes(previousOwnership) && ["bridge", "external"].includes(state.turnOwnership)) {
    for (const entry of state.pending.filter((candidate) => candidate.awaitingOwnership)) {
      entry.awaitingOwnership = false;

      if (state.turnOwnership === "external" && activeProvider() === "codex") {
        entry.viaCodexQueue = true;
        queueMicrotask(() => persistExternalCodexQueue(entry));
      } else if (state.turnOwnership === "bridge" && entry.intendedSendMode === "steer") {
        queueMicrotask(() => trySteer(entry));
      } else {
        const label = entry.chip?.querySelector(":scope > span");
        if (label) { label.textContent = "Queued — sends when the current turn finishes"; }
      }
    }

    savePending();
  }

  if (state.externalTurn && activeProvider() === "codex") {
    refreshActivityGroup(state.activityGroup, { live: true });
  }
  // Queue actions depend on live ownership. Refresh them whenever that state
  // changes so a safe Steer action appears without requiring a page reload,
  // and disappears immediately if the turn moves elsewhere or finishes.
  for (const entry of state.pending) { syncPendingActions(entry); }
  // Only offer Stop for a turn this bridge owns. An externally observed turn
  // has no safe interrupt handle; showing Stop there would imply control we do
  // not have and used to discard the user's queue before the interrupt failed.
  $("stopBtn").style.display = busy && !external ? "flex" : "none";
  setLivePill(state.externalTurn);
  syncUsageRetryButtons();
  syncControls();

  if (ownTurnEnding) { scheduleExternalRefresh(); }
}

function setLivePill(on, text, { stalled } = {}) {
  document.body.classList.toggle("livesync", !!on);

  if (text) { $("livePillText").textContent = text; }
  if (stalled !== undefined) { $("livePill").classList.toggle("stalled", !!on && stalled); }
  else if (!on) { $("livePill").classList.remove("stalled"); }
}

// Low-level interrupt (used by both Stop and Steer).
async function interruptApi() {
  if (!state.active) { return; }

  try {
    await api("/api/interrupt", { provider: state.active.provider || "codex", threadId: state.active.id, turnId: state.activeTurnId, requireActive: true });
    return true;
  } catch (error) {
    chip("⚠️", "Stop failed: " + (error.message || error));
    return false;
  }
}

// Stop button: a hard stop — drop anything queued, then interrupt.
async function stopAgent() {
  if (state.externalTurn) {
    chip("ℹ️", "This turn is running elsewhere and cannot be stopped from here");
    return;
  }

  $("stopBtn").disabled = true;
  const stopped = await interruptApi();
  $("stopBtn").disabled = false;

  if (!stopped) { return; }

  const remaining = [];

  for (const p of [...state.pending]) {
    if (p.nativeQueue && p.nativeQueueId) {
      const removed = await removePendingEntry(p, { flush: false });
      if (!removed) { remaining.push(p); }
      continue;
    }

    p.chip?.remove();
    p.bubble?.remove();
  }

  state.pending = remaining;
  savePending();
}

// ---------- approvals ----------
function showApproval(a) {
  state.approvalId = a.requestId;
  const p = a.params ?? {};
  const isFile = a.method.includes("fileChange") || a.method.includes("Patch");
  const cmd = p.command || p.call?.command || (p.changes ? p.changes.map((c) => c.path).join("\n") : null) || JSON.stringify(p).slice(0, 500);
  const who = PROVIDER_LABELS[activeProvider()] || "The agent";
  $("apprTitle").textContent = isFile ? `${who} wants to edit files` : `${who} wants to run a command`;
  $("apprBody").textContent = Array.isArray(cmd) ? cmd.join(" ") : cmd;
  $("approval").style.display = "block";
  scrollDown();
}

async function refreshApprovals() {
  const t = state.active;

  if (!t) { return; }

  try {
    const res = await api("/api/approvals?provider=" + encodeURIComponent(activeProvider()));
    const pending = (res.data ?? []).find((a) => a.params?.threadId === t.id || a.params?.threadId === t.draftId);

    if (pending && state.active === t) { showApproval(pending); }
  } catch {}
}

async function answerApproval(decision) {
  if (!state.approvalId) { return; }

  const id = state.approvalId;
  state.approvalId = null;
  $("approval").style.display = "none";

  try { await api("/api/approval", { requestId: id, decision, provider: activeProvider() }); } catch (e) { chip("⚠️", "approval failed: " + e.message); }
}

// ---------- anchored control menus + sheets ----------
let controlPopoverAnchor = null;
let controlPopoverPoint = null;

function positionControlPopover() {
  const popover = $("controlPopover");
  const anchor = controlPopoverAnchor;
  if (!popover.classList.contains("show")) { return; }

  // A context menu belongs where the pointer is, like the platform ones: down
  // and to the right of the click, flipped back over it near an edge.
  if (controlPopoverPoint) {
    popover.style.maxHeight = `${Math.min(window.innerHeight * .52, 430)}px`;
    const rect = popover.getBoundingClientRect();
    const spillsRight = controlPopoverPoint.x + rect.width + 8 > window.innerWidth;
    const spillsDown = controlPopoverPoint.y + rect.height + 8 > window.innerHeight;
    const left = spillsRight ? controlPopoverPoint.x - rect.width : controlPopoverPoint.x;
    const top = spillsDown ? controlPopoverPoint.y - rect.height : controlPopoverPoint.y;
    popover.style.left = `${Math.max(8, Math.min(left, window.innerWidth - rect.width - 8))}px`;
    popover.style.top = `${Math.max(8, Math.min(top, window.innerHeight - rect.height - 8))}px`;
    return;
  }

  if (!anchor) { return; }

  const anchorRect = anchor.getBoundingClientRect();
  const availableAbove = Math.max(140, anchorRect.top - 16);
  popover.style.maxHeight = `${Math.min(window.innerHeight * .52, 430, availableAbove)}px`;
  const menuRect = popover.getBoundingClientRect();
  const left = Math.max(8, Math.min(anchorRect.right - menuRect.width, window.innerWidth - menuRect.width - 8));
  const top = Math.max(8, anchorRect.top - menuRect.height - 7);
  popover.style.left = `${left}px`;
  popover.style.top = `${top}px`;
}

// anchor may be null for a point-anchored menu, which has no control chip to
// mark expanded and nothing to hand focus back to.
function openControlPopover(anchor, html, kind, { point = null } = {}) {
  const popover = $("controlPopover");
  if (controlPopoverAnchor && controlPopoverAnchor !== anchor) {
    controlPopoverAnchor.setAttribute("aria-expanded", "false");
  }
  controlPopoverAnchor = anchor;
  controlPopoverPoint = point;
  anchor?.setAttribute("aria-expanded", "true");
  popover.dataset.kind = kind || "";
  popover.innerHTML = html;
  popover.classList.add("show");
  popover.setAttribute("aria-hidden", "false");
  positionControlPopover();
  requestAnimationFrame(() => {
    positionControlPopover();
    popover.querySelector("button:not(:disabled)")?.focus();
  });
}

function closeControlPopover({ restoreFocus = false } = {}) {
  const popover = $("controlPopover");
  if (!popover?.classList.contains("show")) { return; }
  const anchor = controlPopoverAnchor;
  popover.classList.remove("show");
  popover.setAttribute("aria-hidden", "true");
  popover.innerHTML = "";
  popover.dataset.kind = "";
  anchor?.setAttribute("aria-expanded", "false");
  controlPopoverAnchor = null;
  controlPopoverPoint = null;
  if (restoreFocus) { anchor?.focus(); }
}

function toggleControlPopover(anchor, opener) {
  if ($("controlPopover").classList.contains("show") && controlPopoverAnchor === anchor) {
    closeControlPopover({ restoreFocus: true });
    return;
  }
  opener();
}

function openSheet(html) {
  closeControlPopover();
  if (!$("sheet").classList.contains("show")) { state.sheetReturnFocus = document.activeElement; }
  $("sheet").removeAttribute("inert");
  $("app").setAttribute("inert", "");
  $("sheet").classList.remove("new-session-host");
  $("sheetBody").dataset.sheetKind = "";
  $("sheetBody").innerHTML = html;
  const heading = $("sheetBody").querySelector("h2");
  if (heading) { heading.id = "sheetTitle"; }
  $("overlay").classList.add("show");
  $("sheet").classList.add("show");
  $("sheet").setAttribute("aria-hidden", "false");
  requestAnimationFrame(() => $("sheetBody").querySelector("button, input, textarea, select, [tabindex]")?.focus());
}

function closeSheet() {
  // An HTML preview can contain CSS/SVG animation even though script and the
  // network are blocked. Tear it down instead of letting hidden work continue.
  for (const frame of $("sheetBody").querySelectorAll("iframe.html-preview")) {
    frame.srcdoc = "";
    frame.removeAttribute("src");
  }
  for (const card of $("sheetBody").querySelectorAll(".mermaid-card")) {
    mermaidObserver?.unobserve(card);
    observedMermaidCards.delete(card);
  }
  $("overlay").classList.remove("show");
  $("sheet").classList.remove("show");
  $("sheet").setAttribute("aria-hidden", "true");
  $("sheet").setAttribute("inert", "");
  $("app").removeAttribute("inert");
  state.sheetReturnFocus?.focus?.();
  state.sheetReturnFocus = null;
}
$("overlay").onclick = closeSheet;

function openDiffSheet(diff) {
  openSheet(`<h2>Changes</h2><div class="hint">Unified diff</div><div class="block open" style="margin-top:6px"><div class="body"><pre></pre></div></div>`);
  renderDiffInto($("sheetBody").querySelector("pre"), diff);
}

const MD_FILE_RE = /\.(md|markdown|mdx)$/i;
const HTML_FILE_RE = /\.html?$/i;
const MAX_HTML_PREVIEW_CHARS = 750_000;

function isolatedHtmlPreviewDocument(source) {
  if (!window.DOMPurify) {
    return `<!doctype html><pre>${esc(source)}</pre>`;
  }

  const sanitized = window.DOMPurify.sanitize(source, {
    WHOLE_DOCUMENT: true,
    FORBID_TAGS: ["script", "base", "iframe", "object", "embed"],
    FORBID_ATTR: ["srcdoc"],
  });
  const doc = new DOMParser().parseFromString(sanitized, "text/html");
  // Sandbox blocks script/forms/popups, while these removals also prevent a
  // document from navigating its own frame through markup alone.
  for (const meta of doc.querySelectorAll("meta[http-equiv]")) {
    if (meta.getAttribute("http-equiv")?.toLowerCase() === "refresh") { meta.remove(); }
  }
  for (const link of doc.querySelectorAll("a[href], area[href]")) { link.removeAttribute("href"); }
  for (const form of doc.querySelectorAll("form")) { form.removeAttribute("action"); }

  const policy = doc.createElement("meta");
  policy.httpEquiv = "Content-Security-Policy";
  policy.content = "default-src 'none'; img-src data: blob:; style-src 'unsafe-inline'; font-src data:";
  doc.head.prepend(policy);
  return "<!doctype html>" + doc.documentElement.outerHTML;
}

// A link the agent wrote may point at a local file rather than a URL — e.g.
// [notes](/Users/me/proj/notes.md) or [grok.mjs](providers/grok.mjs:812). The
// browser resolves those against our own origin and 404s, so they open in the
// built-in viewer instead. Returns { path, line } or null for real URLs/anchors.
function localFileTarget(raw) {
  if (!raw) { return null; }

  let s = String(raw).trim();

  if (!s || s.startsWith("#") || s.startsWith("//")) { return null; }

  // A real URL scheme is followed by "//" (http://, file://) or is one of the
  // schemeless-authority ones. Without that test, "foo.js:812" would read as a
  // scheme named "foo.js" instead of a file with a line reference.
  const scheme = s.match(/^([a-z][a-z0-9+.-]*):(\/\/)?/i);

  if (scheme && (scheme[2] || /^(mailto|tel|sms|callto|data|javascript|cid|xmpp|about)$/i.test(scheme[1]))) {
    if (scheme[1].toLowerCase() !== "file") { return null; }

    s = s.replace(/^file:\/\/(?:localhost)?/i, "");

    if (!s.startsWith("/")) { return null; }
  }

  // Trailing line references: foo.js:812, foo.js:812:5, foo.js#L812.
  let line = null;
  const at = s.match(/(?::(\d+)(?::\d+)?|#L(\d+))$/i);

  if (at) {
    line = Number(at[1] ?? at[2]);
    s = s.slice(0, at.index);
  }

  s = s.replace(/^\.\//, "");

  if (!s) { return null; }

  try {
    s = decodeURIComponent(s);
  } catch {
    // keep the raw form when percent-decoding fails
  }

  return { path: s, line };
}

// View a file the agent created/edited — rendered markdown or syntax-highlighted
// code, with an optional Diff tab. Content is fetched sandboxed to the thread cwd.
async function openFileSheet(path, diff, line) {
  const name = path.split("/").pop();
  const tabs = diff
    ? `<div class="file-tabs"><button data-tab="file" class="on">File</button><button data-tab="diff">Diff</button></div>`
    : "";
  openSheet(`<h2>${esc(name)}</h2><div class="hint">${esc(path)}${line ? ":" + line : ""}</div>${tabs}<div id="fileBody"><div class="empty">Loading…</div></div>`);

  function bodyEl() { return $("sheetBody").querySelector("#fileBody"); }

  function showDiff() {
    bodyEl().innerHTML = `<div class="block open"><div class="body"><pre></pre></div></div>`;
    renderDiffInto(bodyEl().querySelector("pre"), diff || "No diff available");
  }

  let fileData = null;

  // Cache-first, like threads: paint the saved copy instantly (works offline),
  // then refresh from the network and keep the fresh copy for next time.
  async function showFile() {
    if (fileData) {
      renderFileInto(bodyEl(), name, fileData);
      return;
    }

    const cwd = state.active?.cwd;
    const cached = await idbGet(fileCacheKey(cwd, path));

    if (cached) {
      renderFileInto(bodyEl(), name, cached);
    }

    try {
      const fresh = await api("/api/file?cwd=" + encodeURIComponent(cwd || "") + "&path=" + encodeURIComponent(path));
      fileData = fresh;
      renderFileInto(bodyEl(), name, fresh);
      cacheFile(cwd, path, fresh);
    } catch (e) {
      if (cached) {
        fileData = cached;
        renderFileInto(bodyEl(), name, cached, cached.cachedAt);
        return;
      }

      bodyEl().innerHTML = `<div class="hint">Couldn't open file: ${esc(e.message)}${diff ? " — try the Diff tab." : ""}</div>`;
    }
  }

  if (diff) {
    $("sheetBody").querySelectorAll("[data-tab]").forEach((b) => {
      b.onclick = () => {
        $("sheetBody").querySelectorAll("[data-tab]").forEach((x) => x.classList.toggle("on", x === b));

        if (b.dataset.tab === "diff") { showDiff(); } else { showFile(); }
      };
    });
  }

  showFile();
}

// Docs vs everything else, for the Files sheet filter.
const DOC_FILE_RE = /\.(md|markdown|mdx|html?|txt|rst|adoc)$/i;

async function openFilesSheet() {
  const cwd = state.active?.cwd;
  const files = [...state.threadFiles.values()].sort((a, b) => a.path.localeCompare(b.path));

  openSheet(`<h2>Files</h2>
    <div class="hint">Edited or linked in this session. Saved files open offline.</div>
    <div class="file-tabs" id="fileFilter">
      <button data-f="all" class="on">All</button>
      <button data-f="docs">Docs</button>
      <button data-f="code">Code</button>
    </div>
    <div id="filesList"></div>
    <button class="primary-btn" id="saveFilesBtn" disabled>Select files to save</button>`);

  const cachedPaths = new Set();
  await Promise.all(files.map(async (f) => {
    if (await idbGet(fileCacheKey(cwd, f.path))) { cachedPaths.add(f.path); }
  }));

  const selected = new Set();
  let filter = "all";

  function visible() {
    return files.filter((f) => {
      if (filter === "docs") { return DOC_FILE_RE.test(f.path); }
      if (filter === "code") { return !DOC_FILE_RE.test(f.path); }

      return true;
    });
  }

  function syncSaveBtn() {
    const btn = $("saveFilesBtn");

    if (!btn) { return; }

    btn.disabled = selected.size === 0;
    btn.textContent = selected.size ? `Save ${selected.size} for offline` : "Select files to save";
  }

  function renderList() {
    const list = $("filesList");
    const rows = visible();

    if (!rows.length) {
      list.innerHTML = `<div class="hint">No ${filter === "all" ? "" : filter + " "}files in this session.</div>`;
      return;
    }

    list.innerHTML = rows.map((f) => {
      const name = f.path.split("/").pop();
      const dir = f.path.split("/").slice(0, -1).join("/");
      const badges = (cachedPaths.has(f.path) ? `<span class="fbadge">Saved</span>` : "")
        + (f.edited ? `<span class="fbadge edit">Edited</span>` : "");

      return `<div class="filerow${selected.has(f.path) ? " sel" : ""}" data-path="${esc(f.path)}">
        <div class="cb" data-role="cb"></div>
        <div class="fmeta" data-role="open">
          <div class="fname">${esc(name)}</div>
          <div class="fdir">${esc(dir || ".")}</div>
        </div>${badges}</div>`;
    }).join("");

    list.querySelectorAll(".filerow").forEach((row) => {
      const path = row.dataset.path;

      row.querySelector('[data-role="cb"]').onclick = (e) => {
        e.stopPropagation();

        if (selected.has(path)) { selected.delete(path); } else { selected.add(path); }

        row.classList.toggle("sel", selected.has(path));
        syncSaveBtn();
      };

      row.querySelector('[data-role="open"]').onclick = () => openFileSheet(path, "");
    });
  }

  $("sheetBody").querySelectorAll("#fileFilter button").forEach((b) => {
    b.onclick = () => {
      filter = b.dataset.f;
      $("sheetBody").querySelectorAll("#fileFilter button").forEach((x) => x.classList.toggle("on", x === b));
      renderList();
    };
  });

  $("saveFilesBtn").onclick = async () => {
    const btn = $("saveFilesBtn");
    const targets = [...selected];
    let done = 0;
    let failed = 0;
    btn.disabled = true;

    for (const p of targets) {
      btn.textContent = `Saving ${done + 1}/${targets.length}…`;

      try {
        const data = await api("/api/file?cwd=" + encodeURIComponent(cwd || "") + "&path=" + encodeURIComponent(p));
        await cacheFile(cwd, p, data);
        cachedPaths.add(p);
        done++;
      } catch {
        failed++;
      }
    }

    selected.clear();
    renderList();
    btn.textContent = failed ? `Saved ${done}, ${failed} failed` : `Saved ${done} for offline`;
    setTimeout(syncSaveBtn, 2200);
  };

  renderList();
  syncSaveBtn();
}

function terminalThreadKey(thread = state.active) {
  return thread ? runKey(thread.provider || "codex", thread.id) : null;
}

function terminalSession(thread) {
  const key = terminalThreadKey(thread);
  let session = state.terminalJobs.get(key);

  if (!session) {
    session = { id: null, offset: 0, log: "", state: "idle", exitCode: null, truncated: false, pollToken: 0, polling: false };
    state.terminalJobs.set(key, session);
  }

  return session;
}

function appendTerminalOutput(session, result) {
  if (result.truncated && !session.truncated) {
    session.log = "[earlier output was truncated by the bridge]\n" + (result.output || "");
    session.truncated = true;
  } else if (result.output) {
    session.log += result.output;
  }

  if (session.log.length > 1024 * 1024) { session.log = session.log.slice(-1024 * 1024); }
  session.id = result.id ?? session.id;
  session.offset = result.nextOffset ?? session.offset;
  // A poll issued just before Stop can arrive just after the stop response.
  // Terminal state is monotonic: stale `running` must not undo `stopping` or a
  // terminal result already shown to the user.
  const terminalStates = new Set(["completed", "failed", "stopped", "unconfirmed"]);
  const staleRunning = result.state === "running" && (session.state === "stopping" || terminalStates.has(session.state));
  if (result.state && !staleRunning) { session.state = result.state; }
  session.exitCode = result.exitCode ?? session.exitCode;
}

function syncTerminalSheet(thread, session) {
  const body = $("sheetBody");
  if (body.dataset.sheetKind !== "terminal" || body.dataset.terminalKey !== terminalThreadKey(thread)) { return; }

  const output = $("terminalOutput");
  const status = $("terminalStatus");
  const input = $("terminalCommand");
  const run = $("terminalRun");
  const stop = $("terminalStop");
  if (!output || !status || !input || !run || !stop) { return; }

  output.textContent = session.log || "Ready. Commands run on the bridge in this project folder.\n";
  output.scrollTop = output.scrollHeight;
  const active = ["running", "stopping", "starting"].includes(session.state);
  input.disabled = active;
  run.disabled = active;
  stop.style.display = active && session.id ? "inline-flex" : "none";
  status.textContent = session.state === "starting" ? "Starting…"
    : session.state === "running" ? "Running on bridge…"
      : session.state === "stopping" ? "Stopping…"
        : session.state === "completed" ? `Finished · exit ${session.exitCode ?? 0}`
          : session.state === "failed" ? `Failed${session.exitCode != null ? ` · exit ${session.exitCode}` : ""}`
            : session.state === "stopped" ? "Stopped"
              : session.state === "unconfirmed" ? "Start unconfirmed — check the project before running it again"
                : "Ready";
}

async function pollTerminalJob(thread, session) {
  if (!session.id || session.polling) { return; }
  session.polling = true;
  const token = ++session.pollToken;

  try {
    while (token === session.pollToken && ["running", "stopping", "starting"].includes(session.state)) {
      if ($("sheetBody").dataset.sheetKind !== "terminal" || $("sheetBody").dataset.terminalKey !== terminalThreadKey(thread)) { break; }
      await new Promise((resolve) => setTimeout(resolve, 450));
      if (token !== session.pollToken || $("sheetBody").dataset.sheetKind !== "terminal" || $("sheetBody").dataset.terminalKey !== terminalThreadKey(thread)) { break; }
      const result = await api(`/api/terminal/status?id=${encodeURIComponent(session.id)}&offset=${session.offset}`);
      appendTerminalOutput(session, result);
      syncTerminalSheet(thread, session);
    }
  } catch (error) {
    if (error.status === 404) {
      session.state = "unconfirmed";
      session.log += "\n[the bridge restarted; this command belonged to the previous bridge process]\n";
    } else if (error.reach) {
      session.state = "unconfirmed";
      session.log += "\n[connection to the bridge closed; the command may have restarted it]\n";
    } else {
      session.state = "failed";
      session.log += `\n[status check failed: ${error.message}]\n`;
    }
    syncTerminalSheet(thread, session);
  } finally {
    session.polling = false;
  }
}

function openTerminalSheet() {
  const thread = state.active;
  const cwd = thread?.cwd;
  if (!thread || !cwd) {
    openSheet('<h2>Project terminal</h2><div class="hint">This session does not report a project folder, so a safe working directory cannot be selected.</div>');
    return;
  }

  const session = terminalSession(thread);
  openSheet(`<div class="terminal-shell">
    <h2>Project terminal</h2>
    <div class="hint terminal-cwd mono" title="${esc(cwd)}">${esc(cwd)}</div>
    <pre class="terminal-output" id="terminalOutput" aria-live="polite"></pre>
    <form class="terminal-form" id="terminalForm">
      <span class="terminal-prompt">›</span>
      <input class="field-input terminal-command mono" id="terminalCommand" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Run a command on the bridge">
      <button class="primary-btn terminal-run" id="terminalRun" type="submit">Run</button>
      <button class="secondary-btn terminal-stop" id="terminalStop" type="button" style="display:none">Stop</button>
    </form>
    <div class="terminal-status" id="terminalStatus" role="status"></div>
  </div>`);
  $("sheetBody").dataset.sheetKind = "terminal";
  $("sheetBody").dataset.terminalKey = terminalThreadKey(thread);
  syncTerminalSheet(thread, session);

  $("terminalForm").onsubmit = async (event) => {
    event.preventDefault();
    const command = $("terminalCommand").value.trim();
    if (!command || ["running", "stopping", "starting"].includes(session.state)) { return; }

    session.id = null;
    session.offset = 0;
    session.log = `$ ${command}\n`;
    session.state = "starting";
    session.exitCode = null;
    session.truncated = false;
    session.pollToken += 1;
    syncTerminalSheet(thread, session);

    try {
      const result = await api("/api/terminal/run", { cwd, command });
      appendTerminalOutput(session, result);
      $("terminalCommand").value = "";
      syncTerminalSheet(thread, session);
      pollTerminalJob(thread, session);
    } catch (error) {
      // The POST may have landed even if its response was lost. Never repeat a
      // shell command automatically; make that ambiguity explicit.
      session.state = "unconfirmed";
      session.log += `\n[start could not be confirmed: ${error.message}]\n`;
      syncTerminalSheet(thread, session);
    }
  };

  $("terminalStop").onclick = async () => {
    if (!session.id) { return; }
    try {
      const result = await api("/api/terminal/stop", { id: session.id });
      appendTerminalOutput(session, result);
      syncTerminalSheet(thread, session);
      pollTerminalJob(thread, session);
    } catch (error) {
      session.log += `\n[stop could not be confirmed: ${error.message}]\n`;
      syncTerminalSheet(thread, session);
    }
  };

  if (["running", "stopping", "starting"].includes(session.state)) { pollTerminalJob(thread, session); }
}

const TERMINAL_DOCK_KEY = "cxp_terminal_dock";
const TERMINAL_BOTTOM_SIZE_KEY = "cxp_terminal_bottom_size";
const TERMINAL_RIGHT_SIZE_KEY = "cxp_terminal_right_size";

function terminalPageUrl(thread = state.active, { embedded = false } = {}) {
  const query = new URLSearchParams({
    provider: thread?.provider || "codex",
    threadId: thread?.id || "",
  });
  if (embedded) { query.set("embedded", "1"); }
  return `/terminal?${query}`;
}

function applyTerminalDock(dock = localStorage.getItem(TERMINAL_DOCK_KEY) || "bottom") {
  const right = dock === "right";
  document.body.classList.toggle("terminal-dock-right", right);
  $("terminalDockBottom").classList.toggle("on", !right);
  $("terminalDockRight").classList.toggle("on", right);
  localStorage.setItem(TERMINAL_DOCK_KEY, right ? "right" : "bottom");
}

function closeTerminalPanel() {
  document.body.classList.remove("terminal-panel-open", "terminal-dock-right");
  $("terminalPanel").setAttribute("aria-hidden", "true");
  $("terminalFrame").src = "about:blank";
}

function openTerminalPanel(thread = state.active) {
  if (!thread?.id || !thread?.cwd) { return false; }
  $("terminalPanelPath").textContent = thread.cwd;
  $("terminalPanelPath").title = thread.cwd;
  $("terminalFrame").src = terminalPageUrl(thread, { embedded: true });
  $("terminalPanel").setAttribute("aria-hidden", "false");
  document.body.classList.add("terminal-panel-open");
  applyTerminalDock();
  return true;
}

async function openTerminalInNewTab() {
  const thread = state.active;
  if (!thread?.id || !thread?.cwd) {
    openSheet('<h2>Project terminal</h2><div class="hint">This session does not report a project folder, so the bridge cannot choose a terminal starting directory.</div>');
    return;
  }
  const popup = window.open("about:blank", "_blank");
  if (popup) {
    popup.opener = null;
    popup.document.title = "Opening project terminal…";
  }
  try {
    const handoff = await api("/api/terminal/browser-handoff", {
      provider: thread.provider || "codex",
      threadId: thread.id,
    });
    if (popup) {
      popup.location.replace(handoff.url);
    } else {
      location.assign(handoff.url);
    }
  } catch (error) {
    popup?.close();
    chip("⚠️", error.message || "Could not open project terminal");
  }
}

function openNativeTerminal() {
  const thread = state.active;
  if (!thread?.id || !thread?.cwd) {
    openSheet('<h2>Project terminal</h2><div class="hint">This session does not report a project folder, so the bridge cannot choose a terminal starting directory.</div>');
    return;
  }
  if (matchMedia("(min-width: 960px)").matches) {
    if (document.body.classList.contains("terminal-panel-open")) { closeTerminalPanel(); }
    else { openTerminalPanel(thread); }
    return;
  }
  location.assign(terminalPageUrl(thread));
}

function resizeTerminalPanel(event) {
  if (!document.body.classList.contains("terminal-panel-open")) { return; }
  event.preventDefault();
  const chat = $("chatView").getBoundingClientRect();
  const right = document.body.classList.contains("terminal-dock-right");
  const move = (pointer) => {
    if (right) {
      const size = Math.round(Math.max(300, Math.min(chat.width * .65, chat.right - pointer.clientX)));
      document.body.style.setProperty("--terminal-panel-right-size", `${size}px`);
      localStorage.setItem(TERMINAL_RIGHT_SIZE_KEY, String(size));
    } else {
      const size = Math.round(Math.max(190, Math.min(chat.height * .72, chat.bottom - pointer.clientY)));
      document.body.style.setProperty("--terminal-panel-bottom-size", `${size}px`);
      localStorage.setItem(TERMINAL_BOTTOM_SIZE_KEY, String(size));
    }
  };
  const stop = () => {
    document.removeEventListener("pointermove", move);
    document.removeEventListener("pointerup", stop);
    document.body.classList.remove("terminal-resizing");
  };
  document.body.classList.add("terminal-resizing");
  document.addEventListener("pointermove", move);
  document.addEventListener("pointerup", stop, { once: true });
}

const savedTerminalBottomSize = Number(localStorage.getItem(TERMINAL_BOTTOM_SIZE_KEY));
const savedTerminalRightSize = Number(localStorage.getItem(TERMINAL_RIGHT_SIZE_KEY));
if (savedTerminalBottomSize >= 190) { document.body.style.setProperty("--terminal-panel-bottom-size", `${savedTerminalBottomSize}px`); }
if (savedTerminalRightSize >= 300) { document.body.style.setProperty("--terminal-panel-right-size", `${savedTerminalRightSize}px`); }

function renderFileInto(el, name, d, staleAt) {
  if (d.binary) {
    el.innerHTML = `<div class="hint">Binary file (${fmtBytes(d.size)}) — not viewable.</div>`;
    return;
  }

  let note = d.truncated ? `<div class="hint">Showing the first 2 MB of ${fmtBytes(d.size)}.</div>` : "";

  if (staleAt) { note = `<div class="hint">Offline copy · saved ${relTime(Math.floor(staleAt / 1000))}</div>` + note; }

  if (MD_FILE_RE.test(name)) {
    el.innerHTML = note + `<div class="md filebody">${renderMarkdown(d.content)}</div>`;
    const markdown = el.querySelector(".md.filebody");
    decorateMarkdownLinks(markdown);
    decorateCodeBlocks(markdown);
    scheduleMermaidBlocks(markdown);
    scheduleMath(markdown, d.content);
    return;
  }

  if (HTML_FILE_RE.test(name)) {
    const previewable = d.content.length <= MAX_HTML_PREVIEW_CHARS;
    el.innerHTML = note + `<div class="file-tabs" data-html-tabs>
      <button type="button" data-view="preview"${previewable ? ' class="on"' : ""}${previewable ? "" : " disabled"}>Preview</button>
      <button type="button" data-view="source"${previewable ? "" : ' class="on"'}>Source</button>
    </div>
    <div class="html-preview-note">Isolated preview · scripts, forms, and network requests are disabled.</div>
    <iframe class="html-preview" title="HTML preview" sandbox=""${previewable ? "" : " hidden"}></iframe>
    <pre class="filecode html-source"${previewable ? " hidden" : ""}><code></code></pre>`;
    const frame = el.querySelector(".html-preview");
    const source = el.querySelector(".html-source");
    const code = source.querySelector("code");
    code.textContent = d.content;
    code.className = "language-html";
    if (window.hljs && d.content.length <= MAX_CODE_HIGHLIGHT_CHARS) {
      try { hljs.highlightElement(code); } catch { /* leave as plain HTML */ }
    }
    if (previewable) {
      // The iframe gets a unique opaque origin (no allow-same-origin) and its
      // own deny-by-default CSP. Raw project HTML never enters the app DOM.
      frame.srcdoc = isolatedHtmlPreviewDocument(d.content);
    }
    el.querySelectorAll("[data-html-tabs] button").forEach((button) => {
      button.onclick = () => {
        if (button.disabled) { return; }
        const showPreview = button.dataset.view === "preview";
        frame.hidden = !showPreview;
        source.hidden = showPreview;
        el.querySelectorAll("[data-html-tabs] button").forEach((candidate) => candidate.classList.toggle("on", candidate === button));
      };
    });
    return;
  }

  el.innerHTML = note + `<pre class="filecode"><code></code></pre>`;
  const code = el.querySelector("code");
  code.textContent = d.content;

  if (window.hljs) {
    try { hljs.highlightElement(code); } catch { /* leave as plain text */ }
  }
}

function currentModel() { return state.models.find((m) => m.id === state.model); }

function setSettingsTruth(next) {
  state.settingsTruth = { ...state.settingsTruth, ...next };
  syncControls();
}

function dispatchReadiness() {
  const mode = currentMode();
  const model = currentModel();
  const efforts = model?.supportedReasoningEfforts ?? [];

  if (state.turnOwnership === "checking") { return { ready: false, reason: "Confirming who owns the running turn" }; }
  if (state.settingsTruth.state === "loading") { return { ready: false, reason: "Thread settings are still loading" }; }
  if (state.settingsTruth.state === "error") { return { ready: false, reason: state.settingsTruth.message || "Thread settings could not be verified" }; }
  if (state.modelsProvider !== activeProvider()) { return { ready: false, reason: "Loading this provider's settings" }; }
  if (!state.model || !model) { return { ready: false, reason: "No exact model is selected" }; }
  if (!state.effort) { return { ready: false, reason: "No reasoning effort is selected" }; }
  if (efforts.length && !efforts.some((candidate) => candidate.reasoningEffort === state.effort)) {
    return { ready: false, reason: `${state.effort} is not supported by ${state.model}` };
  }
  if (mode.unknown || !mode.key) { return { ready: false, reason: "Choose a known permission mode" }; }
  return { ready: true, reason: "" };
}

function settingsSourceMessage(settings) {
  const values = [settings?.sources?.model, settings?.sources?.effort, settings?.sources?.mode];
  const acceptedCount = values.filter((source) => source === "provider_accept").length;
  const providerCount = values.filter((source) => source && source !== "provider_accept" && !source.startsWith("bridge_")).length;
  const savedCount = values.filter((source) => source?.startsWith("bridge_")).length;
  const missingCount = values.filter((source) => !source).length;
  if (acceptedCount) { return "Requested settings accepted · awaiting recorded confirmation"; }
  if (providerCount && savedCount) { return "Provider-confirmed · saved overrides"; }
  if (providerCount && missingCount) { return "Provider-confirmed · defaults for missing fields"; }
  if (providerCount) { return `Confirmed from ${PROVIDER_LABELS[activeProvider()] || "provider"}`; }
  if (missingCount === values.length) { return "Settings not recorded"; }
  return "Saved exact settings";
}

function setLockStatus(lock) {
  state.lock = { ...state.lock, ...lock };
  syncLockControl();
}

function openLockContent(html) {
  openControlPopover($("lockCtl"), html, "lock");
}

function isLockSheetOpen() {
  return $("controlPopover").classList.contains("show") && $("controlPopover").dataset.kind === "lock";
}

function syncLockControl() {
  const codexThread = state.active && activeProvider() === "codex" && !state.active.draft;
  $("lockCtl").style.display = codexThread ? "flex" : "none";
  $("lockName").textContent = state.lock.label || "Checking…";
}

async function refreshLockStatus() {
  const t = state.active;

  if (!t || activeProvider() !== "codex" || t.draft) { return null; }

  const threadId = t.id;

  try {
    const lock = await api(`/api/thread/lock?provider=codex&threadId=${encodeURIComponent(threadId)}`);

    if (state.active?.id === threadId) { setLockStatus(lock); }

    return lock;
  } catch {
    if (state.active?.id === threadId) {
      setLockStatus({ state: "unknown", label: "Check failed" });
    }

    return null;
  }
}

function renderLockSheet() {
  const lock = state.lock;

  if (lock.state === "unknown") {
    openLockContent(`<h2>Write access</h2>
      <div class="hint">The bridge could not check this thread's lock state. You can safely try again.</div>
      <button class="primary-btn" id="retryLockBtn">Check again</button>`);
    $("retryLockBtn").onclick = openLockSheet;
    return;
  }

  if (lock.state === "held") {
    const busy = state.busy;
    openLockContent(`<h2>You have it</h2>
      <div class="hint">This bridge has the thread loaded, so other Codex clients cannot write to it.</div>
      ${busy ? '<div class="hint">Release is unavailable while the agent is working. It will never interrupt a running turn.</div>' : ""}
      <button class="primary-btn" id="releaseLockBtn" ${busy ? "disabled" : ""}>Release</button>`);
    const btn = $("releaseLockBtn");

    btn.onclick = async () => {
      btn.disabled = true;
      btn.textContent = "Releasing…";

      try {
        const next = await api("/api/thread/lock/release", { provider: "codex", threadId: state.active.id });
        setLockStatus(next);
        renderLockSheet();
      } catch (e) {
        btn.textContent = e.code === "turn_in_progress" ? "Wait for the turn to finish" : "Release failed — tap to retry";
        btn.disabled = e.code === "turn_in_progress";
      }
    };
    return;
  }

  if (lock.state === "elsewhere") {
    openLockContent(`<h2>Open elsewhere</h2>
      <div class="hint">Another Codex client currently has write access. Close it there, then try again here. This app will only acquire the lock after Codex confirms it is free; it never forces a takeover.</div>
      <button class="primary-btn" id="retryTakeLockBtn">Try again</button>
      <button type="button" class="opt opt-button" id="escapeLockBtn" style="width:100%;margin-top:8px">Start another session</button>`);
    $("retryTakeLockBtn").onclick = () => tryTakeLock($("retryTakeLockBtn"));
    $("escapeLockBtn").onclick = () => { closeControlPopover(); openNewSession(); };
    return;
  }

  openLockContent(`<h2>Not held here</h2>
    <div class="hint">This app is not holding the thread. Codex will grant write access only if no other client owns it; this never forces a takeover.</div>
    <button class="primary-btn" id="takeLockBtn">Try to get write access</button>`);
  $("takeLockBtn").onclick = () => tryTakeLock($("takeLockBtn"));
}

async function tryTakeLock(btn) {
  const t = state.active;

  if (!t || activeProvider() !== "codex" || t.draft) { return; }

  const threadId = t.id;
  const mode = currentMode();
  btn.disabled = true;
  btn.textContent = "Checking write access…";

  try {
    const next = await api("/api/thread/lock/warm", {
      provider: "codex",
      threadId,
      approvalPolicy: mode.approvalPolicy,
      sandbox: mode.sandbox,
    });

    if (state.active?.id !== threadId || activeProvider() !== "codex") { return; }

    setLockStatus(next);
    if (isLockSheetOpen()) { renderLockSheet(); }
  } catch (e) {
    if (state.active?.id !== threadId || activeProvider() !== "codex") { return; }

    if (e.code === "thread_locked_elsewhere") {
      setLockStatus({ state: "elsewhere", label: "Open elsewhere" });
      if (isLockSheetOpen()) { renderLockSheet(); }
    } else {
      btn.disabled = false;
      btn.textContent = "Try again";
    }
  }
}

async function openLockSheet() {
  openLockContent(`<h2>Write access</h2><div class="hint">Checking this thread…</div>`);
  await refreshLockStatus();

  if (state.active && activeProvider() === "codex" && isLockSheetOpen()) { renderLockSheet(); }
}

    <div class="control-menu-title">Effort</div>${html}

    "plan":        { name: "Plan",                 desc: "Read-only — plans and explains without changing anything." },
    "bypass":      { name: "Bypass permissions",   desc: "No prompts at all. Full autonomy — use with care." },
  },
  grok: {
    "bypass":      { name: "Bypass permissions",   desc: "Auto-approves every tool. Full autonomy — use with care." },
  },
};

const DEFAULT_MODE = { codex: "auto", claude: "auto", grok: "bypass" };

function modeSetFor(provider) {
  const base = MODE_SETS[provider] || MODE_SETS.codex;
  const advertised = state.capabilitiesByProvider.get(provider)?.permissionModes;
  if (!Array.isArray(advertised)) { return base; }
  return Object.fromEntries(Object.entries(base).filter(([key]) => advertised.includes(key)));
}

function supportsInput(modality) {
  const modelModes = currentModel()?.inputModalities;
  if (Array.isArray(modelModes)) { return modelModes.includes(modality); }
  return state.capabilitiesByProvider.get(activeProvider())?.inputModalities?.includes(modality) === true;
}

// Resolve the open thread's mode first. Global picks are defaults for sessions
// with no provider/store value, not a competing opinion about an existing one.
function currentMode() {
  const p = activeProvider();
  const set = modeSetFor(p);

  if (state.active && activeProvider() === "codex" && state.threadModeUnknown && !state.threadMode
      && (state.threadApprovalPolicy || state.threadSandboxPolicy)) {
    const sandboxType = typeof state.threadSandboxPolicy === "object"
      ? state.threadSandboxPolicy?.type
      : state.threadSandboxPolicy;
    const policyName = sandboxType === "managed" ? "Managed access" : `${sandboxType || "Custom"} access`;
    return {
      key: "provider-exact",
      name: policyName,
      desc: `Provider-owned policy · approval ${state.threadApprovalPolicy || "unspecified"}`,
      approvalPolicy: state.threadApprovalPolicy,
      sandbox: state.threadSandboxPolicy,
      providerExact: true,
      unknown: false,
    };
  }

  if (state.active && state.threadModeUnknown && !state.threadMode) {
    return {
      key: null,
      name: "Unrepresentable policy",
      desc: `${PROVIDER_LABELS[p] || "Provider"} reports a permission policy this bridge cannot represent. Choose a preset before sending.`,
      unknown: true,
    };
  }

  let key = state.active && state.threadMode ? state.threadMode : state.modeByProvider[p];

  if (!set[key]) {
    key = set[DEFAULT_MODE[p]] ? DEFAULT_MODE[p] : Object.keys(set)[0] ?? null;
    state.modeByProvider[p] = key;
  }

  if (!key || !set[key]) {
    return { key: null, name: "Unavailable", desc: `${PROVIDER_LABELS[p] || "Provider"} does not advertise a permission mode this bridge can apply exactly.`, unknown: true };
  }

  return { key, ...set[key] };
}

// ---------- api ----------
// Two outages are indistinguishable to a naive fetch, and both must fall back to
// the cache: this phone having no network (fetch rejects), and the Mac or its
// tunnel being down (the proxy in front answers 502/52x/53x with an error page,
// which resolves like a normal response). Classify them here and tag the error
// with `reach` so callers can fall back and say which one it is.
function unreachable(kind) {
  return Object.assign(new Error(kind === "host" ? "can't reach your Mac" : "your phone is offline"), { reach: kind });
}

// navigator.onLine can still read a stale `true` for a moment after a cold
// launch, which would blame the Mac for the phone's own outage. Re-check when we
// actually render: a phone that knows it has no network is the better answer.
function effectiveReach(reach) {
  return navigator.onLine ? reach : "phone";
}

function offlineWord(reach) {
  return effectiveReach(reach) === "host" ? "Your Mac looks offline" : "You're offline";
}

async function api(path, body, options = {}) {
  let res;

  try {
    res = await fetch(path, body
      ? { ...options, method: "POST", headers: { "content-type": "application/json", ...(options.headers ?? {}) }, body: JSON.stringify(body) }
      : options);
  } catch (cause) {
    if (cause?.name === "AbortError") { throw cause; }
    // The request never left the phone.
    console.warn("Bridge request failed before a response", path, cause);
    throw unreachable(navigator.onLine ? "host" : "phone");
  }

  // Our own server always answers JSON, so a non-JSON 5xx is the proxy reporting
  // that the machine behind it is gone — not a failing handler.
  if (res.status >= 500 && !(res.headers.get("content-type") || "").includes("json")) {
    throw unreachable("host");
  }

  if (!res.ok) {
    const b = await res.json().catch(() => ({}));
    // code lets callers decide (steer -> queue, say) without matching prose.
    throw Object.assign(new Error(b.error || res.statusText), { code: b.code, status: res.status });
  }

  try {
    return await res.json();
  } catch {
    // For a delivery endpoint, losing/truncating a successful JSON response is
    // ambiguous even though HTTP itself completed. Callers combine this fact
    // with their exact dispatch stage before deciding whether retry is safe.
    throw Object.assign(new Error("the bridge response was incomplete"), {
      code: "invalid_bridge_response",
      status: res.status,
      responseInvalid: true,
    });
  }
}

// ---------- offline cache (IndexedDB) ----------
// Recently-opened threads and the session list are cached so the app reads fully
// offline. On open we paint from cache instantly, then revalidate from the
// network; heavy tool output/diffs are trimmed to keep entries small.
const IDB_NAME = "remote-agents";
const IDB_STORE = "cache";
const MAX_CACHED_TURNS = 40;
const MAX_FIELD_CHARS = 4000;
let _idbPromise = null;

function idbOpen() {
  if (_idbPromise) { return _idbPromise; }

  _idbPromise = new Promise((resolve, reject) => {
    let req;

    try {
      req = indexedDB.open(IDB_NAME, 1);
    } catch (e) {
      reject(e);
      return;
    }

    req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });

  return _idbPromise;
}

async function idbGet(key) {
  try {
    const db = await idbOpen();

    return await new Promise((resolve, reject) => {
      const r = db.transaction(IDB_STORE, "readonly").objectStore(IDB_STORE).get(key);
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    });
  } catch {
    return undefined;
  }
}

async function idbSet(key, val) {
  try {
    const db = await idbOpen();

    await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, "readwrite");
      tx.objectStore(IDB_STORE).put(val, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  } catch {
    // storage unavailable / evicted — cache is best-effort
  }
}

async function idbDel(key) {
  try {
    const db = await idbOpen();

    await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, "readwrite");
      tx.objectStore(IDB_STORE).delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  } catch {
    // storage unavailable — cache is best-effort
  }
}

function threadCacheKey(provider, id) { return "th:" + (provider || "codex") + ":" + id; }

function fileCacheKey(cwd, path) { return "file:" + (cwd || "") + ":" + path; }

// Files you open are kept for offline reading, oldest evicted past the budget.
const FILE_CACHE_MAX_BYTES = 5 * 1024 * 1024;

async function cacheFile(cwd, path, data) {
  if (!data || data.binary) { return; }

  const key = fileCacheKey(cwd, path);
  await idbSet(key, { ...data, cachedAt: Date.now() });

  const idx = (await idbGet("fileidx")) || [];
  const rest = idx.filter((e) => e.key !== key);
  rest.push({ key, size: (data.content || "").length, at: Date.now() });
  rest.sort((a, b) => a.at - b.at);
  let total = rest.reduce((n, e) => n + (e.size || 0), 0);

  while (total > FILE_CACHE_MAX_BYTES && rest.length > 1) {
    const oldest = rest.shift();
    total -= oldest.size || 0;
    await idbDel(oldest.key);
  }

  await idbSet("fileidx", rest);
}

function listCacheKey(provider) { return "list:" + (provider || "codex"); }

// Keep the last N turns; truncate large command output and diffs to a preview.
function trimThreadForCache(thread) {
  const clip = (s) => (typeof s === "string" && s.length > MAX_FIELD_CHARS ? s.slice(0, MAX_FIELD_CHARS) + "\n… (truncated — open online for the full text)" : s);
  const turns = (thread?.turns ?? []).slice(-MAX_CACHED_TURNS).map((turn) => ({
    items: (turn.items ?? []).map((it) => {
      const c = { ...it };

      if (typeof c.aggregatedOutput === "string") { c.aggregatedOutput = clip(c.aggregatedOutput); }

      if (Array.isArray(c.changes)) { c.changes = c.changes.map((ch) => ({ ...ch, diff: clip(ch.diff) })); }

      return c;
    }),
  }));

  return { turns };
}

function setOfflineNote(on, reach) {
  document.body.classList.toggle("offline", !!on);
  const label = on ? (effectiveReach(reach) === "host" ? "Mac offline" : "Offline") : "Connected";
  if (on) { $("offlinePill").textContent = label; }
  $("connDot").title = label;
  $("connDot").setAttribute("aria-label", label);
}

// ---------- helpers ----------
function relTime(sec) {
  const d = Math.floor(Date.now() / 1000) - sec;

  if (d < 60) { return "just now"; }
  if (d < 3600) { return Math.floor(d / 60) + "m ago"; }
  if (d < 86400) { return Math.floor(d / 3600) + "h ago"; }
  return Math.floor(d / 86400) + "d ago";
}

function relFuture(sec) {
  const d = sec - Math.floor(Date.now() / 1000);

  if (d <= 0) { return "now"; }
  if (d < 3600) { return "in " + Math.ceil(d / 60) + "m"; }
  if (d < 86400) { return "in " + Math.round(d / 3600) + "h"; }
  return "in " + Math.round(d / 86400) + "d";
}

function fmtTokens(n) {
  if (n == null) { return ""; }
  if (n < 1000) { return n + ""; }
  if (n < 1e6) { return (n / 1e3).toFixed(n < 1e4 ? 1 : 0) + "k"; }
  return (n / 1e6).toFixed(1) + "M";
}

function fmtBytes(n) {
  if (n == null) { return ""; }
  if (n < 1024) { return n + " B"; }
  if (n < 1048576) { return (n / 1024).toFixed(1) + " KB"; }
  return (n / 1048576).toFixed(1) + " MB";
}

const ICONS = {
  cmd: '<svg class="ic" viewBox="0 0 24 24"><path d="M4 5l7 7-7 7M13 19h7"/></svg>',
  file: '<svg class="ic" viewBox="0 0 24 24"><path d="M14 3v5h5M14 3H6v18h12V8z"/></svg>',
  tool: '<svg class="ic" viewBox="0 0 24 24"><path d="M14 7a4 4 0 0 1-5 5l-5 5 2 2 5-5a4 4 0 0 0 5-5z"/></svg>',
  web: '<svg class="ic" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 18 0 9 9 0 0 0-18 0zM3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>',
  plan: '<svg class="ic" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>',
  spin: '<svg class="ic" viewBox="0 0 24 24" style="animation:spin 1s linear infinite"><path d="M12 3a9 9 0 1 0 9 9" style="opacity:.9"/></svg>',
};

function bellSvg() {
  return '<svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>';
}

function threadRuleKey(provider, threadId) { return `${provider || "codex"}:${threadId}`; }

// Every session currently on screen. Starred sessions are held separately so
// they can be pinned above the list, so anything that looks a thread up by id
// has to consult both.
function listedThreads() { return state.starredThreads.concat(state.threads); }

// A child is part of the parent task for notification purposes. This avoids a
// burst when several workers finish while still letting the child transcript
// remain independently navigable.
function notificationTarget(thread) {
  if (!thread?.parentThreadId) { return thread; }
  // A starred parent lives in the pinned block, not in state.threads.
  return listedThreads().find((candidate) => candidate.id === thread.parentThreadId) || {
    id: thread.parentThreadId,
    provider: thread.provider || "codex",
    name: "Parent task",
  };
}

function syncNotifyButton() {
  const btn = $("notifyBtn");
  const target = notificationTarget(state.active);
  const mode = target && state.notificationRules.get(threadRuleKey(target.provider, target.id));
  btn.classList.toggle("on", !!mode);
  btn.style.color = mode ? "var(--accent)" : "";
  btn.title = mode === "once" ? "Notify once" : mode === "follow" ? "Following this task" : "Task notifications";
  btn.setAttribute("aria-label", btn.title);
}
const styleSpin = document.createElement("style");
styleSpin.textContent = "@keyframes spin{to{transform:rotate(360deg)}}";
document.head.appendChild(styleSpin);

// ---------- session list ----------
function runPresentation(running, confidence) {
  if (running && confidence === "stalled") {
    return { visible: true, label: "no recent activity", className: "stalled" };
  }

  if (!running && confidence === "stale_timeout") {
    return { visible: true, label: "likely stopped", className: "abnormal" };
  }

  return { visible: running, label: "running", className: "" };
}

function liveRunText(confidence) {
  return confidence === "stalled"
    ? "No recent activity — the provider may be stalled"
    : "Running — following live";
}

function rebuildProjectGroups() {
  const byPath = new Map();

  for (const thread of state.threads) {
    const path = String(thread.cwd ?? "").trim();
    const key = path || "__unknown_project__";
    const name = path ? path.split(/[\\/]/).filter(Boolean).pop() || path : "Other sessions";
    const group = byPath.get(key) ?? { key, path: path || null, name, threads: [], running: false, updatedAt: 0 };
    group.threads.push(thread);
    group.running ||= isThreadRunning(thread);
    group.updatedAt = Math.max(group.updatedAt, Number(thread.updatedAt ?? 0));
    byPath.set(key, group);
  }

  const groups = [...byPath.values()];
  const nameCounts = new Map();
  for (const group of groups) { nameCounts.set(group.name, (nameCounts.get(group.name) ?? 0) + 1); }
  for (const group of groups) {
    group.displayName = group.path && nameCounts.get(group.name) > 1
      ? group.path.split(/[\\/]/).filter(Boolean).slice(-2).join("/")
      : group.name;
  }

  state.projectGroups = groups
    .map((group) => ({ ...group, threads: rankLiveThreads(group.threads, state.running) }))
    .sort((a, b) => Number(a.key === "__unknown_project__") - Number(b.key === "__unknown_project__")
      || Number(b.running) - Number(a.running) || b.updatedAt - a.updatedAt || a.name.localeCompare(b.name) || String(a.path ?? "").localeCompare(String(b.path ?? "")));
  state.threads = state.projectGroups.flatMap((group) => group.threads);
}

function renderRows(append) {
  const rows = $("rows");

  if (!append) { rows.innerHTML = ""; renderPinnedRows(); }

  const start = append ? rows.querySelectorAll(".row").length : 0;
  const projectStarts = new Map();
  const projectByThread = new Map();

  if (state.listView === "projects") {
    let projectIndex = 0;
    for (const group of state.projectGroups) {
      projectStarts.set(projectIndex, group);
      for (const thread of group.threads) { projectByThread.set(threadRuleKey(thread.provider, thread.id), group); }
      projectIndex += group.threads.length;
    }
  }

  for (let index = start; index < state.threads.length; index += 1) {
    if (state.listView === "recent" && index === state.featuredCount && index > 0) {
      const divider = document.createElement("div");
      divider.className = "section-divider";
      divider.textContent = "More sessions";
      rows.appendChild(divider);
    }

    const project = projectStarts.get(index);
    if (project) {
      const collapsed = state.collapsedProjects.has(project.key);
      const runningCount = project.threads.filter((thread) => isThreadRunning(thread)).length;
      const header = document.createElement("button");
      header.type = "button";
      header.className = "project-head" + (collapsed ? " collapsed" : "");
      header.title = project.path || project.name;
      header.innerHTML = `<span aria-hidden="true">📁</span><span class="project-chev" aria-hidden="true">›</span><span class="project-name"></span><span class="project-count ${runningCount ? "project-running" : ""}"></span>`;
      header.querySelector(".project-name").textContent = project.displayName || project.name;
      header.querySelector(".project-count").textContent = runningCount ? `${runningCount} running · ${project.threads.length}` : `${project.threads.length}`;
      header.setAttribute("aria-expanded", String(!collapsed));
      header.onclick = () => {
        if (state.collapsedProjects.has(project.key)) { state.collapsedProjects.delete(project.key); }
        else { state.collapsedProjects.add(project.key); }
        renderRows(false);
      };
      rows.appendChild(header);
    }

    const t = state.threads[index];
    rows.appendChild(buildThreadRow(t, projectByThread.get(threadRuleKey(t.provider, t.id))));
  }

  if (!state.threads.length && !state.starredThreads.length) { rows.innerHTML = '<div class="empty">No sessions found</div>'; }

  $("loadMore").textContent = "Load more sessions";
  $("loadMore").style.display = state.listView === "recent" && state.nextCursor ? "block" : "none";
}

function applyStarredPartition({ pinned = [], append = false, search = "" } = {}) {
  // While searching, everything stays in the ordinary list. Pulling favourites
  // out while the pinned block is suppressed would hide them from their own
  // search results.
  if (search) {
    state.starredThreads = [];
    return;
  }

  if (append) {
    // The pinned block was built from page one and is already complete. An
    // appended page only has to avoid drawing a pinned session a second time.
    state.threads = partitionStarredThreads(state.threads, state.starred).rest;
    return;
  }

  // Server-hydrated pins are sessions too old to be on the page at all; merge
  // them in so they take exactly the same path as everything else.
  const seen = new Set();
  const rows = [];

  for (const thread of state.threads.concat(pinned ?? [])) {
    const key = threadRuleKey(thread.provider, thread.id);
    if (seen.has(key)) { continue; }
    seen.add(key);
    rows.push(thread);
  }

  const starredInFeatured = rows.slice(0, state.featuredCount)
    .filter((thread) => state.starred.has(threadRuleKey(thread.provider, thread.id))).length;
  const { starred, rest } = partitionStarredThreads(rows, state.starred, (subset) => rankLiveThreads(subset, state.running));

  state.starredThreads = starred;
  state.threads = rest;
  // featuredCount is a position, not a property of any row, so it has to shrink
  // by however many pinned rows sat inside it or the "More sessions" divider
  // lands in the wrong place.
  state.featuredCount = Math.max(0, state.featuredCount - starredInFeatured);
}

// The pinned block lives in its own container rather than at the top of #rows.
// renderRows' append path derives its start index from a count of DOM rows, so
// pinned rows inside #rows would desync that index and silently skip sessions
// on every "Load more".
function renderPinnedRows() {
  const host = $("pinnedRows");
  host.innerHTML = "";
  // A search is a query; pinning must not fight it.
  const pinned = $("search").value.trim() ? [] : state.starredThreads;

  if (!pinned.length) { return; }

  const divider = document.createElement("div");
  divider.className = "section-divider";
  divider.textContent = "Starred";
  host.appendChild(divider);

  for (const thread of pinned) { host.appendChild(buildThreadRow(thread, null)); }
}

function buildThreadRow(t, threadProject) {
  const div = document.createElement("div");
  const selected = !!state.active && (state.active.parentThreadId || state.active.id) === t.id && activeProvider() === (t.provider || "codex");
  div.className = "row" + (selected ? " active-thread" : "");
  div.dataset.tid = t.id;
  div.dataset.provider = t.provider || "codex";
  if (threadProject) {
    div.dataset.project = threadProject.key;
    div.hidden = state.collapsedProjects.has(threadProject.key);
  }
  const dir = (t.cwd || "").split("/").pop() || "";
  const runningNow = isThreadRunning(t);
  const runState = runPresentation(runningNow, state.runConfidence.get(runKey(t.provider, t.id)) ?? t.runConfidence);
  const childCount = t.subagents?.length ?? 0;
  const expanded = state.expandedSubagents.has(t.id);
  const notifyMode = state.notificationRules.get(threadRuleKey(t.provider, t.id));
  const showReady = state.listView === "recent" && !runningNow && runState.className !== "abnormal";
  const subagentListId = "subagents-" + String(t.id).replace(/[^a-zA-Z0-9_-]/g, "");
  div.innerHTML = `<div class="row-head"><button class="row-copy" type="button"${selected ? ' aria-current="true"' : ""}><div class="titleline"><span class="chip prov"></span><div class="preview"></div></div><div class="meta">
    <span class="chip run-badge ${runState.className}" style="display:${runState.visible ? "inline-flex" : "none"}"><span class="run-dot"></span><span class="run-label">${runState.label}</span></span>
    <span class="chip ready-badge" style="display:${showReady ? "inline-flex" : "none"}">ready</span>
    <span class="chip origin-badge" style="display:${t.origin === "agent" ? "inline-flex" : "none"}">agent</span>
    <span class="chip dir"></span>
    <span class="chip time"></span></div></button><div class="row-actions">
    ${childCount ? `<button class="row-action subagent-action ${expanded ? "expanded" : ""}" aria-expanded="${expanded}" aria-controls="${subagentListId}"><span>${childCount} subagent${childCount === 1 ? "" : "s"}</span><span class="chevron">›</span></button>` : ""}
    <button class="row-action notify-action ${notifyMode ? "on" : ""}" aria-label="${notifyMode ? "Task notifications on" : "Task notifications"}" aria-haspopup="dialog" title="Task notifications">${bellSvg()}</button>
    </div></div><div class="subagents ${expanded ? "open" : ""}" id="${subagentListId}"></div>`;
  div.querySelector(".preview").textContent = t.name || t.preview || "(empty session)";
  const providerMark = div.querySelector(".prov");
  const providerName = PROVIDER_LABELS[t.provider] || "Codex";
  const providerIcon = document.createElement("img");
  providerIcon.src = PROVIDER_ICONS[t.provider] || PROVIDER_ICONS.codex;
  providerIcon.alt = "";
  providerMark.appendChild(providerIcon);
  providerMark.title = providerName;
  providerMark.setAttribute("role", "img");
  providerMark.setAttribute("aria-label", providerName);
  providerMark.style.display = state.providerScope === "all" ? "inline-flex" : "none";
  div.querySelector(".dir").textContent = "📁 " + dir;

  div.querySelector(".time").textContent = relTime(t.updatedAt);
  div.querySelector(".notify-action").onclick = (event) => {
    event.stopPropagation();
    openTaskNotificationSheet(t);
  };

  const disclosure = div.querySelector(".subagent-action");
  const childList = div.querySelector(".subagents");

  if (disclosure) {
    disclosure.onclick = (event) => {
      event.stopPropagation();
      const on = !state.expandedSubagents.has(t.id);
      if (on) { state.expandedSubagents.add(t.id); } else { state.expandedSubagents.delete(t.id); }
      disclosure.classList.toggle("expanded", on);
      disclosure.setAttribute("aria-expanded", String(on));
      childList.classList.toggle("open", on);
    };
  }

  for (const child of t.subagents ?? []) {
    const childRow = document.createElement("button");
    const childRunning = isRunning(child.provider || t.provider, child.id);
    const childProvider = child.provider || t.provider || "codex";
    const childRunState = runPresentation(childRunning, state.runConfidence.get(runKey(childProvider, child.id)) ?? child.runConfidence);
    const childSelected = !!state.active && state.active.id === child.id && activeProvider() === (child.provider || t.provider || "codex");
    childRow.className = "subagent-row" + (childSelected ? " active-subagent" : "");
    childRow.type = "button";
    childRow.dataset.tid = child.id;
    childRow.dataset.provider = childProvider;
    if (childSelected) { childRow.setAttribute("aria-current", "true"); }
    childRow.innerHTML = `<div class="subagent-copy"><div class="subagent-name"></div><div class="subagent-path"></div></div>
      <span class="chip run-badge ${childRunState.className}" style="display:${childRunState.visible ? "inline-flex" : "none"}"><span class="run-dot"></span><span class="run-label">${childRunState.label}</span></span>
      <span class="chip time"></span>`;
    childRow.querySelector(".subagent-name").textContent = child.agentNickname || child.name || child.preview || "Subagent";
    childRow.querySelector(".subagent-path").textContent = child.agentPath || child.preview || "Child task";
    childRow.querySelector(".time").textContent = relTime(child.updatedAt);
    childRow.onclick = (event) => {
      event.stopPropagation();
      openThread({
        ...child,
        name: child.agentNickname || child.name || "Subagent",
        provider: child.provider || t.provider,
        parentThreadId: t.id,
      });
    };
    childList.appendChild(childRow);
  }

  div.querySelector(".row-copy").onclick = (event) => {
    event.stopPropagation();
    openThread(t);
  };
  div.onclick = () => openThread(t);
  return div;
}

async function loadThreads(append) {
  const q = new URLSearchParams();
  const search = $("search").value.trim();
  const provider = state.provider;
  const providerScope = state.providerScope;
  const listView = state.listView;
  const showAgents = state.showAgentSessions;
  const requestSeq = ++state.listRequestSeq;

  q.set("provider", providerScope);
  q.set("origin", showAgents ? "all" : "mine");

  if (append && state.nextCursor) { q.set("cursor", state.nextCursor); }

  if (search) { q.set("search", search); }

  try {
    const path = listView === "recent" ? "/api/threads/recent?" : "/api/threads/projects?";
    let res;

    try {
      res = await api(path + q);
    } catch (error) {
      // During a safe live rollout the static PWA can refresh before the bridge
      // process is restarted (we never restart over active turns). Older
      // bridges do not have the aggregate endpoint yet, so fan out through the
      // existing provider endpoint until the process can be upgraded safely.
      if (error.status !== 404) { throw error; }
      if (listView === "projects") {
        throw Object.assign(new Error("Projects needs the current bridge version. Running agents were left untouched; restart the bridge when they are idle."), { code: "bridge_update_required" });
      }

      const providerNames = providerScope === "all" ? Object.keys(PROVIDER_LABELS) : [providerScope];
      const providerResults = await Promise.allSettled(providerNames.map(async (name) => {
        const data = [];
        let cursor = null;

        const providerQuery = new URLSearchParams();
        providerQuery.set("provider", name);
        if (search) { providerQuery.set("search", search); }
        const page = await api("/api/threads?" + providerQuery);
        data.push(...(page.data ?? []));
        cursor = page.nextCursor ?? null;

        return { name, data, nextCursor: cursor };
      }));
      const groups = [];
      const unavailableProviders = [];

      for (let index = 0; index < providerResults.length; index += 1) {
        const result = providerResults[index];

        if (result.status === "fulfilled") { groups.push(result.value.data); }
        else { unavailableProviders.push(providerNames[index]); }
      }

      let data = groups.flat().sort((a, b) => Number(!!b.running) - Number(!!a.running) || Number(b.updatedAt ?? 0) - Number(a.updatedAt ?? 0));
      if (providerScope !== "all") { data = data.filter((thread) => (thread.provider || "codex") === providerScope); }
      res = { data, featuredCount: Math.min(10, data.length), nextCursor: null, unavailableProviders };
    }

    // Bridges before provider scoping accepted this query parameter but ignored
    // it. Filter again in the client so an upgraded shell never lies about its
    // visible scope while a safe bridge restart is deferred.
    if (listView === "recent" && providerScope !== "all") {
      res = { ...res, data: (res.data ?? []).filter((thread) => (thread.provider || "codex") === providerScope) };
    }

    // A view/provider/search switch can finish requests out of order. Only the
    // newest request may update the list.
    if (requestSeq !== state.listRequestSeq || state.listView !== listView || state.providerScope !== providerScope || state.showAgentSessions !== showAgents) { return; }

    if (append && listView === "recent") {
      const existing = new Set(listedThreads().map((thread) => `${thread.provider}:${thread.id}`));
      state.threads = state.threads.concat((res.data ?? []).filter((thread) => !existing.has(`${thread.provider}:${thread.id}`)));
    } else if (listView === "recent") {
      state.threads = append ? state.threads.concat(res.data) : res.data;
      state.projectGroups = [];
    } else {
      state.threads = res.data ?? [];
      state.projectGroups = [];
    }
    state.nextCursor = listView === "recent" ? res.nextCursor : null;
    if (!append) { state.featuredCount = listView === "recent" ? (res.featuredCount ?? Math.min(10, res.data?.length ?? 0)) : 0; }
    state.unavailableProviders = res.unavailableProviders ?? [];
    if (!append) { state.hiddenAgentCount = Number(res.hiddenAgentCount) || 0; }

    // The server read each thread's run state off disk, which is the only way to
    // know about turns that were already under way before this app connected.
    for (const t of (listView === "projects" ? state.threads : res.data ?? [])) {
      const ourTurn = state.active && t.id === state.active.id && state.busy && !state.externalTurn;
      const threadProvider = t.provider || provider;

      if (!ourTurn) { markRunning(threadProvider, t.id, !!t.running, { confidence: t.runConfidence, live: false }); }

      for (const child of t.subagents ?? []) {
        markRunning(child.provider || threadProvider, child.id, !!child.running, { confidence: child.runConfidence, live: false });
      }
    }

    // Provider events and this fetch can cross in flight. Rank from the live
    // running set immediately before painting so an older response can never
    // put a now-running task back in its previous position. This is an invariant
    // in both Recent Work and the provider-specific Agents view.
    if (listView === "recent") { state.threads = rankLiveThreads(state.threads, state.running); }

    // Partition before the project grouping so a pinned session is never also
    // drawn inside its folder: the header count would stop matching the rows
    // beneath it, and the selected row would highlight in two places at once.
    applyStarredPartition({ pinned: res.pinned, append: listView === "recent" && append, search });

    if (listView === "projects") { rebuildProjectGroups(); }

    const previousListTop = $("listView").scrollTop;
    renderRows(listView === "recent" && append);
    if (listView === "recent" && append) { $("listView").scrollTop = previousListTop; }
    updateListChrome();
    setOfflineNote(false);

    // Cache the first page (no search) so the list renders offline.
    if (!append && !search) { idbSet(listCacheKey(`${listView}:${providerScope}:${showAgents ? "all" : "mine"}`), { data: listedThreads(), groups: state.projectGroups, nextCursor: state.nextCursor, featuredCount: state.featuredCount }); }
  } catch (e) {
    // Offline / unreachable — fall back to the last cached copy of this view.
    if (append || search) { throw e; }

    if (e.code === "bridge_update_required") {
      state.unavailableProviders = [];
      $("listNotice").style.display = "block";
      $("listNotice").textContent = e.message;
      $("rows").innerHTML = '<div class="empty">Projects will be available after the safe bridge refresh.</div>';
      return;
    }

    const cached = await idbGet(listCacheKey(`${listView}:${providerScope}:${showAgents ? "all" : "mine"}`));

    if (cached?.data && requestSeq === state.listRequestSeq && state.listView === listView && state.providerScope === providerScope && state.showAgentSessions === showAgents) {
      state.threads = cached.data;
      state.projectGroups = cached.groups ?? [];
      state.nextCursor = null;
      state.featuredCount = listView === "recent" ? (cached.featuredCount ?? Math.min(10, cached.data.length)) : 0;
      state.unavailableProviders = [];
      // The cache stores the unpartitioned list, so favourites survive offline.
      applyStarredPartition();
      renderRows(false);
      updateListChrome();
      setOfflineNote(true, e.reach);
    } else {
      const label = listView === "recent" ? "recent work" : "projects";
      $("rows").innerHTML = '<div class="empty">' + esc(offlineWord(e.reach) + " — no saved sessions for " + label + ".") + "</div>";
    }
  }
}

function updateListChrome() {
  const scopeLabel = state.providerScope === "all" ? "all agents" : (PROVIDER_LABELS[state.providerScope] || "agent");
  $("providerSeg").style.display = "flex";
  $("search").placeholder = state.listView === "projects"
    ? state.providerScope === "all" ? "Search projects…" : `Search ${scopeLabel} projects…`
    : `Search ${scopeLabel}…`;
  $("viewSeg").querySelectorAll("[data-view]").forEach((button) => {
    const selected = button.dataset.view === state.listView;
    button.classList.toggle("on", selected);
    button.setAttribute("aria-pressed", String(selected));
  });
  // The checkbox is also the hidden-count indicator: one control both explains
  // the default and undoes it.
  $("agentToggleInput").checked = state.showAgentSessions;
  $("agentToggleText").textContent = !state.showAgentSessions && state.hiddenAgentCount
    ? `Show agent-made sessions (${state.hiddenAgentCount} hidden)`
    : "Show agent-made sessions";

  // The agent filter stays literal — an out-of-scope favourite is not shown —
  // but a favourite you cannot find is the failure this notice exists to
  // prevent. Both notes share the line so neither can hide the other.
  const notes = [];

  if (state.unavailableProviders.length) {
    notes.push("Some sessions may be missing: " + state.unavailableProviders.map((p) => PROVIDER_LABELS[p] || p).join(", ") + " could not be refreshed.");
  }

  const hidden = hiddenStarCount();

  if (hidden) {
    notes.push(`★ ${hidden} starred session${hidden === 1 ? "" : "s"} hidden by the current agent filter.`);
  }

  const notice = $("listNotice");
  notice.style.display = notes.length ? "block" : "none";
  notice.textContent = notes.join(" · ");

  // On desktop the list remains a live sidebar while a conversation is open.
  // Keep its filters accurate without replacing the chat title in the header.
  if (state.active) { return; }

  $("viewSeg").style.display = "flex";
  $("hTitle").textContent = state.listView === "projects" ? "Projects" : "Recent Sessions";
  $("hSub").textContent = state.unavailableProviders.length
    ? "Partial sync · " + state.unavailableProviders.map((p) => PROVIDER_LABELS[p] || p).join(", ") + " unavailable"
    : "";
}

// Stars are held keyed by provider, so this never has to parse a provider back
// out of a "provider:threadId" string.
function hiddenStarCount() {
  if (state.providerScope === "all" || $("search").value.trim()) { return 0; }

  let hidden = 0;

  for (const star of state.starred.values()) {
    if ((star.provider || "codex") !== state.providerScope) { hidden += 1; }
  }

  return hidden;
}

function syncSidebarToggle() {
  const collapsed = !!state.sidebarCollapsed;
  document.body.classList.toggle("sidebar-collapsed", collapsed);
  $("sidebarToggleBtn").classList.toggle("collapsed", collapsed);
  $("sidebarToggleBtn").setAttribute("aria-expanded", String(!collapsed));
  $("sidebarToggleBtn").setAttribute("aria-label", collapsed ? "Show session sidebar" : "Hide session sidebar");
  $("sidebarToggleBtn").title = collapsed ? "Show session sidebar" : "Hide session sidebar";
}

function toggleSidebar(forceExpanded = false) {
  state.sidebarCollapsed = forceExpanded ? false : !state.sidebarCollapsed;
  syncSidebarToggle();
  persistPrefs();
}

function syncProviderSeg() {
  $("providerSeg").querySelectorAll("[data-provider]").forEach((button) => {
    const selected = button.dataset.provider === state.providerScope;
    button.classList.toggle("on", selected);
    button.setAttribute("aria-pressed", String(selected));
  });
}

async function switchListView(view) {
  if (!['recent', 'projects'].includes(view) || view === state.listView) { return; }

  state.listView = view;
  state.threads = [];
  state.starredThreads = [];
  state.projectGroups = [];
  state.nextCursor = null;
  state.featuredCount = 0;
  state.unavailableProviders = [];
  $("search").value = "";
  $("pinnedRows").innerHTML = "";
  $("rows").innerHTML = '<div class="empty">Loading…</div>';
  updateListChrome();
  persistPrefs();
  await loadThreads(false);
}

// ---------- chat rendering ----------
function box() { return $("messages"); }

// Auto-scroll is *sticky*, not forced: a running turn appends constantly, and
// yanking the view to the bottom while you are reading further up makes a live
// thread unusable. Stickiness is tracked from the scroll event rather than
// measured at append time — by the time these callers run, the new content is
// already in the DOM, so scrollHeight has grown and "are we at the bottom?" no
// longer answers "were we at the bottom before this arrived?".
const STICK_PX = 120;
let stickToBottom = true;
// Bumped by anything that positions the transcript deliberately, so an
// auto-scroll queued a frame earlier cannot land on top of it.
let scrollSeq = 0;

function atBottom() {
  const b = box();
  return b.scrollHeight - b.scrollTop - b.clientHeight < STICK_PX;
}

// force is for scrolls the user themselves caused — sending a message, opening
// a thread — where landing at the bottom is the whole point.
function scrollDown({ force = false } = {}) {
  if (!force && !stickToBottom) {
    $("jumpBtn").classList.add("unread");
    return;
  }

  const b = box();
  const seq = ++scrollSeq;

  requestAnimationFrame(() => {
    // Superseded: something restored a saved position after this was queued,
    // and that restore is the newer intent.
    if (seq !== scrollSeq) { return; }

    b.scrollTop = b.scrollHeight;
    // Only once the scroll has actually happened. Setting it up front left a
    // window in which a caller that restores a saved position afterwards —
    // resync, loadEarlier — had already been recorded as following the bottom,
    // so the next delta would yank the reader down.
    stickToBottom = true;
    updateJumpBtn();
  });
}

function updateJumpBtn() {
  const btn = $("jumpBtn");
  btn.classList.toggle("on", !stickToBottom);

  if (stickToBottom) { btn.classList.remove("unread"); }
}

// After code moves the scroll position itself, rather than waiting for the
// scroll event to catch up.
function syncStick() {
  scrollSeq++;
  stickToBottom = atBottom();
  updateJumpBtn();
}

// own: this device just sent it, so jumping to it is what the user asked for.
// A user message arriving from the transcript — replayed history, or another
// device typing into the same thread — must not move anyone's viewport.
function attachmentUrl(id) { return "/api/attachment?id=" + encodeURIComponent(id); }

function viewAttachment(attachment) {
  if (!attachment?.id) { return; }
  const viewer = $("imageViewer");
  const img = viewer.querySelector("img");
  img.src = attachmentUrl(attachment.id);
  img.alt = attachment.name || "Attached image preview";
  viewer.classList.add("show");
  viewer.focus();
}

function closeAttachmentViewer() {
  const viewer = $("imageViewer");
  viewer.classList.remove("show");
  viewer.querySelector("img").removeAttribute("src");
}

function addUser(text, { own = false, attachments = [], imageCount = 0 } = {}) {
  resetActivityGroup();
  const el = document.createElement("div");
  el.className = "msg user";

  const count = Math.max(attachments.length, imageCount);

  if (count) {
    const images = document.createElement("div");
    images.className = "user-images";

    for (let index = 0; index < count; index++) {
      const attachment = attachments[index];

      if (attachment?.id) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "image-thumb";
        button.setAttribute("aria-label", `View ${attachment.name || "attached image"}`);
        button.onclick = () => viewAttachment(attachment);
        const img = document.createElement("img");
        img.src = attachmentUrl(attachment.id);
        img.alt = attachment.name || "Attached image";
        button.appendChild(img);
        images.appendChild(button);
      } else {
        const placeholder = document.createElement("div");
        placeholder.className = "image-placeholder";
        placeholder.textContent = "Image attached";
        images.appendChild(placeholder);
      }
    }

    el.appendChild(images);
  }

  if (text) {
    const body = document.createElement("div");
    body.className = "user-text";
    body.textContent = text;
    el.appendChild(body);
  }

  box().appendChild(el);
  scrollDown({ force: own });
  return el;
}

// A message can be rendered twice: once from the session file, once from the
// live delta stream. Without a shared identity the second render appends a
// duplicate bubble whose "streaming" class nothing can ever clear, leaving a
// blinking caret behind forever. The newer render is the truth, so it replaces
// any earlier bubble for the same item.
function addAgent(text, streaming, itemId) {
  resetActivityGroup();
  if (itemId) { findItemEl(itemId)?.remove(); }
  const el = document.createElement("div");
  el.className = "msg agent md" + (streaming ? " streaming" : "");
  if (itemId) { el.dataset.itemId = itemId; }
  el._raw = text || "";
  if (streaming) {
    el.innerHTML = renderMarkdown(el._raw);
    decorateMarkdownLinks(el);
  }
  else { renderFinalMarkdownInto(el, el._raw); }
  registerFilesFromEl(el);
  box().appendChild(el);
  scrollDown();
  return el;
}

// Append streamed text and re-render markdown live.
function appendAgent(el, delta) {
  el._raw = (el._raw || "") + (delta || "");
  el.innerHTML = renderMarkdown(el._raw);
  decorateMarkdownLinks(el);
}

function makeBlock(cls, iconHtml, label, opts = {}) {
  const el = document.createElement("div");
  el.className = "block " + cls + (opts.open ? " open" : "");
  el.innerHTML = `<div class="bhead">${iconHtml}<span class="ttl"><span class="lbl"></span><span class="sub"></span></span><span class="st"></span><span class="chev">›</span></div><div class="body"></div>`;
  el.querySelector(".lbl").textContent = label;

  // A secondary line under the label — used to keep the raw command visible
  // beneath the summary of what it is for.
  if (opts.sub) {
    const sub = el.querySelector(".sub");
    sub.textContent = opts.sub;
    sub.classList.add("on");
  }
  el.querySelector(".bhead").onclick = () => el.classList.toggle("open");
  (opts.parent || box()).appendChild(el);
  scrollDown();
  return el;
}

function setBlockStatus(el, text, cls) {
  const s = el.querySelector(".st");
  s.textContent = text || "";
  s.className = "st " + (cls || "");
}

function renderDiffInto(pre, diff) {
  pre.classList.add("diff");
  pre.innerHTML = diff.split("\n").map((l) => {
    if (l.startsWith("+++") || l.startsWith("---")) { return `<span class="l-meta">${esc(l)}</span>`; }
    if (l.startsWith("@@")) { return `<span class="l-hdr">${esc(l)}</span>`; }
    if (l.startsWith("+")) { return `<span class="l-add">${esc(l)}</span>`; }
    if (l.startsWith("-")) { return `<span class="l-del">${esc(l)}</span>`; }
    return `<span>${esc(l)}</span>`;
  }).join("");
}

// render one finalized item (history or item/completed)
// The agent's own one-line account of what a tool call is for. Providers that
// carry it use different field names, and plenty of calls have none at all.
function summaryOf(item) {
  const raw = item.description ?? item.title ?? item.summary;
  const s = (typeof raw === "string" ? raw : "").replace(/\s+/g, " ").trim();

  // Not a summary if it is just the command repeated back.
  if (!s || s === (item.command ?? "").trim()) { return ""; }

  return s.length > 120 ? s.slice(0, 119) + "…" : s;
}

// Codex reasoning arrives as summary prose, often several paragraphs with a
// bold heading per section. The header shows the most recent heading — the
// closest thing to "what it is thinking about right now".
function latestSummaryLine(text) {
  const lines = (text || "").split("\n").map((l) => l.trim()).filter(Boolean);
  const clip = (s) => (s.length > 90 ? s.slice(0, 89) + "…" : s);

  // Codex writes each summary section as a bold heading followed by prose, and
  // the heading is what reads as "what it is working on". Prose caught mid-
  // stream is a sentence fragment, so headings win when there is one.
  for (let i = lines.length - 1; i >= 0; i--) {
    const m = /^\*\*(.+?)\*\*[.:]?$/.exec(lines[i]) || /^#+\s*(.+)$/.exec(lines[i]);

    if (m) { return clip(m[1].trim()); }
  }

  for (let i = lines.length - 1; i >= 0; i--) {
    const bare = lines[i].replace(/\*\*/g, "").replace(/^#+\s*/, "").trim();

    if (bare) { return clip(bare); }
  }

  return "";
}

const ACTIVITY_TYPES = new Set(["reasoning", "commandExecution", "fileChange", "mcpToolCall", "webSearch"]);

function isCodexActivity(item) {
  return activeProvider() === "codex" && ACTIVITY_TYPES.has(item?.type);
}

function clipActivity(text, length = 110) {
  const s = (text || "").replace(/\s+/g, " ").trim();
  return s.length > length ? s.slice(0, length - 1) + "…" : s;
}

function reasoningText(item) {
  return Array.isArray(item.summary) ? item.summary.join("\n\n") : (item.content || "");
}

function diffCounts(changes) {
  let added = 0;
  let removed = 0;

  for (const change of changes ?? []) {
    for (const line of (change.diff || "").split("\n")) {
      if (line.startsWith("+") && !line.startsWith("+++")) { added++; }
      if (line.startsWith("-") && !line.startsWith("---")) { removed++; }
    }
  }

  return { added, removed };
}

// This is the one shared description used by replay, live updates, and the
// settled digest. Keeping it independent of the row renderer prevents the
// collapsed view from drifting away from what the expanded item contains.
function activityLabel(item) {
  switch (item?.type) {
    case "reasoning":
      return latestSummaryLine(reasoningText(item)) || "Thinking…";
    case "commandExecution": {
      const why = summaryOf(item);

      if (why) { return why; }

      // A bare command reads as a code snippet dropped between messages, which
      // is what made a whole tool stretch look like "the agent ran this one
      // line". A verb makes it an action, and its tense says whether it is
      // still going.
      const done = item.exitCode != null || item.status === "completed";
      return clipActivity(`${done ? "Ran" : "Running"} ${item.command || "a command"}`);
    }
    case "fileChange": {
      const changes = item.changes ?? [];

      if (!changes.length) { return "Editing files…"; }

      const target = changes.length === 1 ? changes[0].path?.split("/").pop() : `${changes.length} files`;
      const { added, removed } = diffCounts(changes);
      const stats = `${added ? ` +${added}` : ""}${removed ? ` -${removed}` : ""}`;
      return `Edited ${target || "files"}${stats}`;
    }
    case "mcpToolCall":
      // Claude's built-in tools land here too, where "tool · Read" says nothing.
      // Its own account of the call wins whenever there is one.
      return summaryOf(item) || clipActivity([item.server, item.tool].filter(Boolean).join(" · ") || "Using tool");
    case "webSearch":
      return clipActivity(item.query || "Searching the web");
    default:
      return "Working…";
  }
}

function activityIcon(item) {
  switch (item?.type) {
    case "reasoning": return "🧠";
    case "commandExecution": return ICONS.cmd;
    case "fileChange": return ICONS.file;
    case "mcpToolCall": return ICONS.tool;
    case "webSearch": return ICONS.web;
    default: return "";
  }
}

function activityRows(group) {
  return [...(group?._body?.children ?? [])].filter((el) => el.dataset.activityRow === "true");
}

// What a finished stretch of tool work amounted to.
//
// Showing the newest activity is right while it is happening, but once the run
// is over that reads as though the agent did only that one thing — a single
// command sitting between two messages. So a settled group describes its
// composition instead.
function activityDigest(rows) {
  if (rows.length === 1) { return rows[0].dataset.activityLabel || "Working…"; }

  const n = {};

  for (const row of rows) { n[row.dataset.activityKind] = (n[row.dataset.activityKind] ?? 0) + 1; }

  const plural = (count, word) => `${count} ${word}${count === 1 ? "" : "s"}`;
  const parts = [];

  if (n.commandExecution) { parts.push(`ran ${plural(n.commandExecution, "command")}`); }
  if (n.fileChange) { parts.push(`edited ${plural(n.fileChange, "file")}`); }
  if (n.mcpToolCall) { parts.push(plural(n.mcpToolCall, "tool call")); }
  if (n.webSearch) { parts.push(plural(n.webSearch, "search")); }

  // Thinking alone is still worth naming; alongside real work it is noise.
  if (!parts.length && n.reasoning) { parts.push("thought it through"); }

  if (!parts.length) { return `${rows.length} steps`; }

  const text = parts.join(" · ");
  return text.charAt(0).toUpperCase() + text.slice(1);
}

function refreshActivityGroup(group, { live = group?.dataset.live === "true" } = {}) {
  const rows = activityRows(group);

  if (!group || !rows.length) { return; }

  const newest = rows.at(-1);
  const label = newest.dataset.activityLabel || "Working…";
  const header = group.querySelector(".activity-label");

  group.dataset.live = live ? "true" : "false";
  group.querySelector(".activity-icon").innerHTML = newest._activityIcon || "";
  header.textContent = live ? label : activityDigest(rows);
  header.classList.toggle("shimmer", live);
}

function createActivityGroup(live) {
  const group = document.createElement("div");
  group.className = "activity-group";
  group.innerHTML = `<div class="activity-head"><span class="activity-icon"></span><span class="lbl activity-label">Working…</span><span class="chev">›</span></div><div class="activity-body"></div>`;
  group._body = group.querySelector(".activity-body");
  group.dataset.live = live ? "true" : "false";
  group.querySelector(".activity-head").onclick = () => group.classList.toggle("open");
  box().appendChild(group);
  state.activityGroup = group;
  scrollDown();
  return group;
}

function ensureActivityGroup(live) {
  if (state.activityGroup?.isConnected) { return state.activityGroup; }
  return createActivityGroup(live);
}

function setActivityRow(el, item, { group, live }) {
  el.dataset.activityRow = "true";
  el.dataset.activityKind = item.type || "";
  el.dataset.activityLabel = activityLabel(item);
  el._activityIcon = activityIcon(item);
  refreshActivityGroup(group, { live });
}

function updateActivityRow(el, item, { live = true } = {}) {
  const group = el?.closest?.(".activity-group");

  if (!group) { return; }

  el.dataset.activityKind = item.type || el.dataset.activityKind || "";
  el.dataset.activityLabel = activityLabel(item);
  el._activityIcon = activityIcon(item);
  refreshActivityGroup(group, { live });
}

function settleActivityGroup(group = state.activityGroup) {
  if (!group) { return; }

  refreshActivityGroup(group, { live: false });
  group.classList.remove("open");
}

function resetActivityGroup() {
  settleActivityGroup();
  state.activityGroup = null;
}

function restoreCurrentActivityGroup() {
  const last = box().lastElementChild;
  state.activityGroup = last?.classList.contains("activity-group") ? last : null;
}

function setReasoningHeader(el, text, { live = true } = {}) {
  const lbl = el.querySelector(".lbl");
  const line = latestSummaryLine(text);

  lbl.textContent = line || (live ? "Thinking…" : "Thought process");
  lbl.classList.toggle("shimmer", live);
}

// A turn is over: nothing more is coming, so stop every reasoning header
// shimmering and let it settle back to a static label.
function settleReasoning() {
  for (const lbl of document.querySelectorAll(".block.reasoning .lbl.shimmer")) {
    lbl.classList.remove("shimmer");
  }
}

function renderActivityItem(item, { group = null, live = false, started = false } = {}) {
  const summary = item.type === "reasoning" ? reasoningText(item) : "";

  if (item.type === "reasoning" && !started && !summary.trim()) { return []; }

  const activity = group || ensureActivityGroup(live);
  const parent = activity._body || activity.querySelector(".activity-body");
  activity._body = parent;
  let el;

  switch (item.type) {
    case "reasoning":
      el = makeBlock("reasoning", "🧠", "Thinking…", { parent });
      el.querySelector(".body").textContent = summary;
      setReasoningHeader(el, summary, { live: false });

      if (started && !summary.trim()) { el.querySelector(".lbl").textContent = "Thinking…"; }

      break;
    case "commandExecution": {
      const why = summaryOf(item);
      el = makeBlock("cmd", ICONS.cmd, why || item.command || "command", { parent, open: started, sub: why ? item.command : "" });
      const ok = item.exitCode === 0;
      setBlockStatus(el, started ? "running" : (item.exitCode != null ? "exit " + item.exitCode : (item.status || "")), started ? "run" : (item.exitCode != null ? (ok ? "ok" : "bad") : ""));

      if (started || item.aggregatedOutput) {
        el.querySelector(".body").innerHTML = `<pre>${esc(item.aggregatedOutput || "")}</pre>`;
      }

      break;
    }
    case "fileChange":
      el = addFileChangeChip(item, { parent, started });
      break;
    case "mcpToolCall":
      // Same rule as the group header: Claude's built-in tools arrive as
      // mcpToolCall, and "tool · Read" tells you nothing that "Read
      // heroController.js" does not.
      el = chip(ICONS.tool, summaryOf(item) || `${item.server || "tool"} · ${item.tool || "call"}`, null, { parent });
      break;
    case "webSearch":
      el = chip(ICONS.web, item.query || "web search", null, { parent });
      break;
    default:
      return [];
  }

  setActivityRow(el, item, { group: activity, live });
  return [el];
}

function renderItem(item, opts = {}) {
  if (isCodexActivity(item)) { return renderActivityItem(item, opts); }

  // Conversation and standalone items are hard boundaries. The group is a
  // contiguous run, so allowing it to survive a message would reorder later
  // activity into a block above that message.
  resetActivityGroup();

  switch (item.type) {
    case "userMessage": {
      const t = (item.content ?? []).map((c) => c.text ?? "").join("");
      const imageParts = (item.content ?? []).filter((c) => c.type === "image" || c.type === "localImage");
      const attachments = imageParts.map((part) => part.attachment ?? null);
      const imageCount = imageParts.length;

      if (t.trim() || imageCount) {
        const el = addUser(t, { attachments, imageCount });
        if (item.clientId) { el.dataset.clientId = item.clientId; }
        return [el];
      }

      break;
    }
    case "agentMessage": {
      if ((item.text ?? "").trim()) { return [addAgent(item.text, false, item.id)]; }

      break;
    }
    case "reasoning": {
      const summary = Array.isArray(item.summary) ? item.summary.join("\n\n") : (item.content || "");

      if (summary.trim()) {
        const el = makeBlock("reasoning", "🧠", "Thought process");
        el.querySelector(".body").textContent = summary;
        // Replayed from the transcript, so it is finished by definition.
        setReasoningHeader(el, summary, { live: false });
        return [el];
      }

      break;
    }
    case "commandExecution": {
      // When the agent said what the command is for, that reads better as the
      // heading than the command itself, which moves to the line below.
      const why = summaryOf(item);
      const el = makeBlock("cmd", ICONS.cmd, why || item.command || "command", { sub: why ? item.command : "" });
      const ok = item.exitCode === 0;
      setBlockStatus(el, item.exitCode != null ? "exit " + item.exitCode : (item.status || ""), item.exitCode != null ? (ok ? "ok" : "bad") : "");

      if (item.aggregatedOutput) { el.querySelector(".body").innerHTML = `<pre>${esc(item.aggregatedOutput)}</pre>`; }

      return [el];
    }
    case "fileChange": {
      return [addFileChangeChip(item)];
    }
    case "mcpToolCall": {
      return [chip(ICONS.tool, summaryOf(item) || `${item.server} · ${item.tool}`)];
    }
    case "webSearch": {
      return [chip(ICONS.web, item.query || "web search")];
    }
    case "plan":
    case "todoList": {
      const el = makeBlock("plan", ICONS.plan, "Plan");
      el.querySelector(".body").innerHTML = `<pre>${esc(item.text || JSON.stringify(item, null, 1))}</pre>`;
      return [el];
    }
    case "turnError": {
      const detail = item.message || "The provider ended this turn with an error.";
      if (item.terminalId && box().querySelector(`[data-terminal-id="${CSS.escape(String(item.terminalId))}"]`)) { return []; }
      const el = chip("⚠️", detail);
      el.classList.add("turn-error");
      if (item.terminalId) { el.dataset.terminalId = item.terminalId; }
      decorateUsageLimitError(el, item);
      return [el];
    }
    default: break;
  }

  return [];
}

function chip(iconHtml, text, onClick, opts = {}) {
  const el = document.createElement("div");
  el.className = "item-chip" + (onClick ? " link" : "");
  el.innerHTML = iconHtml + "<span></span>";
  el.querySelector("span").textContent = text;

  if (onClick) { el.onclick = onClick; }

  (opts.parent || box()).appendChild(el);
  scrollDown();
  return el;
}

// Files this thread touched — edited by the agent, or linked in a reply. Feeds
// the Files sheet so you can reopen one without scrolling the whole chat.
function registerThreadFile(path, edited) {
  if (!path) { return; }

  const cur = state.threadFiles.get(path) || { path, edited: false };
  cur.edited = cur.edited || !!edited;
  state.threadFiles.set(path, cur);
  updateFilesBtn();
}

function registerFilesFromEl(el) {
  el?.querySelectorAll?.("a[href]").forEach((a) => {
    const target = localFileTarget(a.getAttribute("href"));

    if (target) { registerThreadFile(target.path, false); }
  });
}

function updateFilesBtn() {
  const inChat = $("chatView").style.display !== "none";
  $("filesBtn").style.display = inChat && state.threadFiles.size ? "flex" : "none";
}

function addFileChangeChip(item, { parent = null, started = false } = {}) {
  const changes = item.changes ?? [];
  changes.forEach((c) => registerThreadFile(c.path, true));
  const n = changes.length;
  const label = started ? "Editing files…" : (n === 1 ? changes[0].path.split("/").pop() : `${n} files changed`);
  return chip(ICONS.file, "✏️ " + label, started ? null : () => {
    if (n === 1) {
      openFileSheet(changes[0].path, changes[0].diff || "");
    } else {
      const diff = changes.map((c) => `--- ${c.path}\n${c.diff || ""}`).join("\n\n");
      openDiffSheet(diff || "No diff available");
    }
  }, { parent });
}

function renderHistory(thread, window) {
  resetActivityGroup();
  box().innerHTML = "";

  // Only the end of a long thread is sent; offer the rest rather than pretending
  // this is the whole conversation.
  if (window?.hasMore) {
    const more = document.createElement("button");
    more.id = "loadEarlier";
    more.className = "loadearlier";
    more.textContent = "Load earlier messages";
    more.onclick = () => loadEarlier(more);
    box().appendChild(more);
  }

  const turns = thread.turns ?? [];

  // Absolute positions in the whole thread, since only a window of it is served
  // and later changes address items by absolute index.
  let base = window?.start ?? 0;

  turns.forEach((turn, ti) => {
    if (ti > 0) {
      resetActivityGroup();
      const s = document.createElement("div");
      s.className = "turn-sep";
      box().appendChild(s);
    }

    const live = state.externalTurn && ti === turns.length - 1;

    for (const item of turn.items ?? []) { renderItemAt(item, base++, { live }); }
  });
  registerFilesFromEl(box());
  // Deliberately does not scroll. Opening a thread wants the bottom; a resync
  // mid-turn wants to stay put. Only the caller knows which, and a scroll
  // queued from here would land after the caller's restore and undo it.
  // How far through the thread we've drawn. This is an *absolute* position in
  // the whole thread, not a count of what's on screen, because that's what
  // appended items are numbered against — see appendExternalItems.
  state.itemWindow = window ?? null;
  state.renderedItems = window ? window.end : turns.reduce((n, t) => n + (t.items?.length ?? 0), 0);
  // Re-attach anything the session file cannot carry: sends that failed, and
  // messages still waiting to go out.
  restoreFailedSends();
  restorePending();
}

// Which file+parser the positions on screen belong to, and how far along that
// file's change stream this view is. A fetch and the live stream race each
// other, so deltas that arrive mid-fetch are held and replayed against the
// response once it lands — otherwise the older response silently undoes them.
function setCursor(res) {
  state.generation = res?.generation ?? null;
  state.revision = res?.revision ?? 0;
  const held = state.opBuffer ?? [];
  state.opBuffer = [];

  for (const frame of held) {
    if (frame.generation === state.generation && frame.revision > state.revision) {
      applyExternalFrame(frame);
    }
  }
}

// Page backwards through a long thread, prepending older items above the button.
async function loadEarlier(btn) {
  const t = state.active;
  const w = state.itemWindow;

  if (!t || !w?.hasMore || btn.disabled) { return; }

  btn.disabled = true;
  btn.textContent = "Loading earlier messages…";

  try {
    const res = await api(`/api/thread?id=${encodeURIComponent(t.id)}&provider=${encodeURIComponent(t.provider || "codex")}&before=${w.start}`);
    const older = (res.thread?.turns ?? []).flatMap((x) => x.items ?? []);
    const b = box();
    const anchorFromBottom = b.scrollHeight - b.scrollTop;

    // Render into a fragment, then splice it in above the button so the reader's
    // position doesn't jump.
    const marker = document.createComment("older");
    b.insertBefore(marker, btn.nextSibling);
    const tail = [];

    while (marker.nextSibling) { tail.push(b.removeChild(marker.nextSibling)); }

    // The previous current group is now detached in `tail`; rendering through
    // it would put the older rows in the wrong half of the transcript.
    state.activityGroup = null;

    let olderBase = res.itemWindow?.start ?? 0;

    for (const item of older) { renderItemAt(item, olderBase++); }

    for (const node of tail) { b.appendChild(node); }

    marker.remove();
    restoreCurrentActivityGroup();
    state.itemWindow = res.itemWindow ?? { ...w, start: 0, hasMore: false };
    b.scrollTop = b.scrollHeight - anchorFromBottom;
    syncStick();

    if (state.itemWindow.hasMore) {
      btn.disabled = false;
      btn.textContent = "Load earlier messages";
    } else {
      btn.remove();
    }
  } catch (e) {
    btn.disabled = false;
    btn.textContent = "Couldn't load earlier — tap to retry";
  }
}

// Draw one item and label the elements it produced with its position in the
// thread, so a later change to that item can find and replace them. One item can
// render as several nodes, or none at all.
function renderItemAt(item, index, opts = {}) {
  const nodes = renderItem(item, opts);

  for (const node of nodes) {
    node.dataset.idx = String(index);
  }

  return nodes;
}

// One change frame from the server. Ordering and generation are checked here so
// every path — live, buffered-during-a-fetch, replayed — obeys the same rules.
function applyExternalFrame(frame) {
  const { result, ops, generation, revision } = frame;

  if (frame.terminalOutcome === "failed") {
    showTurnFailure(frame.terminalError, frame.terminalId);
  }

  if (result !== "ops" && result !== "reset" && result !== "error") { return; }

  if (result === "error") {
    scheduleExternalRefresh();
    return;
  }

  // Mid-fetch: hold it. The response about to land may already include this,
  // and applying it first would have it overwritten a moment later.
  if (state.fetching) {
    state.opBuffer = (state.opBuffer ?? []).concat(frame);
    return;
  }

  // A different file or parser: every position on screen means something else
  // now, so nothing can be patched — only replaced.
  if (result === "reset" || (generation && state.generation && generation !== state.generation)) {
    scheduleExternalRefresh();
    return;
  }

  // Already reflected in what we drew.
  if (revision != null && revision <= (state.revision ?? 0)) { return; }

  applyExternalOps(ops ?? []);
  state.revision = revision ?? state.revision;
}

function showTurnFailure(error, terminalId = null) {
  if (terminalId && box().querySelector(`[data-terminal-id="${CSS.escape(String(terminalId))}"]`)) { return; }

  const message = typeof error === "string" ? error : (error?.message || "The provider ended this turn with an error.");
  const el = chip("⚠️", message);
  el.classList.add("turn-error");
  if (terminalId) { el.dataset.terminalId = terminalId; }
  decorateUsageLimitError(el, typeof error === "string" ? { message: error } : error);
  return el;
}

function updateResumeButton(runtime = null) {
  const button = $("resumeBtn");
  state.canResumeInterrupted = runtime?.canResumeInterrupted === true && !runtime?.running;
  button.disabled = false;
  button.textContent = "▶";
  button.removeAttribute("aria-busy");
  button.title = "Resume interrupted turn";
  if (state.canResumeInterrupted) { button.dataset.turnId = runtime.terminalId || ""; }
  else { delete button.dataset.turnId; }
  syncComposerPrimaryAction();
}

function showRuntimeRecovery(runtime = null) {
  if (runtime?.terminalError?.code !== "bridge_restarted") { return; }
  showTurnFailure(
    runtime.terminalError,
    runtime.terminalId || `bridge-restarted:${activeProvider()}:${state.active?.id || "thread"}`,
  );
}

function syncComposerPrimaryAction() {
  const hasComposerContent = !!$("input")?.value.trim() || state.composerAttachments.length > 0;
  const showResume = state.canResumeInterrupted && !state.busy && !hasComposerContent;
  $("resumeBtn").style.display = showResume ? "flex" : "none";
  $("sendActions").style.display = showResume ? "none" : "";
}

async function resumeInterruptedTurn() {
  const t = state.active;
  if (!t || t.provider !== "codex" || !t.id || $("resumeBtn").disabled) { return; }
  const button = $("resumeBtn");
  const requestId = button.dataset.requestId || newRequestId();
  button.dataset.requestId = requestId;
  button.disabled = true;
  button.textContent = "…";
  button.setAttribute("aria-busy", "true");
  button.title = "Resuming interrupted Codex turn…";
  startSendProgress(requestId, t.id, "", null);
  try {
    await api("/api/resume", {
      provider: "codex", threadId: t.id, turnId: button.dataset.turnId || null, requestId,
    });
    finishSendProgress();
    updateResumeButton(null);
    setBusy(true, { external: false });
    setLivePill(true, "Resuming interrupted turn…", { stalled: false });
  } catch (error) {
    try {
      const query = new URLSearchParams({ provider: "codex", method: "resume", requestId, threadId: t.id });
      const status = await api(`/api/send/status?${query}`);
      if (status.state === "accepted") {
        finishSendProgress();
        updateResumeButton(null);
        setBusy(true, { external: false });
        setLivePill(true, "Resuming interrupted turn…", { stalled: false });
        return;
      }
      if (status.state === "uncertain" || status.state === "dispatching") {
        failSendProgress(Object.assign(new Error("Resume delivery could not be confirmed"), { code: "delivery_uncertain" }));
        button.style.display = "none";
        chip("⚠️", "Resume delivery could not be confirmed. Refresh the thread before retrying.");
        return;
      }
    } catch {}
    failSendProgress(error);
    button.disabled = false;
    button.textContent = "▶";
    button.removeAttribute("aria-busy");
    chip("⚠️", "Could not resume this turn: " + error.message);
  }
}

const USAGE_LIMIT_CODES = new Set([
  "credit_balance_exhausted", "credits_exhausted", "insufficient_quota", "monthly_spend_limit",
  "quota_exceeded", "rate_limit", "rate_limit_exceeded", "usage_exhausted", "usage_limit_exceeded",
]);

function isUsageLimitError(error) {
  if (error?.status === 429) { return true; }
  const rawCode = error?.code ?? error?.error ?? error?.codex_error_info;
  const code = String(rawCode ?? "").trim().toLowerCase().replace(/[\s-]+/g, "_");
  if (USAGE_LIMIT_CODES.has(code)) { return true; }
  const message = typeof error === "string" ? error : error?.message;
  return /(?:usage|spend|rate|quota|credits?)[\s_-]*(?:limit|exhausted|exceeded|depleted)|(?:limit|quota|credits?)[\s_-]+(?:was\s+)?(?:reached|exhausted|exceeded|depleted)|monthly\s+spend|(?:out\s+of|no)\s+(?:usage|credits?|quota)|(?:usage|credits?|quota)\s+(?:is\s+|are\s+)?(?:not\s+left|unavailable|depleted)/i.test(String(message || ""));
}

function usageRetryForOpenThread() {
  if (!state.active) { return null; }
  const pending = new Set(["waiting_usage", "waiting_thread", "waiting_provider", "checking", "dispatching", "uncertain"]);
  return [...state.usageRetries.values()]
    .filter((entry) => entry.provider === activeProvider() && entry.threadId === state.active.id && pending.has(entry.state))
    .sort((a, b) => Number(b.updatedAt || 0) - Number(a.updatedAt || 0))[0] || null;
}

function usageRetryPolicyAppliesToOpenThread() {
  if (!state.active) { return false; }
  return state.usageRetryPolicy?.provider === activeProvider()
    && state.usageRetryPolicy?.threadId === state.active.id
    && state.usageRetryPolicy?.enabled === true;
}

function syncUsageRetryButtons() {
  const active = usageRetryForOpenThread();
  const alreadyResumed = state.busy && !active;
  box().querySelectorAll("[data-queue-usage-resume]").forEach((button) => {
    // A policy is permission to create future retries, not proof that this
    // particular usage failure has a durable job. Only an active store entry
    // may claim "Resume queued" and disable this recovery action.
    button.disabled = !!active || alreadyResumed;
    button.textContent = active ? "Resume queued" : alreadyResumed ? "Already resumed" : "Resume when usage returns";
  });
}

function formatRetryTime(value) {
  const raw = Number(value);
  if (!raw) { return null; }
  const at = raw < 1e12 ? raw * 1000 : raw;
  return new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit" }).format(new Date(at));
}

function usageRetryText(entry) {
  const reset = formatRetryTime(entry.resetAt);
  const nextCheck = formatRetryTime(entry.nextCheckAt);
  const account = entry.account?.email || entry.account?.accountLabel || entry.account?.planType || null;
  const suffix = [account, reset ? `provider reset ${reset}` : null, nextCheck ? `next check ${nextCheck}` : null].filter(Boolean).join(" · ");
  const labels = {
    waiting_usage: "Auto-resume queued — checking current account every minute",
    checking: "Checking current account usage…",
    waiting_thread: "Usage is available — waiting for this turn to be idle",
    waiting_provider: "Auto-resume queued — provider temporarily unavailable",
    dispatching: "Sending Continue…",
    uncertain: "Verifying automatic resume — it will not be repeated without proof",
    failed: "The turn could not be resumed automatically",
  };
  const failure = ["waiting_provider", "uncertain", "failed"].includes(entry.state) && entry.error?.message ? ` · ${entry.error.message}` : "";
  return `${labels[entry.state] || "Auto-resume queued"}${suffix ? ` · ${suffix}` : ""}${failure}`;
}

function renderUsageRetry(entry) {
  if (!entry || !state.active || entry.provider !== activeProvider() || entry.threadId !== state.active.id) { return; }
  box().querySelectorAll("[data-usage-resume-id]").forEach((node) => node.remove());
  if (["accepted", "cancelled", "superseded"].includes(entry.state)) { return; }
  const el = chip(entry.state === "uncertain" || entry.state === "failed" ? "⚠️" : "⏳", usageRetryText(entry));
  el.classList.add("usage-resume");
  el.dataset.usageResumeId = entry.id;
  const actions = document.createElement("div");
  actions.className = "pending-actions";
  if (["waiting_usage", "waiting_thread", "waiting_provider", "checking"].includes(entry.state)) {
    const check = document.createElement("button");
    check.className = "pending-action";
    check.textContent = "Check now";
    check.onclick = async () => {
      check.disabled = true;
      try { updateUsageRetry(await api("/api/usage-retries/check", { id: entry.id }).then((result) => result.entry)); }
      catch (error) { chip("⚠️", "Could not check usage: " + error.message); }
      finally { if (check.isConnected) { check.disabled = false; } }
    };
    actions.appendChild(check);
    const cancel = document.createElement("button");
    cancel.className = "pending-action cancel";
    cancel.textContent = "Cancel";
    cancel.onclick = async () => {
      cancel.disabled = true;
      try { updateUsageRetry(await api("/api/usage-retries/cancel", { id: entry.id }).then((result) => result.entry)); }
      catch (error) { chip("⚠️", "Could not cancel auto-resume: " + error.message); }
    };
    actions.appendChild(cancel);
  } else if (entry.state === "uncertain") {
    const check = document.createElement("button");
    check.className = "pending-action";
    check.textContent = "Check now";
    check.onclick = async () => {
      check.disabled = true;
      try { updateUsageRetry(await api("/api/usage-retries/check", { id: entry.id }).then((result) => result.entry)); }
      catch (error) { chip("⚠️", "Could not verify delivery yet: " + error.message); }
      finally { if (check.isConnected) { check.disabled = false; } }
    };
    actions.appendChild(check);
    const dismiss = document.createElement("button");
    dismiss.className = "pending-action cancel";
    dismiss.textContent = "Dismiss";
    dismiss.title = "Stop automatic verification and remove this saved retry; this cannot recall a Continue that may already have reached the agent";
    dismiss.onclick = async () => {
      dismiss.disabled = true;
      try { updateUsageRetry(await api("/api/usage-retries/cancel", { id: entry.id }).then((result) => result.entry)); }
      catch (error) { chip("⚠️", "Could not dismiss auto-resume: " + error.message); }
    };
    actions.appendChild(dismiss);
  }
  if (actions.childElementCount) { el.appendChild(actions); }
}

function updateUsageRetry(entry) {
  if (!entry?.id) { return; }
  state.usageRetries.set(entry.id, entry);
  syncUsageRetryButtons();
  renderUsageRetry(entry);
}

function replaceThreadUsageRetries(provider, threadId, entries = []) {
  // The server response is authoritative for this thread. Merging leaves a
  // missed SSE transition (waiting -> accepted/superseded) alive forever in the
  // PWA and makes the button claim "Resume queued" with no real server job.
  for (const [id, entry] of state.usageRetries) {
    if (entry.provider === provider && entry.threadId === threadId) { state.usageRetries.delete(id); }
  }
  for (const entry of entries) {
    if (entry?.id) { state.usageRetries.set(entry.id, entry); }
  }
}

function renderOpenUsageRetryState() {
  box().querySelectorAll("[data-usage-resume-id]").forEach((node) => node.remove());
  syncUsageRetryButtons();
  if (!state.active) { return; }
  const active = usageRetryForOpenThread();
  const fallback = [...state.usageRetries.values()]
    .filter((entry) => entry.provider === activeProvider() && entry.threadId === state.active.id && ["uncertain", "failed"].includes(entry.state))
    .sort((a, b) => Number(b.updatedAt || 0) - Number(a.updatedAt || 0))[0];
  if (active || fallback) { renderUsageRetry(active || fallback); }
}

async function loadUsageRetryState(thread = state.active) {
  if (!thread || thread.draft) { return; }
  const provider = thread.provider || "codex";
  try {
    const [retries, policy] = await Promise.all([
      api(`/api/usage-retries?provider=${encodeURIComponent(provider)}&threadId=${encodeURIComponent(thread.id)}`),
      api(`/api/usage-retry-policy?provider=${encodeURIComponent(provider)}&threadId=${encodeURIComponent(thread.id)}`),
    ]);
    if (state.active !== thread) { return; }
    replaceThreadUsageRetries(provider, thread.id, retries.data || []);
    state.usageRetryPolicy = { ...policy, provider, threadId: thread.id };
    renderOpenUsageRetryState();
  } catch {}
}

async function queueUsageResume(terminalId = null) {
  const target = state.active;
  const readiness = dispatchReadiness();
  const mode = currentMode();
  if (!target || !readiness.ready || mode.unknown) { throw new Error(readiness.reason || "Exact thread settings are unavailable"); }
  const result = await api("/api/usage-retries", {
    provider: activeProvider(), threadId: target.id, text: "Continue.", cwd: target.cwd,
    model: state.model, effort: state.effort, mode: mode.key,
    approvalPolicy: mode.approvalPolicy, sandbox: mode.sandbox,
    terminalId,
  });
  updateUsageRetry(result.entry);
  box().querySelectorAll("[data-usage-resume-error]").forEach((node) => node.remove());
  return result.entry;
}

function showUsageResumeError(message) {
  // This is one recovery action. Repeated taps or a transcript redraw should
  // update its status, not stack identical warnings beneath the same turn.
  box().querySelectorAll("[data-usage-resume-error]").forEach((node) => node.remove());
  const notice = chip("⚠️", "Could not queue auto-resume: " + message);
  notice.dataset.usageResumeError = "";
}

function decorateUsageLimitError(el, error) {
  if (!isUsageLimitError(error) || !state.active || el.querySelector("[data-queue-usage-resume]")) { return; }
  const actions = document.createElement("div");
  actions.className = "pending-actions";
  const button = document.createElement("button");
  button.className = "pending-action";
  button.dataset.queueUsageResume = "";
  const active = usageRetryForOpenThread();
  const alreadyResumed = state.busy && !active;
  button.textContent = active ? "Resume queued" : alreadyResumed ? "Already resumed" : "Resume when usage returns";
  button.disabled = !!active || alreadyResumed;
  button.onclick = async () => {
    button.disabled = true;
    button.textContent = "Queuing…";
    try { await queueUsageResume(error?.terminalId || el.dataset.terminalId || null); button.textContent = "Resume queued"; }
    catch (error) { button.disabled = false; button.textContent = "Resume when usage returns"; showUsageResumeError(error.message); }
  };
  actions.appendChild(button);
  el.appendChild(actions);
}

// Changes to a thread someone else is driving, as operations rather than "here
// is everything past N" — because a tool result *modifies* the command item that
// is already on screen rather than appending anything. Blind appending left
// those commands running forever with no output.

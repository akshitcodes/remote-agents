<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1117">
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<title>Remote Agents</title>
<style>
  :root {
    --bg: #0d1117; --bg2: #161b22; --bg3: #21262d; --border: #30363d;
    --fg: #e6edf3; --fg-dim: #8b949e; --fg-faint: #6e7681;
    --accent: #3fb950; --accent2: #58a6ff; --danger: #f85149; --warn: #d29922;
    --user-bubble: #1f6feb; --purple: #bc8cff;
    --add: #2ea04326; --add-fg: #7ee787; --del: #f8514926; --del-fg: #ffa198;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  /* Never zoom: pinch is blocked in JS (iOS ignores user-scalable), double-tap
     zoom by touch-action, and iOS text-inflation by text-size-adjust. Any input
     below 16px would make iOS auto-zoom on focus and push the layout off-screen,
     so every focusable field is >= 16px. */
  html, body { height: 100%; max-width: 100%; overflow-x: hidden; touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overscroll-behavior: none;
  }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Monaco, monospace; }
  #app { display: flex; flex-direction: column; height: 100dvh; max-width: 100%; overflow-x: hidden; }

  /* header */
  header {
    display: flex; align-items: center; gap: 7px;
    padding: calc(env(safe-area-inset-top) + 10px) 12px 10px;
    background: var(--bg2); border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  header .htext { flex: 1; min-width: 0; }
  header .title { font-weight: 600; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .sub { font-size: 11px; color: var(--fg-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hbtn { background: none; border: none; color: var(--accent2); font-size: 15px; padding: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
  .hbtn:active { background: var(--bg3); }
  #backBtn { font-size: 26px; padding: 0 4px; display: none; }
  #sidebarToggleBtn { display: none; color: var(--fg-dim); }
  #sidebarToggleBtn svg path:last-child { transform-origin: center; transition: transform .18s ease; }
  #sidebarToggleBtn.collapsed svg path:last-child { transform: rotate(180deg); }
  .hbtn.icon svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }
  #connDot { width: 9px; height: 9px; border-radius: 50%; background: var(--danger); flex-shrink: 0; transition: background .3s; }
  #connDot.on { background: var(--accent); }
  #tokCount { font-size: 11px; color: var(--fg-dim); white-space: nowrap; }
  #offlinePill { display: none; font-size: 10px; font-weight: 600; color: var(--warn); background: #d2992222; border: 1px solid var(--warn); border-radius: 20px; padding: 2px 8px; white-space: nowrap; }
  body.offline #offlinePill { display: inline-block; }

  /* list view */
  #listView { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #searchWrap { padding: 10px 12px 9px; position: sticky; top: 0; background: #0d1117f2; backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); z-index: 2; border-bottom: 1px solid #ffffff08; }
  #search { width: 100%; padding: 9px 13px; border-radius: 11px; border: 1px solid var(--border); background: #161b22cc; color: var(--fg); font-size: 16px; outline: none; box-shadow: inset 0 1px 0 #ffffff08; }
  #search:focus { border-color: #58a6ff88; box-shadow: 0 0 0 3px #58a6ff16; }
  .seg { display: flex; gap: 3px; background: #161b22cc; border: 1px solid var(--border); border-radius: 11px; padding: 3px; margin-bottom: 9px; }
  .seg button { flex: 1; background: none; border: none; color: var(--fg-dim); font-size: 13px; font-weight: 600; padding: 7px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
  .seg button.on { background: #30363d; color: var(--fg); box-shadow: 0 1px 4px #0005, inset 0 1px 0 #ffffff0d; }
  #viewSeg { display: flex; flex-shrink: 0; gap: 1px; margin: 0; padding: 2px; border: 1px solid var(--border); border-radius: 9px; background: #0d111788; }
  #viewSeg button { min-height: 24px; border: 0; border-radius: 7px; padding: 2px 7px; background: transparent; color: var(--fg-dim); font: inherit; font-size: 10.5px; font-weight: 650; white-space: nowrap; cursor: pointer; }
  #viewSeg button.on { background: var(--bg3); color: var(--fg); box-shadow: inset 0 1px 0 #ffffff0d; }
  #providerSeg { display: none; }
  .chip.prov { width: 19px; height: 19px; flex: 0 0 19px; display: inline-flex; align-items: center; justify-content: center; padding: 2px; border-radius: 6px; background: var(--bg3); }
  .chip.prov img { width: 100%; height: 100%; display: block; object-fit: contain; border-radius: 4px; }
  .row { padding: 8px 12px; border-bottom: 1px solid #21262dcc; cursor: pointer; transition: background .12s ease; }
  .row:active { background: linear-gradient(90deg, #161b22, #1b2129); }
  .row-head { display: flex; align-items: center; gap: 7px; min-height: 44px; }
  .row-copy { flex: 1; min-width: 0; border: 0; padding: 0; background: transparent; color: inherit; text-align: left; font: inherit; cursor: pointer; }
  .row .titleline { display: flex; align-items: center; gap: 6px; min-width: 0; margin-bottom: 4px; }
  .row .preview { flex: 1; min-width: 0; font-size: 14px; font-weight: 570; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-actions { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
  .row-action { min-width: 44px; min-height: 44px; border: 0; border-radius: 10px; background: transparent; color: var(--fg-dim); padding: 5px 7px; font: inherit; font-size: 11px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
  .row-action:active { background: var(--bg3); }
  .row-action svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; }
  .row-action.on { color: var(--accent); border-color: #2ea04377; background: #2ea04314; }
  .row-action .chevron { font-size: 15px; line-height: 1; transition: transform .15s; }
  .row-action.expanded .chevron { transform: rotate(90deg); }
  .section-divider { display: flex; align-items: center; gap: 9px; padding: 12px 12px 6px; color: var(--fg-faint); font-size: 10.5px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; }
  .section-divider::after { content: ""; height: 1px; flex: 1; background: var(--bg3); }
  .subagents { display: none; margin: 10px 0 0 16px; border-left: 2px solid var(--border); padding-left: 9px; }
  .subagents.open { display: block; }
  .subagent-row { width: 100%; min-height: 44px; display: flex; align-items: center; gap: 8px; padding: 9px 8px; border: 0; border-radius: 9px; background: transparent; color: inherit; text-align: left; font: inherit; cursor: pointer; }
  .subagent-row:active { background: var(--bg3); }
  .subagent-copy { flex: 1; min-width: 0; }
  .subagent-name { font-size: 13px; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .subagent-path { font-size: 11px; color: var(--fg-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .subagent-row .run-badge { flex-shrink: 0; }
  .row .meta { display: flex; gap: 5px; flex-wrap: nowrap; align-items: center; min-width: 0; overflow: hidden; }
  .chip { font-size: 10.5px; line-height: 1.45; color: var(--fg-dim); background: var(--bg3); padding: 1px 7px; border-radius: 20px; white-space: nowrap; max-width: 45vw; overflow: hidden; text-overflow: ellipsis; }
  .row .chip.dir { min-width: 0; flex: 0 1 auto; }
  .chip.time { background: none; padding: 0; margin-left: auto; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .chip.ready-badge { color: var(--fg-faint); background: transparent; padding-left: 0; }
  .chip.run-badge { display: inline-flex; align-items: center; gap: 5px; color: var(--accent); background: #2ea04322; }
  .chip.run-badge.stalled { color: #d29922; background: #d2992222; }
  .chip.run-badge.abnormal { color: var(--danger); background: #f8514920; }
  .run-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 1.3s ease-in-out infinite; }
  .chip.run-badge.abnormal .run-dot { animation: none; }
  /* A message that didn't send stays visible and carries its own retry, so the
     failure is attached to the thing that failed. */
  .msg.user.failed { border: 1px solid var(--danger); opacity: .85; }
  .msg.user .failed-actions { display: flex; justify-content: flex-end; align-items: center; gap: 6px; margin-top: 7px; }
  .msg.user .retry, .msg.user .dismiss-failed { background: transparent; border: 1px solid var(--danger); color: var(--danger); font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; cursor: pointer; }
  .msg.user .dismiss-failed { border-color: var(--border); color: var(--fg-dim); }
  .msg.user .retry:disabled { opacity: .6; cursor: default; }
  .loadearlier { display: block; margin: 4px auto 14px; background: var(--bg3); border: 1px solid var(--border); color: var(--accent2); padding: 7px 16px; border-radius: 10px; font-size: 13px; cursor: pointer; }
  .loadearlier:disabled { color: var(--fg-dim); cursor: default; }
  /* "this turn is being driven somewhere else" — sits above the transcript
     without covering it, so a running thread never looks frozen. */
  /* Floats over the transcript rather than living in it: #messages is the
     scroller and is rebuilt on every render, which would wipe the pill. */
  #livePill { display: none; position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 6; max-width: 92%; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: var(--accent); background: #12351bee; border: 1px solid #2ea04366; border-radius: 20px; padding: 5px 12px; box-shadow: 0 2px 10px #0006; white-space: nowrap; }
  #livePill.stalled { color: #d29922; background: #3d2f12ee; border-color: #d2992266; }
  body.livesync #livePill { display: flex; }
  /* Shown only when the transcript is scrolled away from the bottom, so a
     running turn never yanks the view out from under you — see stickToBottom. */
  #jumpBtn { display: none; position: absolute; right: 12px; bottom: 12px; z-index: 6; align-items: center; justify-content: center; width: 34px; height: 34px; border: 1px solid var(--border); border-radius: 50%; background: var(--bg2); color: var(--fg); font-size: 15px; line-height: 1; box-shadow: 0 2px 10px #0007; cursor: pointer; }
  #jumpBtn.on { display: flex; }
  #jumpBtn.unread { border-color: #2ea04366; color: var(--accent); }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
  #loadMore { display: block; margin: 14px auto calc(env(safe-area-inset-bottom) + 20px); background: var(--bg3); border: 1px solid var(--border); color: var(--accent2); padding: 9px 22px; border-radius: 10px; font-size: 14px; cursor: pointer; }
  .empty { text-align: center; color: var(--fg-dim); padding: 40px 20px; }

  /* chat view */
  #chatView { flex: 1; display: none; flex-direction: column; min-height: 0; max-width: 100%; overflow-x: hidden; position: relative; }
  /* Overlays (live pill, jump button) anchor to the transcript rather than the
     whole chat view, which also contains the composer — anchoring to the view
     put the jump button on top of the text input. */
  #transcript { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #messages { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: 14px 12px; }
  .msg { max-width: 88%; margin-bottom: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.md { white-space: normal; }
  /* The bubble shrink-wraps its text (a block would stretch to the cap even for
     "hi") and only grows to 80% of the column before wrapping. */
  .msg.user { width: -webkit-fit-content; width: fit-content; max-width: 80%; margin-left: auto; background: var(--user-bubble); color: #fff; padding: 9px 13px; border-radius: 16px 16px 4px 16px; font-size: 14px; }
  /* The agent reply is plain text, not a bubble — give it the full column so
     code, tables and diffs get every pixel. The 88% cap stays for user bubbles. */
  .msg.agent { margin-right: auto; max-width: 100%; font-size: 14.5px; padding: 2px 2px 2px 0; }
  .msg.agent.streaming::after { content: "▍"; color: var(--accent); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* rendered markdown inside agent messages */
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p { margin: 0 0 8px; }
  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin: 14px 0 7px; line-height: 1.25; font-weight: 650; }
  .md h1 { font-size: 20px; } .md h2 { font-size: 18px; } .md h3 { font-size: 16px; }
  .md h4, .md h5, .md h6 { font-size: 14.5px; color: var(--fg-dim); }
  .md ul, .md ol { margin: 0 0 8px; padding-left: 22px; }
  .md li { margin: 2px 0; }
  .md li::marker { color: var(--fg-faint); }
  .md a { color: var(--accent2); text-decoration: underline; text-underline-offset: 2px; word-break: break-word; }
  .md code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.86em; background: var(--bg3); padding: 1px 5px; border-radius: 5px; }
  .md pre { background: var(--bg); border: 1px solid var(--border); border-radius: 9px; padding: 11px 12px; overflow-x: auto; margin: 0 0 10px; }
  .md pre code { background: none; padding: 0; font-size: 12.5px; line-height: 1.5; color: var(--fg); }
  .md .code-card { max-width: 100%; margin: 0 0 12px; overflow: hidden; border: 1px solid var(--border); border-radius: 12px; background: #15191f; box-shadow: inset 0 1px 0 #ffffff08; }
  .md .code-card-head { min-height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 3px 0 12px; border-bottom: 1px solid var(--border); background: #ffffff05; }
  .md .code-language { flex: 1; min-width: 0; color: var(--fg-dim); font-size: 12px; font-weight: 560; letter-spacing: .01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .md .code-copy { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; border: 0; border-radius: 8px; background: transparent; color: var(--fg-dim); cursor: pointer; }
  .md .code-copy:hover { color: var(--fg); background: #ffffff0a; }
  .md .code-copy:focus-visible { color: var(--fg); background: #ffffff0a; outline: 2px solid var(--accent2); outline-offset: -3px; }
  .md .code-copy[data-state="copied"] { color: var(--accent); }
  .md .code-copy[data-state="failed"] { color: var(--danger); }
  .md .code-copy svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .md .code-card pre { margin: 0; border: 0; border-radius: 0; background: transparent; padding: 13px 14px 15px; }
  .md .code-card pre code { display: block; min-width: max-content; }
  .md .mermaid-card .code-card-head { padding-right: 6px; }
  .md .mermaid-toggle { flex-shrink: 0; border: 0; border-radius: 7px; background: transparent; color: var(--fg-dim); padding: 7px 9px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .md .mermaid-toggle:hover, .md .mermaid-toggle:focus-visible { color: var(--fg); background: #ffffff0a; }
  .md .mermaid-toggle:focus-visible { outline: 2px solid var(--accent2); outline-offset: -2px; }
  .md .mermaid-diagram { min-height: 84px; padding: 18px 14px; display: flex; align-items: center; justify-content: center; overflow-x: auto; color: var(--fg-dim); }
  .md .mermaid-diagram svg { display: block; max-width: 100%; height: auto; margin: auto; }
  .md .mermaid-diagram.error { display: block; min-height: 0; color: var(--danger); font-size: 12.5px; }
  .md .mermaid-source[hidden], .md .mermaid-diagram[hidden] { display: none; }
  .md blockquote { margin: 0 0 8px; padding: 2px 0 2px 12px; border-left: 3px solid var(--border); color: var(--fg-dim); }
  .md hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
  .md table { border-collapse: collapse; display: block; overflow-x: auto; margin: 0 0 10px; font-size: 13px; }
  .md th, .md td { border: 1px solid var(--border); padding: 5px 9px; text-align: left; }
  .md th { background: var(--bg3); font-weight: 600; }
  .md strong { font-weight: 650; }
  .md input[type="checkbox"] { margin-right: 6px; }
  .md pre, .md table { max-width: 100%; }
  .md :not(pre) > code { overflow-wrap: anywhere; }
  .turn-sep { height: 1px; background: var(--bg3); margin: 14px 0; }

  /* item blocks */
  .block { border: 1px solid var(--border); background: var(--bg2); border-radius: 10px; margin: 0 0 10px; overflow: hidden; max-width: 100%; }
  .block .bhead { display: flex; align-items: center; gap: 8px; padding: 8px 11px; cursor: pointer; font-size: 13px; }
  .block .bhead .ic { flex-shrink: 0; }
  .block .bhead .ttl { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .block .bhead .lbl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* The raw command, shown under its human-readable summary. */
  .block .bhead .sub { display: none; min-width: 0; font-size: 11px; color: var(--fg-dim); font-family: ui-monospace, Menlo, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .block .bhead .sub.on { display: block; }
  /* Codex emits reasoning *summaries*, so the header carries the latest one
     rather than a static word, and shimmers while more is still arriving. */
  .lbl.shimmer { background: linear-gradient(90deg, var(--fg-faint) 20%, var(--fg) 45%, var(--fg) 55%, var(--fg-faint) 80%); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: shimmerSweep 2.4s linear infinite; }
  @keyframes shimmerSweep { from { background-position: 220% 0; } to { background-position: -220% 0; } }
  @media (prefers-reduced-motion: reduce) { .lbl.shimmer { animation: none; -webkit-text-fill-color: var(--fg-dim); } }
  .block .bhead .st { font-size: 11px; color: var(--fg-dim); font-family: ui-monospace, Menlo, monospace; }
  .block .bhead .chev { color: var(--fg-faint); transition: transform .15s; }
  .block.open .bhead .chev { transform: rotate(90deg); }
  .block .body { display: none; border-top: 1px solid var(--border); }
  .block.open .body { display: block; }
  .block pre { font-family: ui-monospace, Menlo, monospace; font-size: 12px; line-height: 1.5; padding: 10px 11px; overflow-x: auto; white-space: pre; color: var(--fg-dim); max-height: 320px; overflow-y: auto; }
  .block.reasoning { background: transparent; border-color: var(--bg3); }
  .block.reasoning .bhead { color: var(--purple); }
  .block.reasoning .body { padding: 4px 11px 10px; font-size: 13px; color: var(--fg-dim); font-style: italic; white-space: pre-wrap; border-top: none; }
  .block.cmd .bhead .lbl { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
  .activity-group { border: 1px solid var(--border); background: var(--bg2); border-radius: 10px; margin: 0 0 10px; overflow: hidden; max-width: 100%; }
  .activity-head { display: flex; align-items: center; gap: 8px; padding: 9px 11px; cursor: pointer; font-size: 13px; }
  .activity-head .activity-icon { display: flex; flex-shrink: 0; }
  .activity-head .activity-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .activity-head .chev { color: var(--fg-faint); transition: transform .15s; }
  .activity-group.open > .activity-head .chev { transform: rotate(90deg); }
  .activity-body { display: none; padding: 8px 8px 0; border-top: 1px solid var(--border); }
  .activity-group.open > .activity-body { display: block; }
  .activity-body > .block, .activity-body > .item-chip { margin-bottom: 8px; }
  .activity-body > .item-chip { display: flex; width: fit-content; }
  .st.ok { color: var(--accent) !important; }
  .st.bad { color: var(--danger) !important; }
  .st.run { color: var(--accent2) !important; }
  .item-chip { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--fg-dim); background: var(--bg2); border: 1px solid var(--border); border-radius: 9px; padding: 6px 11px; margin: 0 0 10px; max-width: 100%; min-width: 0; }
  .item-chip span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-chip.link { cursor: pointer; }
  .item-chip.link:active { background: var(--bg3); }
  .item-chip.pending { color: var(--warn); border-color: #9e6a03; border-style: dashed; margin-left: auto; }
  .item-chip.turn-error { width: min(100%, 760px); align-items: flex-start; color: #ffb4ad; background: #f8514912; border-color: #f8514966; }
  .item-chip.turn-error span { white-space: normal; overflow: visible; text-overflow: clip; overflow-wrap: anywhere; }
  .pending-actions { display: inline-flex; align-items: center; gap: 3px; margin-left: 2px; }
  .item-chip .pending-actions { min-width: auto; overflow: visible; white-space: normal; flex-shrink: 0; }
  .pending-action { min-height: 34px; border: 0; border-radius: 7px; padding: 4px 8px; background: var(--bg3); color: var(--fg-dim); font: inherit; font-size: 11px; font-weight: 650; cursor: pointer; }
  .pending-action:active { background: var(--border); color: var(--fg); }
  .pending-action.cancel { color: var(--danger); }
  #queuedEditInput { min-height: 120px; resize: vertical; font-family: inherit; line-height: 1.4; }
  .ic { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; flex-shrink: 0; vertical-align: -2px; }

  /* diff colors */
  .diff .l-add { color: var(--add-fg); background: var(--add); display: block; }
  .diff .l-del { color: var(--del-fg); background: var(--del); display: block; }
  .diff .l-hdr { color: var(--accent2); display: block; }
  .diff .l-meta { color: var(--fg-faint); display: block; }

  /* approval banner */
  #approval { display: none; background: #2d1a00; border: 1px solid #9e6a03; margin: 8px 12px; padding: 12px; border-radius: 12px; flex-shrink: 0; }
  #approval .q { font-size: 13px; margin-bottom: 6px; color: var(--warn); font-weight: 600; }
  #approval .cmd { font: 12px ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-all; max-height: 100px; overflow-y: auto; margin-bottom: 10px; color: var(--fg); }
  #approval .btns { display: flex; gap: 8px; }
  #approval button { flex: 1; padding: 9px 4px; border-radius: 9px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; }
  #okBtn { background: var(--accent); color: #04260f; }
  #sessBtn { background: var(--bg3); color: var(--accent); border: 1px solid var(--accent) !important; }
  #noBtn { background: var(--bg3); color: var(--danger); border: 1px solid var(--danger) !important; }

  /* composer + controls */
  #composerWrap { background: var(--bg2); border-top: 1px solid var(--border); flex-shrink: 0; max-width: 100%; overflow-x: hidden; padding: 8px 10px calc(env(safe-area-inset-bottom) + 8px); }
  #composerWrap.dragover { position: relative; outline: 2px solid var(--accent2); outline-offset: -3px; background: #1f6feb18; }
  #composerWrap.dragover::after { content: "Drop images to attach"; position: absolute; inset: 5px; z-index: 8; display: grid; place-items: center; border: 1px dashed var(--accent2); border-radius: 12px; color: var(--accent2); background: #0d1117e8; font-size: 14px; font-weight: 650; pointer-events: none; }
  #controls { display: flex; gap: 7px; margin-bottom: 8px; flex-wrap: wrap; min-width: 0; }
  .ctl { display: flex; align-items: center; gap: 5px; background: var(--bg3); border: 1px solid var(--border); color: var(--fg-dim); border-radius: 8px; padding: 5px 9px; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .ctl:active { background: var(--bg); }
  .ctl b { color: var(--fg); font-weight: 600; }
  .ctl .ck { color: var(--fg-faint); font-size: 10px; }
  .settings-truth { display: inline-flex; align-items: center; gap: 6px; min-height: 29px; margin-left: auto; color: var(--fg-dim); font-size: 11px; white-space: nowrap; }
  .settings-truth::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px #3fb95018; }
  .settings-truth[data-state="loading"]::before { background: var(--warn); animation: pulse 1.3s ease-in-out infinite; }
  .settings-truth[data-state="error"] { color: var(--danger); }
  .settings-truth[data-state="error"]::before { background: var(--danger); box-shadow: 0 0 0 3px #f8514918; }
  .settings-truth[data-state="override"] { color: var(--accent2); }
  .settings-truth[data-state="override"]::before { background: var(--accent2); box-shadow: 0 0 0 3px #58a6ff18; }
  #composer { display: flex; gap: 8px; align-items: flex-end; min-width: 0; }
  #input { flex: 1; min-width: 0; background: var(--bg3); border: 1px solid var(--border); color: var(--fg); border-radius: 18px; padding: 9px 14px; font-size: 16px; outline: none; resize: none; max-height: 120px; font-family: inherit; line-height: 1.4; }
  #sendBtn, #stopBtn, #attachBtn { width: 38px; height: 38px; border-radius: 50%; border: none; font-size: 17px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  #sendBtn { background: var(--accent); color: #04260f; }
  #sendBtn:disabled { opacity: .4; }
  #stopBtn { background: var(--danger); color: #fff; display: none; }
  #attachBtn { background: var(--bg3); color: var(--fg-dim); border: 1px solid var(--border); }
  #attachBtn:disabled { opacity: .35; }
  #attachmentStrip { display: none; gap: 8px; overflow-x: auto; padding: 0 0 8px; }
  #attachmentStrip.on { display: flex; }
  .attachment-preview { width: 58px; height: 58px; position: relative; flex: 0 0 58px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); background: var(--bg3); }
  .attachment-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .attachment-preview button { position: absolute; right: 2px; top: 2px; width: 20px; height: 20px; border: 0; border-radius: 50%; color: #fff; background: #000b; font-size: 14px; line-height: 18px; }
  .msg.user .user-images { display: grid; grid-template-columns: repeat(2, minmax(0, 150px)); gap: 5px; margin-bottom: 6px; }
  .msg.user .image-thumb { display: block; width: 100%; min-width: 0; padding: 0; border: 0; border-radius: 9px; overflow: hidden; background: #0002; cursor: zoom-in; }
  .msg.user .user-images img, .msg.user .image-placeholder { width: 100%; max-height: 190px; min-height: 72px; object-fit: cover; border-radius: 9px; background: #0002; }
  .msg.user .image-thumb img { display: block; }
  .msg.user .image-placeholder { display: flex; align-items: center; justify-content: center; color: var(--fg-dim); font-size: 12px; }
  #imageViewer { position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center; padding: 24px; border: 0; background: #000d; cursor: zoom-out; }
  #imageViewer.show { display: flex; }
  #imageViewer img { max-width: min(100%, 1400px); max-height: 92dvh; object-fit: contain; border-radius: 10px; box-shadow: 0 18px 80px #000; }

  /* sheets / modal */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 50; display: none; }
  .overlay.show { display: block; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 51; background: var(--bg2); border-top: 1px solid var(--border); border-radius: 16px 16px 0 0; padding: 8px 16px calc(env(safe-area-inset-bottom) + 20px); max-height: 82dvh; overflow-y: auto; overflow-x: hidden; max-width: 100%; transform: translateY(100%); transition: transform .22s ease; }
  .sheet.show { transform: translateY(0); }
  .sheet .grip { width: 38px; height: 4px; background: var(--border); border-radius: 4px; margin: 8px auto 14px; }
  .sheet h2 { font-size: 17px; margin-bottom: 4px; overflow-wrap: anywhere; }
  /* File paths are long unbreakable tokens — wrap them or they widen the sheet. */
  .sheet .hint { font-size: 12.5px; color: var(--fg-dim); margin-bottom: 14px; overflow-wrap: anywhere; }
  /* First-pair onboarding is server-rendered so the guidance is useful before
     any app JavaScript runs (and testable with a spoofed mobile User-Agent). */
  .onboard { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 20px; background: #070a0eee; }
  .onboard[hidden] { display: none; }
  /* The server helper may remain in memory during a UI-only upgrade. Keep the
     install overlay unpaintable until the fresh client shell confirms it is
     running in an ordinary browser tab that actually needs onboarding. */
  #installOnboarding:not(.install-ready) { display: none; }
  .onboard-card { width: min(100%, 430px); padding: 24px; border: 1px solid var(--border); border-radius: 18px; background: var(--bg2); box-shadow: 0 18px 70px #000a; }
  .onboard-kicker { margin-bottom: 5px; color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .onboard h1 { margin-bottom: 10px; font-size: 23px; line-height: 1.2; }
  .onboard p { margin-bottom: 12px; color: var(--fg); }
  .onboard .onboard-note { color: var(--fg-dim); font-size: 13px; }
  .onboard-primary, .onboard-secondary { width: 100%; min-height: 44px; margin-top: 8px; border-radius: 10px; font: 600 15px inherit; cursor: pointer; }
  .onboard-primary { border: none; background: var(--accent); color: #04260f; }
  .onboard-primary:disabled { cursor: default; opacity: .5; }
  .onboard-secondary { border: 1px solid var(--border); background: var(--bg3); color: var(--fg-dim); }
  .opt { display: flex; align-items: flex-start; gap: 10px; padding: 11px 12px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; cursor: pointer; }
  .opt.sel { border-color: var(--accent); background: #2ea04314; }
  .opt .radio { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--fg-faint); flex-shrink: 0; margin-top: 1px; }
  .opt-button { width: 100%; background: transparent; color: inherit; text-align: left; font: inherit; }
  .opt.sel .radio { border-color: var(--accent); background: radial-gradient(circle, var(--accent) 42%, transparent 46%); }
  .opt .on { font-weight: 600; font-size: 14.5px; }
  .opt .od { font-size: 12.5px; color: var(--fg-dim); margin-top: 2px; }
  .sheet .seclabel { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-faint); margin: 16px 0 8px; font-family: ui-monospace, Menlo, monospace; }
  .primary-btn { width: 100%; background: var(--accent); color: #04260f; border: none; border-radius: 11px; padding: 13px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 14px; }
  .primary-btn:disabled { opacity: .4; }
  .field-input { width: 100%; background: var(--bg3); border: 1px solid var(--border); color: var(--fg); border-radius: 10px; padding: 10px 12px; font-size: 16px; outline: none; }
  .sheet.new-session-host { height: min(82dvh, 680px); overflow: hidden; display: flex; flex-direction: column; }
  .sheet.new-session-host #sheetBody { flex: 1; min-height: 0; }
  .new-session-layout { height: 100%; min-height: 0; display: flex; flex-direction: column; }
  .new-session-projects { flex: 1; min-height: 110px; overflow-y: auto; overscroll-behavior: contain; padding: 1px 2px 4px 0; -webkit-overflow-scrolling: touch; }
  .new-session-footer { flex-shrink: 0; margin-top: 8px; padding-top: 10px; border-top: 1px solid var(--border); background: var(--bg2); }
  .new-session-footer .seclabel { margin-top: 0; }

  /* file viewer */
  .file-tabs { display: flex; gap: 6px; margin: 4px 0 12px; }
  .file-tabs button { background: var(--bg3); border: 1px solid var(--border); color: var(--fg-dim); font-size: 12.5px; font-weight: 600; padding: 6px 14px; border-radius: 8px; cursor: pointer; }
  .file-tabs button.on { background: var(--accent2); color: #04121f; }
  .filebody { font-size: 14px; }
  .filerow { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 7px; cursor: pointer; }
  .filerow.sel { border-color: var(--accent); background: #2ea04314; }
  .filerow .cb { width: 19px; height: 19px; border-radius: 5px; border: 2px solid var(--fg-faint); flex-shrink: 0; }
  .filerow.sel .cb { border-color: var(--accent); background: var(--accent); }
  .filerow .fmeta { flex: 1; min-width: 0; }
  .filerow .fname { font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
  .filerow .fdir { font-size: 11.5px; color: var(--fg-faint); overflow-wrap: anywhere; }
  .filerow .fbadge { font-size: 10.5px; color: var(--accent); border: 1px solid var(--accent); border-radius: 20px; padding: 1px 7px; flex-shrink: 0; }
  .filerow .fbadge.edit { color: var(--accent2); border-color: var(--accent2); }
  .filecode { background: var(--bg); border: 1px solid var(--border); border-radius: 9px; padding: 12px; overflow-x: auto; max-height: 62dvh; overflow-y: auto; margin: 0; }
  .filecode code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; line-height: 1.55; white-space: pre; background: none; padding: 0; }
  .html-preview { width: 100%; height: min(62dvh, 720px); display: block; border: 1px solid var(--border); border-radius: 9px; background: #fff; }
  .html-preview-note { margin: -4px 0 10px; color: var(--fg-faint); font-size: 11.5px; }
  .html-source[hidden], .html-preview[hidden] { display: none; }
  /* highlight.js dark theme (compact, mapped to our palette) */
  .hljs { color: var(--fg); background: transparent; }
  .hljs-comment, .hljs-quote { color: var(--fg-faint); font-style: italic; }
  .hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-doctag, .hljs-name { color: #ff7b72; }
  .hljs-string, .hljs-regexp, .hljs-addition, .hljs-attribute, .hljs-meta .hljs-string { color: var(--add-fg); }
  .hljs-number, .hljs-symbol, .hljs-bullet, .hljs-template-variable, .hljs-variable { color: #79c0ff; }
  .hljs-title, .hljs-title.function_, .hljs-section, .hljs-built_in { color: #d2a8ff; }
  .hljs-type, .hljs-class .hljs-title, .hljs-title.class_ { color: #ffa657; }
  .hljs-attr, .hljs-property, .hljs-selector-attr, .hljs-selector-class, .hljs-selector-id { color: #79c0ff; }
  .hljs-tag, .hljs-punctuation { color: var(--fg-dim); }
  .hljs-meta { color: var(--accent2); }
  .hljs-deletion { color: var(--del-fg); }
  .hljs-emphasis { font-style: italic; }
  .hljs-strong { font-weight: 700; }

  /* usage panel */
  .gauge { background: var(--bg3); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .gauge .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .gauge .name { font-size: 13px; color: var(--fg-dim); }
  .gauge .pct { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .bar { height: 8px; background: var(--bg); border-radius: 6px; overflow: hidden; }
  .bar > span { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .bar.hot > span { background: linear-gradient(90deg, var(--warn), var(--danger)); }
  .gauge .reset { font-size: 11.5px; color: var(--fg-faint); margin-top: 7px; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
  .stat { background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 11px 12px; }
  .stat .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .k { font-size: 11.5px; color: var(--fg-dim); margin-top: 2px; }
  .credit { display: flex; gap: 9px; align-items: center; background: #2ea04314; border: 1px solid var(--accent); border-radius: 10px; padding: 10px 12px; margin-top: 6px; font-size: 13px; }
  .usage-seg { margin: 10px 0 14px; }
  .usage-note { background: #1f6feb12; border: 1px solid #388bfd55; border-radius: 10px; padding: 10px 12px; margin: 8px 0 12px; color: var(--fg-dim); font-size: 12.5px; line-height: 1.4; }

  /* Laptop workspace: keep navigation in view and bound the reading measure.
     Mobile still uses the original full-screen list -> chat navigation below
     this breakpoint, including its back button and safe-area spacing. */
  @media (min-width: 960px) {
    body.thread-open #app {
      display: grid;
      grid-template-columns: clamp(310px, 24vw, 380px) minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr);
      background: var(--bg);
      transition: grid-template-columns .2s ease;
    }
    body.thread-open.sidebar-collapsed #app { grid-template-columns: 0 minmax(0, 1fr); }
    body.thread-open header { grid-column: 1 / -1; grid-row: 1; padding: 10px 18px; box-shadow: 0 1px 0 #0008; z-index: 4; }
    body.thread-open #backBtn { display: none !important; }
    body.thread-open #sidebarToggleBtn { display: flex; }
    body.thread-open #viewSeg,
    body.thread-open #usageBtn,
    body.thread-open #newBtn { display: flex !important; }
    body.thread-open #listView {
      display: block !important;
      grid-column: 1;
      grid-row: 2;
      min-width: 0;
      border-right: 1px solid var(--border);
      background: var(--bg);
      transition: opacity .15s ease;
    }
    body.thread-open.sidebar-collapsed #listView {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      border-right: 0;
    }
    body.thread-open #chatView {
      grid-column: 2;
      grid-row: 2;
      min-width: 0;
      align-items: center;
      background: var(--bg);
    }
    body.thread-open #transcript,
    body.thread-open #composerWrap {
      width: min(calc(100% - 32px), 70vw, 1100px);
      border-left: 0;
      border-right: 0;
      background: transparent;
    }
    body.thread-open #messages { padding: 24px clamp(24px, 4vw, 56px) 20px; }
    body.thread-open #composerWrap {
      padding: 10px clamp(20px, 3vw, 42px) 14px;
      border-top-color: #30363d70;
      box-shadow: none;
    }
    body.thread-open #approval {
      width: min(calc(100% - 32px), 70vw, 1076px);
      margin-left: auto;
      margin-right: auto;
    }
    body.thread-open #controls { margin-bottom: 10px; }
    body.thread-open #input { min-height: 42px; padding: 10px 16px; }
    body.thread-open .msg.agent { font-size: 15px; line-height: 1.58; }
    body.thread-open .msg.user { max-width: 72%; }
    body.thread-open .row:hover,
    body.thread-open .row:focus-within { background: #161b22; }
    body.thread-open .row.active-thread {
      background: linear-gradient(90deg, #1f6feb20, #161b22 72%);
      box-shadow: inset 3px 0 var(--accent2);
    }
    body.thread-open .subagent-row.active-subagent { background: #1f6feb18; color: var(--accent2); }
    body.thread-open .row-copy:focus-visible {
      outline: 2px solid var(--accent2);
      outline-offset: -3px;
      border-radius: 8px;
    }
    .sheet {
      left: 50%;
      right: auto;
      bottom: 24px;
      width: min(620px, calc(100vw - 48px));
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 24px 80px #000b;
      transform: translate(-50%, calc(100% + 32px));
    }
    .sheet.show { transform: translate(-50%, 0); }
  }
</style>
</head>
<body>
<!-- PLATFORM_ONBOARDING -->
<section id="notificationOnboarding" class="onboard" hidden aria-labelledby="notificationOnboardingTitle">
  <div class="onboard-card">
    <div class="onboard-kicker">App installed</div>
    <h1 id="notificationOnboardingTitle">Know when your agent finishes</h1>
    <p>Remote Agents can notify this device when a turn completes, even while the app is closed.</p>
    <button type="button" class="onboard-primary" id="enablePushOnboardingBtn">Enable notifications</button>
    <button type="button" class="onboard-secondary" id="dismissPushOnboardingBtn">Not now</button>
    <p class="onboard-note" id="pushOnboardingHint"></p>
  </div>
</section>
<div id="app">
  <header>
    <button id="backBtn" class="hbtn" aria-label="Back">‹</button>
    <button id="sidebarToggleBtn" class="hbtn icon" aria-label="Hide session sidebar" aria-expanded="true" title="Hide session sidebar"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM9 5v14"/><path d="M14 9l-3 3 3 3"/></svg></button>
    <div class="htext">
      <div class="title" id="hTitle">Codex Sessions</div>
      <div class="sub" id="hSub"></div>
    </div>
    <div id="viewSeg" aria-label="Session view">
      <button data-view="recent" class="on">Recent</button>
      <button data-view="provider">Agents</button>
    </div>
    <span id="offlinePill">Offline</span>
    <span id="tokCount" class="mono"></span>
    <button id="diffBtn" class="hbtn icon" aria-label="Diff" style="display:none"><svg viewBox="0 0 24 24"><path d="M12 3v18M5 8h4M5 12h4M5 16h4"/><path d="M15 12h4M17 10v4"/></svg></button>
    <button id="filesBtn" class="hbtn icon" aria-label="Files" style="display:none"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg></button>
    <button id="notifyBtn" class="hbtn icon" aria-label="Task notifications" aria-haspopup="dialog" style="display:none"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg></button>
    <button id="usageBtn" class="hbtn icon" aria-label="Usage"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 18 0 9 9 0 0 0-18 0z"/><path d="M12 12l4-2"/><path d="M12 7v0"/></svg></button>
    <button id="newBtn" class="hbtn icon" aria-label="New session"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <div id="connDot" title="event stream"></div>
  </header>

  <aside id="listView" aria-label="Agent sessions">
    <div id="searchWrap">
      <div class="seg" id="providerSeg">
        <button data-provider="codex" class="on" aria-pressed="true" style="display:none">Codex</button>
        <button data-provider="claude" aria-pressed="false" style="display:none">Claude</button>
        <button data-provider="grok" aria-pressed="false" style="display:none">Grok</button>
      </div>
      <input id="search" type="search" placeholder="Search sessions…" autocomplete="off">
    </div>
    <div id="rows"></div>
    <button id="loadMore" style="display:none">Load more</button>
  </aside>

  <main id="chatView" aria-label="Selected agent conversation">
    <div id="transcript">
      <div id="messages"></div>
      <div id="livePill"><span class="run-dot"></span><span id="livePillText">Running — following along…</span></div>
      <button id="jumpBtn" title="Jump to latest" aria-label="Jump to latest">↓</button>
    </div>
    <div id="approval">
      <div class="q" id="apprTitle">Approval requested</div>
      <div class="cmd mono" id="apprBody"></div>
      <div class="btns">
        <button id="noBtn">Deny</button>
        <button id="sessBtn">Allow session</button>
        <button id="okBtn">Approve</button>
      </div>
    </div>
    <div id="composerWrap">
      <div id="controls">
        <button class="ctl" id="modelCtl"><span id="modelLabel">Model</span> <b id="modelName">—</b> <span class="ck">▾</span></button>
        <button class="ctl" id="effortCtl"><span id="effortLabel">Effort</span> <b id="effortName">—</b> <span class="ck">▾</span></button>
        <button class="ctl" id="modeCtl"><span id="modeName">Agent</span> <span class="ck">▾</span></button>
        <button class="ctl" id="steerCtl"><span>Send</span> <b id="steerName">Queue</b> <span class="ck">▾</span></button>
        <button class="ctl" id="lockCtl" style="display:none"><span>Lock</span> <b id="lockName">Not held here</b> <span class="ck">▾</span></button>
        <span class="settings-truth" id="settingsTruth" data-state="loading" role="status">Checking settings…</span>
      </div>
      <div id="attachmentStrip"></div>
      <div id="composer">
        <input id="imageInput" type="file" accept="image/*" multiple hidden>

<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
<script src="/vendor/highlight.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => (s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

// ---------- markdown ----------
// Rich, correct rendering via `marked` (GFM: headings, lists, tables, code,
// task lists) sanitized through DOMPurify — agent output is untrusted, so any
// raw HTML/scripts are stripped. Both libs are vendored in /vendor (no build
// step). Falls back to escaped plain text if the libraries fail to load.
if (window.marked?.setOptions) {
  window.marked.setOptions({ gfm: true, breaks: true });
}

function renderMarkdown(src) {
  if (!src) { return ""; }

  if (!window.marked || !window.DOMPurify) {
    return "<p>" + esc(src).replace(/\n/g, "<br>") + "</p>";
  }

  // `file://` link targets are dropped by the sanitizer, so rewrite them to plain
  // absolute paths first; the click handler opens those in the file viewer.
  const normalized = src.replace(/(\]\(\s*)file:\/\/(?:localhost)?(\/)/gi, "$1$2");
  const html = window.marked.parse(normalized);
  return window.DOMPurify.sanitize(html, {
    ADD_ATTR: ["target"],
    // Interactive controls are created only by this client after sanitizing.
    // Agent-authored styles/hidden content must not disguise what a copy action copies.
    FORBID_TAGS: ["button", "style"],
    FORBID_ATTR: ["style", "hidden"],
  });
}

// BEGIN code-block-metadata (pure so language decisions stay unit-testable)
const CODE_LANGUAGE_LABELS = {
  bash: "Shell", c: "C", cpp: "C++", csharp: "C#", css: "CSS", diff: "Diff",
  dockerfile: "Dockerfile", go: "Go", graphql: "GraphQL", html: "HTML", ini: "INI",
  java: "Java", javascript: "JavaScript", js: "JavaScript", json: "JSON", jsx: "JSX",
  kotlin: "Kotlin", markdown: "Markdown", md: "Markdown", php: "PHP", plaintext: "Plain text",
  mermaid: "Mermaid",
  py: "Python", python: "Python", rb: "Ruby", ruby: "Ruby", rust: "Rust", sh: "Shell",
  shell: "Shell", sql: "SQL", swift: "Swift", text: "Plain text", toml: "TOML", ts: "TypeScript",
  tsx: "TSX", typescript: "TypeScript", xml: "XML",
  yaml: "YAML", yml: "YAML",
};
const MAX_CODE_HIGHLIGHT_CHARS = 200_000;
const MAX_MERMAID_CHARS = 50_000;

function codeBlockMetadata(className, text) {
  const explicit = String(className || "").match(/(?:^|\s)language-([^\s]+)/i)?.[1]?.toLowerCase() || null;
  let language = explicit;
  let inferred = false;

  if (!language) {
    const candidate = String(text || "").trim();

    if (candidate.length <= MAX_CODE_HIGHLIGHT_CHARS && ((candidate.startsWith("{") && candidate.endsWith("}")) || (candidate.startsWith("[") && candidate.endsWith("]")))) {
      try {
        JSON.parse(candidate);
        language = "json";
        inferred = true;
      } catch { /* ordinary plain text containing braces */ }
    }
  }

  const label = language
    ? CODE_LANGUAGE_LABELS[language] || language.replace(/(^|[-_])([a-z])/g, (_match, gap, letter) => (gap ? " " : "") + letter.toUpperCase())
    : "Plain text";
  return { language, label, inferred };
}
// END code-block-metadata

const COPY_CODE_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>';
const COPIED_CODE_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>';

let mermaidLoader = null;
let mermaidRenderQueue = Promise.resolve();
let mermaidSequence = 0;
const observedMermaidCards = new Set();
const mermaidObserver = window.IntersectionObserver ? new IntersectionObserver((entries) => {
  for (const entry of entries) {
    if (!entry.isIntersecting) { continue; }
    mermaidObserver.unobserve(entry.target);
    observedMermaidCards.delete(entry.target);
    queueMermaidRender(entry.target);
  }
}, { rootMargin: "320px 0px" }) : null;

function loadMermaid() {
  if (window.mermaid?.render) { return Promise.resolve(window.mermaid); }
  if (mermaidLoader) { return mermaidLoader; }

  mermaidLoader = new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = "/vendor/mermaid.min.js";
    script.async = true;
    script.onload = () => {
      if (!window.mermaid?.render) {
        reject(new Error("Mermaid did not initialize"));
        return;
      }
      window.mermaid.initialize({
        startOnLoad: false,
        securityLevel: "strict",
        htmlLabels: false,
        theme: "dark",
        maxTextSize: MAX_MERMAID_CHARS,
        maxEdges: 500,
        suppressErrorRendering: true,
      });
      resolve(window.mermaid);
    };
    script.onerror = () => reject(new Error("Mermaid renderer could not be loaded"));
    document.head.appendChild(script);
  }).catch((error) => {
    mermaidLoader = null;
    throw error;
  });
  return mermaidLoader;
}

async function renderMermaidCard(card) {
  if (!card.isConnected || card.dataset.mermaidState !== "pending") { return; }
  const diagram = card.querySelector(".mermaid-diagram");
  const source = card._mermaidSource || "";
  card.dataset.mermaidState = "rendering";
  diagram.textContent = "Rendering diagram…";

  try {
    if (source.length > MAX_MERMAID_CHARS) {
      throw new Error(`Diagram source exceeds ${MAX_MERMAID_CHARS.toLocaleString()} characters`);
    }
    const mermaid = await loadMermaid();
    if (!card.isConnected) { return; }
    const result = await mermaid.render(`remote_agents_mermaid_${++mermaidSequence}`, source);
    if (!card.isConnected) { return; }
    diagram.innerHTML = window.DOMPurify
      ? window.DOMPurify.sanitize(result.svg, { USE_PROFILES: { svg: true, svgFilters: true } })
      : "";
    if (!diagram.querySelector("svg")) { throw new Error("Diagram output was rejected"); }
    card.dataset.mermaidState = "ready";
  } catch (error) {
    if (!card.isConnected) { return; }
    card.dataset.mermaidState = "error";
    diagram.classList.add("error");
    diagram.textContent = `Could not render this Mermaid diagram: ${error?.message || "invalid diagram"}`;
  }
}

function queueMermaidRender(card) {
  // Mermaid uses shared renderer state. Serialize diagrams so several cards
  // entering the viewport together cannot interfere with each other.
  mermaidRenderQueue = mermaidRenderQueue.then(() => renderMermaidCard(card), () => renderMermaidCard(card));
}

function scheduleMermaidBlocks(root) {
  // Remove stale observer targets whenever a new final message/file is rendered.
  for (const card of observedMermaidCards) {
    if (!card.isConnected) {
      mermaidObserver?.unobserve(card);
      observedMermaidCards.delete(card);
    }
  }

  for (const card of root.querySelectorAll('.mermaid-card[data-mermaid-state="pending"]')) {
    if (mermaidObserver) {
      observedMermaidCards.add(card);
      mermaidObserver.observe(card);
    } else {
      queueMermaidRender(card);
    }
  }
}

function makeMermaidCard(pre, code, sourceText) {
  for (const attr of Array.from(pre.attributes)) { pre.removeAttribute(attr.name); }
  for (const attr of Array.from(code.attributes)) { code.removeAttribute(attr.name); }
  code.className = "language-mermaid";
  code.textContent = sourceText;

  const card = document.createElement("div");
  card.className = "code-card mermaid-card";
  card.dataset.mermaidState = "pending";
  card._mermaidSource = sourceText;
  const head = document.createElement("div");
  head.className = "code-card-head";
  const label = document.createElement("span");
  label.className = "code-language";
  label.textContent = "Mermaid diagram";
  const toggle = document.createElement("button");
  toggle.type = "button";
  toggle.className = "mermaid-toggle";
  toggle.textContent = "Source";
  toggle.setAttribute("aria-pressed", "false");
  const copy = document.createElement("button");
  copy.type = "button";
  copy.className = "code-copy";
  copy.dataset.copyLabel = "Copy Mermaid source";
  copy.dataset.copyTitle = "Copy Mermaid source";
  copy.setAttribute("aria-label", copy.dataset.copyLabel);
  copy.title = copy.dataset.copyTitle;
  copy.innerHTML = COPY_CODE_ICON;
  copy._codeEl = code;
  copy._copyText = sourceText;
  const diagram = document.createElement("div");
  diagram.className = "mermaid-diagram";
  diagram.textContent = "Diagram will render when visible…";
  pre.className = "mermaid-source";
  pre.hidden = true;
  toggle.onclick = () => {
    const showingSource = pre.hidden;
    pre.hidden = !showingSource;
    diagram.hidden = showingSource;
    toggle.textContent = showingSource ? "Diagram" : "Source";
    toggle.setAttribute("aria-pressed", String(showingSource));
  };
  head.append(label, toggle, copy);
  pre.replaceWith(card);
  card.append(head, diagram, pre);
  return card;
}

function decorateCodeBlocks(root) {
  for (const code of root.querySelectorAll("pre > code")) {
    const pre = code.parentElement;
    if (!pre || code._codeCardDecorated) { continue; }
    code._codeCardDecorated = true;

    const sourceText = code.textContent || "";
    const metadata = codeBlockMetadata(code.className, sourceText);
    if (metadata.language === "mermaid") {
      makeMermaidCard(pre, code, sourceText);
      continue;
    }
    // Marked code fences are already plain text. Raw agent HTML can contain
    // hidden descendants, so flatten it before display and retain the exact
    // same source for copying. Copied content can never exceed visible source.
    for (const attr of Array.from(pre.attributes)) { pre.removeAttribute(attr.name); }
    for (const attr of Array.from(code.attributes)) { code.removeAttribute(attr.name); }
    code.className = metadata.language ? `language-${metadata.language}` : "";
    code.textContent = sourceText;
    if (sourceText.length <= MAX_CODE_HIGHLIGHT_CHARS && metadata.language && window.hljs?.getLanguage?.(metadata.language)) {
      try { window.hljs.highlightElement(code); } catch { /* retain safe plain code */ }
    }

    const card = document.createElement("div");
    card.className = "code-card";
    const head = document.createElement("div");
    head.className = "code-card-head";
    const label = document.createElement("span");
    label.className = "code-language";
    label.textContent = metadata.label;
    const copy = document.createElement("button");
    copy.type = "button";
    copy.className = "code-copy";
    copy.dataset.copyLabel = `Copy ${metadata.label} code`;
    copy.dataset.copyTitle = `Copy ${metadata.label}`;
    copy.setAttribute("aria-label", copy.dataset.copyLabel);
    copy.title = copy.dataset.copyTitle;
    copy.innerHTML = COPY_CODE_ICON;
    // Bind copy behavior to the exact DOM node we created. Agent-authored HTML
    // may retain class names after sanitization, but it cannot forge JS identity.
    copy._codeEl = code;
    copy._copyText = sourceText;
    head.append(label, copy);
    pre.replaceWith(card);
    card.append(head, pre);
  }
}

function renderFinalMarkdownInto(el, text) {
  el.innerHTML = renderMarkdown(text);
  decorateCodeBlocks(el);
  scheduleMermaidBlocks(el);
}

async function writeClipboardText(text) {
  if (navigator.clipboard?.writeText) {
    await navigator.clipboard.writeText(text);
    return;
  }

  const fallback = document.createElement("textarea");
  fallback.value = text;
  fallback.setAttribute("readonly", "");
  fallback.style.position = "fixed";
  fallback.style.left = "-9999px";
  fallback.style.top = "0";
  fallback.style.opacity = "0";
  const previousFocus = document.activeElement;
  document.body.appendChild(fallback);
  let copied = false;

  try {
    fallback.focus();
    fallback.select();
    fallback.setSelectionRange(0, fallback.value.length);
    copied = document.execCommand("copy");
  } finally {
    fallback.remove();
    if (previousFocus instanceof HTMLElement) { previousFocus.focus({ preventScroll: true }); }
  }

  if (!copied) { throw new Error("Copy is unavailable"); }
}

async function copyCodeBlock(button) {
  const code = button._codeEl;
  if (!code) { return; }

  try {
    await writeClipboardText(button._copyText || "");
    button.dataset.state = "copied";
    button.setAttribute("aria-label", "Copied code");
    button.title = "Copied";
    button.innerHTML = COPIED_CODE_ICON;
  } catch {
    button.dataset.state = "failed";
    button.setAttribute("aria-label", "Could not copy code");
    button.title = "Could not copy";
  }

  clearTimeout(button._copyReset);
  button._copyReset = setTimeout(() => {
    button.dataset.state = "";
    button.setAttribute("aria-label", button.dataset.copyLabel || "Copy code");
    button.title = button.dataset.copyTitle || "Copy code";
    button.innerHTML = COPY_CODE_ICON;
  }, 1800);
}

const state = {
  provider: "codex",         // codex | claude
  listView: "recent",        // recent | provider
  sidebarCollapsed: false,
  listRequestSeq: 0,
  unavailableProviders: [],
  featuredCount: 0,
  threads: [], nextCursor: null,
  active: null, activeTurnId: null,
  items: new Map(),          // itemId -> {kind, el, bodyEl}
  approvalId: null,
  searchTimer: null,
  models: [], model: null, effort: null,
  modelsProvider: null,
  capabilitiesByProvider: new Map(),
  modelRequestSeq: 0,
  modeByProvider: { codex: "auto", claude: "manual", grok: "bypass" }, // defaults for new threads
  threadMode: null,          // server-resolved mode for the open thread
  threadModeUnknown: false, // provider exposed a combination we cannot map honestly
  threadApprovalPolicy: null,
  threadSandboxPolicy: null,
  settingsTruth: { state: "loading", sources: {}, message: "Checking settings…" },
  modelsReady: false,
  settingsSave: Promise.resolve(),
  sendMode: "queue",         // queue | steer — what happens when you send mid-turn
  busy: false,               // is a turn currently running
  turnOwnership: "idle",     // idle | checking | unknown | bridge | external
  pending: [],               // [{ text, chip }] messages waiting to send
  failedSends: [],           // [{ threadId, text, requestId }] sends that never landed
  running: new Set(),        // "provider:threadId" of threads with an active turn
  runConfidence: new Map(),  // same key -> bridge | provider | marker | heuristic | stalled | stale_timeout | historical_stale
  sseErrored: false,         // did the event stream drop (for reconnect catch-up)
  resyncing: false,          // guard against overlapping re-reads
  nativeQueueReconciling: false,
  lastDiff: "",
  threadFiles: new Map(), // path -> { path, edited } for the open thread
  activityGroup: null,    // newest contiguous Codex activity run
  lock: { state: "unknown", label: "Checking…" },
  sendStage: null,        // { requestId, threadId, text, bubble, chip }
  composerAttachments: [], // uploaded server refs safe to persist in queues
  uploadingAttachments: 0,
  notificationRules: new Map(), // "provider:threadId" -> once | follow, for this device
  expandedSubagents: new Set(),
};

const AVAILABLE_PROVIDER_NAMES = /* USABLE_PROVIDERS */ ["codex", "claude", "grok"];
const ALL_PROVIDER_LABELS = { codex: "Codex", claude: "Claude", grok: "Grok" };
const PROVIDER_LABELS = Object.fromEntries(AVAILABLE_PROVIDER_NAMES.map((name) => [name, ALL_PROVIDER_LABELS[name]]).filter(([, label]) => label));
const PROVIDER_ICONS = { codex: "/icons/provider-codex.svg", claude: "/icons/provider-claude.svg", grok: "/icons/provider-grok.svg" };

function providerLabel() { return PROVIDER_LABELS[state.provider] || "Codex"; }

function activeProvider() { return state.active ? (state.active.provider || "codex") : state.provider; }

// Permission modes are provider-specific and map to each CLI's real controls:
//  - Codex: `sandbox` + `approvalPolicy` are passed to turn/start.
//  - Claude: the mode key maps to `claude --permission-mode` (manual routes
//    sensitive tools through the approval hook).
const MODE_SETS = {
  codex: {
    "read-only": { name: "Read Only",    sandbox: "read-only",          approvalPolicy: "untrusted",  desc: "Reads files and runs safe commands; asks before anything that writes." },
    "auto":      { name: "Approve for me", sandbox: "workspace-write",   approvalPolicy: "on-request", desc: "Only asks for actions detected as potentially unsafe, or before leaving the workspace." },
    "full":      { name: "Full Access",   sandbox: "danger-full-access", approvalPolicy: "never",      desc: "No sandbox and no prompts — runs everything unattended. Use with care." },
  },
  claude: {
    "manual":      { name: "Manual approve",       desc: "Asks before running commands or editing files (approvals appear here)." },
    "auto":        { name: "Auto",                 desc: "Approves actions that pass Claude's safety check and pauses for anything risky." },
    "acceptEdits": { name: "Edit automatically",   desc: "Auto-accepts file edits and runs tools without asking." },
    "plan":        { name: "Plan",                 desc: "Read-only — plans and explains without changing anything." },
    "bypass":      { name: "Bypass permissions",   desc: "No prompts at all. Full autonomy — use with care." },
  },
  grok: {
    "bypass":      { name: "Bypass permissions",   desc: "Auto-approves every tool. Full autonomy — use with care." },
  },
};

const DEFAULT_MODE = { codex: "auto", claude: "auto", grok: "bypass" };

const SEND_MODES = {
  queue: { name: "Queue", desc: "Held and sent automatically when the current turn finishes." },
  steer: { name: "Steer", desc: "Adds guidance to a turn this bridge owns at the next safe boundary; otherwise it stays queued." },
};

function sendModesFor(provider) {
  if (provider === "grok") {
    return {
      queue: SEND_MODES.queue,
      steer: { name: "Interrupt & send", desc: "Stops a Grok turn owned by this bridge, waits for confirmed cancellation, then sends your message." },
    };
  }

  return SEND_MODES;
}

function effectiveSendBehavior() {
  if (!state.busy) { return { name: "Now", desc: "Starts a new turn immediately." }; }
  if (state.turnOwnership === "checking") {
    return { name: "Checking…", desc: "Confirming which app owns this running turn before accepting a message." };
  }
  if (state.turnOwnership === "unknown") {
    return { name: "Queue (syncing)", desc: "Ownership could not be confirmed. Your message stays local and unsent until sync recovers." };
  }
  if (state.externalTurn) {
    if (activeProvider() === "codex") {
      return {
        name: "Codex queue",
        desc: "Codex Desktop owns this turn. This follow-up is saved in Codex's native queue and starts automatically after the turn finishes; interrupt the current turn in Codex Desktop.",
      };
    }
    return { name: "Queue (external)", desc: "This turn is owned elsewhere, so the message waits for confirmed completion." };
  }
  if (state.sendMode === "queue") { return SEND_MODES.queue; }
  return sendModesFor(activeProvider()).steer;
}

function modeSetFor(provider) {
  const base = MODE_SETS[provider] || MODE_SETS.codex;
  const advertised = state.capabilitiesByProvider.get(provider)?.permissionModes;
  if (!Array.isArray(advertised)) { return base; }
  return Object.fromEntries(Object.entries(base).filter(([key]) => advertised.includes(key)));
}

function supportsInput(modality) {
  const modelModes = currentModel()?.inputModalities;
  if (Array.isArray(modelModes)) { return modelModes.includes(modality); }
  return state.capabilitiesByProvider.get(activeProvider())?.inputModalities?.includes(modality) === true;
}

// Resolve the open thread's mode first. Global picks are defaults for sessions
// with no provider/store value, not a competing opinion about an existing one.
function currentMode() {
  const p = activeProvider();
  const set = modeSetFor(p);

  if (state.active && activeProvider() === "codex" && state.threadModeUnknown && !state.threadMode
      && (state.threadApprovalPolicy || state.threadSandboxPolicy)) {
    const sandboxType = typeof state.threadSandboxPolicy === "object"
      ? state.threadSandboxPolicy?.type
      : state.threadSandboxPolicy;
    const policyName = sandboxType === "managed" ? "Managed access" : `${sandboxType || "Custom"} access`;
    return {
      key: "provider-exact",
      name: policyName,
      desc: `Provider-owned policy · approval ${state.threadApprovalPolicy || "unspecified"}`,
      approvalPolicy: state.threadApprovalPolicy,
      sandbox: state.threadSandboxPolicy,
      providerExact: true,
      unknown: false,
    };
  }

  if (state.active && state.threadModeUnknown && !state.threadMode) {
    return {
      key: null,
      name: "Unrepresentable policy",
      desc: `${PROVIDER_LABELS[p] || "Provider"} reports a permission policy this bridge cannot represent. Choose a preset before sending.`,
      unknown: true,
    };
  }

  let key = state.active && state.threadMode ? state.threadMode : state.modeByProvider[p];

  if (!set[key]) {
    key = set[DEFAULT_MODE[p]] ? DEFAULT_MODE[p] : Object.keys(set)[0] ?? null;
    state.modeByProvider[p] = key;
  }

  if (!key || !set[key]) {
    return { key: null, name: "Unavailable", desc: `${PROVIDER_LABELS[p] || "Provider"} does not advertise a permission mode this bridge can apply exactly.`, unknown: true };
  }

  return { key, ...set[key] };
}

// ---------- api ----------
// Two outages are indistinguishable to a naive fetch, and both must fall back to
// the cache: this phone having no network (fetch rejects), and the Mac or its
// tunnel being down (the proxy in front answers 502/52x/53x with an error page,
// which resolves like a normal response). Classify them here and tag the error
// with `reach` so callers can fall back and say which one it is.
function unreachable(kind) {
  return Object.assign(new Error(kind === "host" ? "can't reach your Mac" : "your phone is offline"), { reach: kind });
}

// navigator.onLine can still read a stale `true` for a moment after a cold
// launch, which would blame the Mac for the phone's own outage. Re-check when we
// actually render: a phone that knows it has no network is the better answer.
function effectiveReach(reach) {
  return navigator.onLine ? reach : "phone";
}

function offlineWord(reach) {
  return effectiveReach(reach) === "host" ? "Your Mac looks offline" : "You're offline";
}

async function api(path, body) {
  let res;

  try {
    res = await fetch(path, body && { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  } catch (cause) {
    // The request never left the phone.
    console.warn("Bridge request failed before a response", path, cause);
    throw unreachable(navigator.onLine ? "host" : "phone");
  }

  // Our own server always answers JSON, so a non-JSON 5xx is the proxy reporting
  // that the machine behind it is gone — not a failing handler.
  if (res.status >= 500 && !(res.headers.get("content-type") || "").includes("json")) {
    throw unreachable("host");
  }

  if (!res.ok) {
    const b = await res.json().catch(() => ({}));
    // code lets callers decide (steer -> queue, say) without matching prose.
    throw Object.assign(new Error(b.error || res.statusText), { code: b.code, status: res.status });
  }

  try {
    return await res.json();
  } catch {
    // For a delivery endpoint, losing/truncating a successful JSON response is
    // ambiguous even though HTTP itself completed. Callers combine this fact
    // with their exact dispatch stage before deciding whether retry is safe.
    throw Object.assign(new Error("the bridge response was incomplete"), {
      code: "invalid_bridge_response",
      status: res.status,
      responseInvalid: true,
    });
  }
}

// ---------- offline cache (IndexedDB) ----------
// Recently-opened threads and the session list are cached so the app reads fully
// offline. On open we paint from cache instantly, then revalidate from the
// network; heavy tool output/diffs are trimmed to keep entries small.
const IDB_NAME = "remote-agents";
const IDB_STORE = "cache";
const MAX_CACHED_TURNS = 40;
const MAX_FIELD_CHARS = 4000;
let _idbPromise = null;

function idbOpen() {
  if (_idbPromise) { return _idbPromise; }

  _idbPromise = new Promise((resolve, reject) => {
    let req;

    try {
      req = indexedDB.open(IDB_NAME, 1);
    } catch (e) {
      reject(e);
      return;
    }

    req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });

  return _idbPromise;
}

async function idbGet(key) {
  try {
    const db = await idbOpen();

    return await new Promise((resolve, reject) => {
      const r = db.transaction(IDB_STORE, "readonly").objectStore(IDB_STORE).get(key);
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    });
  } catch {
    return undefined;
  }
}

async function idbSet(key, val) {
  try {
    const db = await idbOpen();

    await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, "readwrite");
      tx.objectStore(IDB_STORE).put(val, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  } catch {
    // storage unavailable / evicted — cache is best-effort
  }
}

async function idbDel(key) {
  try {
    const db = await idbOpen();

    await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, "readwrite");
      tx.objectStore(IDB_STORE).delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  } catch {
    // storage unavailable — cache is best-effort
  }
}

function threadCacheKey(provider, id) { return "th:" + (provider || "codex") + ":" + id; }

function fileCacheKey(cwd, path) { return "file:" + (cwd || "") + ":" + path; }

// Files you open are kept for offline reading, oldest evicted past the budget.
const FILE_CACHE_MAX_BYTES = 5 * 1024 * 1024;

async function cacheFile(cwd, path, data) {
  if (!data || data.binary) { return; }

  const key = fileCacheKey(cwd, path);
  await idbSet(key, { ...data, cachedAt: Date.now() });

  const idx = (await idbGet("fileidx")) || [];
  const rest = idx.filter((e) => e.key !== key);
  rest.push({ key, size: (data.content || "").length, at: Date.now() });
  rest.sort((a, b) => a.at - b.at);
  let total = rest.reduce((n, e) => n + (e.size || 0), 0);

  while (total > FILE_CACHE_MAX_BYTES && rest.length > 1) {
    const oldest = rest.shift();
    total -= oldest.size || 0;
    await idbDel(oldest.key);
  }

  await idbSet("fileidx", rest);
}

function listCacheKey(provider) { return "list:" + (provider || "codex"); }

// Keep the last N turns; truncate large command output and diffs to a preview.
function trimThreadForCache(thread) {
  const clip = (s) => (typeof s === "string" && s.length > MAX_FIELD_CHARS ? s.slice(0, MAX_FIELD_CHARS) + "\n… (truncated — open online for the full text)" : s);
  const turns = (thread?.turns ?? []).slice(-MAX_CACHED_TURNS).map((turn) => ({
    items: (turn.items ?? []).map((it) => {
      const c = { ...it };

      if (typeof c.aggregatedOutput === "string") { c.aggregatedOutput = clip(c.aggregatedOutput); }

      if (Array.isArray(c.changes)) { c.changes = c.changes.map((ch) => ({ ...ch, diff: clip(ch.diff) })); }

      return c;
    }),
  }));

  return { turns };
}

function setOfflineNote(on, reach) {
  document.body.classList.toggle("offline", !!on);

  if (on) { $("offlinePill").textContent = effectiveReach(reach) === "host" ? "Mac offline" : "Offline"; }
}

// ---------- helpers ----------
function relTime(sec) {
  const d = Math.floor(Date.now() / 1000) - sec;

  if (d < 60) { return "just now"; }
  if (d < 3600) { return Math.floor(d / 60) + "m ago"; }
  if (d < 86400) { return Math.floor(d / 3600) + "h ago"; }
  return Math.floor(d / 86400) + "d ago";
}

function relFuture(sec) {
  const d = sec - Math.floor(Date.now() / 1000);

  if (d <= 0) { return "now"; }
  if (d < 3600) { return "in " + Math.ceil(d / 60) + "m"; }
  if (d < 86400) { return "in " + Math.round(d / 3600) + "h"; }
  return "in " + Math.round(d / 86400) + "d";
}

function fmtTokens(n) {
  if (n == null) { return ""; }
  if (n < 1000) { return n + ""; }
  if (n < 1e6) { return (n / 1e3).toFixed(n < 1e4 ? 1 : 0) + "k"; }
  return (n / 1e6).toFixed(1) + "M";
}

function fmtBytes(n) {
  if (n == null) { return ""; }
  if (n < 1024) { return n + " B"; }
  if (n < 1048576) { return (n / 1024).toFixed(1) + " KB"; }
  return (n / 1048576).toFixed(1) + " MB";
}

  if (running && confidence === "stalled") {
    return { visible: true, label: "no recent activity", className: "stalled" };
  }

  if (!running && confidence === "stale_timeout") {
    return { visible: true, label: "likely stopped", className: "abnormal" };
  }

  return { visible: running, label: "running", className: "" };
}

function liveRunText(confidence) {
  return confidence === "stalled"

    : "Running — following live";
}

async function loadThreads(append) {
  const q = new URLSearchParams();
  const search = $("search").value.trim();
  const provider = state.provider;
  const listView = state.listView;
  const requestSeq = ++state.listRequestSeq;

  if (listView === "provider") { q.set("provider", provider); }

  if (append && state.nextCursor) { q.set("cursor", state.nextCursor); }

  if (search) { q.set("search", search); }

  try {
    const path = listView === "recent" ? "/api/threads/recent?" : "/api/threads?";
    let res;

    try {
      res = await api(path + q);
    } catch (error) {
      // During a safe live rollout the static PWA can refresh before the bridge
      // process is restarted (we never restart over active turns). Older
      // bridges do not have the aggregate endpoint yet, so fan out through the
      // existing provider endpoint until the process can be upgraded safely.
      if (listView !== "recent" || error.status !== 404) { throw error; }

      const providerResults = await Promise.allSettled(Object.keys(PROVIDER_LABELS).map(async (name) => {
        const providerQuery = new URLSearchParams(q);
        providerQuery.set("provider", name);
        return { name, result: await api("/api/threads?" + providerQuery) };
      }));
      const groups = [];
      const unavailableProviders = [];

      const providerNames = Object.keys(PROVIDER_LABELS);

      for (let index = 0; index < providerResults.length; index += 1) {
        const result = providerResults[index];

        if (result.status === "fulfilled") { groups.push(result.value.result.data ?? []); }
        else { unavailableProviders.push(providerNames[index]); }
      }

      res = {
        data: groups.flat().sort((a, b) => Number(!!b.running) - Number(!!a.running) || Number(b.updatedAt ?? 0) - Number(a.updatedAt ?? 0)),
        featuredCount: Math.min(10, groups.flat().length),
        nextCursor: null,
        unavailableProviders,
      };
    }

    // A view/provider/search switch can finish requests out of order. Only the
    // newest request may update the list.
    if (requestSeq !== state.listRequestSeq || state.listView !== listView || (listView === "provider" && state.provider !== provider)) { return; }

    if (append && listView === "recent") {
      const existing = new Set(state.threads.map((thread) => `${thread.provider}:${thread.id}`));
      state.threads = state.threads.concat((res.data ?? []).filter((thread) => !existing.has(`${thread.provider}:${thread.id}`)));
    } else {
      state.threads = append ? state.threads.concat(res.data) : res.data;
    }
    state.nextCursor = res.nextCursor;
    if (!append) { state.featuredCount = listView === "recent" ? (res.featuredCount ?? Math.min(10, res.data?.length ?? 0)) : 0; }
    state.unavailableProviders = res.unavailableProviders ?? [];

    // The server read each thread's run state off disk, which is the only way to
    // know about turns that were already under way before this app connected.
    for (const t of res.data ?? []) {
      const ourTurn = state.active && t.id === state.active.id && state.busy && !state.externalTurn;
      const threadProvider = t.provider || provider;

      if (!ourTurn) { markRunning(threadProvider, t.id, !!t.running, { confidence: t.runConfidence, live: false }); }

      for (const child of t.subagents ?? []) {
        markRunning(child.provider || threadProvider, child.id, !!child.running, { confidence: child.runConfidence, live: false });
      }
    }

    // Provider events and this fetch can cross in flight. Rank from the live
    // running set immediately before painting so an older response can never
    // put a now-running task back in its previous position. This is an invariant
    // in both Recent Work and the provider-specific Agents view.
    state.threads = rankLiveThreads(state.threads, state.running);

    const previousListTop = $("listView").scrollTop;
    renderRows(listView === "provider" && append);
    if (listView === "recent" && append) { $("listView").scrollTop = previousListTop; }
    updateListChrome();
    setOfflineNote(false);

    // Cache the first page (no search) so the list renders offline.
    if (!append && !search) { idbSet(listCacheKey(listView === "recent" ? "recent" : provider), { data: res.data, nextCursor: res.nextCursor, featuredCount: state.featuredCount }); }
  } catch (e) {
    // Offline / unreachable — fall back to the last cached copy of this view.
    if (append || search) { throw e; }

    const cached = await idbGet(listCacheKey(listView === "recent" ? "recent" : provider));

    if (cached?.data && requestSeq === state.listRequestSeq && state.listView === listView && (listView === "recent" || state.provider === provider)) {
      state.threads = cached.data;
      state.nextCursor = null;
      state.featuredCount = listView === "recent" ? (cached.featuredCount ?? Math.min(10, cached.data.length)) : 0;
      state.unavailableProviders = [];
      renderRows(false);
      updateListChrome();
      setOfflineNote(true, e.reach);
    } else {
      const label = listView === "recent" ? "recent work" : providerLabel();
      $("rows").innerHTML = '<div class="empty">' + offlineWord(e.reach) + " — no saved sessions for " + esc(label) + ".</div>";
    }
  }
}

// ---------- chat rendering ----------
function box() { return $("messages"); }

// Auto-scroll is *sticky*, not forced: a running turn appends constantly, and
// yanking the view to the bottom while you are reading further up makes a live
// thread unusable. Stickiness is tracked from the scroll event rather than
// measured at append time — by the time these callers run, the new content is
// already in the DOM, so scrollHeight has grown and "are we at the bottom?" no
// longer answers "were we at the bottom before this arrived?".
const STICK_PX = 120;
let stickToBottom = true;
// Bumped by anything that positions the transcript deliberately, so an
// auto-scroll queued a frame earlier cannot land on top of it.
let scrollSeq = 0;

function atBottom() {
  const b = box();

function setModel(id) {
  state.model = id;
  const m = currentModel();
  const efforts = (m?.supportedReasoningEfforts ?? []).map((e) => e.reasoningEffort);

  if (!efforts.includes(state.effort)) { state.effort = m?.defaultReasoningEffort ?? efforts[0] ?? null; }

  setSettingsTruth({ state: "override", message: "Exact override for next turn" });

  persistPrefs();
  saveThreadSettings().catch((e) => chip("⚠️", "Could not save thread settings: " + e.message));
  syncControls();
}

function syncControls() {
  const m = currentModel();
  const readiness = dispatchReadiness();
  const truth = state.settingsTruth;
  $("modelName").textContent = m?.displayName || state.model || "—";
  $("effortName").textContent = state.effort === "provider-default" ? "Provider default" : state.effort || "—";
  $("modeName").textContent = currentMode().name;
  const imagesSupported = supportsInput("image");
  $("attachBtn").disabled = !imagesSupported || state.uploadingAttachments > 0;
  $("attachBtn").title = imagesSupported ? "Attach images" : `${providerLabel()} does not advertise image prompt support`;
  $("modelEffortCtl").title = readiness.ready
    ? `${m?.displayName || state.model} · ${state.effort === "provider-default" ? "Provider default" : state.effort}`
    : readiness.reason;
  $("modeCtl").title = currentMode().unknown
    ? readiness.reason
    : (currentMode().providerExact ? currentMode().desc : `Exact permission preset: ${currentMode().key}`);
  $("settingsTruth").dataset.state = truth.state;
  $("settingsTruth").textContent = truth.message;
  $("settingsTruth").title = `Model: ${state.model || "unavailable"} · Effort: ${state.effort || "unavailable"} · Mode: ${currentMode().key || "unavailable"}`;
  $("settingsTruth").hidden = truth.state !== "loading" && truth.state !== "error";
  $("sendBtn").disabled = state.uploadingAttachments > 0 || !readiness.ready;
  $("sendBtn").title = readiness.ready ? "Send with the exact settings shown" : readiness.reason;
  $("sendActions").title = readiness.ready ? "" : readiness.reason;
  syncComposerPrimaryAction();
  syncLockControl();
}

function threadSettingsBody() {
  const t = state.active;
  if (!t?.id || state.modelsProvider !== (t.provider || state.provider)) { return null; }
  const mode = currentMode();
  const body = {
    provider: t.provider || state.provider,
    threadId: t.id,
    model: state.model,
    effort: state.effort,
  };
  if (!mode.unknown && !mode.providerExact) { body.mode = mode.key; }
  return body;
}

function saveThreadSettings(patch = null, { pending = true } = {}) {
  const current = threadSettingsBody();
  if (!current) { return Promise.resolve(); }
  const body = patch
    ? { provider: current.provider, threadId: current.threadId, ...patch }
    : current;
  body.pending = pending;
  const job = state.settingsSave.catch(() => {}).then(() => api("/api/thread/settings", body));
  state.settingsSave = job;
  return job;
}

function addCurrentThreadModel(model, effort, availability) {
  if (!model || state.models.some((item) => item.id === model)) { return; }
  state.models.unshift({
    id: model,
    displayName: model,
    description: availability === "unlisted"
      ? "Current thread model. It is not in the provider's current list; the next send will request this exact ID and the provider may reject it."
      : "Current thread model.",
    threadOnly: true,
    supportedReasoningEfforts: effort ? [{ reasoningEffort: effort, description: "Current thread effort." }] : [],
  });
}

// BEGIN thread-settings-selection (kept pure so the real browser decision is unit tested)
function selectThreadSettingsPair(settings, models, fallback) {
  const supports = (model, effort) => {
    if (!model || !effort) { return false; }
    const efforts = model.supportedReasoningEfforts ?? [];
    return !efforts.length || efforts.some((candidate) => candidate.reasoningEffort === effort);
  };
  const advertised = models.find((model) => model.id === settings?.model);
  if (advertised && supports(advertised, settings?.effort)) {
    return { model: advertised.id, effort: settings.effort, recovery: false, threadOnly: false };
  }

  const confirmed = settings?.providerConfirmed;
  const confirmedModel = models.find((model) => model.id === confirmed?.model);
  if (confirmedModel && supports(confirmedModel, confirmed?.effort)) {
    return {
      model: confirmedModel.id,
      effort: confirmed.effort,
      recovery: confirmed.model !== settings?.model || confirmed.effort !== settings?.effort,
      threadOnly: false,
    };
  }

  // A provider transcript can name a historical model that is no longer in
  // today's picker. Preserve that exact provider-owned pair as thread-only;
  // arbitrary bridge-only IDs never reach this branch.
  if (confirmed?.model && confirmed?.effort && !confirmedModel) {
    return {
      model: confirmed.model,
      effort: confirmed.effort,
      recovery: confirmed.model !== settings?.model || confirmed.effort !== settings?.effort,
      threadOnly: true,
    };
  }

  // New threads and provider records that contain only policy facts have no
  // saved pair to recover. Use the already-loaded provider default instead of
  // treating the absence of an override as corrupt settings.
  const fallbackModel = models.find((model) => model.id === fallback?.model);
  if (!settings?.model && !settings?.effort && fallbackModel && supports(fallbackModel, fallback?.effort)) {
    return { model: fallbackModel.id, effort: fallback.effort, recovery: false, threadOnly: false };
  }

  // Providers may persist effort independently of model. Pair that effort only
  // with the loaded provider default when it explicitly supports the value.
  if (!settings?.model && settings?.effort && fallbackModel && supports(fallbackModel, settings.effort)) {
    return { model: fallbackModel.id, effort: settings.effort, recovery: false, threadOnly: false };
  }

  // Some provider records name the model but omit effort. Select that model's
  // advertised default coherently, never an effort inherited from another model.
  if (advertised && !settings?.effort) {
    const efforts = advertised.supportedReasoningEfforts ?? [];
    const effort = fallback?.model === advertised.id && supports(advertised, fallback.effort)
      ? fallback.effort
      : advertised.defaultReasoningEffort ?? efforts[0]?.reasoningEffort ?? null;
    if (effort && supports(advertised, effort)) {
      return { model: advertised.id, effort, recovery: false, threadOnly: false };
    }
  }
  return null;
}
// END thread-settings-selection

async function loadThreadSettings(t, { flush = true } = {}) {
  setSettingsTruth({ state: "loading", sources: {}, message: "Checking settings…" });
  state.models = state.models.filter((model) => !model.threadOnly);
  const prefs = loadPrefs();
  const def = state.models.find((model) => model.isDefault) || state.models[0];
  state.model = prefs.model && state.models.some((model) => model.id === prefs.model) ? prefs.model : def?.id ?? null;
  const baseModel = currentModel();
  const efforts = (baseModel?.supportedReasoningEfforts ?? []).map((effort) => effort.reasoningEffort);
  state.effort = prefs.effort && efforts.includes(prefs.effort)
    ? prefs.effort
    : baseModel?.defaultReasoningEffort ?? efforts[0] ?? null;

  try {
    const settings = await api(`/api/thread/settings?provider=${encodeURIComponent(t.provider || state.provider)}&threadId=${encodeURIComponent(t.id)}`);
    if (state.active !== t) { return; }
    const selection = selectThreadSettingsPair(settings, state.models, { model: state.model, effort: state.effort });
    const recoverPair = selection?.recovery ? { model: selection.model, effort: selection.effort } : null;
    const displayedModel = selection?.model ?? settings.model;
    const displayedEffort = selection?.effort ?? settings.effort;
    const providerRecordedSelection = settings.providerConfirmed?.model === displayedModel
      && settings.providerConfirmed?.effort === displayedEffort;
    const availability = displayedModel && state.models.length
      ? (state.models.some((model) => model.id === displayedModel) ? "listed" : "unlisted")
      : settings.modelAvailability;
    if (providerRecordedSelection || selection?.threadOnly) { addCurrentThreadModel(displayedModel, displayedEffort, availability); }
    if (displayedModel) { state.model = displayedModel; }
    if (displayedEffort) { state.effort = displayedEffort; }
    state.threadMode = settings.mode || null;
    state.threadModeUnknown = settings.modeKnown === false;
    state.threadApprovalPolicy = settings.approvalPolicy ?? null;
    state.threadSandboxPolicy = settings.sandboxPolicy ?? null;
    const sourceValues = [settings.sources?.model, settings.sources?.effort, settings.sources?.mode];
    const providerConfirmed = sourceValues.every((source) => source && !source.startsWith("bridge_"));
    state.settingsTruth = {
      state: providerConfirmed ? "confirmed" : "override",
      sources: settings.sources ?? {},
      message: recoverPair
        ? `Recovered model and effort from ${PROVIDER_LABELS[activeProvider()] || "provider"}`
        : settingsSourceMessage(settings),
    };
    if (!state.modelsReady) {
      state.settingsTruth = { state: "error", sources: settings.sources ?? {}, message: "Models unavailable · send blocked" };
    } else if (!selection || !currentModel() || !state.effort) {
      state.settingsTruth = { state: "error", sources: settings.sources ?? {}, message: "Saved settings unavailable · choose model and effort" };
    }

    // Repair only an exact provider-recorded pair. Current models must pass the
    // loaded catalog; historical unlisted models must come from provider truth.
    // Never independently mix one model's effort with another model.
    if (recoverPair) {
      saveThreadSettings(recoverPair, { pending: false }).catch((e) => chip("⚠️", "Could not repair thread settings: " + e.message));
    }

    // Materialize only missing facts so another browser sees the same fallback.
    // Provider-owned values stay provider-owned and are not copied as a cache.
    if (selection) {
      const missing = {};
      if (!settings.sources?.model && state.model) { missing.model = state.model; }
      if (!settings.sources?.effort && state.effort) { missing.effort = state.effort; }
      const materializedMode = currentMode();
      if (!settings.sources?.mode && !materializedMode.unknown && !materializedMode.providerExact) {
        missing.mode = materializedMode.key;
      }
      if (Object.keys(missing).length) {
        saveThreadSettings(missing, { pending: false }).catch((e) => chip("⚠️", "Could not save thread settings: " + e.message));
      }
    }
    syncControls();
    if (flush) { flushPending(); }
  } catch (e) {
    state.settingsTruth = { state: "error", sources: {}, message: "Settings unavailable · send blocked" };
    syncControls();
    chip("⚠️", "Could not load this thread's settings: " + e.message);
  }
}

function persistPrefs() {
  const previous = loadPrefs();
  const saveComposerDefaults = !state.active;
  localStorage.setItem("cxp_prefs", JSON.stringify({
    provider: state.provider,
    providerScope: state.providerScope,
    listView: state.listView,
    model: saveComposerDefaults ? state.model : previous.model,
    effort: saveComposerDefaults ? state.effort : previous.effort,
    modeByProvider: state.modeByProvider,
    sidebarCollapsed: state.sidebarCollapsed,
    showAgentSessions: state.showAgentSessions,
  }));
}

function loadPrefs() {
  try { return JSON.parse(localStorage.getItem("cxp_prefs")) || {}; } catch { return {}; }
}

// ---------- new session ----------
// Model catalogs fetched only to validate a new session's model. Deliberately
// not initModels(): that swaps the global catalog and would clobber the open
// thread's composer, which is why the old flow silently reused whichever agent
// happened to be open instead of offering a choice.
const newSessionModels = new Map();

async function newSessionModel(provider) {
  if (provider === state.modelsProvider && state.model) { return state.model; }

  if (!newSessionModels.has(provider)) {
    const models = (await api("/api/models?provider=" + encodeURIComponent(provider)))?.data ?? [];
    newSessionModels.set(provider, models.find((model) => model.isDefault)?.id || models[0]?.id || null);
  }

  return newSessionModels.get(provider);
}

// One screen: agent and project together. The remembered project list paints
// immediately from the bridge's durable cache, then a live provider scan
// refreshes it in place, so picking a folder never waits on a CLI round trip.
async function openNewSession() {
  if (!AVAILABLE_PROVIDER_NAMES.length) {
    openSheet('<h2>No agent is ready</h2><div class="hint">Install and sign in to a provider on the Mac, then restart Remote Agents.</div>');
    return;
  }

  // The open thread's agent is the likely choice, so it starts selected — but
  // it stays visible and changeable rather than being assumed.
  let provider = (state.active ? activeProvider() : state.provider) || AVAILABLE_PROVIDER_NAMES[0];
  if (!AVAILABLE_PROVIDER_NAMES.includes(provider)) { provider = AVAILABLE_PROVIDER_NAMES[0]; }

  const known = new Map();
  const refreshed = new Set();
  let chosen = "";

  openSheet(`
    <div class="new-session-layout">
      <h2>New session</h2>
      <div class="seclabel" style="margin-top:6px">Agent</div>
      <div class="new-session-agents seg" id="newProviderSeg" role="group" aria-label="Agent"></div>
      <div class="seclabel">Project</div>
      <div class="new-session-projects" id="newProjectList"><div class="new-session-note">Loading projects…</div></div>
      <div class="new-session-footer">
        <div class="seclabel">Or a custom path</div>
        <input class="field-input" id="cwdInput" placeholder="/Users/you/code/project" autocapitalize="off" autocorrect="off">
        <button class="primary-btn" id="createBtn" disabled>Start session</button>
      </div>
    </div>`);
  $("sheet").classList.add("new-session-host");

  function syncCreateButton() {
    const cwd = $("cwdInput")?.value.trim() || chosen;
    const button = $("createBtn");
    if (!button) { return; }
    button.disabled = !cwd;
    button.textContent = cwd ? `Start ${PROVIDER_LABELS[provider] || provider} session` : "Pick a project";
  }

  function renderProviders() {
    const seg = $("newProviderSeg");
    if (!seg) { return; }
    seg.innerHTML = AVAILABLE_PROVIDER_NAMES.map((name) => `
      <button type="button" class="${name === provider ? "on" : ""}" data-new-provider="${esc(name)}" aria-pressed="${name === provider}">
        <img src="${esc(PROVIDER_ICONS[name] || PROVIDER_ICONS.codex)}" alt="">
        <span>${esc(PROVIDER_LABELS[name] || name)}</span>
      </button>`).join("");
    seg.querySelectorAll("[data-new-provider]").forEach((button) => {
      button.onclick = () => selectProvider(button.dataset.newProvider);
    });
  }

  function renderProjects() {
    const host = $("newProjectList");
    if (!host) { return; }
    const projects = known.get(provider);

    if (!projects) {
      host.innerHTML = '<div class="new-session-note">Loading projects…</div>';
      return;
    }

    if (!projects.length) {
      host.innerHTML = `<div class="empty">No projects recorded for ${esc(PROVIDER_LABELS[provider] || provider)} yet. Paste a path below.</div>`;
      return;
    }

    host.innerHTML = projects.map((project) => `
      <button type="button" class="opt opt-button ${project.path === chosen ? "sel" : ""}" data-cwd="${esc(project.path)}">
        <div class="radio"></div>
        <div><div class="on">${esc(project.name)}</div><div class="od">${esc(project.path)} \u00b7 ${Number(project.count) || 0} sessions</div></div>
      </button>`).join("");
    host.querySelectorAll("[data-cwd]").forEach((el) => {
      el.onclick = () => {
        chosen = el.dataset.cwd;
        host.querySelectorAll(".opt").forEach((option) => option.classList.toggle("sel", option === el));
        $("cwdInput").value = "";
        syncCreateButton();
      };
    });
  }

  // The remembered list is a cache, so it is refreshed from the provider once
  // per agent per screen and re-rendered in place if the answer changed.
  async function refreshProjects(name) {
    if (refreshed.has(name)) { return; }
    refreshed.add(name);

    try {
      const listed = (await api("/api/projects?provider=" + encodeURIComponent(name)))?.projects ?? [];
      known.set(name, sortNewSessionProjects(listed));
      if (name === provider) { renderProjects(); }
    } catch {
      // The remembered copy is still on screen and still usable.
      if (!known.get(name)) { known.set(name, []); renderProjects(); }
    }
  }

  function selectProvider(name) {
    if (!name || name === provider || !AVAILABLE_PROVIDER_NAMES.includes(name)) { return; }
    provider = name;
    chosen = "";
    renderProviders();
    renderProjects();
    syncCreateButton();
    refreshProjects(name);
    newSessionModel(name).catch(() => {});
  }

  renderProviders();
  $("cwdInput").addEventListener("input", () => {
    if ($("cwdInput").value.trim()) {
      chosen = "";
      $("newProjectList").querySelectorAll(".opt").forEach((option) => option.classList.remove("sel"));
    }
    syncCreateButton();
  });

  $("createBtn").onclick = async () => {
    const cwd = $("cwdInput").value.trim() || chosen;

    if (!cwd) { return; }

    const button = $("createBtn");
    button.disabled = true;
    button.textContent = "Starting…";

    try {
      const model = await newSessionModel(provider);

      if (!model) {
        throw Object.assign(new Error(`${PROVIDER_LABELS[provider] || provider} is not advertising any model right now.`), { code: "model_unavailable" });
      }

      const res = await api("/api/thread/new", { provider, cwd, model });
      const thread = res.thread;
      closeSheet();
      // openThread switches the global provider and reloads its catalog, so a
      // session started for another agent lands with the right controls.
      openThread({
        id: thread.id,
        name: thread.name ?? null,
        preview: thread.preview ?? "New session",
        cwd: thread.cwd ?? cwd,
        provider: thread.provider ?? provider,
        draft: thread.draft,
      });
    } catch (e) {
      button.disabled = false;
      syncCreateButton();
      chip("\u26a0\ufe0f", "Could not start the session: " + e.message);
    }
  };

  // Paint from the durable cache first; the provider scan follows.
  try {
    const cached = await api("/api/projects/known");
    for (const [name, projects] of Object.entries(cached?.projects ?? {})) {
      known.set(name, sortNewSessionProjects(projects));
    }
  } catch {
    // No cache available yet — the live scan below is the only source.
  }

  renderProjects();
  syncCreateButton();
  refreshProjects(provider);
  newSessionModel(provider).catch(() => {});
}

// Most-used first is what makes the top of this list the folder you actually
// want; recency only breaks ties.
function sortNewSessionProjects(projects) {
  return [...(projects ?? [])].sort((a, b) =>
    Number(b.count ?? 0) - Number(a.count ?? 0)
    || Number(b.lastUsed ?? 0) - Number(a.lastUsed ?? 0)
    || String(a.name ?? a.path ?? "").localeCompare(String(b.name ?? b.path ?? "")));
}

// ---------- usage ----------
let lastUsageBar = null;
let lastUsageProvider = null;

function updateUsageLive(rl, provider = activeProvider()) {
  if (lastUsageBar && provider === lastUsageProvider && rl?.primary) {
    const pct = remainingPercentOf(rl.primary);
    if (pct == null) { return; }
    lastUsageBar.style.width = pct + "%";
    lastUsageBar.parentElement.classList.toggle("low", pct <= 20);
  }
}

function remainingPercentOf(limit) {
  const remaining = typeof limit?.remainingPercent === "number" ? limit.remainingPercent : NaN;
  if (Number.isFinite(remaining)) { return Math.max(0, Math.min(100, remaining)); }
  const used = typeof limit?.usedPercent === "number" ? limit.usedPercent : NaN;
  return Number.isFinite(used) ? Math.max(0, Math.min(100, 100 - used)) : null;
}

function gaugeHtml(p) {
  const mins = Number(p.windowDurationMins ?? 0);
  const win = mins >= 1440 ? `${Math.round(mins / 1440)}d` : mins >= 60 ? `${Math.round(mins / 60)}h` : `${mins}m`;
  const pct = remainingPercentOf(p);
  const hasPct = pct != null;
  const label = `${win} remaining`;
  let html = `<div class="gauge"><div class="top"><span class="name">${label}</span>`;

  if (hasPct) {
    html += `<span class="pct">${Math.round(pct * 10) / 10}% left</span></div><div class="bar ${pct <= 20 ? "low" : ""}"><span style="width:${pct}%"></span></div>`;
  } else {
    html += `<span class="pct" style="font-size:14px">${esc(p.status || "active")}</span></div>`;
  }

  if (p.resetsAt) { html += `<div class="reset">resets ${relFuture(p.resetsAt)}</div>`; }

  html += `</div>`;
  return html;
}

// ---------- notifications (Web Push) ----------
//
// iOS delivers Web Push only to a Home-Screen install, via Apple's own push
// service — so this needs no native app and no third-party service. The bridge
// pushes when a turn finishes, with the thread title and a slice of the reply.

const PUSH_SUPPORTED = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
let deferredInstallPrompt = null;

function isStandalone() {
  return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
}

function isIOS() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent);
}

function urlB64ToUint8Array(base64) {
  const padding = "=".repeat((4 - (base64.length % 4)) % 4);
  const raw = atob((base64 + padding).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
}

function notificationsSectionHtml() {
  return `<div class="seclabel">Notifications</div>
    <div class="hint" id="pushHint">Checking…</div>
    <button class="primary-btn" id="pushBtn" style="margin-top:6px" disabled>…</button>`;
}

async function currentPushSub() {
  const reg = await navigator.serviceWorker?.getRegistration();
  return reg ? reg.pushManager.getSubscription() : null;
}

async function ensurePushSubscription() {
  if (!PUSH_SUPPORTED) { throw new Error("this browser can't receive push notifications"); }
  if (isIOS() && !isStandalone()) { throw new Error("add this app to the Home Screen first"); }
  if (Notification.permission === "denied") { throw new Error("notifications are blocked in browser settings"); }

  const existing = await currentPushSub();
  if (existing) {
    // Browser state can outlive a restored bridge data directory. This POST is
    // idempotent and repairs the server side automatically.
    await api("/api/push/subscribe", { subscription: existing.toJSON() });
    return existing;
  }

  const permission = await Notification.requestPermission();
  if (permission !== "granted") { throw new Error("notification permission wasn't granted"); }

  const { key } = await api("/api/push/key");
  if (!key) { throw new Error("the bridge has no push key"); }

  const reg = await navigator.serviceWorker.ready;
  const fresh = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToUint8Array(key) });
  await api("/api/push/subscribe", { subscription: fresh.toJSON() });
  return fresh;
}

function setStarState(payload) {
  state.starred = new Map((payload?.stars ?? []).map((star) => [threadRuleKey(star.provider, star.threadId), star]));
  state.maxStars = Number(payload?.max) || state.maxStars;
}

// Correcting a misclassification, as opposed to starring around it. A star is
// a shortcut that stops working the moment you unstar; this changes what the
// session *is*, so it survives the agent filter permanently.
async function setThreadMine(thread, mine) {
  try {
    const res = await api("/api/thread/origin", {
      provider: thread.provider || "codex",
      threadId: thread.id,
      mine,
      title: thread.name || thread.preview || "",
      cwd: thread.cwd || "",
    });
    settingsState.mine = res.mine ?? [];
    state.mineThreadKeys = new Set(settingsState.mine.map((row) => threadRuleKey(row.provider, row.threadId)));
    await loadThreads(false);
    if (!$("settingsWindow").hidden) { renderSettings(); }
  } catch (e) {
    chip("\u26a0\ufe0f", "Could not reclassify this session: " + e.message);
  }
}

async function loadManualOrigins() {
  try {
    const res = await api("/api/thread/origin");
    settingsState.mine = res.mine ?? [];
    state.mineThreadKeys = new Set(settingsState.mine.map((row) => threadRuleKey(row.provider, row.threadId)));
  } catch {
    // The list still renders; the bridge remains the authority on origin.
  }
}

async function loadHiddenThreads() {
  try {
    const res = await api("/api/thread/hidden");
    settingsState.hidden = res.hidden ?? [];
    state.hiddenThreadKeys = new Set(settingsState.hidden.map((row) => threadRuleKey(row.provider, row.threadId)));
  } catch {
    // The list still renders; the bridge is the authority on what is filtered.
  }
}

async function loadThreadStars() {
  try {
    setStarState(await api("/api/thread/stars"));
  } catch {
    // The list stays usable without favourites; they refresh on the next load.
  }
}

// Reloads the list rather than moving the row between state.threads and
// state.starredThreads by hand. The server owns both the star set and the
// hydration of pins that have aged off the page, so re-reading it is the only
// way the two stay consistent.
async function setThreadStar(thread, starred) {
  const target = notificationTarget(thread);

  try {
    setStarState(await api("/api/thread/stars", {
      provider: target.provider || "codex",
      threadId: target.id,
      starred,
    }));
    await loadThreads(false);
  } catch (e) {
    chip("⚠️", e.code === "star_limit_reached" ? e.message : "Could not update favourites: " + e.message);
  }
}

async function loadNotificationRules() {
  state.notificationRules.clear();
  if (!PUSH_SUPPORTED) { return; }

  try {
    const sub = await currentPushSub();
    if (!sub) { return; }
    const status = await api("/api/thread/notifications/status", { endpoint: sub.endpoint });

    for (const rule of status.rules ?? []) {
      state.notificationRules.set(threadRuleKey(rule.provider, rule.threadId), rule.mode);
    }
  } catch {
    // The session list remains usable offline; subscription state refreshes on
    // the next foreground sync or bell interaction.
  }

  syncNotifyButton();
  if (!state.active && state.threads.length) { renderRows(false); }
}

async function setTaskNotification(thread, mode) {
  const target = notificationTarget(thread);
  const sub = mode === "off" ? await currentPushSub() : await ensurePushSubscription();

  if (!sub) {
    if (mode === "off") { return; }
    throw new Error("notifications are not enabled on this device");
  }

  await api("/api/thread/notifications", {
    endpoint: sub.endpoint,
    provider: target.provider || "codex",
    threadId: target.id,
    mode,
  });

  const k = threadRuleKey(target.provider, target.id);
  if (mode === "off") { state.notificationRules.delete(k); } else { state.notificationRules.set(k, mode); }
  renderRows(false);
  syncNotifyButton();
}

// Right-click / long-press menu for one session. Uses the same anchored popover
// as the composer control menus rather than a bottom sheet: a context menu that
// appears somewhere other than where you clicked is not a context menu.
function openRowMenu(thread, point) {
  const target = notificationTarget(thread);
  const starred = state.starred.has(threadRuleKey(target.provider, target.id));
  const targetKey = threadRuleKey(target.provider, target.id);
  const hidden = state.hiddenThreadKeys.has(targetKey);
  const targetRow = listedThreads().find((row) => threadRuleKey(row.provider, row.id) === targetKey) ?? thread;
  const markedMine = state.mineThreadKeys.has(targetKey);
  // Only meaningful for a session the rules got wrong, or one already corrected.
  const canReclassify = targetRow?.origin === "agent" || markedMine;
  const full = !starred && state.starred.size >= state.maxStars;
  const notifyMode = state.notificationRules.get(threadRuleKey(target.provider, target.id));

  openControlPopover(null, `
    <div class="control-menu-head">${esc(target.name || target.preview || "Session")}</div>
    <button type="button" class="control-menu-row" id="rowStarAction"${full ? " disabled" : ""}>
      <span class="menu-check" aria-hidden="true">${starred ? "★" : "☆"}</span>
      <span class="menu-label">${starred ? "Remove from favourites" : "Add to favourites"}</span>
    </button>
    ${full ? `<div class="control-menu-note">You already have ${state.maxStars} favourites. Remove one first.</div>` : ""}
    <button type="button" class="control-menu-row" id="rowNotifyAction">
      <span class="menu-check" aria-hidden="true">${notifyMode ? "●" : ""}</span>
      <span class="menu-label">Task notifications</span>
      <span class="menu-value">${notifyMode ? esc(notifyMode) : "Off"}</span>
    </button>
    ${canReclassify ? `<button type="button" class="control-menu-row" id="rowMineAction">
      <span class="menu-check" aria-hidden="true">${markedMine ? "\u25c9" : "\u25cb"}</span>
      <span class="menu-label">${markedMine ? "Classify as agent-made" : "Keep in my sessions"}</span>
    </button>` : ""}
    <button type="button" class="control-menu-row" id="rowHideAction">
      <span class="menu-check" aria-hidden="true">${hidden ? "\u25c9" : "\u25cb"}</span>
      <span class="menu-label">${hidden ? "Unhide session" : "Hide session"}</span>
    </button>
    <button type="button" class="control-menu-row" id="rowOpenAction">
      <span class="menu-check" aria-hidden="true"></span>
      <span class="menu-label">Open session</span>
      <span class="menu-arrow" aria-hidden="true">\u203a</span>
    </button>`, "session", { point });

  $("rowStarAction").onclick = () => { closeControlPopover(); setThreadStar(target, !starred); };
  $("rowHideAction").onclick = () => { closeControlPopover(); setThreadHidden(target, !hidden); };
  $("rowMineAction")?.addEventListener("click", () => { closeControlPopover(); setThreadMine(target, !markedMine); });
  // openSheet closes this popover on its own; closing first keeps the order obvious.
  $("rowNotifyAction").onclick = () => { closeControlPopover(); openTaskNotificationSheet(thread); };
  $("rowOpenAction").onclick = () => { closeControlPopover(); openThread(thread); };
}

async function openTaskNotificationSheet(thread) {
  const target = notificationTarget(thread);
  const k = threadRuleKey(target.provider, target.id);
  const current = state.notificationRules.get(k) || "off";
  const isChild = thread?.parentThreadId && thread.id !== target.id;
  const title = target.name || target.preview || "this task";

  openSheet(`<h2>Task notifications</h2>
    <div class="hint">${isChild ? "This subagent is grouped under " : "Choose how this device follows "}<b>${esc(title)}</b>. You will be notified for exact completed or failed turns started on the Mac or phone.</div>
    <button type="button" class="opt opt-button ${current === "once" ? "sel" : ""}" data-notify-mode="once"><div class="radio"></div><div><div class="on">Notify once</div><div class="od">Notify for the next confirmed completion, then turn this off.</div></div></button>
    <button type="button" class="opt opt-button ${current === "follow" ? "sel" : ""}" data-notify-mode="follow"><div class="radio"></div><div><div class="on">Follow this task</div><div class="od">Notify after every future confirmed turn until you turn it off.</div></div></button>
    <button type="button" class="opt opt-button ${current === "off" ? "sel" : ""}" data-notify-mode="off"><div class="radio"></div><div><div class="on">Off</div><div class="od">Do not watch externally-started turns for this task.</div></div></button>
    <div class="hint" id="taskNotifyHint">Subagent work stays grouped: following the parent does not send a separate alert for each child.</div>`);

  $("sheetBody").querySelectorAll("[data-notify-mode]").forEach((option) => {
    option.onclick = async () => {
      const hint = $("taskNotifyHint");
      const mode = option.dataset.notifyMode;
      $("sheetBody").querySelectorAll("[data-notify-mode]").forEach((item) => item.style.pointerEvents = "none");
      hint.textContent = mode === "off" ? "Turning off…" : "Enabling notifications…";

      try {
        await setTaskNotification(target, mode);
        closeSheet();
      } catch (error) {
        hint.textContent = "Couldn't update: " + (error.message || error);
        $("sheetBody").querySelectorAll("[data-notify-mode]").forEach((item) => item.style.pointerEvents = "");
      }
    };
  });
}

function setShowAgentSessions(checked) {
  if (state.showAgentSessions === !!checked) { return; }
  state.showAgentSessions = !!checked;
  persistPrefs();
  loadThreads(false);
}

// A full-screen window rather than a sheet: settings are a place you go, not a
// thing that slides over what you were doing. Two panes on desktop; on narrow
// screens the section list is the first screen and picking one swaps to it.
const SETTINGS_SECTIONS = [
  { key: "general", group: "App", title: "General" },
  { key: "sessions", group: "App", title: "Sessions" },
  { key: "usage", group: "App", title: "Usage & limits" },
  { key: "hidden", group: "App", title: "Hidden sessions" },
  { key: "mine", group: "App", title: "Kept as mine" },
  { key: "session", group: "Current session", title: "This session", needsThread: true },
];

const settingsState = { section: "general", globalResume: null, hidden: null, mine: null, loading: true };

function setShowAgentSessions(checked) {
  if (state.showAgentSessions === !!checked) { return; }
  state.showAgentSessions = !!checked;
  persistPrefs();
  loadThreads(false);
}

async function setThreadHidden(thread, hidden) {
  try {
    const res = await api("/api/thread/hidden", {
      provider: thread.provider || "codex",
      threadId: thread.id,
      hidden,
      // Kept server-side so the settings list can still name a session that has
      // aged off every page the list endpoints return.
      title: thread.name || thread.preview || "",
      cwd: thread.cwd || "",
    });
    settingsState.hidden = res.hidden ?? [];
    state.hiddenThreadKeys = new Set(settingsState.hidden.map((row) => threadRuleKey(row.provider, row.threadId)));
    await loadThreads(false);
    if (!$("settingsWindow").hidden) { renderSettings(); }
  } catch (e) {
    chip("\u26a0\ufe0f", "Could not update hidden sessions: " + e.message);
  }
}

function settingsSections() {
  return SETTINGS_SECTIONS.filter((section) => !section.needsThread || state.active);
}

function renderSettingsNav() {
  const sections = settingsSections();
  const groups = [];

  for (const section of sections) {
    const last = groups[groups.length - 1];
    if (last?.name === section.group) { last.items.push(section); }
    else { groups.push({ name: section.group, items: [section] }); }
  }

  $("settingsSide").innerHTML = `

    ${groups.map((group) => `<div class="settings-group">${esc(group.name)}</div>${group.items.map((section) => `

function renderSettingsBody() {
  const sections = settingsSections();

  let html = `<h1 id="settingsHeading">${esc(section.title)}</h1>`;

function wireSettingsBody(section, thread) {
  const body = $("settingsBody");

  body.querySelector('[data-setting="sidebar"]')?.addEventListener("click", () => {
    toggleSidebar();
    renderSettingsBody();
  });

  body.querySelector('[data-setting="agents"]')?.addEventListener("click", () => {
    setShowAgentSessions(!state.showAgentSessions);
    renderSettingsBody();
  });

  body.querySelector('[data-setting="resume"]')?.addEventListener("click", async (event) => {
    event.currentTarget.disabled = true;
    try {
      const saved = await api("/api/usage-retry-policy", {
        scope: "global",
        enabled: !settingsState.globalResume,
        // With a chat open the bridge can arm its pending stop immediately.
        ...(thread ? { provider: thread.provider || state.provider, threadId: thread.id } : {}),
      });
      settingsState.globalResume = saved.globalEnabled === true;
      if (saved.retry) { updateUsageRetry(saved.retry); }
      if (saved.armError) { chip("\u26a0\ufe0f", `Auto-resume is on; initial check will retry: ${saved.armError}`); }
      if (thread) { state.usageRetryPolicy = { ...saved, provider: thread.provider || state.provider, threadId: thread.id }; }
    } catch (error) {
      chip("\u26a0\ufe0f", "Could not save auto-resume setting: " + error.message);
    }
    renderSettingsBody();
  });

  body.querySelector('[data-setting="usage-dashboard"]')?.addEventListener("click", () => { closeSettingsWindow(); openUsageSheet(); });
  body.querySelector('[data-setting="task"]')?.addEventListener("click", () => { closeSettingsWindow(); openTaskSettingsSheet(); });
  body.querySelector('[data-setting="notify"]')?.addEventListener("click", () => { closeSettingsWindow(); state.active && openTaskNotificationSheet(state.active); });
  body.querySelector('[data-setting="hide-current"]')?.addEventListener("click", async () => {
    if (!state.active) { return; }
    const target = state.active;
    closeSettingsWindow();
    backToList();
    await setThreadHidden(target, true);
  });

  body.querySelectorAll("[data-unmine]").forEach((button) => {
    button.onclick = async () => {
      button.disabled = true;
      button.textContent = "Undoing\u2026";
      await setThreadMine({ provider: button.dataset.unmine, id: button.dataset.unmineId }, false);
    };
  });

  body.querySelectorAll("[data-unhide]").forEach((button) => {
    button.onclick = async () => {
      button.disabled = true;
      button.textContent = "Unhiding…";
      await setThreadHidden({ provider: button.dataset.unhide, id: button.dataset.unhideId }, false);
    };
  });
}

function renderSettings() {
  renderSettingsNav();
  renderSettingsBody();
}

function closeSettingsWindow() {
  const panel = $("settingsWindow");
  if (panel.hidden) { return; }
  panel.hidden = true;
  panel.classList.remove("on-detail");
  $("app").removeAttribute("inert");
  state.settingsReturnFocus?.focus?.();
  state.settingsReturnFocus = null;
}

async function openSettingsWindow(section = "general") {
  closeControlPopover();
  state.settingsReturnFocus = document.activeElement;
  settingsState.section = section;
  settingsState.globalResume = null;
  settingsState.hidden = null;
  settingsState.mine = null;
  $("settingsWindow").hidden = false;
  // Narrow screens start on the section list; a directly requested section
  // opens straight into its detail pane.
  $("settingsWindow").classList.toggle("on-detail", section !== "general" || window.innerWidth > 720);
  $("app").setAttribute("inert", "");
  renderSettings();
  requestAnimationFrame(() => $("settingsBack")?.focus());

  const [resume, hidden, mine] = await Promise.allSettled([
    api("/api/usage-retry-policy"),
    api("/api/thread/hidden"),
    api("/api/thread/origin"),
  ]);
  settingsState.globalResume = resume.status === "fulfilled" ? resume.value?.globalEnabled === true : null;
  settingsState.hidden = hidden.status === "fulfilled" ? hidden.value?.hidden ?? [] : [];
  settingsState.mine = mine.status === "fulfilled" ? mine.value?.mine ?? [] : [];
  if (!$("settingsWindow").hidden) { renderSettings(); }
}

async function openTaskSettingsSheet() {
  const thread = state.active;
  if (!thread) { return; }
  const provider = thread.provider || "codex";
  openSheet('<h2>Task settings</h2><div class="hint">Loading settings…</div>');

  const [policyResult, accountResult] = await Promise.allSettled([
    api(`/api/usage-retry-policy?provider=${encodeURIComponent(provider)}&threadId=${encodeURIComponent(thread.id)}`),
    provider === "codex"
      ? api(`/api/codex/thread-account?threadId=${encodeURIComponent(thread.id)}`)
      : Promise.resolve(null),
  ]);
  if (policyResult.status === "fulfilled") {
    state.usageRetryPolicy = { ...policyResult.value, provider, threadId: thread.id };
  }
  state.codexThreadAccount = accountResult.status === "fulfilled" ? accountResult.value : null;
  if (state.active !== thread || !$("sheet").classList.contains("show")) { return; }

  const render = () => {
    const policy = state.usageRetryPolicy;
    const inherited = policy.threadOverride == null;
    const accountState = state.codexThreadAccount;
    const accountError = provider === "codex" && accountResult.status === "rejected"
      ? `<div class="hint">Could not load Codex accounts: ${esc(accountResult.reason?.message || accountResult.reason)}</div>`
      : "";
    const accountOptions = provider === "codex" && accountState
      ? `<div class="toggle-title" style="margin-bottom:4px">Codex account for this task</div>
        <div class="hint" style="margin-bottom:10px">Shared follows the Codex login on this Mac. Choosing an account pins only this task; other Codex apps and tasks are unchanged.</div>
        ${(accountState.accounts || []).map((account) => `<button type="button" class="opt opt-button ${account.id === accountState.selectedProfileId ? "sel" : ""}" data-codex-profile="${esc(account.id)}">
          <div class="radio"></div><div><div class="on">${esc(account.label)}</div><div class="od">${account.kind === "shared" ? "Use the account currently signed in globally" : esc([account.email, account.plan].filter(Boolean).join(" · ") || "Managed Codex account")}</div></div>
        </button>`).join("")}
        ${accountState.switchPending ? '<div class="hint" style="margin-bottom:14px">The current turn will finish on its existing account. The selected account will be used for the next turn.</div>' : '<div class="hint" style="margin-bottom:14px">The selected account will be used for this task’s next turn.</div>'}`
      : accountError;
    $("sheetBody").innerHTML = `<h2 id="sheetTitle">Task settings</h2>
      ${accountOptions}
      <div class="toggle-row">
        <div class="toggle-copy"><div class="toggle-title">Auto-resume after usage resets</div><div class="toggle-desc">For this chat, resume one confirmed usage-limit stop when the selected account has capacity again. Codex resumes natively; other providers send a continuation prompt.</div></div>
        <button type="button" class="toggle ${policy.enabled ? "on" : ""}" data-retry-scope="thread" role="switch" aria-checked="${policy.enabled}"></button>
      </div>
      <div class="toggle-row">
        <div class="toggle-copy"><div class="toggle-title">Enable for all chats</div><div class="toggle-desc">Global default for Codex, Claude, and Grok chats on this bridge. New installs start with this off.</div></div>
        <button type="button" class="toggle ${policy.globalEnabled ? "on" : ""}" data-retry-scope="global" role="switch" aria-checked="${policy.globalEnabled}"></button>
      </div>
      <div class="hint" style="margin-top:12px">${inherited ? `This chat currently follows the global default (${policy.globalEnabled ? "on" : "off"}).` : `This chat has its own ${policy.threadOverride ? "on" : "off"} override.`}</div>
      ${inherited ? "" : '<button type="button" class="pending-action" data-retry-inherit>Use global default</button>'}`;

    $("sheetBody").querySelectorAll("[data-codex-profile]").forEach((button) => {
      button.onclick = async () => {
        $("sheetBody").querySelectorAll("button").forEach((candidate) => candidate.disabled = true);
        try {
          state.codexThreadAccount = await api("/api/codex/thread-account", {
            threadId: thread.id,
            profileId: button.dataset.codexProfile,
          });
          await initModels(provider, thread.id);
          if (state.active === thread) { await loadThreadSettings(thread, { flush: false }); }
          render();
        } catch (error) {
          chip("⚠️", "Could not change Codex account: " + error.message);
          render();
        }
      };
    });

    $("sheetBody").querySelectorAll("[data-retry-scope]").forEach((button) => {
      button.onclick = async () => {
        $("sheetBody").querySelectorAll("button").forEach((candidate) => candidate.disabled = true);
        try {
          const scope = button.dataset.retryScope;
          const enabled = scope === "global" ? !policy.globalEnabled : !policy.enabled;
          const saved = await api("/api/usage-retry-policy", { scope, enabled, provider, threadId: thread.id });
          state.usageRetryPolicy = {
            ...saved,
            provider,
            threadId: thread.id,
          };
          if (saved.retry) { updateUsageRetry(saved.retry); }
          if (saved.armError) { chip("⚠️", `Auto-resume is on; initial check will retry: ${saved.armError}`); }
          await loadUsageRetryState(thread);
          syncUsageRetryButtons();
          render();
        } catch (error) {
          chip("⚠️", "Could not save auto-resume setting: " + error.message);
          render();
        }
      };
    });
    $("sheetBody").querySelector("[data-retry-inherit]")?.addEventListener("click", async () => {
      try {
        state.usageRetryPolicy = {
          ...await api("/api/usage-retry-policy", { scope: "thread", enabled: null, provider, threadId: thread.id }),
          provider,
          threadId: thread.id,
        };
        syncUsageRetryButtons();
        render();
      } catch (error) { chip("⚠️", "Could not save auto-resume setting: " + error.message); }
    });
  };
  render();
}

async function wireNotifications() {
  const btn = $("pushBtn");
  const hint = $("pushHint");

  if (!btn || !hint) { return; }

  function show(text, label, enabled) {
    hint.textContent = text;
    btn.textContent = label;
    btn.disabled = !enabled;
  }

  if (!PUSH_SUPPORTED) {
    show("This browser can't receive push notifications.", "Unavailable", false);
    return;
  }

  if (isIOS() && !isStandalone()) {
    show("On iPhone these only work from the Home Screen app — tap Share → Add to Home Screen, then open it from there.", "Add to Home Screen first", false);
    return;
  }

  if (Notification.permission === "denied") {
    show("Notifications are blocked for this app in your browser settings.", "Blocked", false);
    return;
  }

  const sub = await currentPushSub();

  if (sub) {
    show("On. Bells on individual tasks also follow turns started directly on your Mac.", "Turn off notifications", true);

    btn.onclick = async () => {
      btn.disabled = true;

      try {
        await api("/api/push/unsubscribe", { endpoint: sub.endpoint });
        await sub.unsubscribe();
      } catch {
        // already gone — fall through and re-read the state
      }

      state.notificationRules.clear();
      renderRows(false);
      syncNotifyButton();
      wireNotifications();
    };

    return;
  }

  show("Off. Enable this device, then use a task bell to follow work started on your Mac too.", "Enable notifications", true);

  btn.onclick = async () => {
    btn.disabled = true;
    hint.textContent = "Requesting permission…";

    try {
      await ensurePushSubscription();
      await loadNotificationRules();
      wireNotifications();
    } catch (e) {
      show("Couldn't enable notifications: " + (e.message || e), "Try again", true);
    }
  };
}

function wireInstallOnboarding() {
  const panel = $("installOnboarding");

  if (!panel) { return; }

  const hide = () => {
    panel.classList.remove("install-ready");
    panel.hidden = true;
  };

  if (isStandalone() || localStorage.getItem("remote_agents_install_dismissed") === "1") {
    hide();
    return;
  }

  $("dismissInstallBtn").onclick = () => {
    localStorage.setItem("remote_agents_install_dismissed", "1");
    hide();
  };

  const installBtn = $("installPwaBtn");

  window.addEventListener("beforeinstallprompt", (event) => {
    event.preventDefault();
    deferredInstallPrompt = event;

    if (installBtn) {
      installBtn.disabled = false;
      installBtn.textContent = "Install app";
      $("installPwaHint").textContent = "Chrome is ready to install Remote Agents.";
    }
  });

  if (installBtn) {
    installBtn.onclick = async () => {
      if (!deferredInstallPrompt) { return; }
      installBtn.disabled = true;
      await deferredInstallPrompt.prompt();
      const choice = await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;

      if (choice.outcome === "accepted") {
        hide();
      } else {
        installBtn.disabled = false;
        installBtn.textContent = "Install app";
      }
    };
  }

  window.addEventListener("appinstalled", hide);
  // The server keeps this hidden to prevent a first-paint flash in an already
  // installed PWA. Reveal it only after standalone detection has completed.
  panel.hidden = false;
  panel.classList.add("install-ready");
}

function wireNotificationOnboarding() {
  const panel = $("notificationOnboarding");

  if (!panel || !isStandalone() || !PUSH_SUPPORTED || Notification.permission === "denied" || localStorage.getItem("remote_agents_push_dismissed") === "1") {
    return;
  }

  currentPushSub().then((sub) => {
    if (sub) { return; }
    panel.hidden = false;

    $("dismissPushOnboardingBtn").onclick = () => {
      localStorage.setItem("remote_agents_push_dismissed", "1");
      panel.hidden = true;
    };

    $("enablePushOnboardingBtn").onclick = async () => {
      const btn = $("enablePushOnboardingBtn");
      const hint = $("pushOnboardingHint");
      btn.disabled = true;
      hint.textContent = "Requesting permission…";

      try {
        await ensurePushSubscription();
        panel.hidden = true;
      } catch (e) {
        hint.textContent = "Couldn't enable notifications: " + (e.message || e);
        btn.disabled = false;
      }
    };
  }).catch(() => {});
}

// Tell the bridge what is on screen, so a turn you are watching finish does not
// also arrive as a notification. Reports go stale server-side after ~75s, so a
// closed or backgrounded app stops suppressing on its own.
function clientId() {
  let id = localStorage.getItem("cxp_client_id");

  if (!id) {
    id = Math.random().toString(36).slice(2) + Date.now().toString(36);
    localStorage.setItem("cxp_client_id", id);
  }

  return id;
}

function sendPresence() {
  const ids = [state.active?.id, state.active?.draftId].filter(Boolean);

  api("/api/presence", {
    clientId: clientId(),
    provider: state.provider,
    ids,
    visible: !document.hidden && ids.length > 0,
  }).catch(() => {});
}

// Opened from a notification: jump straight to that thread.
async function openLinkedThread() {
  const q = new URLSearchParams(location.search);
  const id = q.get("thread");

  if (!id) { return; }

  const prov = q.get("provider");
  history.replaceState(null, "", "/");

  if (prov && PROVIDER_LABELS[prov] && prov !== state.provider) {
    await switchProvider(prov);
  }

  const found = state.threads.flatMap((t) => [t, ...(t.subagents ?? []).map((child) => ({ ...child, parentThreadId: t.id }))]).find((t) => t.id === id);
  openThread(found || { id, provider: prov || state.provider, cwd: null, name: null, preview: "Session" });
}

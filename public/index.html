<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1117">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<title>Remote Agents</title>
<style>
  :root {
    --bg: #0d1117; --bg2: #161b22; --bg3: #21262d; --border: #30363d;
    --fg: #e6edf3; --fg-dim: #8b949e; --fg-faint: #6e7681;
    --accent: #3fb950; --accent2: #58a6ff; --danger: #f85149; --warn: #d29922;
    --user-bubble: #1f6feb; --purple: #bc8cff;
    --add: #2ea04326; --add-fg: #7ee787; --del: #f8514926; --del-fg: #ffa198;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  /* Never zoom: pinch is blocked in JS (iOS ignores user-scalable), double-tap
     zoom by touch-action, and iOS text-inflation by text-size-adjust. Any input
     below 16px would make iOS auto-zoom on focus and push the layout off-screen,
     so every focusable field is >= 16px. */
  html, body { height: 100%; max-width: 100%; overflow-x: hidden; touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overscroll-behavior: none;
  }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Monaco, monospace; }
  #app { display: flex; flex-direction: column; height: 100dvh; max-width: 100%; overflow-x: hidden; }

  /* header */
  header {
    display: flex; align-items: center; gap: 10px;
    padding: calc(env(safe-area-inset-top) + 10px) 12px 10px;
    background: var(--bg2); border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  header .htext { flex: 1; min-width: 0; }
  header .title { font-weight: 600; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .sub { font-size: 11px; color: var(--fg-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hbtn { background: none; border: none; color: var(--accent2); font-size: 15px; padding: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
  .hbtn:active { background: var(--bg3); }
  #backBtn { font-size: 26px; padding: 0 4px; display: none; }
  .hbtn.icon svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }
  #connDot { width: 9px; height: 9px; border-radius: 50%; background: var(--danger); flex-shrink: 0; transition: background .3s; }
  #connDot.on { background: var(--accent); }
  #tokCount { font-size: 11px; color: var(--fg-dim); white-space: nowrap; }
  #offlinePill { display: none; font-size: 10px; font-weight: 600; color: var(--warn); background: #d2992222; border: 1px solid var(--warn); border-radius: 20px; padding: 2px 8px; white-space: nowrap; }
  body.offline #offlinePill { display: inline-block; }

  /* list view */
  #listView { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #searchWrap { padding: 10px 12px; position: sticky; top: 0; background: var(--bg); z-index: 2; }
  #search { width: 100%; padding: 9px 13px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg3); color: var(--fg); font-size: 16px; outline: none; }
  .seg { display: flex; gap: 3px; background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 3px; margin-bottom: 10px; }
  .seg button { flex: 1; background: none; border: none; color: var(--fg-dim); font-size: 13px; font-weight: 600; padding: 7px; border-radius: 8px; cursor: pointer; }
  .seg button.on { background: var(--accent2); color: #04121f; }
  .chip.prov { color: var(--accent2); }
  .row { padding: 12px 14px; border-bottom: 1px solid var(--bg3); cursor: pointer; }
  .row:active { background: var(--bg2); }
  .row .preview { font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 6px; }
  .row .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .chip { font-size: 11px; color: var(--fg-dim); background: var(--bg3); padding: 2px 8px; border-radius: 20px; white-space: nowrap; max-width: 45vw; overflow: hidden; text-overflow: ellipsis; }
  .chip.branch { color: var(--purple); }
  .chip.time { background: none; padding-left: 0; }
  .chip.run-badge { display: inline-flex; align-items: center; gap: 5px; color: var(--accent); background: #2ea04322; }
  .run-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 1.3s ease-in-out infinite; }
  /* A message that didn't send stays visible and carries its own retry, so the
     failure is attached to the thing that failed. */
  .msg.user.failed { border: 1px solid var(--danger); opacity: .85; }
  .msg.user .retry { display: block; margin: 7px 0 0 auto; background: transparent; border: 1px solid var(--danger); color: var(--danger); font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; cursor: pointer; }
  .msg.user .retry:disabled { opacity: .6; cursor: default; }
  .loadearlier { display: block; margin: 4px auto 14px; background: var(--bg3); border: 1px solid var(--border); color: var(--accent2); padding: 7px 16px; border-radius: 10px; font-size: 13px; cursor: pointer; }
  .loadearlier:disabled { color: var(--fg-dim); cursor: default; }
  /* "this turn is being driven somewhere else" — sits above the transcript
     without covering it, so a running thread never looks frozen. */
  /* Floats over the transcript rather than living in it: #messages is the
     scroller and is rebuilt on every render, which would wipe the pill. */
  #livePill { display: none; position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 6; max-width: 92%; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: var(--accent); background: #12351bee; border: 1px solid #2ea04366; border-radius: 20px; padding: 5px 12px; box-shadow: 0 2px 10px #0006; white-space: nowrap; }
  body.livesync #livePill { display: flex; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
  #loadMore { display: block; margin: 14px auto calc(env(safe-area-inset-bottom) + 20px); background: var(--bg3); border: 1px solid var(--border); color: var(--accent2); padding: 9px 22px; border-radius: 10px; font-size: 14px; cursor: pointer; }
  .empty { text-align: center; color: var(--fg-dim); padding: 40px 20px; }

  /* chat view */
  #chatView { flex: 1; display: none; flex-direction: column; min-height: 0; max-width: 100%; overflow-x: hidden; position: relative; }
  #messages { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: 14px 12px; }
  .msg { max-width: 88%; margin-bottom: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.md { white-space: normal; }
  /* The bubble shrink-wraps its text (a block would stretch to the cap even for
     "hi") and only grows to 80% of the column before wrapping. */
  .msg.user { width: -webkit-fit-content; width: fit-content; max-width: 80%; margin-left: auto; background: var(--user-bubble); color: #fff; padding: 9px 13px; border-radius: 16px 16px 4px 16px; font-size: 14px; }
  /* The agent reply is plain text, not a bubble — give it the full column so
     code, tables and diffs get every pixel. The 88% cap stays for user bubbles. */
  .msg.agent { margin-right: auto; max-width: 100%; font-size: 14.5px; padding: 2px 2px 2px 0; }
  .msg.agent.streaming::after { content: "▍"; color: var(--accent); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* rendered markdown inside agent messages */
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p { margin: 0 0 8px; }
  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin: 14px 0 7px; line-height: 1.25; font-weight: 650; }
  .md h1 { font-size: 20px; } .md h2 { font-size: 18px; } .md h3 { font-size: 16px; }
  .md h4, .md h5, .md h6 { font-size: 14.5px; color: var(--fg-dim); }
  .md ul, .md ol { margin: 0 0 8px; padding-left: 22px; }
  .md li { margin: 2px 0; }
  .md li::marker { color: var(--fg-faint); }
  .md a { color: var(--accent2); text-decoration: underline; text-underline-offset: 2px; word-break: break-word; }
  .md code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.86em; background: var(--bg3); padding: 1px 5px; border-radius: 5px; }
  .md pre { background: var(--bg); border: 1px solid var(--border); border-radius: 9px; padding: 11px 12px; overflow-x: auto; margin: 0 0 10px; }
  .md pre code { background: none; padding: 0; font-size: 12.5px; line-height: 1.5; color: var(--fg); }
  .md blockquote { margin: 0 0 8px; padding: 2px 0 2px 12px; border-left: 3px solid var(--border); color: var(--fg-dim); }
  .md hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
  .md table { border-collapse: collapse; display: block; overflow-x: auto; margin: 0 0 10px; font-size: 13px; }
  .md th, .md td { border: 1px solid var(--border); padding: 5px 9px; text-align: left; }
  .md th { background: var(--bg3); font-weight: 600; }
  .md strong { font-weight: 650; }
  .md input[type="checkbox"] { margin-right: 6px; }
  .md pre, .md table { max-width: 100%; }
  .md :not(pre) > code { overflow-wrap: anywhere; }
  .turn-sep { height: 1px; background: var(--bg3); margin: 14px 0; }

  /* item blocks */
  .block { border: 1px solid var(--border); background: var(--bg2); border-radius: 10px; margin: 0 0 10px; overflow: hidden; max-width: 100%; }
  .block .bhead { display: flex; align-items: center; gap: 8px; padding: 8px 11px; cursor: pointer; font-size: 13px; }
  .block .bhead .ic { flex-shrink: 0; }
  .block .bhead .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .block .bhead .st { font-size: 11px; color: var(--fg-dim); font-family: ui-monospace, Menlo, monospace; }
  .block .bhead .chev { color: var(--fg-faint); transition: transform .15s; }
  .block.open .bhead .chev { transform: rotate(90deg); }
  .block .body { display: none; border-top: 1px solid var(--border); }
  .block.open .body { display: block; }
  .block pre { font-family: ui-monospace, Menlo, monospace; font-size: 12px; line-height: 1.5; padding: 10px 11px; overflow-x: auto; white-space: pre; color: var(--fg-dim); max-height: 320px; overflow-y: auto; }
  .block.reasoning { background: transparent; border-color: var(--bg3); }
  .block.reasoning .bhead { color: var(--purple); }
  .block.reasoning .body { padding: 4px 11px 10px; font-size: 13px; color: var(--fg-dim); font-style: italic; white-space: pre-wrap; border-top: none; }
  .block.cmd .bhead .lbl { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
  .st.ok { color: var(--accent) !important; }
  .st.bad { color: var(--danger) !important; }
  .st.run { color: var(--accent2) !important; }
  .item-chip { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--fg-dim); background: var(--bg2); border: 1px solid var(--border); border-radius: 9px; padding: 6px 11px; margin: 0 0 10px; max-width: 100%; min-width: 0; }
  .item-chip span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-chip.link { cursor: pointer; }
  .item-chip.link:active { background: var(--bg3); }
  .item-chip.pending { color: var(--warn); border-color: #9e6a03; border-style: dashed; margin-left: auto; }
  .ic { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; flex-shrink: 0; vertical-align: -2px; }

  /* diff colors */
  .diff .l-add { color: var(--add-fg); background: var(--add); display: block; }
  .diff .l-del { color: var(--del-fg); background: var(--del); display: block; }
  .diff .l-hdr { color: var(--accent2); display: block; }
  .diff .l-meta { color: var(--fg-faint); display: block; }

  /* approval banner */
  #approval { display: none; background: #2d1a00; border: 1px solid #9e6a03; margin: 8px 12px; padding: 12px; border-radius: 12px; flex-shrink: 0; }
  #approval .q { font-size: 13px; margin-bottom: 6px; color: var(--warn); font-weight: 600; }
  #approval .cmd { font: 12px ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-all; max-height: 100px; overflow-y: auto; margin-bottom: 10px; color: var(--fg); }
  #approval .btns { display: flex; gap: 8px; }
  #approval button { flex: 1; padding: 9px 4px; border-radius: 9px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; }
  #okBtn { background: var(--accent); color: #04260f; }
  #sessBtn { background: var(--bg3); color: var(--accent); border: 1px solid var(--accent) !important; }
  #noBtn { background: var(--bg3); color: var(--danger); border: 1px solid var(--danger) !important; }

  /* composer + controls */
  #composerWrap { background: var(--bg2); border-top: 1px solid var(--border); flex-shrink: 0; max-width: 100%; overflow-x: hidden; padding: 8px 10px calc(env(safe-area-inset-bottom) + 8px); }
  #controls { display: flex; gap: 7px; margin-bottom: 8px; flex-wrap: wrap; min-width: 0; }
  .ctl { display: flex; align-items: center; gap: 5px; background: var(--bg3); border: 1px solid var(--border); color: var(--fg-dim); border-radius: 8px; padding: 5px 9px; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .ctl:active { background: var(--bg); }
  .ctl b { color: var(--fg); font-weight: 600; }
  .ctl .ck { color: var(--fg-faint); font-size: 10px; }
  #composer { display: flex; gap: 8px; align-items: flex-end; min-width: 0; }
  #input { flex: 1; min-width: 0; background: var(--bg3); border: 1px solid var(--border); color: var(--fg); border-radius: 18px; padding: 9px 14px; font-size: 16px; outline: none; resize: none; max-height: 120px; font-family: inherit; line-height: 1.4; }
  #sendBtn, #stopBtn { width: 38px; height: 38px; border-radius: 50%; border: none; font-size: 17px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  #sendBtn { background: var(--accent); color: #04260f; }
  #sendBtn:disabled { opacity: .4; }
  #stopBtn { background: var(--danger); color: #fff; display: none; }

  /* sheets / modal */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 50; display: none; }
  .overlay.show { display: block; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 51; background: var(--bg2); border-top: 1px solid var(--border); border-radius: 16px 16px 0 0; padding: 8px 16px calc(env(safe-area-inset-bottom) + 20px); max-height: 82dvh; overflow-y: auto; overflow-x: hidden; max-width: 100%; transform: translateY(100%); transition: transform .22s ease; }
  .sheet.show { transform: translateY(0); }
  .sheet .grip { width: 38px; height: 4px; background: var(--border); border-radius: 4px; margin: 8px auto 14px; }
  .sheet h2 { font-size: 17px; margin-bottom: 4px; overflow-wrap: anywhere; }
  /* File paths are long unbreakable tokens — wrap them or they widen the sheet. */
  .sheet .hint { font-size: 12.5px; color: var(--fg-dim); margin-bottom: 14px; overflow-wrap: anywhere; }
  .opt { display: flex; align-items: flex-start; gap: 10px; padding: 11px 12px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; cursor: pointer; }
  .opt.sel { border-color: var(--accent); background: #2ea04314; }
  .opt .radio { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--fg-faint); flex-shrink: 0; margin-top: 1px; }
  .opt.sel .radio { border-color: var(--accent); background: radial-gradient(circle, var(--accent) 42%, transparent 46%); }
  .opt .on { font-weight: 600; font-size: 14.5px; }
  .opt .od { font-size: 12.5px; color: var(--fg-dim); margin-top: 2px; }
  .sheet .seclabel { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-faint); margin: 16px 0 8px; font-family: ui-monospace, Menlo, monospace; }
  .primary-btn { width: 100%; background: var(--accent); color: #04260f; border: none; border-radius: 11px; padding: 13px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 14px; }
  .primary-btn:disabled { opacity: .4; }
  .field-input { width: 100%; background: var(--bg3); border: 1px solid var(--border); color: var(--fg); border-radius: 10px; padding: 10px 12px; font-size: 16px; outline: none; }

  /* file viewer */
  .file-tabs { display: flex; gap: 6px; margin: 4px 0 12px; }
  .file-tabs button { background: var(--bg3); border: 1px solid var(--border); color: var(--fg-dim); font-size: 12.5px; font-weight: 600; padding: 6px 14px; border-radius: 8px; cursor: pointer; }
  .file-tabs button.on { background: var(--accent2); color: #04121f; }
  .filebody { font-size: 14px; }
  .filerow { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 7px; cursor: pointer; }
  .filerow.sel { border-color: var(--accent); background: #2ea04314; }
  .filerow .cb { width: 19px; height: 19px; border-radius: 5px; border: 2px solid var(--fg-faint); flex-shrink: 0; }
  .filerow.sel .cb { border-color: var(--accent); background: var(--accent); }
  .filerow .fmeta { flex: 1; min-width: 0; }
  .filerow .fname { font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
  .filerow .fdir { font-size: 11.5px; color: var(--fg-faint); overflow-wrap: anywhere; }
  .filerow .fbadge { font-size: 10.5px; color: var(--accent); border: 1px solid var(--accent); border-radius: 20px; padding: 1px 7px; flex-shrink: 0; }
  .filerow .fbadge.edit { color: var(--accent2); border-color: var(--accent2); }
  .filecode { background: var(--bg); border: 1px solid var(--border); border-radius: 9px; padding: 12px; overflow-x: auto; max-height: 62dvh; overflow-y: auto; margin: 0; }
  .filecode code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; line-height: 1.55; white-space: pre; background: none; padding: 0; }
  /* highlight.js dark theme (compact, mapped to our palette) */
  .hljs { color: var(--fg); background: transparent; }
  .hljs-comment, .hljs-quote { color: var(--fg-faint); font-style: italic; }
  .hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-doctag, .hljs-name { color: #ff7b72; }
  .hljs-string, .hljs-regexp, .hljs-addition, .hljs-attribute, .hljs-meta .hljs-string { color: var(--add-fg); }
  .hljs-number, .hljs-symbol, .hljs-bullet, .hljs-template-variable, .hljs-variable { color: #79c0ff; }
  .hljs-title, .hljs-title.function_, .hljs-section, .hljs-built_in { color: #d2a8ff; }
  .hljs-type, .hljs-class .hljs-title, .hljs-title.class_ { color: #ffa657; }
  .hljs-attr, .hljs-property, .hljs-selector-attr, .hljs-selector-class, .hljs-selector-id { color: #79c0ff; }
  .hljs-tag, .hljs-punctuation { color: var(--fg-dim); }
  .hljs-meta { color: var(--accent2); }
  .hljs-deletion { color: var(--del-fg); }
  .hljs-emphasis { font-style: italic; }
  .hljs-strong { font-weight: 700; }

  /* usage panel */
  .gauge { background: var(--bg3); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .gauge .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .gauge .name { font-size: 13px; color: var(--fg-dim); }
  .gauge .pct { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .bar { height: 8px; background: var(--bg); border-radius: 6px; overflow: hidden; }
  .bar > span { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .bar.hot > span { background: linear-gradient(90deg, var(--warn), var(--danger)); }
  .gauge .reset { font-size: 11.5px; color: var(--fg-faint); margin-top: 7px; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
  .stat { background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 11px 12px; }
  .stat .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .k { font-size: 11.5px; color: var(--fg-dim); margin-top: 2px; }
  .spark { display: flex; align-items: flex-end; gap: 3px; height: 46px; margin-top: 10px; }
  .spark > div { flex: 1; background: var(--accent2); border-radius: 2px 2px 0 0; min-height: 2px; opacity: .8; }
  .credit { display: flex; gap: 9px; align-items: center; background: #2ea04314; border: 1px solid var(--accent); border-radius: 10px; padding: 10px 12px; margin-top: 6px; font-size: 13px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="backBtn" class="hbtn" aria-label="Back">‹</button>
    <div class="htext">
      <div class="title" id="hTitle">Codex Sessions</div>
      <div class="sub" id="hSub"></div>
    </div>
    <span id="offlinePill">Offline</span>
    <span id="tokCount" class="mono"></span>
    <button id="diffBtn" class="hbtn icon" aria-label="Diff" style="display:none"><svg viewBox="0 0 24 24"><path d="M12 3v18M5 8h4M5 12h4M5 16h4"/><path d="M15 12h4M17 10v4"/></svg></button>
    <button id="filesBtn" class="hbtn icon" aria-label="Files" style="display:none"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg></button>
    <button id="usageBtn" class="hbtn icon" aria-label="Usage"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 18 0 9 9 0 0 0-18 0z"/><path d="M12 12l4-2"/><path d="M12 7v0"/></svg></button>

<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
<script src="/vendor/highlight.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => (s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

// ---------- markdown ----------
// Rich, correct rendering via `marked` (GFM: headings, lists, tables, code,
// task lists) sanitized through DOMPurify — agent output is untrusted, so any
// raw HTML/scripts are stripped. Both libs are vendored in /vendor (no build
// step). Falls back to escaped plain text if the libraries fail to load.
if (window.marked?.setOptions) {
  window.marked.setOptions({ gfm: true, breaks: true });
}

function renderMarkdown(src) {
  if (!src) { return ""; }

  if (!window.marked || !window.DOMPurify) {
    return "<p>" + esc(src).replace(/\n/g, "<br>") + "</p>";
  }

  // `file://` link targets are dropped by the sanitizer, so rewrite them to plain
  // absolute paths first; the click handler opens those in the file viewer.
  const normalized = src.replace(/(\]\(\s*)file:\/\/(?:localhost)?(\/)/gi, "$1$2");
  const html = window.marked.parse(normalized);
  return window.DOMPurify.sanitize(html, { ADD_ATTR: ["target"] });
}

const state = {
  provider: "codex",         // codex | claude
  threads: [], nextCursor: null,
  active: null, activeTurnId: null,
  items: new Map(),          // itemId -> {kind, el, bodyEl}
  approvalId: null,
  searchTimer: null,
  models: [], model: null, effort: null,
  modeByProvider: { codex: "auto", claude: "manual" }, // permission mode, per provider
  sendMode: "queue",         // queue | steer — what happens when you send mid-turn
  busy: false,               // is a turn currently running
  pending: [],               // [{ text, chip }] messages waiting to send
  running: new Set(),        // "provider:threadId" of threads with an active turn
  sseErrored: false,         // did the event stream drop (for reconnect catch-up)
  resyncing: false,          // guard against overlapping re-reads
  lastDiff: "",
  threadFiles: new Map(), // path -> { path, edited } for the open thread
};

const PROVIDER_LABELS = { codex: "Codex", claude: "Claude", grok: "Grok" };

function providerLabel() { return PROVIDER_LABELS[state.provider] || "Codex"; }

function activeProvider() { return state.active ? (state.active.provider || "codex") : state.provider; }

// Permission modes are provider-specific and map to each CLI's real controls:
//  - Codex: `sandbox` + `approvalPolicy` are passed to turn/start.
//  - Claude: the mode key maps to `claude --permission-mode` (manual routes
//    sensitive tools through the approval hook).
const MODE_SETS = {
  codex: {
    "read-only": { name: "Read Only",    sandbox: "read-only",          approvalPolicy: "untrusted",  desc: "Reads files and runs safe commands; asks before anything that writes." },
    "auto":      { name: "Approve for me", sandbox: "workspace-write",   approvalPolicy: "on-request", desc: "Only asks for actions detected as potentially unsafe, or before leaving the workspace." },
    "full":      { name: "Full Access",   sandbox: "danger-full-access", approvalPolicy: "never",      desc: "No sandbox and no prompts — runs everything unattended. Use with care." },
  },
  claude: {
    "manual":      { name: "Manual approve",       desc: "Asks before running commands or editing files (approvals appear here)." },
    "auto":        { name: "Auto",                 desc: "Approves actions that pass Claude's safety check and pauses for anything risky." },
    "acceptEdits": { name: "Edit automatically",   desc: "Auto-accepts file edits and runs tools without asking." },
    "plan":        { name: "Plan",                 desc: "Read-only — plans and explains without changing anything." },
    "bypass":      { name: "Bypass permissions",   desc: "No prompts at all. Full autonomy — use with care." },
  },
  grok: {
    "manual":      { name: "Manual approve",       desc: "Grok asks before running tools (handled by the Grok CLI)." },
    "bypass":      { name: "Bypass permissions",   desc: "Auto-approves every tool. Full autonomy — use with care." },
  },
};

const DEFAULT_MODE = { codex: "auto", claude: "auto", grok: "manual" };

const SEND_MODES = {
  queue: { name: "Queue", desc: "Held and sent automatically when the current turn finishes." },
  steer: { name: "Steer", desc: "Interrupts the current turn now, then sends — so the agent changes course immediately." },
};

function modeSetFor(provider) { return MODE_SETS[provider] || MODE_SETS.codex; }

// Resolve the active provider's selected permission mode, repairing an invalid key.
function currentMode() {
  const p = activeProvider();
  const set = modeSetFor(p);
  let key = state.modeByProvider[p];

  if (!set[key]) {
    key = DEFAULT_MODE[p];
    state.modeByProvider[p] = key;
  }

  return { key, ...set[key] };
}

// ---------- api ----------
// Two outages are indistinguishable to a naive fetch, and both must fall back to
// the cache: this phone having no network (fetch rejects), and the Mac or its
// tunnel being down (the proxy in front answers 502/52x/53x with an error page,
// which resolves like a normal response). Classify them here and tag the error
// with `reach` so callers can fall back and say which one it is.
function unreachable(kind) {
  return Object.assign(new Error(kind === "host" ? "can't reach your Mac" : "your phone is offline"), { reach: kind });
}

// navigator.onLine can still read a stale `true` for a moment after a cold
// launch, which would blame the Mac for the phone's own outage. Re-check when we
// actually render: a phone that knows it has no network is the better answer.
function effectiveReach(reach) {
  return navigator.onLine ? reach : "phone";
}

function offlineWord(reach) {
  return effectiveReach(reach) === "host" ? "Your Mac looks offline" : "You're offline";
}

async function api(path, body) {
  let res;

  try {
    res = await fetch(path, body && { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  } catch {
    // The request never left the phone.
    throw unreachable(navigator.onLine ? "host" : "phone");
  }

  // Our own server always answers JSON, so a non-JSON 5xx is the proxy reporting
  // that the machine behind it is gone — not a failing handler.
  if (res.status >= 500 && !(res.headers.get("content-type") || "").includes("json")) {
    throw unreachable("host");
  }

  if (!res.ok) {
    const b = await res.json().catch(() => ({}));
    throw new Error(b.error || res.statusText);
  }

  return res.json();
}

// ---------- offline cache (IndexedDB) ----------
// Recently-opened threads and the session list are cached so the app reads fully
// offline. On open we paint from cache instantly, then revalidate from the
// network; heavy tool output/diffs are trimmed to keep entries small.
const IDB_NAME = "remote-agents";
const IDB_STORE = "cache";
const MAX_CACHED_TURNS = 40;
const MAX_FIELD_CHARS = 4000;
let _idbPromise = null;

function idbOpen() {
  if (_idbPromise) { return _idbPromise; }

  _idbPromise = new Promise((resolve, reject) => {
    let req;

    try {
      req = indexedDB.open(IDB_NAME, 1);
    } catch (e) {
      reject(e);
      return;
    }

    req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });

  return _idbPromise;
}

async function idbGet(key) {
  try {
    const db = await idbOpen();

    return await new Promise((resolve, reject) => {
      const r = db.transaction(IDB_STORE, "readonly").objectStore(IDB_STORE).get(key);
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    });
  } catch {
    return undefined;
  }
}

async function idbSet(key, val) {
  try {
    const db = await idbOpen();

    await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, "readwrite");
      tx.objectStore(IDB_STORE).put(val, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  } catch {
    // storage unavailable / evicted — cache is best-effort
  }
}

async function idbDel(key) {
  try {
    const db = await idbOpen();

    await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, "readwrite");
      tx.objectStore(IDB_STORE).delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  } catch {
    // storage unavailable — cache is best-effort
  }
}

function threadCacheKey(provider, id) { return "th:" + (provider || "codex") + ":" + id; }

function fileCacheKey(cwd, path) { return "file:" + (cwd || "") + ":" + path; }

// Files you open are kept for offline reading, oldest evicted past the budget.
const FILE_CACHE_MAX_BYTES = 5 * 1024 * 1024;

async function cacheFile(cwd, path, data) {
  if (!data || data.binary) { return; }

  const key = fileCacheKey(cwd, path);
  await idbSet(key, { ...data, cachedAt: Date.now() });

  const idx = (await idbGet("fileidx")) || [];
  const rest = idx.filter((e) => e.key !== key);
  rest.push({ key, size: (data.content || "").length, at: Date.now() });
  rest.sort((a, b) => a.at - b.at);
  let total = rest.reduce((n, e) => n + (e.size || 0), 0);

  while (total > FILE_CACHE_MAX_BYTES && rest.length > 1) {
    const oldest = rest.shift();
    total -= oldest.size || 0;
    await idbDel(oldest.key);
  }

  await idbSet("fileidx", rest);
}

function listCacheKey(provider) { return "list:" + (provider || "codex"); }

// Keep the last N turns; truncate large command output and diffs to a preview.
function trimThreadForCache(thread) {
  const clip = (s) => (typeof s === "string" && s.length > MAX_FIELD_CHARS ? s.slice(0, MAX_FIELD_CHARS) + "\n… (truncated — open online for the full text)" : s);
  const turns = (thread?.turns ?? []).slice(-MAX_CACHED_TURNS).map((turn) => ({
    items: (turn.items ?? []).map((it) => {
      const c = { ...it };

      if (typeof c.aggregatedOutput === "string") { c.aggregatedOutput = clip(c.aggregatedOutput); }

      if (Array.isArray(c.changes)) { c.changes = c.changes.map((ch) => ({ ...ch, diff: clip(ch.diff) })); }

      return c;
    }),
  }));

  return { turns };
}

function setOfflineNote(on, reach) {
  document.body.classList.toggle("offline", !!on);

  if (on) { $("offlinePill").textContent = effectiveReach(reach) === "host" ? "Mac offline" : "Offline"; }
}

// ---------- helpers ----------
function relTime(sec) {
  const d = Math.floor(Date.now() / 1000) - sec;

  if (d < 60) { return "just now"; }
  if (d < 3600) { return Math.floor(d / 60) + "m ago"; }
  if (d < 86400) { return Math.floor(d / 3600) + "h ago"; }
  return Math.floor(d / 86400) + "d ago";
}

function relFuture(sec) {
  const d = sec - Math.floor(Date.now() / 1000);

  if (d <= 0) { return "now"; }
  if (d < 3600) { return "in " + Math.ceil(d / 60) + "m"; }
  if (d < 86400) { return "in " + Math.round(d / 3600) + "h"; }
  return "in " + Math.round(d / 86400) + "d";
}

function fmtTokens(n) {
  if (n == null) { return ""; }
  if (n < 1000) { return n + ""; }
  if (n < 1e6) { return (n / 1e3).toFixed(n < 1e4 ? 1 : 0) + "k"; }
  return (n / 1e6).toFixed(1) + "M";
}

function fmtBytes(n) {
  if (n == null) { return ""; }
  if (n < 1024) { return n + " B"; }
  if (n < 1048576) { return (n / 1024).toFixed(1) + " KB"; }
  return (n / 1048576).toFixed(1) + " MB";
}

const ICONS = {
  cmd: '<svg class="ic" viewBox="0 0 24 24"><path d="M4 5l7 7-7 7M13 19h7"/></svg>',
  file: '<svg class="ic" viewBox="0 0 24 24"><path d="M14 3v5h5M14 3H6v18h12V8z"/></svg>',
  tool: '<svg class="ic" viewBox="0 0 24 24"><path d="M14 7a4 4 0 0 1-5 5l-5 5 2 2 5-5a4 4 0 0 0 5-5z"/></svg>',
  web: '<svg class="ic" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 18 0 9 9 0 0 0-18 0zM3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>',
  plan: '<svg class="ic" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>',
  spin: '<svg class="ic" viewBox="0 0 24 24" style="animation:spin 1s linear infinite"><path d="M12 3a9 9 0 1 0 9 9" style="opacity:.9"/></svg>',
};
const styleSpin = document.createElement("style");
styleSpin.textContent = "@keyframes spin{to{transform:rotate(360deg)}}";
document.head.appendChild(styleSpin);

// ---------- session list ----------
function renderRows(append) {
  const rows = $("rows");

  if (!append) { rows.innerHTML = ""; }

  const start = append ? rows.children.length : 0;

  for (const t of state.threads.slice(start)) {
    const div = document.createElement("div");
    div.className = "row";
    div.dataset.tid = t.id;
    const dir = (t.cwd || "").split("/").pop() || "";
    const runningNow = isRunning(t.provider, t.id);
    div.innerHTML = `<div class="preview"></div><div class="meta">
      <span class="chip run-badge" style="display:${runningNow ? "inline-flex" : "none"}"><span class="run-dot"></span>running</span>
      <span class="chip prov"></span>
      <span class="chip dir"></span>
      ${t.gitInfo?.branch ? '<span class="chip branch"></span>' : ""}
      <span class="chip time"></span></div>`;
    div.querySelector(".preview").textContent = t.name || t.preview || "(empty session)";
    div.querySelector(".prov").textContent = PROVIDER_LABELS[t.provider] || "Codex";
    div.querySelector(".dir").textContent = "📁 " + dir;

    if (t.gitInfo?.branch) { div.querySelector(".branch").textContent = "⎇ " + t.gitInfo.branch; }

    div.querySelector(".time").textContent = relTime(t.updatedAt);
    div.onclick = () => openThread(t);
    rows.appendChild(div);
  }

  if (!state.threads.length) { rows.innerHTML = '<div class="empty">No sessions found</div>'; }

  $("loadMore").style.display = state.nextCursor ? "block" : "none";
}

async function loadThreads(append) {
  const q = new URLSearchParams();
  const search = $("search").value.trim();
  const provider = state.provider;

  q.set("provider", provider);

  if (append && state.nextCursor) { q.set("cursor", state.nextCursor); }

  if (search) { q.set("search", search); }

  try {
    const res = await api("/api/threads?" + q);

    // A newer switch may have changed the provider while this was in flight —
    // discard the stale response so it can't overwrite the current list.
    if (state.provider !== provider) { return; }

    state.threads = append ? state.threads.concat(res.data) : res.data;
    state.nextCursor = res.nextCursor;

    // The server read each thread's run state off disk, which is the only way to
    // know about turns that were already under way before this app connected.
    for (const t of res.data ?? []) {
      const ourTurn = state.active && t.id === state.active.id && state.busy && !state.externalTurn;

      if (!ourTurn) { markRunning(provider, t.id, !!t.running); }
    }

    renderRows(append);
    setOfflineNote(false);

    // Cache the first page (no search) so the list renders offline.
    if (!append && !search) { idbSet(listCacheKey(provider), { data: res.data, nextCursor: res.nextCursor }); }
  } catch (e) {
    // Offline / unreachable — fall back to the last cached list for this provider.
    if (append || search) { throw e; }

    const cached = await idbGet(listCacheKey(provider));

    if (cached?.data && state.provider === provider) {
      state.threads = cached.data;
      state.nextCursor = null;
      renderRows(false);
      setOfflineNote(true, e.reach);
    } else {
      $("rows").innerHTML = '<div class="empty">' + offlineWord(e.reach) + " — no saved sessions for " + esc(providerLabel()) + ".</div>";
    }
  }
}

// ---------- chat rendering ----------
function box() { return $("messages"); }

function scrollDown() {
  const b = box();
  requestAnimationFrame(() => { b.scrollTop = b.scrollHeight; });
}

function addUser(text) {
  const el = document.createElement("div");
  el.className = "msg user";
  el.textContent = text;
  box().appendChild(el);
  scrollDown();
  return el;
}

function addAgent(text, streaming) {
  const el = document.createElement("div");
  el.className = "msg agent md" + (streaming ? " streaming" : "");
  el._raw = text || "";
  el.innerHTML = renderMarkdown(el._raw);
  registerFilesFromEl(el);
  box().appendChild(el);
  scrollDown();
  return el;
}

// Append streamed text and re-render markdown live.
function appendAgent(el, delta) {
  el._raw = (el._raw || "") + (delta || "");
  el.innerHTML = renderMarkdown(el._raw);
}

function makeBlock(cls, iconHtml, label, opts = {}) {
  const el = document.createElement("div");
  el.className = "block " + cls + (opts.open ? " open" : "");
  el.innerHTML = `<div class="bhead">${iconHtml}<span class="lbl"></span><span class="st"></span><span class="chev">›</span></div><div class="body"></div>`;
  el.querySelector(".lbl").textContent = label;
  el.querySelector(".bhead").onclick = () => el.classList.toggle("open");
  box().appendChild(el);
  scrollDown();
  return el;
}

function setBlockStatus(el, text, cls) {
  const s = el.querySelector(".st");
  s.textContent = text || "";
  s.className = "st " + (cls || "");
}

function renderDiffInto(pre, diff) {
  pre.classList.add("diff");
  pre.innerHTML = diff.split("\n").map((l) => {
    if (l.startsWith("+++") || l.startsWith("---")) { return `<span class="l-meta">${esc(l)}</span>`; }
    if (l.startsWith("@@")) { return `<span class="l-hdr">${esc(l)}</span>`; }
    if (l.startsWith("+")) { return `<span class="l-add">${esc(l)}</span>`; }
    if (l.startsWith("-")) { return `<span class="l-del">${esc(l)}</span>`; }
    return `<span>${esc(l)}</span>`;
  }).join("");
}

// render one finalized item (history or item/completed)
function renderItem(item) {
  switch (item.type) {
    case "userMessage": {
      const t = (item.content ?? []).map((c) => c.text ?? "").join("");

      if (t.trim()) { addUser(t); }

      break;
    }
    case "agentMessage": {
      if ((item.text ?? "").trim()) { addAgent(item.text); }

      break;
    }
    case "reasoning": {
      const summary = Array.isArray(item.summary) ? item.summary.join("\n\n") : (item.content || "");

      if (summary.trim()) {
        const el = makeBlock("reasoning", "🧠", "Thought process");
        el.querySelector(".body").textContent = summary;
      }

      break;
    }
    case "commandExecution": {
      const el = makeBlock("cmd", ICONS.cmd, item.command || "command");
      const ok = item.exitCode === 0;
      setBlockStatus(el, item.exitCode != null ? "exit " + item.exitCode : (item.status || ""), item.exitCode != null ? (ok ? "ok" : "bad") : "");

      if (item.aggregatedOutput) { el.querySelector(".body").innerHTML = `<pre>${esc(item.aggregatedOutput)}</pre>`; }

      break;
    }
    case "fileChange": {
      addFileChangeChip(item);
      break;
    }
    case "mcpToolCall": {
      chip(ICONS.tool, `${item.server} · ${item.tool}`);
      break;
    }
    case "webSearch": {
      chip(ICONS.web, item.query || "web search");
      break;
    }
    case "plan":
    case "todoList": {
      const el = makeBlock("plan", ICONS.plan, "Plan");
      el.querySelector(".body").innerHTML = `<pre>${esc(item.text || JSON.stringify(item, null, 1))}</pre>`;
      break;
    }
    default: break;
  }
}

function chip(iconHtml, text, onClick) {
  const el = document.createElement("div");
  el.className = "item-chip" + (onClick ? " link" : "");
  el.innerHTML = iconHtml + "<span></span>";
  el.querySelector("span").textContent = text;

  if (onClick) { el.onclick = onClick; }

  box().appendChild(el);
  scrollDown();
  return el;
}

// Files this thread touched — edited by the agent, or linked in a reply. Feeds
// the Files sheet so you can reopen one without scrolling the whole chat.
function registerThreadFile(path, edited) {
  if (!path) { return; }

  const cur = state.threadFiles.get(path) || { path, edited: false };
  cur.edited = cur.edited || !!edited;
  state.threadFiles.set(path, cur);
  updateFilesBtn();
}

function registerFilesFromEl(el) {
  el?.querySelectorAll?.("a[href]").forEach((a) => {
    const target = localFileTarget(a.getAttribute("href"));

    if (target) { registerThreadFile(target.path, false); }
  });
}

function updateFilesBtn() {
  const inChat = $("chatView").style.display !== "none";
  $("filesBtn").style.display = inChat && state.threadFiles.size ? "flex" : "none";
}

function addFileChangeChip(item) {
  const changes = item.changes ?? [];
  changes.forEach((c) => registerThreadFile(c.path, true));
  const n = changes.length;
  const label = n === 1 ? changes[0].path.split("/").pop() : `${n} files changed`;
  chip(ICONS.file, "✏️ " + label, () => {
    if (n === 1) {
      openFileSheet(changes[0].path, changes[0].diff || "");
    } else {
      const diff = changes.map((c) => `--- ${c.path}\n${c.diff || ""}`).join("\n\n");
      openDiffSheet(diff || "No diff available");
    }
  });
}

function renderHistory(thread, window) {
  box().innerHTML = "";

  // Only the end of a long thread is sent; offer the rest rather than pretending
  // this is the whole conversation.
  if (window?.hasMore) {
    const more = document.createElement("button");
    more.id = "loadEarlier";
    more.className = "loadearlier";
    more.textContent = "Load earlier messages";
    more.onclick = () => loadEarlier(more);
    box().appendChild(more);
  }

  const turns = thread.turns ?? [];

  // Absolute positions in the whole thread, since only a window of it is served
  // and later changes address items by absolute index.
  let base = window?.start ?? 0;

  turns.forEach((turn, ti) => {
    if (ti > 0) { const s = document.createElement("div"); s.className = "turn-sep"; box().appendChild(s); }

    for (const item of turn.items ?? []) { renderItemAt(item, base++); }
  });
  registerFilesFromEl(box());
  scrollDown();
  // How far through the thread we've drawn. This is an *absolute* position in
  // the whole thread, not a count of what's on screen, because that's what
  // appended items are numbered against — see appendExternalItems.
  state.itemWindow = window ?? null;
  state.renderedItems = window ? window.end : turns.reduce((n, t) => n + (t.items?.length ?? 0), 0);
}

// Which file+parser the positions on screen belong to, and how far along that
// file's change stream this view is. A fetch and the live stream race each
// other, so deltas that arrive mid-fetch are held and replayed against the
// response once it lands — otherwise the older response silently undoes them.
function setCursor(res) {
  state.generation = res?.generation ?? null;
  state.revision = res?.revision ?? 0;
  const held = state.opBuffer ?? [];
  state.opBuffer = [];

  for (const frame of held) {
    if (frame.generation === state.generation && frame.revision > state.revision) {
      applyExternalFrame(frame);
    }
  }
}

// Page backwards through a long thread, prepending older items above the button.
async function loadEarlier(btn) {
  const t = state.active;
  const w = state.itemWindow;

  if (!t || !w?.hasMore || btn.disabled) { return; }

  btn.disabled = true;
  btn.textContent = "Loading earlier messages…";

  try {
    const res = await api(`/api/thread?id=${encodeURIComponent(t.id)}&provider=${encodeURIComponent(t.provider || "codex")}&before=${w.start}`);
    const older = (res.thread?.turns ?? []).flatMap((x) => x.items ?? []);
    const b = box();
    const anchorFromBottom = b.scrollHeight - b.scrollTop;

    // Render into a fragment, then splice it in above the button so the reader's
    // position doesn't jump.
    const marker = document.createComment("older");
    b.insertBefore(marker, btn.nextSibling);
    const tail = [];

    while (marker.nextSibling) { tail.push(b.removeChild(marker.nextSibling)); }

    let olderBase = res.itemWindow?.start ?? 0;

    for (const item of older) { renderItemAt(item, olderBase++); }

    for (const node of tail) { b.appendChild(node); }

    marker.remove();
    state.itemWindow = res.itemWindow ?? { ...w, start: 0, hasMore: false };
    b.scrollTop = b.scrollHeight - anchorFromBottom;

    if (state.itemWindow.hasMore) {
      btn.disabled = false;
      btn.textContent = "Load earlier messages";
    } else {
      btn.remove();
    }
  } catch (e) {
    btn.disabled = false;
    btn.textContent = "Couldn't load earlier — tap to retry";
  }
}

// Draw one item and label the elements it produced with its position in the
// thread, so a later change to that item can find and replace them. One item can
// render as several nodes, or none at all.
function renderItemAt(item, index) {
  const b = box();
  const before = b.childNodes.length;
  renderItem(item);

  for (let i = before; i < b.childNodes.length; i++) {
    const node = b.childNodes[i];

    if (node.nodeType === 1) { node.dataset.idx = String(index); }
  }
}

// One change frame from the server. Ordering and generation are checked here so
// every path — live, buffered-during-a-fetch, replayed — obeys the same rules.
function applyExternalFrame(frame) {
  const { result, ops, generation, revision } = frame;

  if (result !== "ops" && result !== "reset" && result !== "error") { return; }

  if (result === "error") {
    scheduleExternalRefresh();
    return;
  }

  // Mid-fetch: hold it. The response about to land may already include this,
  // and applying it first would have it overwritten a moment later.
  if (state.fetching) {
    state.opBuffer = (state.opBuffer ?? []).concat(frame);
    return;
  }

  // A different file or parser: every position on screen means something else
  // now, so nothing can be patched — only replaced.
  if (result === "reset" || (generation && state.generation && generation !== state.generation)) {
    scheduleExternalRefresh();
    return;
  }

  // Already reflected in what we drew.
  if (revision != null && revision <= (state.revision ?? 0)) { return; }

  applyExternalOps(ops ?? []);
  state.revision = revision ?? state.revision;
}

// Changes to a thread someone else is driving, as operations rather than "here
// is everything past N" — because a tool result *modifies* the command item that
// is already on screen rather than appending anything. Blind appending left
// those commands running forever with no output.
function applyExternalOps(ops) {
  const b = box();
  const wasAtBottom = b.scrollHeight - b.scrollTop - b.clientHeight < 120;
  let drew = false;

  for (const { op, index, item } of ops) {
    if (op === "append") {
      // Anything before what we've drawn is already there; a gap means we missed
      // an event, so re-read rather than render out of order.
      if (index < state.renderedItems) { continue; }

      if (index > state.renderedItems) {
        scheduleExternalRefresh();
        return;
      }

      renderItemAt(item, index);
      state.renderedItems = index + 1;
      drew = true;
      continue;
    }

    if (op === "replace") {
      const existing = [...b.querySelectorAll(`[data-idx="${index}"]`)];

      // Not on screen — it's above the window this client loaded.
      if (!existing.length) { continue; }

      const anchor = existing[0];
      const added = [];
      const before = b.childNodes.length;
      renderItem(item);

      for (let i = before; i < b.childNodes.length; i++) { added.push(b.childNodes[i]); }

      for (const node of added) {
        if (node.nodeType === 1) { node.dataset.idx = String(index); }

        b.insertBefore(node, anchor);
      }

      for (const node of existing) { node.remove(); }

      drew = true;
    }
  }

  if (!drew) { return; }

  registerFilesFromEl(b);
  setLivePill(state.externalTurn, "Running — following live");

  if (wasAtBottom) { scrollDown(); }
}

// ---------- live streaming ----------
function liveItem(itemId, factory) {
  let rec = state.items.get(itemId);

  if (!rec) {
    rec = factory();
    state.items.set(itemId, rec);
  }

  return rec;
}

function onNotify(method, params, provider) {
  if (provider && provider !== activeProvider()) { return; }

  if (method === "thread/adopted") {
    if (state.active && state.active.id === params.threadId) {
      state.active.draftId = state.active.id;
      state.active.id = params.sessionId;
      state.active.draft = false;
    }

    return;
  }

  const tid = params?.threadId;

  // Track which threads are running, regardless of which one is open, so the
  // list can badge them and opening one shows the correct running state.
  if (method === "turn/started") { markRunning(provider, tid, true); }

  if (method === "turn/completed" || method === "turn/failed" || method === "turn/aborted") { markRunning(provider, tid, false); }

  if (method === "thread/status/changed") {
    const st = params?.status;
    const active = st === "active" || st?.type === "active" || st?.type === "running";
    markRunning(provider, tid, active);
  }

  if (!state.active || (tid !== state.active.id && tid !== state.active.draftId)) {
    if (method === "account/rateLimits/updated") { updateUsageLive(params.rateLimits); }

    return;
  }

  switch (method) {
    case "turn/started":
      state.activeTurnId = params.turn?.id ?? params.turnId;
      state.lastDiff = "";
      $("diffBtn").style.display = "none";
      setBusy(true);
      break;

    case "item/started": {
      const item = params.item ?? {};
      const id = item.id;

      if (item.type === "commandExecution") {
        liveItem(id, () => {
          const el = makeBlock("cmd", ICONS.cmd, item.command || "command", { open: true });
          setBlockStatus(el, "running", "run");
          el.querySelector(".body").innerHTML = "<pre></pre>";
          return { el, pre: el.querySelector("pre") };
        });
      } else if (item.type === "reasoning") {
        liveItem(id, () => {
          const el = makeBlock("reasoning", "🧠", "Thinking…", { open: true });
          return { el, body: el.querySelector(".body") };
        });
      } else if (item.type === "fileChange") {
        // wait for completed to know the changes
      } else if (item.type === "mcpToolCall") {
        chip(ICONS.tool, `${item.server} · ${item.tool}`);
      } else if (item.type === "webSearch") {
        chip(ICONS.web, item.query || "web search");
      }

      break;
    }

    case "item/agentMessage/delta": {
      const rec = liveItem(params.itemId, () => ({ el: addAgent("", true) }));
      appendAgent(rec.el, params.delta ?? "");
      scrollDown();
      break;
    }

    case "item/reasoning/summaryTextDelta":
    case "item/reasoning/textDelta": {
      const rec = liveItem(params.itemId, () => {
        const el = makeBlock("reasoning", "🧠", "Thinking…", { open: true });
        return { el, body: el.querySelector(".body") };
      });
      rec.body.textContent += params.delta ?? "";
      scrollDown();
      break;
    }

    case "item/commandExecution/outputDelta": {
      const rec = state.items.get(params.itemId);

      if (rec?.pre) { rec.pre.textContent += params.delta ?? ""; scrollDown(); }

      break;
    }

    case "item/completed": {
      const item = params.item ?? {};
      const rec = state.items.get(item.id);

      if (item.type === "agentMessage" && rec) {
        rec.el.classList.remove("streaming");
        rec.el._raw = item.text ?? rec.el._raw;
        rec.el.innerHTML = renderMarkdown(rec.el._raw);
        registerFilesFromEl(rec.el);
      } else if (item.type === "commandExecution" && rec) {
        const ok = item.exitCode === 0;
        setBlockStatus(rec.el, item.exitCode != null ? "exit " + item.exitCode : (item.status || "done"), item.exitCode != null ? (ok ? "ok" : "bad") : "");
        rec.el.classList.remove("open");

        if (item.aggregatedOutput && rec.pre && !rec.pre.textContent) { rec.pre.textContent = item.aggregatedOutput; }
      } else if (item.type === "reasoning" && rec) {
        rec.el.querySelector(".lbl").textContent = "Thought process";
        rec.el.classList.remove("open");
      } else if (item.type === "fileChange") {
        addFileChangeChip(item);
      } else if (item.type === "plan" || item.type === "todoList") {
        renderItem(item);
      }

      break;
    }

    case "turn/diff/updated":
      state.lastDiff = params.diff || "";
      $("diffBtn").style.display = state.lastDiff ? "flex" : "none";
      break;

    case "thread/tokenUsage/updated": {
      const tot = params.tokenUsage?.total?.totalTokens;

      if (tot != null) { $("tokCount").textContent = fmtTokens(tot) + " tok"; }

      break;
    }

    case "account/rateLimits/updated":
      updateUsageLive(params.rateLimits);
      break;

    case "turn/aborted":
    case "turn/completed":
    case "turn/failed":
      setBusy(false);
      state.activeTurnId = null;
      state.items.forEach((r) => r.el?.classList.remove("streaming"));

      if (method === "turn/failed") { chip("⚠️", "Turn failed" + (params.error?.message ? ": " + params.error.message : "")); }

      flushPending();
      break;
  }
}

// ---------- navigation ----------
async function openThread(t) {
  state.active = t;
  state.activeTurnId = null;
  state.items = new Map();
  state.pending = [];
  state.lastDiff = "";
  state.threadFiles = new Map();
  $("filesBtn").style.display = "none";
  sendPresence();
  setBusy(false);
  syncControls();
  $("listView").style.display = "none";
  $("chatView").style.display = "flex";
  $("backBtn").style.display = "block";
  $("newBtn").style.display = "none";
  $("usageBtn").style.display = "none";
  $("diffBtn").style.display = "none";
  $("tokCount").textContent = "";
  $("hTitle").textContent = t.name || t.preview || "Session";
  $("hSub").textContent = (t.cwd || "").split("/").slice(-2).join("/");
  $("input").placeholder = "Message " + (PROVIDER_LABELS[t.provider] || "Codex") + "…";
  box().innerHTML = '<div class="empty">Loading…</div>';

  if (t.draft) {
    box().innerHTML = '<div class="empty">New session — send a message to begin.</div>';
    return;
  }

  const cacheKey = threadCacheKey(t.provider, t.id);

  // Paint the cached copy instantly (works offline); the network refreshes it.
  const cached = await idbGet(cacheKey);

  if (state.active !== t) { return; }

  // If it's mid-turn, say so before the fetch lands: the cached copy on screen
  // is a snapshot, and without this a busy thread reads as a finished one.
  if (t.running || isRunning(t.provider, t.id)) {
    setBusy(true, { external: true });
    setLivePill(true, "Loading new messages…");
  }

  if (cached?.thread) {
    renderHistory(cached.thread);

    if (cached.tokens) { $("tokCount").textContent = fmtTokens(cached.tokens) + " tok"; }
  }

  state.fetching = true;

  try {
    const res = await api("/api/thread?id=" + encodeURIComponent(t.id) + "&provider=" + encodeURIComponent(t.provider || "codex"));

    if (state.active !== t) { return; }

    renderHistory(res.thread, res.itemWindow);
    state.fetching = false;
    setCursor(res);
    setOfflineNote(false);
    const tu = res.thread?.tokenUsage?.total?.totalTokens ?? res.thread?.turns?.at?.(-1)?.tokenUsage?.total?.totalTokens;

    if (tu) { $("tokCount").textContent = fmtTokens(tu) + " tok"; }

    idbSet(cacheKey, { thread: trimThreadForCache(res.thread), updatedAt: t.updatedAt, tokens: tu ?? cached?.tokens ?? null, cachedAt: Date.now() });

    // If a turn is already running on this thread (e.g. started on the Mac),
    // reflect it: show the stop button and let the watcher stream it in.
    // Opening a thread is never how one of our own turns starts, so anything
    // running here is being driven elsewhere.
    if (isRunning(t.provider, t.id)) {
      setBusy(true, { external: true });
      setLivePill(true, "Running — following live");
    }
  } catch (e) {
    state.fetching = false;

    if (state.active !== t) { return; }

    const msg = String(e.message || "");

    if (cached?.thread) {
      // Keep the saved copy on screen; flag it only when the reason we couldn't
      // refresh was actually a lost phone/Mac, not a server-side error.
      if (e.reach) { setOfflineNote(true, e.reach); }
    } else if (/not materialized|not found|before first user message/i.test(msg)) {
      // Brand-new session with no history yet — this is expected, not an error.
      box().innerHTML = '<div class="empty">New session — send a message to begin.</div>';
    } else if (e.reach) {
      box().innerHTML = '<div class="empty">' + offlineWord(e.reach) + " — no saved copy of this session yet.</div>";
    } else {
      box().innerHTML = '<div class="empty">Failed to load: ' + esc(e.message) + "</div>";
    }
  }
}

function backToList() {
  state.active = null;
  sendPresence();
  $("chatView").style.display = "none";
  $("listView").style.display = "block";
  $("backBtn").style.display = "none";
  $("newBtn").style.display = "flex";
  $("usageBtn").style.display = "flex";
  $("diffBtn").style.display = "none";
  $("filesBtn").style.display = "none";
  $("hTitle").textContent = providerLabel() + " Sessions";
  $("hSub").textContent = "";
  $("tokCount").textContent = "";
  loadThreads(false);
}

async function switchProvider(name) {
  if (name === state.provider) { return; }

  state.provider = name;
  persistPrefs();
  $("providerSeg").querySelectorAll("[data-provider]").forEach((b) => b.classList.toggle("on", b.dataset.provider === name));
  $("hTitle").textContent = providerLabel() + " Sessions";
  state.threads = [];
  state.nextCursor = null;
  $("search").value = "";
  $("rows").innerHTML = '<div class="empty">Loading…</div>';

  await initModels();
  loadThreads(false);
}

// ---------- sending ----------
// send() is the composer action. When idle it sends immediately; when a turn is
// running it enqueues (Queue = send on turn end, Steer = interrupt now + send).
async function send() {
  const text = $("input").value.trim();

  if (!text || !state.active) { return; }

  $("input").value = "";
  $("input").style.height = "auto";

  if (state.busy) {
    enqueue(text);
    return;
  }

  doSend(text, { bubble: addUser(text) });
}

function enqueue(text) {
  const bubble = addUser(text);
  const steering = state.sendMode === "steer";
  const c = chip("⏳", steering ? "Steering — interrupting the current turn…" : "Queued — sends when the current turn finishes");
  c.classList.add("pending");
  state.pending.push({ text, chip: c, bubble });

  // Steer forces the running turn to end now; the turn-end handler flushes.
  if (steering) { interruptApi(); }
}

// Send the next queued message once the turn has ended.
function flushPending() {
  if (state.busy || !state.pending.length || !state.active) { return; }

  const next = state.pending.shift();

  if (next.chip) { next.chip.remove(); }

  doSend(next.text, { bubble: next.bubble });
}

// The actual API call for one message. The user bubble is already rendered.
//
// requestId is generated once and reused by every retry of this same message, so
// the ambiguous case — it arrived but the reply was lost on a flaky connection —
// resolves to the original outcome instead of sending the message twice.
async function doSend(text, { bubble, requestId } = {}) {
  const m = currentMode();
  const id = requestId || newRequestId();
  setBusy(true);
  markSendFailed(bubble, null);

  try {
    await api("/api/message", {
      provider: state.active.provider || "codex",
      threadId: state.active.id, text,
      model: state.model, effort: state.effort,
      mode: m.key, cwd: state.active.cwd, draft: state.active.draft,
      approvalPolicy: m.approvalPolicy, sandbox: m.sandbox,
      requestId: id,
    });
  } catch (e) {
    setBusy(false);
    markSendFailed(bubble, () => doSend(text, { bubble, requestId: id }));

    if (!bubble) { chip("⚠️", "send failed: " + e.message); }

    flushPending();
  }
}

function newRequestId() {
  return crypto.randomUUID?.() ?? (String(Date.now()) + Math.random().toString(16).slice(2));
}

// Mark the message that failed, rather than dropping a warning further down the
// transcript — the thing that didn't send is the thing you tap to retry.
function markSendFailed(bubble, onRetry) {
  if (!bubble) { return; }

  bubble.querySelector(".retry")?.remove();
  bubble.classList.toggle("failed", !!onRetry);

  if (!onRetry) { return; }

  const btn = document.createElement("button");
  btn.className = "retry";
  btn.title = "Not sent — tap to retry";
  btn.textContent = "⟳ Retry";
  btn.onclick = () => {
    btn.disabled = true;
    btn.textContent = "⟳ Sending…";
    onRetry();
  };
  bubble.appendChild(btn);
  scrollDown();
}

function setBusy(busy, { external = false } = {}) {
  state.busy = busy;

  // A turn driven elsewhere (a terminal, an IDE, another device) reaches us by
  // re-reading the session file, not by streaming — so resync must stay allowed
  // for it, unlike a turn we are streaming ourselves.
  state.externalTurn = busy && external;
  // Send stays enabled while busy so messages can be queued or used to steer.
  $("stopBtn").style.display = busy ? "flex" : "none";
  setLivePill(state.externalTurn);
}

function setLivePill(on, text) {
  document.body.classList.toggle("livesync", !!on);

  if (text) { $("livePillText").textContent = text; }
}

// Low-level interrupt (used by both Stop and Steer).
async function interruptApi() {
  if (!state.active) { return; }

  try {
    await api("/api/interrupt", { provider: state.active.provider || "codex", threadId: state.active.id, turnId: state.activeTurnId });
  } catch {}
}

// Stop button: a hard stop — drop anything queued, then interrupt.
function stopAgent() {
  for (const p of state.pending) {
    if (p.chip) { p.chip.remove(); }
  }

  state.pending = [];
  interruptApi();
}

// ---------- approvals ----------
function showApproval(a) {
  state.approvalId = a.requestId;
  const p = a.params ?? {};
  const isFile = a.method.includes("fileChange") || a.method.includes("Patch");
  const cmd = p.command || p.call?.command || (p.changes ? p.changes.map((c) => c.path).join("\n") : null) || JSON.stringify(p).slice(0, 500);
  const who = PROVIDER_LABELS[activeProvider()] || "The agent";
  $("apprTitle").textContent = isFile ? `${who} wants to edit files` : `${who} wants to run a command`;
  $("apprBody").textContent = Array.isArray(cmd) ? cmd.join(" ") : cmd;
  $("approval").style.display = "block";
  scrollDown();
}

async function answerApproval(decision) {
  if (!state.approvalId) { return; }

  const id = state.approvalId;
  state.approvalId = null;
  $("approval").style.display = "none";

  try { await api("/api/approval", { requestId: id, decision, provider: activeProvider() }); } catch (e) { chip("⚠️", "approval failed: " + e.message); }
}

// ---------- sheets ----------
function openSheet(html) {
  $("sheetBody").innerHTML = html;
  $("overlay").classList.add("show");
  $("sheet").classList.add("show");
}

function closeSheet() {
  $("overlay").classList.remove("show");
  $("sheet").classList.remove("show");
}
$("overlay").onclick = closeSheet;

function openDiffSheet(diff) {
  openSheet(`<h2>Changes</h2><div class="hint">Unified diff</div><div class="block open" style="margin-top:6px"><div class="body"><pre></pre></div></div>`);
  renderDiffInto($("sheetBody").querySelector("pre"), diff);
}

const MD_FILE_RE = /\.(md|markdown|mdx)$/i;

// A link the agent wrote may point at a local file rather than a URL — e.g.
// [notes](/Users/me/proj/notes.md) or [grok.mjs](providers/grok.mjs:812). The
// browser resolves those against our own origin and 404s, so they open in the
// built-in viewer instead. Returns { path, line } or null for real URLs/anchors.
function localFileTarget(raw) {
  if (!raw) { return null; }

  let s = String(raw).trim();

  if (!s || s.startsWith("#") || s.startsWith("//")) { return null; }

  // A real URL scheme is followed by "//" (http://, file://) or is one of the
  // schemeless-authority ones. Without that test, "foo.js:812" would read as a
  // scheme named "foo.js" instead of a file with a line reference.
  const scheme = s.match(/^([a-z][a-z0-9+.-]*):(\/\/)?/i);

  if (scheme && (scheme[2] || /^(mailto|tel|sms|callto|data|javascript|cid|xmpp|about)$/i.test(scheme[1]))) {
    if (scheme[1].toLowerCase() !== "file") { return null; }

    s = s.replace(/^file:\/\/(?:localhost)?/i, "");

    if (!s.startsWith("/")) { return null; }
  }

  // Trailing line references: foo.js:812, foo.js:812:5, foo.js#L812.
  let line = null;
  const at = s.match(/(?::(\d+)(?::\d+)?|#L(\d+))$/i);

  if (at) {
    line = Number(at[1] ?? at[2]);
    s = s.slice(0, at.index);
  }

  s = s.replace(/^\.\//, "");

  if (!s) { return null; }

  try {
    s = decodeURIComponent(s);
  } catch {
    // keep the raw form when percent-decoding fails
  }

  return { path: s, line };
}

// View a file the agent created/edited — rendered markdown or syntax-highlighted
// code, with an optional Diff tab. Content is fetched sandboxed to the thread cwd.
async function openFileSheet(path, diff, line) {
  const name = path.split("/").pop();
  const tabs = diff
    ? `<div class="file-tabs"><button data-tab="file" class="on">File</button><button data-tab="diff">Diff</button></div>`
    : "";
  openSheet(`<h2>${esc(name)}</h2><div class="hint">${esc(path)}${line ? ":" + line : ""}</div>${tabs}<div id="fileBody"><div class="empty">Loading…</div></div>`);

  function bodyEl() { return $("sheetBody").querySelector("#fileBody"); }

  function showDiff() {
    bodyEl().innerHTML = `<div class="block open"><div class="body"><pre></pre></div></div>`;
    renderDiffInto(bodyEl().querySelector("pre"), diff || "No diff available");
  }

  let fileData = null;

  // Cache-first, like threads: paint the saved copy instantly (works offline),
  // then refresh from the network and keep the fresh copy for next time.
  async function showFile() {
    if (fileData) {
      renderFileInto(bodyEl(), name, fileData);
      return;
    }

    const cwd = state.active?.cwd;
    const cached = await idbGet(fileCacheKey(cwd, path));

    if (cached) {
      renderFileInto(bodyEl(), name, cached);
    }

    try {
      const fresh = await api("/api/file?cwd=" + encodeURIComponent(cwd || "") + "&path=" + encodeURIComponent(path));
      fileData = fresh;
      renderFileInto(bodyEl(), name, fresh);
      cacheFile(cwd, path, fresh);
    } catch (e) {
      if (cached) {
        fileData = cached;
        renderFileInto(bodyEl(), name, cached, cached.cachedAt);
        return;
      }

      bodyEl().innerHTML = `<div class="hint">Couldn't open file: ${esc(e.message)}${diff ? " — try the Diff tab." : ""}</div>`;
    }
  }

  if (diff) {
    $("sheetBody").querySelectorAll("[data-tab]").forEach((b) => {
      b.onclick = () => {
        $("sheetBody").querySelectorAll("[data-tab]").forEach((x) => x.classList.toggle("on", x === b));

        if (b.dataset.tab === "diff") { showDiff(); } else { showFile(); }
      };
    });
  }

  showFile();
}

// Docs vs everything else, for the Files sheet filter.
const DOC_FILE_RE = /\.(md|markdown|mdx|html?|txt|rst|adoc)$/i;

async function openFilesSheet() {
  const cwd = state.active?.cwd;
  const files = [...state.threadFiles.values()].sort((a, b) => a.path.localeCompare(b.path));

  openSheet(`<h2>Files</h2>
    <div class="hint">Edited or linked in this session. Saved files open offline.</div>
    <div class="file-tabs" id="fileFilter">
      <button data-f="all" class="on">All</button>
      <button data-f="docs">Docs</button>
      <button data-f="code">Code</button>
    </div>
    <div id="filesList"></div>
    <button class="primary-btn" id="saveFilesBtn" disabled>Select files to save</button>`);

  const cachedPaths = new Set();
  await Promise.all(files.map(async (f) => {
    if (await idbGet(fileCacheKey(cwd, f.path))) { cachedPaths.add(f.path); }
  }));

  const selected = new Set();
  let filter = "all";

  function visible() {
    return files.filter((f) => {
      if (filter === "docs") { return DOC_FILE_RE.test(f.path); }
      if (filter === "code") { return !DOC_FILE_RE.test(f.path); }

      return true;
    });
  }

  function syncSaveBtn() {
    const btn = $("saveFilesBtn");

    if (!btn) { return; }

    btn.disabled = selected.size === 0;
    btn.textContent = selected.size ? `Save ${selected.size} for offline` : "Select files to save";
  }

  function renderList() {
    const list = $("filesList");
    const rows = visible();

    if (!rows.length) {
      list.innerHTML = `<div class="hint">No ${filter === "all" ? "" : filter + " "}files in this session.</div>`;
      return;
    }

    list.innerHTML = rows.map((f) => {
      const name = f.path.split("/").pop();
      const dir = f.path.split("/").slice(0, -1).join("/");
      const badges = (cachedPaths.has(f.path) ? `<span class="fbadge">Saved</span>` : "")
        + (f.edited ? `<span class="fbadge edit">Edited</span>` : "");

      return `<div class="filerow${selected.has(f.path) ? " sel" : ""}" data-path="${esc(f.path)}">
        <div class="cb" data-role="cb"></div>
        <div class="fmeta" data-role="open">
          <div class="fname">${esc(name)}</div>
          <div class="fdir">${esc(dir || ".")}</div>
        </div>${badges}</div>`;
    }).join("");

    list.querySelectorAll(".filerow").forEach((row) => {
      const path = row.dataset.path;

      row.querySelector('[data-role="cb"]').onclick = (e) => {
        e.stopPropagation();

        if (selected.has(path)) { selected.delete(path); } else { selected.add(path); }

        row.classList.toggle("sel", selected.has(path));
        syncSaveBtn();
      };

      row.querySelector('[data-role="open"]').onclick = () => openFileSheet(path, "");
    });
  }

  $("sheetBody").querySelectorAll("#fileFilter button").forEach((b) => {
    b.onclick = () => {
      filter = b.dataset.f;
      $("sheetBody").querySelectorAll("#fileFilter button").forEach((x) => x.classList.toggle("on", x === b));
      renderList();
    };
  });

  $("saveFilesBtn").onclick = async () => {
    const btn = $("saveFilesBtn");
    const targets = [...selected];
    let done = 0;
    let failed = 0;
    btn.disabled = true;

    for (const p of targets) {
      btn.textContent = `Saving ${done + 1}/${targets.length}…`;

      try {
        const data = await api("/api/file?cwd=" + encodeURIComponent(cwd || "") + "&path=" + encodeURIComponent(p));
        await cacheFile(cwd, p, data);
        cachedPaths.add(p);
        done++;
      } catch {
        failed++;
      }
    }

    selected.clear();
    renderList();
    btn.textContent = failed ? `Saved ${done}, ${failed} failed` : `Saved ${done} for offline`;
    setTimeout(syncSaveBtn, 2200);
  };

  renderList();
  syncSaveBtn();
}

function renderFileInto(el, name, d, staleAt) {
  if (d.binary) {
    el.innerHTML = `<div class="hint">Binary file (${fmtBytes(d.size)}) — not viewable.</div>`;
    return;
  }

  let note = d.truncated ? `<div class="hint">Showing the first 2 MB of ${fmtBytes(d.size)}.</div>` : "";

  if (staleAt) { note = `<div class="hint">Offline copy · saved ${relTime(Math.floor(staleAt / 1000))}</div>` + note; }

  if (MD_FILE_RE.test(name)) {
    el.innerHTML = note + `<div class="md filebody">${renderMarkdown(d.content)}</div>`;
    return;
  }

  el.innerHTML = note + `<pre class="filecode"><code></code></pre>`;
  const code = el.querySelector("code");
  code.textContent = d.content;

  if (window.hljs) {
    try { hljs.highlightElement(code); } catch { /* leave as plain text */ }
  }
}

let lastUsageBar = null;

function updateUsageLive(rl) {
  if (lastUsageBar && rl?.primary && typeof rl.primary.usedPercent === "number") {
    const pct = rl.primary.usedPercent;
    lastUsageBar.style.width = pct + "%";
    lastUsageBar.parentElement.classList.toggle("hot", pct >= 80);

function gaugeHtml(name, p) {
  const win = p.windowDurationMins >= 10080 ? "weekly" : p.windowDurationMins >= 1440 ? "daily" : `${p.windowDurationMins}m`;
  const hasPct = typeof p.usedPercent === "number";
  const label = name === "primary" ? `Rate limit · ${win}` : "Secondary limit";
  let html = `<div class="gauge"><div class="top"><span class="name">${label}</span>`;

  if (hasPct) {
    html += `<span class="pct">${p.usedPercent}%</span></div><div class="bar ${p.usedPercent >= 80 ? "hot" : ""}"><span style="width:${p.usedPercent}%"></span></div>`;
  } else {
    html += `<span class="pct" style="font-size:14px">${esc(p.status || "active")}</span></div>`;
  }

  if (p.resetsAt) { html += `<div class="reset">resets ${relFuture(p.resetsAt)}</div>`; }

  html += `</div>`;
  return html;
}

// ---------- notifications (Web Push) ----------
//
// iOS delivers Web Push only to a Home-Screen install, via Apple's own push
// service — so this needs no native app and no third-party service. The bridge
// pushes when a turn finishes, with the thread title and a slice of the reply.

const PUSH_SUPPORTED = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;

function isStandalone() {
  return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
}

function isIOS() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent);
}

function urlB64ToUint8Array(base64) {
  const padding = "=".repeat((4 - (base64.length % 4)) % 4);
  const raw = atob((base64 + padding).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
}

function notificationsSectionHtml() {
  return `<div class="seclabel">Notifications</div>
    <div class="hint" id="pushHint">Checking…</div>
    <button class="primary-btn" id="pushBtn" style="margin-top:6px" disabled>…</button>`;
}

async function currentPushSub() {
  const reg = await navigator.serviceWorker?.getRegistration();
  return reg ? reg.pushManager.getSubscription() : null;
}

async function wireNotifications() {
  const btn = $("pushBtn");
  const hint = $("pushHint");

  if (!btn || !hint) { return; }

  function show(text, label, enabled) {
    hint.textContent = text;
    btn.textContent = label;
    btn.disabled = !enabled;
  }

  if (!PUSH_SUPPORTED) {
    show("This browser can't receive push notifications.", "Unavailable", false);
    return;
  }

  if (isIOS() && !isStandalone()) {
    show("On iPhone these only work from the Home Screen app — tap Share → Add to Home Screen, then open it from there.", "Add to Home Screen first", false);
    return;
  }

  if (Notification.permission === "denied") {
    show("Notifications are blocked for this app in your browser settings.", "Blocked", false);
    return;
  }

  const sub = await currentPushSub();

  if (sub) {
    show("On — you'll be notified when a turn finishes, with the reply.", "Turn off notifications", true);

    btn.onclick = async () => {
      btn.disabled = true;

      try {
        await api("/api/push/unsubscribe", { endpoint: sub.endpoint });
        await sub.unsubscribe();
      } catch {
        // already gone — fall through and re-read the state
      }

      wireNotifications();
    };

    return;
  }

  show("Off. Get notified when Codex, Claude or Grok finishes a turn.", "Enable notifications", true);

  btn.onclick = async () => {
    btn.disabled = true;
    hint.textContent = "Requesting permission…";

    try {
      const perm = await Notification.requestPermission();

      if (perm !== "granted") {
        show("Permission wasn't granted, so notifications stay off.", "Enable notifications", true);
        return;
      }

      const { key } = await api("/api/push/key");

      if (!key) { throw new Error("the bridge has no push key"); }

      const reg = await navigator.serviceWorker.ready;
      const fresh = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToUint8Array(key) });
      await api("/api/push/subscribe", { subscription: fresh.toJSON() });
      wireNotifications();
    } catch (e) {
      show("Couldn't enable notifications: " + (e.message || e), "Try again", true);
    }
  };
}

// Tell the bridge what is on screen, so a turn you are watching finish does not
// also arrive as a notification. Reports go stale server-side after ~75s, so a
// closed or backgrounded app stops suppressing on its own.
function clientId() {
  let id = localStorage.getItem("cxp_client_id");

  if (!id) {
    id = Math.random().toString(36).slice(2) + Date.now().toString(36);
    localStorage.setItem("cxp_client_id", id);
  }

  return id;
}

function sendPresence() {
  const ids = [state.active?.id, state.active?.draftId].filter(Boolean);

  api("/api/presence", {
    clientId: clientId(),
    provider: state.provider,
    ids,
    visible: !document.hidden && ids.length > 0,
  }).catch(() => {});
}

// Opened from a notification: jump straight to that thread.
async function openLinkedThread() {
  const q = new URLSearchParams(location.search);
  const id = q.get("thread");

  if (!id) { return; }

  const prov = q.get("provider");
  history.replaceState(null, "", "/");

  if (prov && PROVIDER_LABELS[prov] && prov !== state.provider) {
    await switchProvider(prov);
  }

  const found = state.threads.find((t) => t.id === id);
  openThread(found || { id, provider: prov || state.provider, cwd: null, name: null, preview: "Session" });
}

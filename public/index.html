  return b.scrollHeight - b.scrollTop - b.clientHeight < STICK_PX;
}

// force is for scrolls the user themselves caused — sending a message, opening
// a thread — where landing at the bottom is the whole point.
function scrollDown({ force = false } = {}) {
  if (!force && !stickToBottom) {
    $("jumpBtn").classList.add("unread");
    return;
  }

  const b = box();
  const seq = ++scrollSeq;

  requestAnimationFrame(() => {
    // Superseded: something restored a saved position after this was queued,
    // and that restore is the newer intent.
    if (seq !== scrollSeq) { return; }

    b.scrollTop = b.scrollHeight;
    // Only once the scroll has actually happened. Setting it up front left a
    // window in which a caller that restores a saved position afterwards —
    // resync, loadEarlier — had already been recorded as following the bottom,
    // so the next delta would yank the reader down.
    stickToBottom = true;
    updateJumpBtn();
  });
}

function updateJumpBtn() {
  const btn = $("jumpBtn");
  btn.classList.toggle("on", !stickToBottom);

  if (stickToBottom) { btn.classList.remove("unread"); }
}

// After code moves the scroll position itself, rather than waiting for the
// scroll event to catch up.
function syncStick() {
  scrollSeq++;
  stickToBottom = atBottom();
  updateJumpBtn();
}

// own: this device just sent it, so jumping to it is what the user asked for.
// A user message arriving from the transcript — replayed history, or another
// device typing into the same thread — must not move anyone's viewport.
function attachmentUrl(id) { return "/api/attachment?id=" + encodeURIComponent(id); }

function viewAttachment(attachment) {
  if (!attachment?.id) { return; }
  const viewer = $("imageViewer");
  const img = viewer.querySelector("img");
  img.src = attachmentUrl(attachment.id);
  img.alt = attachment.name || "Attached image preview";
  viewer.classList.add("show");
  viewer.focus();
}

function closeAttachmentViewer() {
  const viewer = $("imageViewer");
  viewer.classList.remove("show");
  viewer.querySelector("img").removeAttribute("src");
}

function addUser(text, { own = false, attachments = [], imageCount = 0 } = {}) {
  resetActivityGroup();
  const el = document.createElement("div");
  el.className = "msg user";

  const count = Math.max(attachments.length, imageCount);

  if (count) {
    const images = document.createElement("div");
    images.className = "user-images";

    for (let index = 0; index < count; index++) {
      const attachment = attachments[index];

      if (attachment?.id) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "image-thumb";
        button.setAttribute("aria-label", `View ${attachment.name || "attached image"}`);
        button.onclick = () => viewAttachment(attachment);
        const img = document.createElement("img");
        img.src = attachmentUrl(attachment.id);
        img.alt = attachment.name || "Attached image";
        button.appendChild(img);
        images.appendChild(button);
      } else {
        const placeholder = document.createElement("div");
        placeholder.className = "image-placeholder";
        placeholder.textContent = "Image attached";
        images.appendChild(placeholder);
      }
    }

    el.appendChild(images);
  }

  if (text) {
    const body = document.createElement("div");
    body.className = "user-text";
    body.textContent = text;
    el.appendChild(body);
  }

  box().appendChild(el);
  scrollDown({ force: own });
  return el;
}

// A message can be rendered twice: once from the session file, once from the
// live delta stream. Without a shared identity the second render appends a
// duplicate bubble whose "streaming" class nothing can ever clear, leaving a
// blinking caret behind forever. The newer render is the truth, so it replaces
// any earlier bubble for the same item.
function addAgent(text, streaming, itemId) {
  resetActivityGroup();
  if (itemId) { findItemEl(itemId)?.remove(); }
  const el = document.createElement("div");
  el.className = "msg agent md" + (streaming ? " streaming" : "");
  if (itemId) { el.dataset.itemId = itemId; }
  el._raw = text || "";
  if (streaming) { el.innerHTML = renderMarkdown(el._raw); }
  else { renderFinalMarkdownInto(el, el._raw); }
  registerFilesFromEl(el);
  box().appendChild(el);
  scrollDown();
  return el;
}

// Append streamed text and re-render markdown live.
function appendAgent(el, delta) {
  el._raw = (el._raw || "") + (delta || "");
  el.innerHTML = renderMarkdown(el._raw);
}

function makeBlock(cls, iconHtml, label, opts = {}) {
  const el = document.createElement("div");
  el.className = "block " + cls + (opts.open ? " open" : "");
  el.innerHTML = `<div class="bhead">${iconHtml}<span class="ttl"><span class="lbl"></span><span class="sub"></span></span><span class="st"></span><span class="chev">›</span></div><div class="body"></div>`;
  el.querySelector(".lbl").textContent = label;

  // A secondary line under the label — used to keep the raw command visible
  // beneath the summary of what it is for.
  if (opts.sub) {
    const sub = el.querySelector(".sub");
    sub.textContent = opts.sub;
    sub.classList.add("on");
  }
  el.querySelector(".bhead").onclick = () => el.classList.toggle("open");
  (opts.parent || box()).appendChild(el);
  scrollDown();
  return el;
}

function setBlockStatus(el, text, cls) {
  const s = el.querySelector(".st");
  s.textContent = text || "";
  s.className = "st " + (cls || "");
}

function renderDiffInto(pre, diff) {
  pre.classList.add("diff");
  pre.innerHTML = diff.split("\n").map((l) => {
    if (l.startsWith("+++") || l.startsWith("---")) { return `<span class="l-meta">${esc(l)}</span>`; }
    if (l.startsWith("@@")) { return `<span class="l-hdr">${esc(l)}</span>`; }
    if (l.startsWith("+")) { return `<span class="l-add">${esc(l)}</span>`; }
    if (l.startsWith("-")) { return `<span class="l-del">${esc(l)}</span>`; }
    return `<span>${esc(l)}</span>`;
  }).join("");
}

// render one finalized item (history or item/completed)
// The agent's own one-line account of what a tool call is for. Providers that
// carry it use different field names, and plenty of calls have none at all.
function summaryOf(item) {
  const raw = item.description ?? item.title ?? item.summary;
  const s = (typeof raw === "string" ? raw : "").replace(/\s+/g, " ").trim();

  // Not a summary if it is just the command repeated back.
  if (!s || s === (item.command ?? "").trim()) { return ""; }

  return s.length > 120 ? s.slice(0, 119) + "…" : s;
}

// Codex reasoning arrives as summary prose, often several paragraphs with a
// bold heading per section. The header shows the most recent heading — the
// closest thing to "what it is thinking about right now".
function latestSummaryLine(text) {
  const lines = (text || "").split("\n").map((l) => l.trim()).filter(Boolean);
  const clip = (s) => (s.length > 90 ? s.slice(0, 89) + "…" : s);

  // Codex writes each summary section as a bold heading followed by prose, and
  // the heading is what reads as "what it is working on". Prose caught mid-
  // stream is a sentence fragment, so headings win when there is one.
  for (let i = lines.length - 1; i >= 0; i--) {
    const m = /^\*\*(.+?)\*\*[.:]?$/.exec(lines[i]) || /^#+\s*(.+)$/.exec(lines[i]);

    if (m) { return clip(m[1].trim()); }
  }

  for (let i = lines.length - 1; i >= 0; i--) {
    const bare = lines[i].replace(/\*\*/g, "").replace(/^#+\s*/, "").trim();

    if (bare) { return clip(bare); }
  }

  return "";
}

const ACTIVITY_TYPES = new Set(["reasoning", "commandExecution", "fileChange", "mcpToolCall", "webSearch"]);

function isCodexActivity(item) {
  return activeProvider() === "codex" && ACTIVITY_TYPES.has(item?.type);
}

function clipActivity(text, length = 110) {
  const s = (text || "").replace(/\s+/g, " ").trim();
  return s.length > length ? s.slice(0, length - 1) + "…" : s;
}

function reasoningText(item) {
  return Array.isArray(item.summary) ? item.summary.join("\n\n") : (item.content || "");
}

function diffCounts(changes) {
  let added = 0;
  let removed = 0;

  for (const change of changes ?? []) {
    for (const line of (change.diff || "").split("\n")) {
      if (line.startsWith("+") && !line.startsWith("+++")) { added++; }
      if (line.startsWith("-") && !line.startsWith("---")) { removed++; }
    }
  }

  return { added, removed };
}

// This is the one shared description used by replay, live updates, and the
// settled digest. Keeping it independent of the row renderer prevents the
// collapsed view from drifting away from what the expanded item contains.
function activityLabel(item) {
  switch (item?.type) {
    case "reasoning":
      return latestSummaryLine(reasoningText(item)) || "Thinking…";
    case "commandExecution": {
      const why = summaryOf(item);

      if (why) { return why; }

      // A bare command reads as a code snippet dropped between messages, which
      // is what made a whole tool stretch look like "the agent ran this one
      // line". A verb makes it an action, and its tense says whether it is
      // still going.
      const done = item.exitCode != null || item.status === "completed";
      return clipActivity(`${done ? "Ran" : "Running"} ${item.command || "a command"}`);
    }
    case "fileChange": {
      const changes = item.changes ?? [];

      if (!changes.length) { return "Editing files…"; }

      const target = changes.length === 1 ? changes[0].path?.split("/").pop() : `${changes.length} files`;
      const { added, removed } = diffCounts(changes);
      const stats = `${added ? ` +${added}` : ""}${removed ? ` -${removed}` : ""}`;
      return `Edited ${target || "files"}${stats}`;
    }
    case "mcpToolCall":
      // Claude's built-in tools land here too, where "tool · Read" says nothing.
      // Its own account of the call wins whenever there is one.
      return summaryOf(item) || clipActivity([item.server, item.tool].filter(Boolean).join(" · ") || "Using tool");
    case "webSearch":
      return clipActivity(item.query || "Searching the web");
    default:
      return "Working…";
  }
}

function activityIcon(item) {
  switch (item?.type) {
    case "reasoning": return "🧠";
    case "commandExecution": return ICONS.cmd;
    case "fileChange": return ICONS.file;
    case "mcpToolCall": return ICONS.tool;
    case "webSearch": return ICONS.web;
    default: return "";
  }
}

function activityRows(group) {
  return [...(group?._body?.children ?? [])].filter((el) => el.dataset.activityRow === "true");
}

// What a finished stretch of tool work amounted to.
//
// Showing the newest activity is right while it is happening, but once the run
// is over that reads as though the agent did only that one thing — a single
// command sitting between two messages. So a settled group describes its
// composition instead.
function activityDigest(rows) {
  if (rows.length === 1) { return rows[0].dataset.activityLabel || "Working…"; }

  const n = {};

  for (const row of rows) { n[row.dataset.activityKind] = (n[row.dataset.activityKind] ?? 0) + 1; }

  const plural = (count, word) => `${count} ${word}${count === 1 ? "" : "s"}`;
  const parts = [];

  if (n.commandExecution) { parts.push(`ran ${plural(n.commandExecution, "command")}`); }
  if (n.fileChange) { parts.push(`edited ${plural(n.fileChange, "file")}`); }
  if (n.mcpToolCall) { parts.push(plural(n.mcpToolCall, "tool call")); }
  if (n.webSearch) { parts.push(plural(n.webSearch, "search")); }

  // Thinking alone is still worth naming; alongside real work it is noise.
  if (!parts.length && n.reasoning) { parts.push("thought it through"); }

  if (!parts.length) { return `${rows.length} steps`; }

  const text = parts.join(" · ");
  return text.charAt(0).toUpperCase() + text.slice(1);
}

function refreshActivityGroup(group, { live = group?.dataset.live === "true" } = {}) {
  const rows = activityRows(group);

  if (!group || !rows.length) { return; }

  const newest = rows.at(-1);
  const label = newest.dataset.activityLabel || "Working…";
  const header = group.querySelector(".activity-label");

  group.dataset.live = live ? "true" : "false";
  group.querySelector(".activity-icon").innerHTML = newest._activityIcon || "";
  header.textContent = live ? label : activityDigest(rows);
  header.classList.toggle("shimmer", live);
}

function createActivityGroup(live) {
  const group = document.createElement("div");
  group.className = "activity-group";
  group.innerHTML = `<div class="activity-head"><span class="activity-icon"></span><span class="lbl activity-label">Working…</span><span class="chev">›</span></div><div class="activity-body"></div>`;
  group._body = group.querySelector(".activity-body");
  group.dataset.live = live ? "true" : "false";
  group.querySelector(".activity-head").onclick = () => group.classList.toggle("open");
  box().appendChild(group);
  state.activityGroup = group;
  scrollDown();
  return group;
}

function ensureActivityGroup(live) {
  if (state.activityGroup?.isConnected) { return state.activityGroup; }
  return createActivityGroup(live);
}

function setActivityRow(el, item, { group, live }) {
  el.dataset.activityRow = "true";
  el.dataset.activityKind = item.type || "";
  el.dataset.activityLabel = activityLabel(item);
  el._activityIcon = activityIcon(item);
  refreshActivityGroup(group, { live });
}

function updateActivityRow(el, item, { live = true } = {}) {
  const group = el?.closest?.(".activity-group");

  if (!group) { return; }

  el.dataset.activityKind = item.type || el.dataset.activityKind || "";
  el.dataset.activityLabel = activityLabel(item);
  el._activityIcon = activityIcon(item);
  refreshActivityGroup(group, { live });
}

function settleActivityGroup(group = state.activityGroup) {
  if (!group) { return; }

  refreshActivityGroup(group, { live: false });
  group.classList.remove("open");
}

function resetActivityGroup() {
  settleActivityGroup();
  state.activityGroup = null;
}

function restoreCurrentActivityGroup() {
  const last = box().lastElementChild;
  state.activityGroup = last?.classList.contains("activity-group") ? last : null;
}

function setReasoningHeader(el, text, { live = true } = {}) {
  const lbl = el.querySelector(".lbl");
  const line = latestSummaryLine(text);

  lbl.textContent = line || (live ? "Thinking…" : "Thought process");
  lbl.classList.toggle("shimmer", live);
}

// A turn is over: nothing more is coming, so stop every reasoning header
// shimmering and let it settle back to a static label.
function settleReasoning() {
  for (const lbl of document.querySelectorAll(".block.reasoning .lbl.shimmer")) {
    lbl.classList.remove("shimmer");
  }
}

function renderActivityItem(item, { group = null, live = false, started = false } = {}) {
  const summary = item.type === "reasoning" ? reasoningText(item) : "";

  if (item.type === "reasoning" && !started && !summary.trim()) { return []; }

  const activity = group || ensureActivityGroup(live);
  const parent = activity._body || activity.querySelector(".activity-body");
  activity._body = parent;
  let el;

  switch (item.type) {
    case "reasoning":
      el = makeBlock("reasoning", "🧠", "Thinking…", { parent });
      el.querySelector(".body").textContent = summary;
      setReasoningHeader(el, summary, { live: false });

      if (started && !summary.trim()) { el.querySelector(".lbl").textContent = "Thinking…"; }

      break;
    case "commandExecution": {
      const why = summaryOf(item);
      el = makeBlock("cmd", ICONS.cmd, why || item.command || "command", { parent, open: started, sub: why ? item.command : "" });
      const ok = item.exitCode === 0;
      setBlockStatus(el, started ? "running" : (item.exitCode != null ? "exit " + item.exitCode : (item.status || "")), started ? "run" : (item.exitCode != null ? (ok ? "ok" : "bad") : ""));

      if (started || item.aggregatedOutput) {
        el.querySelector(".body").innerHTML = `<pre>${esc(item.aggregatedOutput || "")}</pre>`;
      }

      break;
    }
    case "fileChange":
      el = addFileChangeChip(item, { parent, started });
      break;
    case "mcpToolCall":
      // Same rule as the group header: Claude's built-in tools arrive as
      // mcpToolCall, and "tool · Read" tells you nothing that "Read
      // heroController.js" does not.
      el = chip(ICONS.tool, summaryOf(item) || `${item.server || "tool"} · ${item.tool || "call"}`, null, { parent });
      break;
    case "webSearch":
      el = chip(ICONS.web, item.query || "web search", null, { parent });
      break;
    default:
      return [];
  }

  setActivityRow(el, item, { group: activity, live });
  return [el];
}

function renderItem(item, opts = {}) {
  if (isCodexActivity(item)) { return renderActivityItem(item, opts); }

  // Conversation and standalone items are hard boundaries. The group is a
  // contiguous run, so allowing it to survive a message would reorder later
  // activity into a block above that message.
  resetActivityGroup();

  switch (item.type) {
    case "userMessage": {
      const t = (item.content ?? []).map((c) => c.text ?? "").join("");
      const imageParts = (item.content ?? []).filter((c) => c.type === "image" || c.type === "localImage");
      const attachments = imageParts.map((part) => part.attachment ?? null);
      const imageCount = imageParts.length;

      if (t.trim() || imageCount) {
        const el = addUser(t, { attachments, imageCount });
        if (item.clientId) { el.dataset.clientId = item.clientId; }
        return [el];
      }

      break;
    }
    case "agentMessage": {
      if ((item.text ?? "").trim()) { return [addAgent(item.text, false, item.id)]; }

      break;
    }
    case "reasoning": {
      const summary = Array.isArray(item.summary) ? item.summary.join("\n\n") : (item.content || "");

      if (summary.trim()) {
        const el = makeBlock("reasoning", "🧠", "Thought process");
        el.querySelector(".body").textContent = summary;
        // Replayed from the transcript, so it is finished by definition.
        setReasoningHeader(el, summary, { live: false });
        return [el];
      }

      break;
    }
    case "commandExecution": {
      // When the agent said what the command is for, that reads better as the
      // heading than the command itself, which moves to the line below.
      const why = summaryOf(item);
      const el = makeBlock("cmd", ICONS.cmd, why || item.command || "command", { sub: why ? item.command : "" });
      const ok = item.exitCode === 0;
      setBlockStatus(el, item.exitCode != null ? "exit " + item.exitCode : (item.status || ""), item.exitCode != null ? (ok ? "ok" : "bad") : "");

      if (item.aggregatedOutput) { el.querySelector(".body").innerHTML = `<pre>${esc(item.aggregatedOutput)}</pre>`; }

      return [el];
    }
    case "fileChange": {
      return [addFileChangeChip(item)];
    }
    case "mcpToolCall": {
      return [chip(ICONS.tool, summaryOf(item) || `${item.server} · ${item.tool}`)];
    }
    case "webSearch": {
      return [chip(ICONS.web, item.query || "web search")];
    }
    case "plan":
    case "todoList": {
      const el = makeBlock("plan", ICONS.plan, "Plan");
      el.querySelector(".body").innerHTML = `<pre>${esc(item.text || JSON.stringify(item, null, 1))}</pre>`;
      return [el];
    }
    case "turnError": {
      const detail = item.message || "The provider ended this turn with an error.";
      const el = chip("⚠️", detail);
      el.classList.add("turn-error");
      if (item.terminalId) { el.dataset.terminalId = item.terminalId; }
      return [el];
    }
    default: break;
  }

  return [];
}

function chip(iconHtml, text, onClick, opts = {}) {
  const el = document.createElement("div");
  el.className = "item-chip" + (onClick ? " link" : "");
  el.innerHTML = iconHtml + "<span></span>";
  el.querySelector("span").textContent = text;

  if (onClick) { el.onclick = onClick; }

  (opts.parent || box()).appendChild(el);
  scrollDown();
  return el;
}

// Files this thread touched — edited by the agent, or linked in a reply. Feeds
// the Files sheet so you can reopen one without scrolling the whole chat.
function registerThreadFile(path, edited) {
  if (!path) { return; }

  const cur = state.threadFiles.get(path) || { path, edited: false };
  cur.edited = cur.edited || !!edited;
  state.threadFiles.set(path, cur);
  updateFilesBtn();
}

function registerFilesFromEl(el) {
  el?.querySelectorAll?.("a[href]").forEach((a) => {
    const target = localFileTarget(a.getAttribute("href"));

    if (target) { registerThreadFile(target.path, false); }
  });
}

function updateFilesBtn() {
  const inChat = $("chatView").style.display !== "none";
  $("filesBtn").style.display = inChat && state.threadFiles.size ? "flex" : "none";
}

function addFileChangeChip(item, { parent = null, started = false } = {}) {
  const changes = item.changes ?? [];
  changes.forEach((c) => registerThreadFile(c.path, true));
  const n = changes.length;
  const label = started ? "Editing files…" : (n === 1 ? changes[0].path.split("/").pop() : `${n} files changed`);
  return chip(ICONS.file, "✏️ " + label, started ? null : () => {
    if (n === 1) {
      openFileSheet(changes[0].path, changes[0].diff || "");
    } else {
      const diff = changes.map((c) => `--- ${c.path}\n${c.diff || ""}`).join("\n\n");
      openDiffSheet(diff || "No diff available");
    }
  }, { parent });
}

function renderHistory(thread, window) {
  resetActivityGroup();
  box().innerHTML = "";

  // Only the end of a long thread is sent; offer the rest rather than pretending
  // this is the whole conversation.
  if (window?.hasMore) {
    const more = document.createElement("button");
    more.id = "loadEarlier";
    more.className = "loadearlier";
    more.textContent = "Load earlier messages";
    more.onclick = () => loadEarlier(more);
    box().appendChild(more);
  }

  const turns = thread.turns ?? [];

  // Absolute positions in the whole thread, since only a window of it is served
  // and later changes address items by absolute index.
  let base = window?.start ?? 0;

  turns.forEach((turn, ti) => {
    if (ti > 0) {
      resetActivityGroup();
      const s = document.createElement("div");
      s.className = "turn-sep";
      box().appendChild(s);
    }

    const live = state.externalTurn && ti === turns.length - 1;

    for (const item of turn.items ?? []) { renderItemAt(item, base++, { live }); }
  });
  registerFilesFromEl(box());
  // Deliberately does not scroll. Opening a thread wants the bottom; a resync
  // mid-turn wants to stay put. Only the caller knows which, and a scroll
  // queued from here would land after the caller's restore and undo it.
  // How far through the thread we've drawn. This is an *absolute* position in
  // the whole thread, not a count of what's on screen, because that's what
  // appended items are numbered against — see appendExternalItems.
  state.itemWindow = window ?? null;
  state.renderedItems = window ? window.end : turns.reduce((n, t) => n + (t.items?.length ?? 0), 0);
  // Re-attach anything the session file cannot carry: sends that failed, and
  // messages still waiting to go out.
  restoreFailedSends();
  restorePending();
}

// Which file+parser the positions on screen belong to, and how far along that
// file's change stream this view is. A fetch and the live stream race each
// other, so deltas that arrive mid-fetch are held and replayed against the
// response once it lands — otherwise the older response silently undoes them.
function setCursor(res) {
  state.generation = res?.generation ?? null;
  state.revision = res?.revision ?? 0;
  const held = state.opBuffer ?? [];
  state.opBuffer = [];

  for (const frame of held) {
    if (frame.generation === state.generation && frame.revision > state.revision) {
      applyExternalFrame(frame);
    }
  }
}

// Page backwards through a long thread, prepending older items above the button.
async function loadEarlier(btn) {
  const t = state.active;
  const w = state.itemWindow;

  if (!t || !w?.hasMore || btn.disabled) { return; }

  btn.disabled = true;
  btn.textContent = "Loading earlier messages…";

  try {
    const res = await api(`/api/thread?id=${encodeURIComponent(t.id)}&provider=${encodeURIComponent(t.provider || "codex")}&before=${w.start}`);
    const older = (res.thread?.turns ?? []).flatMap((x) => x.items ?? []);
    const b = box();
    const anchorFromBottom = b.scrollHeight - b.scrollTop;

    // Render into a fragment, then splice it in above the button so the reader's
    // position doesn't jump.
    const marker = document.createComment("older");
    b.insertBefore(marker, btn.nextSibling);
    const tail = [];

    while (marker.nextSibling) { tail.push(b.removeChild(marker.nextSibling)); }

    // The previous current group is now detached in `tail`; rendering through
    // it would put the older rows in the wrong half of the transcript.
    state.activityGroup = null;

    let olderBase = res.itemWindow?.start ?? 0;

    for (const item of older) { renderItemAt(item, olderBase++); }

    for (const node of tail) { b.appendChild(node); }

    marker.remove();
    restoreCurrentActivityGroup();
    state.itemWindow = res.itemWindow ?? { ...w, start: 0, hasMore: false };
    b.scrollTop = b.scrollHeight - anchorFromBottom;
    syncStick();

    if (state.itemWindow.hasMore) {
      btn.disabled = false;
      btn.textContent = "Load earlier messages";
    } else {
      btn.remove();
    }
  } catch (e) {
    btn.disabled = false;
    btn.textContent = "Couldn't load earlier — tap to retry";
  }
}

// Draw one item and label the elements it produced with its position in the
// thread, so a later change to that item can find and replace them. One item can
// render as several nodes, or none at all.
function renderItemAt(item, index, opts = {}) {
  const nodes = renderItem(item, opts);

  for (const node of nodes) {
    node.dataset.idx = String(index);
  }

  return nodes;
}

// One change frame from the server. Ordering and generation are checked here so
// every path — live, buffered-during-a-fetch, replayed — obeys the same rules.
function applyExternalFrame(frame) {
  const { result, ops, generation, revision } = frame;

  if (frame.terminalOutcome === "failed") {
    showTurnFailure(frame.terminalError, frame.terminalId);
  }

  if (result !== "ops" && result !== "reset" && result !== "error") { return; }

  if (result === "error") {
    scheduleExternalRefresh();
    return;
  }

  // Mid-fetch: hold it. The response about to land may already include this,
  // and applying it first would have it overwritten a moment later.
  if (state.fetching) {
    state.opBuffer = (state.opBuffer ?? []).concat(frame);
    return;
  }

  // A different file or parser: every position on screen means something else
  // now, so nothing can be patched — only replaced.
  if (result === "reset" || (generation && state.generation && generation !== state.generation)) {
    scheduleExternalRefresh();
    return;
  }

  // Already reflected in what we drew.
  if (revision != null && revision <= (state.revision ?? 0)) { return; }

  applyExternalOps(ops ?? []);
  state.revision = revision ?? state.revision;
}

function showTurnFailure(error, terminalId = null) {
  if (terminalId && box().querySelector(`[data-terminal-id="${CSS.escape(String(terminalId))}"]`)) { return; }

  const message = typeof error === "string" ? error : (error?.message || "The provider ended this turn with an error.");
  const el = chip("⚠️", message);
  el.classList.add("turn-error");
  if (terminalId) { el.dataset.terminalId = terminalId; }
  return el;
}

// Changes to a thread someone else is driving, as operations rather than "here
// is everything past N" — because a tool result *modifies* the command item that
// is already on screen rather than appending anything. Blind appending left
// those commands running forever with no output.
function applyExternalOps(ops) {
  const b = box();
  // Captured before the ops mutate the DOM: a `replace` can reset scrollTop,
  // which would otherwise be mistaken for the user scrolling away.
  const wasAtBottom = atBottom();
  let drew = false;

  for (const { op, index, item } of ops) {
    if (op === "append") {
      // Anything before what we've drawn is already there; a gap means we missed
      // an event, so re-read rather than render out of order.
      if (index < state.renderedItems) { continue; }

      if (index > state.renderedItems) {
        scheduleExternalRefresh();
        return;
      }

      renderItemAt(item, index, { live: state.externalTurn });
      state.renderedItems = index + 1;
      drew = true;
      continue;
    }

    if (op === "replace") {
      const existing = [...b.querySelectorAll(`[data-idx="${index}"]`)];

      // Not on screen — it's above the window this client loaded.
      if (!existing.length) { continue; }

      const anchor = existing[0];
      const oldGroup = anchor.closest(".activity-group");
      const added = renderItem(item, { group: isCodexActivity(item) ? oldGroup : null, live: oldGroup?.dataset.live === "true" });

      for (const node of added) {
        node.dataset.idx = String(index);
        anchor.parentNode.insertBefore(node, anchor);
      }

      for (const node of existing) { node.remove(); }

      if (oldGroup) { refreshActivityGroup(oldGroup); }

      drew = true;
    }
  }

  if (!drew) { return; }

  registerFilesFromEl(b);
  setLivePill(state.externalTurn, "Running — following live", { stalled: false });

  if (wasAtBottom) { scrollDown({ force: true }); }
}

// ---------- live streaming ----------
function findItemEl(itemId) {
  return box().querySelector('[data-item-id="' + CSS.escape(String(itemId)) + '"]');
}

// Clear carets from the DOM, not from state.items: openThread and every thread
// refetch replace that map, so a bubble orphaned by one of those resets is
// unreachable through it and would blink for the rest of the session.
function clearCarets() {
  box().querySelectorAll(".msg.agent.streaming").forEach((el) => {
    el.classList.remove("streaming");
    renderFinalMarkdownInto(el, el._raw || "");
    registerFilesFromEl(el);
  });
}

function liveItem(itemId, factory) {
  let rec = state.items.get(itemId);

  if (!rec) {
    rec = factory();
    state.items.set(itemId, rec);
  }

  return rec;
}

function onNotify(method, params, provider) {
  const tid = params?.threadId;

  // Run state belongs to the provider's task list, even when a task from a
  // different provider is currently open. Transcript events below are still
  // scoped to the open provider, but the provider-agnostic Recent view must
  // never miss a start/stop transition.
  if (method === "turn/started") { markRunning(provider, tid, true, { confidence: "provider" }); }

  if (method === "turn/completed" || method === "turn/failed" || method === "turn/aborted") { markRunning(provider, tid, false, { confidence: "provider" }); }

  if (method === "thread/status/changed") {
    const st = params?.status;
    const active = st === "active" || st?.type === "active" || st?.type === "running";
    markRunning(provider, tid, active, { confidence: "provider" });
  }

  if (provider && provider !== activeProvider()) { return; }

  if (method === "account/rateLimits/updated") {
    updateUsageLive(params.rateLimits, provider);

    // A rate-limit frame is account-scoped and normally has no threadId. Only
    // attach an explicit exhaustion signal to the chat while a turn is active;
    // opening the Usage sheet must never manufacture a thread failure.
    if (state.active && state.busy && params.rateLimits?.rateLimitReachedType) {
      const reached = String(params.rateLimits.rateLimitReachedType);
      showTurnFailure(`Usage exhausted — the provider reported its ${reached} limit was reached.`, `${provider}:usage:${reached}:${params.rateLimits.primary?.resetsAt ?? "unknown"}`);
    }

    return;
  }

  if (method === "thread/adopted") {
    if (state.active && state.active.id === params.threadId) {
      migrateThreadLocalState(activeProvider(), state.active.id, params.sessionId);
      state.active.draftId = state.active.id;
      state.active.id = params.sessionId;
      state.active.draft = false;
    }

    return;
  }

  if (!state.active || (tid !== state.active.id && tid !== state.active.draftId)) { return; }

  // Once real turn output arrives, the existing streaming UI is the status.
  // Remove the pre-stream progress chip instead of building a second surface.
  if (method === "item/started" || method === "item/completed" || method.includes("/delta") || method.includes("/outputDelta")) {
    finishSendProgress();
  }

  switch (method) {
    case "approval/expired":
      if (!params.requestId || params.requestId === state.approvalId) {
        state.approvalId = null;
        $("approval").style.display = "none";
        chip("ℹ️", "Approval timed out and was denied safely");
      }
      break;

    case "turn/started":
      resetActivityGroup();
      state.activeTurnId = params.turn?.id ?? params.turnId;
      state.lastDiff = "";
      $("diffBtn").style.display = "none";
      setBusy(true);
      break;

    case "item/started": {
      const item = params.item ?? {};
      const id = item.id;

      if (isCodexActivity(item)) {
        liveItem(id, () => {
          const [el] = renderActivityItem(item, { live: true, started: true });
          return {
            el,
            body: el?.querySelector(".body"),
            pre: el?.querySelector("pre"),
            summaryText: reasoningText(item),
          };
        });
      } else if (item.type === "commandExecution") {
        liveItem(id, () => {
          const why = summaryOf(item);
          const el = makeBlock("cmd", ICONS.cmd, why || item.command || "command", { open: true, sub: why ? item.command : "" });
          setBlockStatus(el, "running", "run");
          el.querySelector(".body").innerHTML = "<pre></pre>";
          return { el, pre: el.querySelector("pre") };
        });
      } else if (item.type === "reasoning") {
        liveItem(id, () => {
          const el = makeBlock("reasoning", "🧠", "Thinking…", { open: false });
          el.querySelector(".lbl").classList.add("shimmer");
          return { el, body: el.querySelector(".body") };
        });
      } else if (item.type === "fileChange") {
        // wait for completed to know the changes
      } else if (item.type === "mcpToolCall") {
        chip(ICONS.tool, `${item.server} · ${item.tool}`);
      } else if (item.type === "webSearch") {
        chip(ICONS.web, item.query || "web search");
      }

      break;
    }

    case "item/agentMessage/delta": {
      const rec = liveItem(params.itemId, () => ({ el: addAgent("", true, params.itemId) }));
      appendAgent(rec.el, params.delta ?? "");
      scrollDown();
      break;
    }

    case "item/reasoning/summaryTextDelta":
    case "item/reasoning/textDelta": {
      const rec = liveItem(params.itemId, () => {
        // Collapsed: the header itself now carries the live summary, so opening
        // it is for reading the detail rather than seeing that anything is
        // happening at all.
        if (activeProvider() === "codex") {
          const [el] = renderActivityItem({ type: "reasoning", content: "" }, { live: true, started: true });
          return { el, body: el.querySelector(".body"), summaryText: "" };
        }

        const el = makeBlock("reasoning", "🧠", "Thinking…", { open: false });
        return { el, body: el.querySelector(".body"), summaryText: "" };
      });
      rec.body.textContent += params.delta ?? "";

      // Only the summary stream is a human-readable précis of the reasoning.
      // textDelta carries raw content and lands in the header as mid-sentence
      // fragments, so it updates the body but never the label.
      if (method === "item/reasoning/summaryTextDelta") {
        rec.summaryText = (rec.summaryText || "") + (params.delta ?? "");
        setReasoningHeader(rec.el, rec.summaryText, { live: activeProvider() !== "codex" });

        if (activeProvider() === "codex") {
          updateActivityRow(rec.el, { type: "reasoning", content: rec.summaryText }, { live: true });
        }
      }

      scrollDown();
      break;
    }

    case "item/commandExecution/outputDelta": {
      const rec = state.items.get(params.itemId);

      if (rec?.pre) { rec.pre.textContent += params.delta ?? ""; scrollDown(); }

      break;
    }

    case "item/completed": {
      const item = params.item ?? {};
      const rec = state.items.get(item.id);

      if (item.type === "agentMessage" && rec) {
        rec.el.classList.remove("streaming");
        rec.el._raw = item.text ?? rec.el._raw;
        renderFinalMarkdownInto(rec.el, rec.el._raw);
        registerFilesFromEl(rec.el);
      } else if (item.type === "commandExecution" && rec) {
        // The summary can arrive with the completed item rather than the
        // started one, so promote it here too if it turned up late.
        const why = summaryOf(item);
        const sub = rec.el.querySelector(".sub");

        if (why && sub && !sub.classList.contains("on")) {
          rec.el.querySelector(".lbl").textContent = why;
          sub.textContent = item.command || "";
          sub.classList.add("on");
        }

        const ok = item.exitCode === 0;
        setBlockStatus(rec.el, item.exitCode != null ? "exit " + item.exitCode : (item.status || "done"), item.exitCode != null ? (ok ? "ok" : "bad") : "");
        rec.el.classList.remove("open");

        if (item.aggregatedOutput && rec.pre && !rec.pre.textContent) { rec.pre.textContent = item.aggregatedOutput; }

        updateActivityRow(rec.el, item, { live: true });
      } else if (item.type === "reasoning" && rec) {
        // Keep the summary as the heading — it says more than "Thought process"
        // — but stop it shimmering now that nothing further is coming.
        const done = Array.isArray(item.summary) ? item.summary.join("\n\n") : (rec.summaryText || "");
        setReasoningHeader(rec.el, done, { live: false });
        rec.el.classList.remove("open");
        updateActivityRow(rec.el, { ...item, summary: null, content: done || "Thought process" }, { live: true });
      } else if (item.type === "fileChange") {
        if (rec?.el?.closest(".activity-group")) {
          const group = rec.el.closest(".activity-group");
          const [el] = renderActivityItem(item, { group, live: true });
          rec.el.replaceWith(el);
          state.items.set(item.id, { el });
          refreshActivityGroup(group, { live: true });
        } else if (isCodexActivity(item)) {
          renderActivityItem(item, { live: true });
        } else {
          addFileChangeChip(item);
        }
      } else if (item.type === "plan" || item.type === "todoList") {
        renderItem(item);
      }

      break;
    }

    case "turn/diff/updated":
      state.lastDiff = params.diff || "";
      $("diffBtn").style.display = state.lastDiff ? "flex" : "none";
      break;

    case "thread/tokenUsage/updated": {
      const tot = params.tokenUsage?.total?.totalTokens;

      if (tot != null) { $("tokCount").textContent = fmtTokens(tot) + " tok"; }

      break;
    }

    case "turn/aborted":
    case "turn/completed":
    case "turn/failed": {
      const error = params.error ?? params.turn?.error;

      if (error?.code === "thread_locked_elsewhere") {
        failSendProgress(error);
      } else {
        finishSendProgress();
      }

      setBusy(false);
      state.activeTurnId = null;
      clearCarets();

      if ((method === "turn/failed" || error) && error?.code !== "thread_locked_elsewhere") {
        showTurnFailure(error || "Turn failed", params.turn?.id ? `${provider}:${params.turn.id}` : null);
      }

      flushPending();
      break;
    }
  }

  if (!method.startsWith("turn/") && (params?.error || params?.failureReason)) {
    const source = method === "mcpServer/startupStatus/updated" && params.name ? `${params.name}: ` : "";
    const error = params.error ?? params.failureReason;
    const message = typeof error === "string" ? error : (error?.message || JSON.stringify(error));
    const noticeId = `${provider}:${method}:${params.requestId ?? params.name ?? state.activeTurnId ?? "thread"}`;
    showTurnFailure(source + message, noticeId);
  }
}

// ---------- navigation ----------
async function openThread(t) {
  resetActivityGroup();
  state.active = t;
  state.threadMode = null;
  state.threadModeUnknown = false;
  state.threadApprovalPolicy = null;
  state.threadSandboxPolicy = null;
  state.settingsTruth = { state: "loading", sources: {}, message: "Checking settings…" };
  const threadProvider = t.provider || state.provider || "codex";
  const providerChanged = threadProvider !== state.modelsProvider;
  state.provider = threadProvider;
  persistPrefs();
  syncProviderSeg();

  if (providerChanged) {
    await initModels(threadProvider);
    if (state.active !== t) { return; }
  }

  state.approvalId = null;
  $("approval").style.display = "none";
  state.lock = { state: "unknown", label: "Checking…" };
  await loadThreadSettings(t);
  if (state.active !== t) { return; }
  state.activeTurnId = null;
  state.items = new Map();
  state.pending = [];
  state.composerAttachments = [];
  renderComposerAttachments();
  state.lastDiff = "";
  state.threadFiles = new Map();
  $("filesBtn").style.display = "none";
  $("notifyBtn").style.display = "flex";
  sendPresence();
  setBusy(false);
  syncControls();
  document.body.classList.add("thread-open");
  syncSidebarToggle();
  $("listView").style.display = "none";
  $("chatView").style.display = "flex";
  $("viewSeg").style.display = "none";
  $("backBtn").style.display = "block";
  $("newBtn").style.display = "none";
  $("usageBtn").style.display = "none";
  $("diffBtn").style.display = "none";
  $("tokCount").textContent = "";
  $("hTitle").textContent = t.name || t.preview || "Session";
  $("hSub").textContent = t.agentPath || (t.cwd || "").split("/").slice(-2).join("/");
  $("rows").querySelectorAll(".row").forEach((row) => {
    const selected = row.dataset.tid === String(t.parentThreadId || t.id) && row.dataset.provider === (t.provider || "codex");
    row.classList.toggle("active-thread", selected);
    const trigger = row.querySelector(".row-copy");

    if (selected) { trigger?.setAttribute("aria-current", "true"); }
    else { trigger?.removeAttribute("aria-current"); }

    row.querySelectorAll(".subagent-row").forEach((child) => {
      const childSelected = child.dataset.tid === String(t.id);
      child.classList.toggle("active-subagent", childSelected);
      if (childSelected) { child.setAttribute("aria-current", "true"); }
      else { child.removeAttribute("aria-current"); }
    });
  });
  $("input").placeholder = "Message " + (PROVIDER_LABELS[t.provider] || "Codex") + "…";
  syncNotifyButton();
  box().innerHTML = '<div class="empty">Loading…</div>';
  refreshLockStatus();

  if (t.draft) {
    box().innerHTML = '<div class="empty">New session — send a message to begin.</div>';
    return;
  }

  const cacheKey = threadCacheKey(t.provider, t.id);

  // Paint the cached copy instantly (works offline); the network refreshes it.
  const cached = await idbGet(cacheKey);

  if (state.active !== t) { return; }

  // If it's mid-turn, say so before the fetch lands: the cached copy on screen
  // is a snapshot, and without this a busy thread reads as a finished one.
  if (t.running || isRunning(t.provider, t.id)) {
    setBusy(true, { external: true, ownershipChecking: true });
    setLivePill(true, "Loading new messages…", { stalled: false });
  }

  if (cached?.thread) {
    renderHistory(cached.thread);
    scrollDown({ force: true });

    if (cached.tokens) { $("tokCount").textContent = fmtTokens(cached.tokens) + " tok"; }
  }

  state.fetching = true;

  try {
    const res = await api("/api/thread?id=" + encodeURIComponent(t.id) + "&provider=" + encodeURIComponent(t.provider || "codex"));

    if (state.active !== t) { return; }

    renderHistory(res.thread, res.itemWindow);
    scrollDown({ force: true });
    state.fetching = false;
    setCursor(res);
    if (res.runtime) {
      markRunning(t.provider, t.id, !!res.runtime.running, { confidence: res.runtime.confidence });
    }
    refreshApprovals();
    refreshLockStatus();
    setOfflineNote(false);
    const tu = res.thread?.tokenUsage?.total?.totalTokens ?? res.thread?.turns?.at?.(-1)?.tokenUsage?.total?.totalTokens;

    if (tu) { $("tokCount").textContent = fmtTokens(tu) + " tok"; }

    idbSet(cacheKey, { thread: trimThreadForCache(res.thread), updatedAt: t.updatedAt, tokens: tu ?? cached?.tokens ?? null, cachedAt: Date.now() });
    reconcileNativeCodexQueue(t);

    // A browser can reopen while a bridge-owned turn is still running. The
    // server's runtime source is authoritative; file activity alone must not
    // downgrade an owned turn into an uncontrollable external turn.
    if (isRunning(t.provider, t.id)) {
      const external = res.runtime?.source !== "bridge";
      state.activeTurnId = external ? null : (res.runtime?.turnId ?? state.activeTurnId);
      setBusy(true, { external });
      setLivePill(true, liveRunText(res.runtime?.confidence), { stalled: res.runtime?.confidence === "stalled" });
    } else {
      state.activeTurnId = null;
      // Only auto-dispatch a restored queue after a successful canonical read
      // and an explicit provider marker prove the thread is idle.
      setBusy(false);
      const confidence = state.runConfidence.get(runKey(t.provider, t.id));

      if (confidence === "provider" || confidence === "bridge" || confidence === "marker") {
        queueMicrotask(flushPending);
      } else if (state.pending.length) {
        for (const entry of state.pending) {
          const label = entry.chip?.querySelector("span");

          if (label) { label.textContent = "Completion could not be confirmed — check the thread, then tap Retry to try now"; }
          entry.retryRequired = true;
          markSendFailed(entry.bubble, () => retryPendingEntry(entry), {
            onDismiss: () => removePendingEntry(entry, { allowUncertain: true }),
          });
        }

        savePending();
      }
    }
  } catch (e) {
    state.fetching = false;

    if (state.active !== t) { return; }

    if (state.turnOwnership === "checking") {
      setBusy(state.busy, { external: true, ownershipUnknown: true });
    }

    const msg = String(e.message || "");

    if (cached?.thread) {
      // Keep the saved copy on screen; flag it only when the reason we couldn't
      // refresh was actually a lost phone/Mac, not a server-side error.
      if (e.reach) { setOfflineNote(true, e.reach); }
    } else if (/not materialized|not found|before first user message/i.test(msg)) {
      // Brand-new session with no history yet — this is expected, not an error.
      box().innerHTML = '<div class="empty">New session — send a message to begin.</div>';
    } else if (e.reach) {
      box().innerHTML = '<div class="empty">' + offlineWord(e.reach) + " — no saved copy of this session yet.</div>";
    } else {
      box().innerHTML = '<div class="empty">Failed to load: ' + esc(e.message) + "</div>";
    }
  }
}

function backToList() {
  finishSendProgress();
  state.active = null;
  state.threadMode = null;
  state.threadModeUnknown = false;
  state.threadApprovalPolicy = null;
  state.threadSandboxPolicy = null;
  document.body.classList.remove("thread-open");
  sendPresence();
  $("chatView").style.display = "none";
  $("listView").style.display = "block";
  $("backBtn").style.display = "none";
  $("newBtn").style.display = "flex";
  $("usageBtn").style.display = "flex";
  $("diffBtn").style.display = "none";
  $("filesBtn").style.display = "none";
  $("notifyBtn").style.display = "none";
  updateListChrome();
  $("tokCount").textContent = "";
  loadThreads(false);
}

async function switchProvider(name) {
  if (!PROVIDER_LABELS[name] || name === state.provider) { return; }

  state.provider = name;
  persistPrefs();
  syncProviderSeg();
  updateListChrome();
  state.threads = [];
  state.nextCursor = null;
  $("search").value = "";
  $("rows").innerHTML = '<div class="empty">Loading…</div>';

  // On desktop this is a sidebar filter while a task remains open. Do not let
  // browsing Claude/Grok sessions replace the active task's composer catalog.
  if (!state.active) { await initModels(name); }
  loadThreads(false);
}

// ---------- sending ----------
// send() is the composer action. When idle it sends immediately; when a turn is
// running it enqueues (Queue = send on turn end, Steer = interrupt now + send).
const MAX_ATTACHMENTS = 4;
const MAX_ATTACHMENT_BYTES = 3 * 1024 * 1024;
const MAX_ATTACHMENTS_TOTAL_BYTES = 8 * 1024 * 1024;
const MAX_IMAGE_EDGE = 2000;
const DIRECT_IMAGE_TYPES = new Set(["image/png", "image/jpeg", "image/gif", "image/webp"]);

function renderComposerAttachments() {
  const strip = $("attachmentStrip");
  strip.innerHTML = "";
  strip.classList.toggle("on", state.composerAttachments.length > 0);

  for (const attachment of state.composerAttachments) {
    const preview = document.createElement("div");
    preview.className = "attachment-preview";
    const img = document.createElement("img");
    img.src = attachmentUrl(attachment.id);
    img.alt = attachment.name || "Attached image";
    const remove = document.createElement("button");
    remove.type = "button";
    remove.textContent = "×";
    remove.setAttribute("aria-label", `Remove ${attachment.name || "image"}`);
    remove.onclick = () => {
      state.composerAttachments = state.composerAttachments.filter((item) => item.id !== attachment.id);
      renderComposerAttachments();
    };
    preview.append(img, remove);
    strip.appendChild(preview);
  }
}

function imageElement(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("This image format could not be decoded")); };
    img.src = url;
  });
}

function canvasBlob(canvas, type, quality) {
  return new Promise((resolve, reject) => canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error("Image compression failed")), type, quality));
}

async function normalizedImage(file) {
  const img = await imageElement(file);

  if (DIRECT_IMAGE_TYPES.has(file.type) && file.size <= MAX_ATTACHMENT_BYTES && Math.max(img.naturalWidth, img.naturalHeight) <= MAX_IMAGE_EDGE) {
    return file;
  }

  const scale = Math.min(1, MAX_IMAGE_EDGE / Math.max(img.naturalWidth, img.naturalHeight));
  const canvas = document.createElement("canvas");
  canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
  canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  let blob = await canvasBlob(canvas, "image/jpeg", 0.86);

  if (blob.size > MAX_ATTACHMENT_BYTES) { blob = await canvasBlob(canvas, "image/jpeg", 0.7); }
  if (blob.size > MAX_ATTACHMENT_BYTES) { throw new Error("Image is still larger than 3 MB after compression"); }

  return new File([blob], (file.name || "image").replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg" });
}

function base64Of(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(",", 2)[1] || "");
    reader.onerror = () => reject(new Error("Could not read image"));
    reader.readAsDataURL(file);
  });
}

async function uploadImages(files) {
  if (activeProvider() === "grok") {
    chip("⚠️", "This Grok CLI does not support image prompts");
    return;
  }

  const remaining = MAX_ATTACHMENTS - state.composerAttachments.length;

  if (remaining <= 0) { chip("⚠️", `Attach at most ${MAX_ATTACHMENTS} images`); return; }

  state.uploadingAttachments++;
  syncControls();

  try {
    for (const original of [...files].slice(0, remaining)) {
      const file = await normalizedImage(original);

      if (state.composerAttachments.reduce((sum, item) => sum + (item.size || 0), 0) + file.size > MAX_ATTACHMENTS_TOTAL_BYTES) {
        throw new Error("Attached images must be 8 MB or less in total");
      }

      const attachment = await api("/api/attachment", { name: file.name, data: await base64Of(file) });
      state.composerAttachments.push(attachment);
      renderComposerAttachments();
    }

    if (files.length > remaining) { chip("⚠️", `Only the first ${remaining} image${remaining === 1 ? " was" : "s were"} attached`); }
  } catch (error) {
    chip("⚠️", "Image not attached: " + error.message);
  } finally {
    state.uploadingAttachments--;
    $("imageInput").value = "";
    syncControls();
  }
}

async function send() {
  const text = $("input").value.trim();
  const attachments = state.composerAttachments.slice();

  if ((!text && !attachments.length) || !state.active || state.uploadingAttachments) { return; }
  const readiness = dispatchReadiness();
  if (!readiness.ready) {
    chip("⚠️", `${readiness.reason}. Nothing was queued or sent.`);
    syncControls();
    return;
  }

  $("input").value = "";
  $("input").style.height = "auto";
  state.composerAttachments = [];
  renderComposerAttachments();

  if (state.busy) {
    enqueue(text, attachments);
    return;
  }

  doSend(text, { attachments, bubble: addUser(text, { own: true, attachments }) });
}

// Queued and steered-but-not-yet-landed messages used to live only in
// state.pending, which is memory. A steer that cannot land (the turn belongs to
// another writer) deliberately stays pending — so on reload the message was
// silently dropped, with no bubble, no chip and no record anywhere. Persist the
// queue per thread so nothing you typed can disappear.
const PENDING_KEY = "cxp_pending";

function pendingStore() {
  try { return JSON.parse(localStorage.getItem(PENDING_KEY)) || {}; } catch { return {}; }
}

function migrateThreadLocalState(provider, fromId, toId) {
  if (!fromId || !toId || fromId === toId) { return; }

  const fromKey = runKey(provider, fromId);
  const toKey = runKey(provider, toId);
  const pending = pendingStore();

  if (pending[fromKey]?.length) {
    const byId = new Map();
    const merged = [...(pending[toKey] ?? []), ...pending[fromKey]];

    merged.forEach((entry, index) => {
      const key = entry?.requestId || `legacy:${index}:${typeof entry === "string" ? entry : JSON.stringify(entry)}`;
      byId.set(key, entry);
    });

    pending[toKey] = [...byId.values()];
    delete pending[fromKey];
    try { localStorage.setItem(PENDING_KEY, JSON.stringify(pending)); } catch {}
  }

  let changed = false;

  for (const failed of state.failedSends) {
    if ((failed.provider || "codex") === provider && failed.threadId === fromId) {
      failed.threadId = toId;
      changed = true;
    }
  }

  if (changed) { saveFailedSends(); }

  const prefs = threadPrefsStore();

  if (prefs[fromKey] && !prefs[toKey]) { prefs[toKey] = prefs[fromKey]; }
  if (prefs[fromKey]) {
    delete prefs[fromKey];
    try { localStorage.setItem(THREAD_PREFS_KEY, JSON.stringify(prefs)); } catch {}
  }
}

function savePending() {
  const tid = state.active?.id;

  if (!tid) { return; }

  const all = pendingStore();
  const key = runKey(state.active.provider, tid);
  const entries = state.pending
    .filter((e) => e.text || e.attachments?.length)
    .map((e) => ({
      text: e.text,
      attachments: e.attachments ?? [],
      requestId: e.requestId || newRequestId(),
      retryRequired: !!e.retryRequired,
      retryWithNewId: !!e.retryWithNewId,
      retryAsSteer: !!e.retryAsSteer,
      awaitingOwnership: !!e.awaitingOwnership,
      intendedSendMode: e.intendedSendMode ?? null,
      mayHaveDispatched: !!e.mayHaveDispatched,
      viaCodexQueue: !!e.viaCodexQueue,
      nativeQueue: !!e.nativeQueue,
      nativeQueueId: e.nativeQueueId ?? null,
    }));

  if (entries.length) { all[key] = entries; } else { delete all[key]; }

  try { localStorage.setItem(PENDING_KEY, JSON.stringify(all)); } catch {}
}

async function removePendingEntry(entry, { flush = true, allowUncertain = false } = {}) {
  let at = state.pending.indexOf(entry);

  if (at < 0 || entry.dispatching || (entry.mayHaveDispatched && !allowUncertain)) { return false; }

  if (entry.nativeQueue && entry.nativeQueueId) {
    entry.dispatching = true;
    syncPendingActions(entry);
    try {
      await api("/api/queue/delete", {
        provider: entry.provider || activeProvider(),
        threadId: entry.threadId || state.active?.id,
        queuedSubmissionId: entry.nativeQueueId,
      });
    } catch (error) {
      entry.dispatching = false;
      syncPendingActions(entry);
      chip("⚠️", "Could not cancel queued message: " + (error.message || error));
      return false;
    }
  }

  at = state.pending.indexOf(entry);
  if (at >= 0) { state.pending.splice(at, 1); }
  entry.chip?.remove();
  entry.bubble?.remove();
  savePending();
  if (flush && !state.busy) { queueMicrotask(flushPending); }
  return true;
}

function setQueuedBubbleText(entry, text) {
  if (!entry.bubble) { return; }

  let body = entry.bubble.querySelector(".user-text");

  if (!text) {
    body?.remove();
    return;
  }

  if (!body) {
    body = document.createElement("div");
    body.className = "user-text";
    entry.bubble.appendChild(body);
  }

  body.textContent = text;
}

function openPendingEditSheet(entry) {
  if (!state.pending.includes(entry) || entry.dispatching || entry.mayHaveDispatched) { return; }

  openSheet(`<h2>Edit queued message</h2>
    <div class="hint">This has not been sent to the agent yet.</div>
    <textarea class="field-input" id="queuedEditInput"></textarea>
    <button class="primary-btn" id="saveQueuedEdit">Save message</button>`);
  $("queuedEditInput").value = entry.text || "";
  $("queuedEditInput").focus();
  $("saveQueuedEdit").onclick = async () => {
    const text = $("queuedEditInput").value.trim();

    if (!text && !(entry.attachments ?? []).length) { return; }
    if (!state.pending.includes(entry) || entry.dispatching || entry.mayHaveDispatched) { closeSheet(); return; }

    if (entry.nativeQueue && entry.nativeQueueId) {
      entry.dispatching = true;
      syncPendingActions(entry);
      try {
        await api("/api/queue/update", {
          provider: entry.provider || activeProvider(),
          threadId: entry.threadId || state.active?.id,
          queuedSubmissionId: entry.nativeQueueId,
          text,
          attachmentIds: (entry.attachments ?? []).map((attachment) => attachment.id),
        });
      } catch (error) {
        entry.dispatching = false;
        syncPendingActions(entry);
        chip("⚠️", "Could not edit queued message: " + (error.message || error));
        return;
      }
      entry.dispatching = false;
    }

    entry.text = text;
    entry.retryRequired = false;
    entry.retryWithNewId = false;
    entry.mayHaveDispatched = false;
    markSendFailed(entry.bubble, null);
    setQueuedBubbleText(entry, text);
    const label = entry.chip?.querySelector(":scope > span");
    const queueIndex = state.pending.indexOf(entry);
    if (label) {
      label.textContent = entry.nativeQueue
        ? "Queued in Codex — sends automatically when the current turn finishes"
        : state.busy
        ? "Queued — sends when the current turn finishes"
        : queueIndex > 0
          ? "Queued — sends after earlier messages"
          : "Ready to send";
    }
    savePending();
    syncPendingActions(entry);
    closeSheet();
    if (!state.busy) { flushPending(); }
  };
}

function syncPendingActions(entry) {
  entry.chip?.querySelector(".pending-actions")?.remove();

  if (!entry.chip?.isConnected || entry.dispatching) { return; }

  const actions = document.createElement("span");
  actions.className = "pending-actions";

  if (entry.mayHaveDispatched) {
    const check = document.createElement("button");
    check.type = "button";
    check.className = "pending-action edit";
    check.textContent = "Check status";
    check.onclick = async (event) => {
      event.stopPropagation();
      check.disabled = true;
      try { await checkPendingDelivery(entry); } finally { if (check.isConnected) { check.disabled = false; } }
    };
    const dismiss = document.createElement("button");
    dismiss.type = "button";
    dismiss.className = "pending-action cancel";
    dismiss.textContent = "Dismiss";
    dismiss.title = "Stop retrying and remove this local copy; this cannot recall a message that already reached the agent";
    dismiss.onclick = (event) => {
      event.stopPropagation();
      removePendingEntry(entry, { allowUncertain: true });
    };
    actions.append(check, dismiss);
    entry.chip.appendChild(actions);
    return;
  }

  if (canSteerPendingEntry(entry)) {
    const steer = document.createElement("button");
    steer.type = "button";
    steer.className = "pending-action steer";
    steer.textContent = activeProvider() === "grok" ? "Interrupt & send now" : "Steer now";
    steer.title = activeProvider() === "grok"
      ? "Cancel the current Grok turn, wait for confirmation, then send this message"
      : "Move this queued message into the running turn at its next safe boundary";
    steer.onclick = async (event) => {
      event.stopPropagation();
      await steerPendingEntry(entry);
    };
    actions.appendChild(steer);
  }

  const edit = document.createElement("button");
  edit.type = "button";
  edit.className = "pending-action edit";
  edit.textContent = "Edit";
  edit.onclick = (event) => { event.stopPropagation(); openPendingEditSheet(entry); };
  const cancel = document.createElement("button");
  cancel.type = "button";
  cancel.className = "pending-action cancel";
  cancel.textContent = "Cancel";
  cancel.onclick = (event) => { event.stopPropagation(); removePendingEntry(entry); };
  actions.append(edit, cancel);
  entry.chip.appendChild(actions);
}

function canSteerPendingEntry(entry) {
  if (!state.pending.includes(entry) || entry.dispatching || entry.mayHaveDispatched || entry.nativeQueue) { return false; }
  if (!state.active || !state.busy || state.turnOwnership !== "bridge") { return false; }
  return (entry.provider || activeProvider()) === activeProvider()
    && (entry.threadId || state.active.id) === state.active.id;
}

async function steerPendingEntry(entry) {
  if (!canSteerPendingEntry(entry)) {
    chip("⚠️", "The active turn changed. This message is still safely queued.");
    syncPendingActions(entry);
    return false;
  }

  entry.intendedSendMode = "steer";
  entry.awaitingOwnership = false;
  const label = entry.chip?.querySelector(":scope > span");
  if (label) {
    label.textContent = activeProvider() === "grok"
      ? "Stopping Grok safely, then sending this message…"
      : "Steering into the current turn…";
  }
  savePending();
  await trySteer(entry);
  return !state.pending.includes(entry);
}

function restorePending() {
  const tid = state.active?.id;

  if (!tid) { return; }

  const saved = pendingStore()[runKey(state.active.provider, tid)] ?? [];

  for (const raw of saved) {
    const text = typeof raw === "string" ? raw : raw?.text;
    const attachments = Array.isArray(raw?.attachments) ? raw.attachments : [];
    const requestId = raw?.requestId || newRequestId();
    const savedRetryRequired = !!raw?.retryRequired;
    const retryWithNewId = !!raw?.retryWithNewId;
    const retryAsSteer = !!raw?.retryAsSteer;
    const awaitingOwnership = !!raw?.awaitingOwnership;
    const intendedSendMode = raw?.intendedSendMode ?? null;
    const viaCodexQueue = !!raw?.viaCodexQueue;
    const nativeQueue = !!raw?.nativeQueue;
    const nativeQueueId = raw?.nativeQueueId ?? null;
    const mayHaveDispatched = !!raw?.mayHaveDispatched || (savedRetryRequired && retryWithNewId);
    const retryRequired = savedRetryRequired || (mayHaveDispatched && !nativeQueue);

    if (!text && !attachments.length) { continue; }

    // renderHistory replaces the transcript DOM while the in-memory queue
    // intentionally survives. Reattach that existing entry instead of either
    // duplicating it or leaving its bubble/chip detached and invisible.
    const existing = state.pending.find((entry) => entry.requestId === requestId);

    if (existing?.bubble?.isConnected && existing?.chip?.isConnected) { continue; }

    const bubble = addUser(text, { attachments });
    const uncertain = retryRequired && mayHaveDispatched;
    const c = chip(
      retryRequired ? "⚠️" : "⏳",
      uncertain
        ? "Delivery uncertain — check the latest messages, then tap Retry only if needed"
        : retryRequired
          ? "Not sent — tap Retry"
          : nativeQueue
            ? "Queued in Codex — sends automatically when the current turn finishes"
            : "Not sent yet — waiting for the current turn to end",
    );
    c.classList.add("pending");

    if (existing) {
      existing.text = text;
      existing.attachments = attachments;
      existing.bubble = bubble;
      existing.chip = c;
      existing.retryRequired = retryRequired;
      existing.retryWithNewId = retryWithNewId;
      existing.retryAsSteer = retryAsSteer;
      existing.awaitingOwnership = awaitingOwnership;
      existing.intendedSendMode = intendedSendMode;
      existing.viaCodexQueue = viaCodexQueue;
      existing.mayHaveDispatched = mayHaveDispatched;
      existing.nativeQueue = nativeQueue;
      existing.nativeQueueId = nativeQueueId;
      existing.provider = state.active.provider;
      existing.threadId = tid;
    } else {
      state.pending.push({ text, attachments, requestId, chip: c, bubble, retryRequired, retryWithNewId, retryAsSteer, awaitingOwnership, intendedSendMode, viaCodexQueue, mayHaveDispatched, nativeQueue, nativeQueueId, provider: state.active.provider, threadId: tid });
    }

    const entry = existing || state.pending.at(-1);
    syncPendingActions(entry);

    if (retryRequired) {
      markSendFailed(bubble, () => retryPendingEntry(entry), {
        uncertain,
        onDismiss: () => removePendingEntry(entry, { allowUncertain: true }),
      });
    }
  }

  // Migrate legacy string-only entries immediately so retries keep one stable
  // id across reloads and ambiguous HTTP failures.
  savePending();
}

async function reconcileNativeCodexQueue(target = state.active) {
  if (!target || target.provider !== "codex") { return; }
  if (state.nativeQueueReconciling) { return; }
  const candidates = state.pending
    .filter((entry) => entry.nativeQueue || entry.mayHaveDispatched)
    .map((entry) => ({ entry, queueId: entry.nativeQueueId ?? null }));
  if (!candidates.length) { return; }
  state.nativeQueueReconciling = true;

  try {
    const result = await api(`/api/queue?provider=codex&threadId=${encodeURIComponent(target.id)}&limit=100`);
    if (state.active !== target) { return; }
    const queued = result.data ?? [];
    const queuedIds = new Set(queued.map((entry) => entry.id));
    const byClientId = new Map(queued.map((entry) => [entry.clientUserMessageId, entry]));
    let changed = false;

    for (const candidate of candidates) {
      const { entry, queueId } = candidate;
      const providerEntry = byClientId.get(entry.requestId);
      if (providerEntry) {
        entry.nativeQueue = true;
        entry.nativeQueueId = providerEntry.id;
        entry.dispatching = false;
        entry.mayHaveDispatched = false;
        entry.retryRequired = false;
        const providerText = providerEntry.input?.find?.((part) => part.type === "text")?.text;
        if (typeof providerText === "string" && providerText !== entry.text) {
          entry.text = providerText;
          setQueuedBubbleText(entry, providerText);
        }
        const label = entry.chip?.querySelector(":scope > span");
        if (label) { label.textContent = "Queued in Codex — sends automatically when the current turn finishes"; }
        markSendFailed(entry.bubble, null);
        syncPendingActions(entry);
        changed = true;
        continue;
      }

      // Only prune a queue id that existed before this list request. An add may
      // finish while the list is in flight; its new id was not part of this
      // snapshot and must survive until the next reconciliation.
      if (result.nextCursor || !queueId || entry.nativeQueueId !== queueId || !entry.nativeQueue || queuedIds.has(queueId)) { continue; }
      const at = state.pending.indexOf(entry);
      if (at >= 0) { state.pending.splice(at, 1); }
      entry.chip?.remove();
      // The queue entry either became canonical history or was cancelled in
      // another Codex client. In both cases the optimistic copy is no longer a
      // truthful source; remove it and promptly refresh canonical history.
      entry.bubble?.remove();
      scheduleExternalRefresh();
      changed = true;
    }

    if (changed) { savePending(); }
  } catch {
    // Queue reconciliation is advisory. Keep the local durable entry and its
    // edit/cancel controls when Codex cannot currently answer.
  } finally {
    state.nativeQueueReconciling = false;
  }
}

async function retryPendingEntry(entry) {
  entry.retryRequired = false;
  entry.dispatching = false;

  if (entry.nativeQueue) {
    entry.retryWithNewId = false;
    entry.mayHaveDispatched = false;
    markSendFailed(entry.bubble, null);
    savePending();
    return reconcileNativeCodexQueue();
  }

  if (entry.viaCodexQueue) {
    entry.retryWithNewId = false;
    entry.mayHaveDispatched = false;
    markSendFailed(entry.bubble, null);
    savePending();
    return persistExternalCodexQueue(entry);
  }

  if (entry.retryWithNewId) { entry.requestId = newRequestId(); }

  entry.retryWithNewId = false;
  entry.mayHaveDispatched = false;
  markSendFailed(entry.bubble, null);
  savePending();

  if (entry.retryAsSteer && state.busy) {
    return trySteer(entry);
  } else {
    return doSend(entry.text, { attachments: entry.attachments ?? [], bubble: entry.bubble, requestId: entry.requestId, pendingEntry: entry });
  }
}

async function checkPendingDelivery(entry) {
  if (!state.pending.includes(entry)) { return; }

  const label = entry.chip?.querySelector(":scope > span");
  if (label) { label.textContent = "Checking whether the bridge received this message…"; }

  try {
    const query = new URLSearchParams({
      provider: entry.provider || activeProvider(),
      method: entry.retryAsSteer ? "steer" : "send",
      requestId: entry.requestId,
      threadId: entry.threadId || state.active?.id || "",
    });
    const result = await api(`/api/send/status?${query}`);

    if (result.state === "accepted") {
      const at = state.pending.indexOf(entry);
      if (at >= 0) { state.pending.splice(at, 1); }
      entry.chip?.remove();
      markSendFailed(entry.bubble, null);
      savePending();
      scheduleExternalRefresh();
      return;
    }

    // The status request itself is finished. Keep Check status available even
    // while the original provider operation is still in flight.
    entry.dispatching = false;
    entry.mayHaveDispatched = result.state === "uncertain" || result.state === "dispatching";
    entry.retryRequired = result.state !== "dispatching";
    entry.retryWithNewId = result.state === "uncertain";

    if (result.state === "not_found" || result.state === "failed") {
      entry.dispatching = false;
      entry.mayHaveDispatched = false;
      entry.retryRequired = true;
      entry.retryWithNewId = false;
      if (label) { label.textContent = "Not sent — Retry, Edit, or Cancel"; }
      markSendFailed(entry.bubble, () => retryPendingEntry(entry), {
        onDismiss: () => removePendingEntry(entry, { allowUncertain: true }),
      });
    } else if (result.state === "dispatching") {
      if (label) { label.textContent = "The bridge is still delivering this message"; }
      markSendFailed(entry.bubble, null);
    } else {
      if (label) { label.textContent = "Delivery remains uncertain — retry only if it is absent from the thread"; }
      markSendFailed(entry.bubble, () => retryPendingEntry(entry), {
        uncertain: true,
        onDismiss: () => removePendingEntry(entry, { allowUncertain: true }),
      });
    }

    savePending();
    syncPendingActions(entry);
  } catch (error) {
    if (label) { label.textContent = "Could not check yet — the message remains saved locally"; }
    entry.dispatching = false;
    savePending();
    syncPendingActions(entry);
    throw error;
  }
}

function enqueue(text, attachments = []) {
  const bubble = addUser(text, { own: true, attachments });
  const steering = state.sendMode === "steer" && state.turnOwnership === "bridge";
  const nativeExternalCodex = state.turnOwnership === "external" && activeProvider() === "codex";
  const ownershipUnknown = state.turnOwnership === "checking" || state.turnOwnership === "unknown";
  const c = chip("⏳", steering
    ? "Steering — lands at the next tool call…"
    : nativeExternalCodex
      ? "Saving to Codex’s queue…"
      : ownershipUnknown
        ? "Saved locally — waiting for ownership sync"
      : "Queued — sends when the current turn finishes");
  c.classList.add("pending");
  const entry = {
    text,
    attachments,
    requestId: newRequestId(),
    chip: c,
    bubble,
    viaCodexQueue: nativeExternalCodex,
    awaitingOwnership: ownershipUnknown,
    intendedSendMode: state.sendMode,
    provider: activeProvider(),
    threadId: state.active?.id,
  };
  state.pending.push(entry);
  savePending();
  syncPendingActions(entry);

  // Queued messages wait for the turn to end. Steering does not: it goes into
  // the turn that is already running.
  if (steering) { trySteer(entry); }
  else if (nativeExternalCodex) { persistExternalCodexQueue(entry); }
}

async function persistExternalCodexQueue(entry) {
  if (!state.pending.includes(entry) || entry.nativeQueue || entry.dispatching || (entry.provider || activeProvider()) !== "codex") { return; }

  const label = entry.chip?.querySelector(":scope > span");
  entry.viaCodexQueue = true;
  entry.dispatching = true;
  entry.mayHaveDispatched = true;
  syncPendingActions(entry);
  savePending();

  try {
    const result = await api("/api/queue", {
      provider: "codex",
      threadId: entry.threadId || state.active?.id,
      text: entry.text,
      attachmentIds: (entry.attachments ?? []).map((attachment) => attachment.id),
      requestId: entry.requestId,
    });
    entry.nativeQueue = true;
    entry.nativeQueueId = result.queuedSubmission?.id;
    entry.dispatching = false;
    entry.mayHaveDispatched = false;
    entry.retryRequired = false;
    if (!state.pending.includes(entry)) { return; }
    if (label) { label.textContent = "Queued in Codex — sends automatically when the current turn finishes"; }
    savePending();
    syncPendingActions(entry);
  } catch (error) {
    entry.dispatching = false;
    const uncertain = error.code === "delivery_uncertain" || !!error.reach || !error.status || error.status >= 500;
    entry.mayHaveDispatched = uncertain;
    entry.retryRequired = uncertain;
    if (label) {
      label.textContent = uncertain
        ? "Could not confirm Codex queue delivery — check before retrying"
        : "Codex queue rejected this message — tap Retry";
    }
    savePending();
    syncPendingActions(entry);
    markSendFailed(entry.bubble, () => {
      entry.retryRequired = false;
      entry.mayHaveDispatched = false;
      markSendFailed(entry.bubble, null);
      persistExternalCodexQueue(entry);
    }, {
      uncertain,
      onDismiss: () => removePendingEntry(entry, { allowUncertain: true }),
    });
  }
}

// Why steering was not possible, in the user's terms. Each maps to a code the
// provider returns; anything unrecognised just says it will wait.
function steerFallbackReason(code) {
  switch (code) {
    case "steer_unsupported":
      return `${PROVIDER_LABELS[activeProvider()] || "This agent"} can't steer — sending when the turn finishes`;
    case "not_our_turn":
      return "This turn is running elsewhere — sending when it finishes";
    case "not_steerable":
      return "This turn can't be steered — sending when it finishes";
    case "turn_changed":
      return "The running turn changed — sending when the current turn finishes";
    default:
      return "Queued — sends when the current turn finishes";
  }
}

// Native steer: hand the message to the turn that is already running and let the
// agent absorb it at its next tool-call boundary. This is deliberately neither
// of the two things it could be mistaken for — it does not interrupt, and it
// does not wait for the turn to end. If the provider cannot do it, the message
// stays queued and the chip explains why rather than silently doing nothing.
async function trySteer(entry) {
  const t = state.active;

  if (!t) { return; }

  const id = entry.requestId || (entry.requestId = newRequestId());
  entry.dispatching = true;
  entry.mayHaveDispatched = true;
  syncPendingActions(entry);
  savePending();

  try {
    await api("/api/steer", {
      provider: t.provider || "codex",
      threadId: t.id,
      turnId: state.activeTurnId,
      expectedTurnId: state.activeTurnId,
      text: entry.text,
      attachmentIds: (entry.attachments ?? []).map((attachment) => attachment.id),
      requestId: id,
    });
  } catch (e) {
    if (e.code === "steer_unsupported" && activeProvider() === "grok" && !state.externalTurn) {
      await interruptForQueuedMessage(entry);
      return;
    }

    const label = entry.chip?.querySelector("span");

    const uncertain = e.code === "delivery_uncertain" || !!e.reach || !!e.responseInvalid || !e.status;

    if (uncertain) {
      entry.dispatching = false;
      entry.retryRequired = true;
      entry.retryWithNewId = e.code === "delivery_uncertain";
      entry.retryAsSteer = true;
      entry.mayHaveDispatched = true;
      savePending();
      if (label) { label.textContent = "Steer delivery could not be confirmed — check the latest messages, then tap Retry if needed"; }
      markSendFailed(entry.bubble, () => retryPendingEntry(entry), {
        uncertain: true,
        onDismiss: () => removePendingEntry(entry, { allowUncertain: true }),
      });
      syncPendingActions(entry);
      return;
    }

    entry.dispatching = false;
    entry.mayHaveDispatched = false;
    savePending();
    syncPendingActions(entry);
    if (label) { label.textContent = steerFallbackReason(e.code); }

    if (activeProvider() === "codex" && e.code === "not_our_turn") {
      try {
        let runtimeResult = await api(`/api/thread/runtime?provider=codex&threadId=${encodeURIComponent(t.id)}`);
        let runtime = runtimeResult.runtime;

        // A completed turn's trailing start marker can briefly outlive its
        // writer. Settle once before deciding that another Codex process owns
        // the thread and parking this message in its native queue.
        if (runtime?.running && runtime.source !== "bridge") {
          await new Promise((resolve) => setTimeout(resolve, 750));
          runtimeResult = await api(`/api/thread/runtime?provider=codex&threadId=${encodeURIComponent(t.id)}`);
          runtime = runtimeResult.runtime;
        }

        if (runtime?.running && runtime.source !== "bridge") {
          setBusy(true, { external: true });
          entry.viaCodexQueue = true;

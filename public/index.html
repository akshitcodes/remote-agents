          savePending();
          await persistExternalCodexQueue(entry);
        } else if (runtime?.running) {
          state.activeTurnId = runtime.turnId ?? null;
          setBusy(true);
        } else {
          state.activeTurnId = null;
          setBusy(false);
          flushPending();
        }
      } catch (runtimeError) {
        entry.retryRequired = true;
        savePending();
        if (label) { label.textContent = "Could not confirm who owns the turn — message remains unsent"; }
        markSendFailed(entry.bubble, () => retryPendingEntry(entry), {
          onDismiss: () => removePendingEntry(entry, { allowUncertain: true }),
        });
      }
    }

    return; // still pending: flushPending sends it when the turn ends
  }

  // It is part of the running turn now, so it must not also be sent later.
  const at = state.pending.indexOf(entry);

  if (at >= 0) { state.pending.splice(at, 1); savePending(); }

  entry.chip?.remove();
}

// Grok's ACP protocol cannot inject guidance into a live prompt. In Steer mode,
// the explicit user-selected fallback is cancel-then-send: cancellation must be
// confirmed by the provider before the durable queue is allowed to flush.
async function interruptForQueuedMessage(entry) {
  const label = entry.chip?.querySelector("span");

  if (label) { label.textContent = "Stopping Grok safely, then sending this message…"; }

  try {
    await api("/api/interrupt", { provider: "grok", threadId: state.active.id, turnId: state.activeTurnId, requireActive: true });
  } catch (error) {
    entry.dispatching = false;
    entry.mayHaveDispatched = false;
    savePending();
    syncPendingActions(entry);
    if (label) { label.textContent = "Could not confirm Grok stopped — message remains queued"; }
    return;
  }

  // The provider resolves interrupt only after the active prompt reaches its
  // terminal state. Clear local busy state and dispatch exactly once.
  setBusy(false);
  flushPending();
}

// Send the next queued message once the turn has ended.
function flushPending() {
  if (state.busy || !state.pending.length || !state.active) { return; }

  // Provider-native entries are already durable and are consumed by Codex.
  // They must never be replayed through the bridge's ordinary send path, and
  // later local entries must not jump ahead of them during the brief idle edge
  // between the external turn and Codex starting its queue head.
  const nativeEntry = state.pending.find((entry) => entry.nativeQueue);

  if (nativeEntry) {
    const label = nativeEntry.chip?.querySelector(":scope > span");
    if (label) { label.textContent = "Waiting for Codex to consume the queued message"; }
    return;
  }
  const next = state.pending[0];

  // A known provider failure needs a deliberate tap. Reconnect/run-state
  // events must not turn it into an unbounded automatic retry loop.
  if (next.retryRequired) { return; }

  const label = next.chip?.querySelector("span");
  const readiness = dispatchReadiness();
  if (!readiness.ready) {
    if (label) { label.textContent = `Waiting for verified settings — ${readiness.reason}`; }
    return;
  }

  if (label) { label.textContent = "Sending queued message…"; }
  next.dispatching = true;
  syncPendingActions(next);

  doSend(next.text, {
    attachments: next.attachments ?? [],
    bubble: next.bubble ?? addUser(next.text, { attachments: next.attachments ?? [] }),
    requestId: next.requestId,
    pendingEntry: next,
  });
}

// The actual API call for one message. The user bubble is already rendered.
//
// requestId is generated once and reused by every retry of this same message, so
// the ambiguous case — it arrived but the reply was lost on a flaky connection —
// resolves to the original outcome instead of sending the message twice.
// A failed send lives only in the DOM, and every re-render rebuilds the
// transcript from the session file — which by definition does not contain a
// message that never landed. Without this, the bubble and its Retry button are
// destroyed moments after they appear and the typed text is lost.
const FAILED_SENDS_KEY = "cxp_failed_sends";

function saveFailedSends() {
  try { localStorage.setItem(FAILED_SENDS_KEY, JSON.stringify(state.failedSends.slice(-200))); } catch {}
}

function loadFailedSends() {
  try {
    const rows = JSON.parse(localStorage.getItem(FAILED_SENDS_KEY));
    return Array.isArray(rows) ? rows : [];
  } catch { return []; }
}

function recordFailedSend(threadId, text, requestId, provider = activeProvider(), attachments = [], retryWithNewId = false) {
  dropFailedSend(requestId);
  state.failedSends.push({ provider, threadId, text, requestId, attachments, retryWithNewId });
  saveFailedSends();
}

function dropFailedSend(requestId) {
  state.failedSends = state.failedSends.filter((f) => f.requestId !== requestId);
  saveFailedSends();
}

function restoreFailedSends() {
  const tid = state.active?.id;

  if (!tid) { return; }

  for (const f of state.failedSends) {
    if (f.threadId !== tid || (f.provider || "codex") !== activeProvider()) { continue; }

    const attachments = Array.isArray(f.attachments) ? f.attachments : [];
    const bubble = addUser(f.text, { attachments });
    markSendFailed(bubble, () => {
      const requestId = f.retryWithNewId ? newRequestId() : f.requestId;

      if (f.retryWithNewId) { dropFailedSend(f.requestId); }

      doSend(f.text, { attachments, bubble, requestId });
    }, {
      uncertain: !!f.retryWithNewId,
      onDismiss: () => {
        dropFailedSend(f.requestId);
        bubble.remove();
      },
    });
  }
}

function startSendProgress(requestId, threadId, text, bubble) {
  state.sendStage?.chip?.remove();
  state.sendStage = {
    requestId,
    threadId,
    text,
    bubble,
    chip: chip("⏳", "Sending to the bridge…"),
  };
}

function updateSendProgress(frame) {
  const progress = state.sendStage;

  if (!progress || frame.requestId !== progress.requestId || frame.threadId !== progress.threadId) { return; }

  const label = progress.chip?.querySelector("span");

  if (!label) { return; }

  switch (frame.stage) {
    case "accepted":
      label.textContent = "Message reached the bridge";
      break;
    case "resuming":
      label.textContent = frame.rolloutBytes >= 50 * 1024 * 1024
        ? `Loading a large session (${fmtBytes(frame.rolloutBytes)}) into Codex…`
        : "Loading the session into Codex…";
      break;
    case "resumed":
      label.textContent = frame.cold ? "Session loaded into Codex" : "Session was already loaded in Codex";
      break;
    case "starting_turn":
      label.textContent = "Session ready — starting the turn…";
      break;
    case "turn_started":
      label.textContent = "Turn started — waiting for the first update…";
      break;
  }
}

function finishSendProgress() {
  state.sendStage?.chip?.remove();
  state.sendStage = null;
}

function failSendProgress(error) {
  const progress = state.sendStage;

  if (!progress) { return; }

  const label = progress.chip?.querySelector("span");
  const conflict = error?.code === "thread_locked_elsewhere";
  const uncertain = error?.code === "delivery_uncertain";

  if (label) {
    label.textContent = conflict
      ? "This thread is open on your Mac; close it there to continue"
      : uncertain
        ? "Delivery is uncertain after a bridge restart — check the latest messages before retrying"
        : "Message did not reach the agent: " + (error?.message || "unknown error");
  }

  state.sendStage = null;
}

async function doSend(text, { attachments = [], bubble, requestId, pendingEntry } = {}) {
  const m = currentMode();
  const target = state.active;
  const readiness = dispatchReadiness();
  if (!target || !readiness.ready) {
    if (pendingEntry) {
      pendingEntry.dispatching = false;
      pendingEntry.mayHaveDispatched = false;
      pendingEntry.retryRequired = false;
      savePending();
      syncPendingActions(pendingEntry);
      const label = pendingEntry.chip?.querySelector("span");
      if (label) { label.textContent = `Waiting for verified settings — ${readiness.reason}`; }
    }
    markSendFailed(bubble, null);
    chip("⚠️", `${readiness.reason}. Nothing was sent.`);
    syncControls();
    return;
  }
  const dispatch = {
    provider: target.provider || "codex",
    threadId: target.id,
    model: state.model,
    effort: state.effort,
    mode: m.key,
    approvalPolicy: m.approvalPolicy,
    sandbox: m.sandbox,
  };
  const id = requestId || newRequestId();
  const threadId = target.id;
  startSendProgress(id, threadId, text, bubble);
  if (pendingEntry) {
    pendingEntry.dispatching = true;
    // Persist this before the request can leave the page. A reload during a
    // slow resume must never resurrect Edit/Cancel for an in-flight message.
    pendingEntry.mayHaveDispatched = true;
    syncPendingActions(pendingEntry);
    savePending();
  }
  setBusy(true);
  markSendFailed(bubble, null);
  let messageAttempted = false;

  try {
    if (m.unknown) {
      throw Object.assign(new Error("choose a permission preset before sending from this thread"), { code: "unknown_permission_mode" });
    }

    // A settings write is part of dispatch: never let a turn leave with a value
    // that can disappear on another browser or after a bridge restart.
    const settingsPayload = {
      provider: dispatch.provider,
      threadId: dispatch.threadId,
      model: dispatch.model,
      effort: dispatch.effort,
      pending: true,
    };
    if (!m.providerExact) { settingsPayload.mode = dispatch.mode; }
    const settingsJob = state.settingsSave.catch(() => {}).then(() => api("/api/thread/settings", settingsPayload));
    state.settingsSave = settingsJob;
    await settingsJob;
    messageAttempted = true;
    const accepted = await api("/api/message", {
      provider: dispatch.provider,
      threadId: dispatch.threadId, text,
      attachmentIds: attachments.map((attachment) => attachment.id),
      model: dispatch.model, effort: dispatch.effort,
      mode: dispatch.mode, cwd: target.cwd, draft: target.draft,
      approvalPolicy: dispatch.approvalPolicy, sandbox: dispatch.sandbox,
      requestId: id,
    });
    if (accepted?.dispatch?.accepted && state.active === target) {
      const stillShowingDispatch = state.model === dispatch.model
        && state.effort === dispatch.effort
        && currentMode().key === dispatch.mode;
      if (stillShowingDispatch) {
        state.settingsTruth = {
          state: "accepted",
          sources: { model: "provider_accept", effort: "provider_accept", mode: "provider_accept" },
          message: "Requested settings accepted by provider",
        };
      } else {
        // The user changed the controls while the request was in flight. Keep
        // those newer values as a pending next-turn override after the server
        // marks the dispatched snapshot accepted.
        state.settingsTruth = { state: "override", sources: {}, message: "Current turn accepted · next override saved" };
        saveThreadSettings().catch((error) => chip("⚠️", "Could not save next-turn settings: " + error.message));
      }
      syncControls();
    }
    finishSendProgress();
    dropFailedSend(id);
    if (pendingEntry) {
      const at = state.pending.indexOf(pendingEntry);

      if (at >= 0) { state.pending.splice(at, 1); savePending(); }

      pendingEntry.chip?.remove();
    }
  } catch (e) {
    setBusy(false);
    failSendProgress(e);

    if (["model_unavailable", "effort_unavailable", "permission_mode_unavailable", "model_not_available", "effort_not_supported", "permission_mode_mismatch", "model_verification_failed", "provider_cli_incompatible", "provider_settings_unconfirmed"].includes(e.code)) {
      if (state.active === target) {
        state.settingsTruth = { state: "error", sources: {}, message: "Settings changed · refreshing…" };
        syncControls();
        // Refresh the controls from provider truth, but leave the failed message
        // visible for an explicit Retry/Cancel decision. Recovery must never
        // silently turn a rejected send into a later delivery.
        await loadThreadSettings(target, { flush: false });
      }
    }

    const retryId = e.code === "delivery_uncertain" ? null : id;
    const retry = () => {
      if (pendingEntry) {
        pendingEntry.retryRequired = false;
        pendingEntry.mayHaveDispatched = false;
        savePending();
      }

      let nextId = retryId;

      if (pendingEntry && !retryId) {
        pendingEntry.requestId = newRequestId();
        savePending();
        nextId = pendingEntry.requestId;
      } else if (!pendingEntry && !retryId) {
        dropFailedSend(id);
        nextId = newRequestId();
      }

      doSend(text, { attachments, bubble, requestId: nextId, pendingEntry });
    };

    if ((e.code === "thread_locked_elsewhere" || e.code === "turn_in_progress") && !pendingEntry) {
      const elsewhere = e.code === "thread_locked_elsewhere";
      const c = chip("⏳", elsewhere ? "Open elsewhere — queued until the thread is available" : "Another send won the race — queued behind the current turn");
      c.classList.add("pending");
      const queued = { text, attachments, requestId: id, bubble, chip: c, retryRequired: elsewhere };
      dropFailedSend(id);
      state.pending.push(queued);
      savePending();
      syncPendingActions(queued);
      if (elsewhere) {
        markSendFailed(bubble, () => doSend(text, { attachments, bubble, requestId: id, pendingEntry: queued }), {
          onDismiss: () => removePendingEntry(queued),
        });
        setLockStatus({ state: "elsewhere", label: "Open elsewhere" });
      } else {
        markSendFailed(bubble, null);
        setBusy(true, { external: true });
      }
    } else if (pendingEntry) {
      const label = pendingEntry.chip?.querySelector("span");

      if (e.code === "turn_in_progress") {
        pendingEntry.dispatching = false;
        pendingEntry.mayHaveDispatched = false;
        savePending();
        syncPendingActions(pendingEntry);
        if (label) { label.textContent = "Still working — queued behind the current turn"; }
        markSendFailed(bubble, null);
        setBusy(true, { external: true });
      } else {
        pendingEntry.dispatching = false;
        pendingEntry.retryRequired = true;
        pendingEntry.retryWithNewId = messageAttempted && e.code === "delivery_uncertain";
        pendingEntry.mayHaveDispatched = messageAttempted && (e.code === "delivery_uncertain" || !!e.reach || !!e.responseInvalid || !e.status);
        savePending();
        if (label) { label.textContent = pendingEntry.mayHaveDispatched ? "Delivery could not be confirmed — check the thread, then retry if needed" : "Not sent — tap Retry"; }
        markSendFailed(bubble, retry, {
          uncertain: pendingEntry.mayHaveDispatched,
          onDismiss: () => removePendingEntry(pendingEntry, { allowUncertain: true }),
        });
        syncPendingActions(pendingEntry);
      }
    } else if (e.code !== "thread_locked_elsewhere") {
      const uncertain = messageAttempted && (e.code === "delivery_uncertain" || !!e.reach || !!e.responseInvalid || !e.status);
      recordFailedSend(threadId, text, id, activeProvider(), attachments, uncertain);
      markSendFailed(bubble, retry, {
        uncertain,
        onDismiss: () => {
          dropFailedSend(id);
          bubble.remove();
        },
      });
    }

    if (!bubble) { chip("⚠️", "send failed: " + e.message); }

  }
}

function newRequestId() {
  return crypto.randomUUID?.() ?? (String(Date.now()) + Math.random().toString(16).slice(2));
}

// Mark the message that failed, rather than dropping a warning further down the
// transcript — the thing that didn't send is the thing you tap to retry.
function markSendFailed(bubble, onRetry, { uncertain = false, onDismiss = null } = {}) {
  if (!bubble) { return; }

  bubble.querySelector(".failed-actions")?.remove();
  bubble.querySelector(".retry")?.remove(); // remove controls from pre-0.4.4 DOM
  bubble.classList.toggle("failed", !!onRetry);

  if (!onRetry) { return; }

  const btn = document.createElement("button");
  btn.className = "retry";
  btn.title = uncertain ? "Delivery uncertain — check the latest messages before retrying" : "Not sent — tap to retry";
  btn.textContent = uncertain ? "⚠ Check, then retry" : "⟳ Retry";
  const originalText = btn.textContent;
  btn.onclick = async () => {
    btn.disabled = true;
    btn.textContent = "⟳ Sending…";
    try {
      await onRetry();
    } finally {
      // A successful/reclassified attempt removes or replaces this control. If
      // it did neither, do not strand a permanently disabled Retry button.
      if (btn.isConnected && btn.disabled) {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    }
  };
  const actions = document.createElement("div");
  actions.className = "failed-actions";
  actions.appendChild(btn);
  if (onDismiss) {
    const dismiss = document.createElement("button");
    dismiss.type = "button";
    dismiss.className = "dismiss-failed";
    dismiss.textContent = uncertain ? "Dismiss" : "Cancel";
    dismiss.title = uncertain
      ? "Remove this recovery copy; this cannot recall a message that may already have reached the agent"
      : "Cancel this unsent message";
    dismiss.onclick = async () => {
      dismiss.disabled = true;
      try {
        await onDismiss();
      } finally {
        if (dismiss.isConnected) { dismiss.disabled = false; }
      }
    };
    actions.appendChild(dismiss);
  }
  bubble.appendChild(actions);
  scrollDown();
}

function setBusy(busy, { external = false, ownershipChecking = false, ownershipUnknown = false } = {}) {
  // A turn we streamed ourselves was rendered optimistically from live events.
  // The session file is the canonical record of it, and the watcher's trailing
  // read lands *after* the turn ends — at which point the guard that suppressed
  // file ops mid-turn no longer applies, so that content gets drawn a second
  // time. Reconcile against the file once the turn is over instead.
  const ownTurnEnding = state.busy && !state.externalTurn && !busy;

  if (!busy) {
    settleReasoning();
    settleActivityGroup();
    // Nothing is in flight, so nothing should be blinking — this also catches a
    // bubble orphaned by a turn that ended before it was drawn.
    clearCarets();
  }

  const previousOwnership = state.turnOwnership;
  state.busy = busy;
  state.turnOwnership = !busy
    ? "idle"
    : (ownershipChecking ? "checking" : (ownershipUnknown ? "unknown" : (external ? "external" : "bridge")));

  // A turn driven elsewhere (a terminal, an IDE, another device) reaches us by
  // re-reading the session file, not by streaming — so resync must stay allowed
  // for it, unlike a turn we are streaming ourselves.
  state.externalTurn = busy && external;

  // A message accepted while ownership was unknown stayed local. Route it only
  // after a canonical refresh proves which control primitive is safe.
  if (busy && ["checking", "unknown"].includes(previousOwnership) && ["bridge", "external"].includes(state.turnOwnership)) {
    for (const entry of state.pending.filter((candidate) => candidate.awaitingOwnership)) {
      entry.awaitingOwnership = false;

      if (state.turnOwnership === "external" && activeProvider() === "codex") {
        entry.viaCodexQueue = true;
        queueMicrotask(() => persistExternalCodexQueue(entry));
      } else if (state.turnOwnership === "bridge" && entry.intendedSendMode === "steer") {
        queueMicrotask(() => trySteer(entry));
      } else {
        const label = entry.chip?.querySelector(":scope > span");
        if (label) { label.textContent = "Queued — sends when the current turn finishes"; }
      }
    }

    savePending();
  }

  if (state.externalTurn && activeProvider() === "codex") {
    refreshActivityGroup(state.activityGroup, { live: true });
  }
  // Queue actions depend on live ownership. Refresh them whenever that state
  // changes so a safe Steer action appears without requiring a page reload,
  // and disappears immediately if the turn moves elsewhere or finishes.
  for (const entry of state.pending) { syncPendingActions(entry); }
  // Only offer Stop for a turn this bridge owns. An externally observed turn
  // has no safe interrupt handle; showing Stop there would imply control we do
  // not have and used to discard the user's queue before the interrupt failed.
  $("stopBtn").style.display = busy && !external ? "flex" : "none";
  setLivePill(state.externalTurn);
  syncControls();

  if (ownTurnEnding) { scheduleExternalRefresh(); }
}

function setLivePill(on, text, { stalled } = {}) {
  document.body.classList.toggle("livesync", !!on);

  if (text) { $("livePillText").textContent = text; }
  if (stalled !== undefined) { $("livePill").classList.toggle("stalled", !!on && stalled); }
  else if (!on) { $("livePill").classList.remove("stalled"); }
}

// Low-level interrupt (used by both Stop and Steer).
async function interruptApi() {
  if (!state.active) { return; }

  try {
    await api("/api/interrupt", { provider: state.active.provider || "codex", threadId: state.active.id, turnId: state.activeTurnId, requireActive: true });
    return true;
  } catch (error) {
    chip("⚠️", "Stop failed: " + (error.message || error));
    return false;
  }
}

// Stop button: a hard stop — drop anything queued, then interrupt.
async function stopAgent() {
  if (state.externalTurn) {
    chip("ℹ️", "This turn is running elsewhere and cannot be stopped from here");
    return;
  }

  $("stopBtn").disabled = true;
  const stopped = await interruptApi();
  $("stopBtn").disabled = false;

  if (!stopped) { return; }

  const remaining = [];

  for (const p of [...state.pending]) {
    if (p.nativeQueue && p.nativeQueueId) {
      const removed = await removePendingEntry(p, { flush: false });
      if (!removed) { remaining.push(p); }
      continue;
    }

    p.chip?.remove();
    p.bubble?.remove();
  }

  state.pending = remaining;
  savePending();
}

// ---------- approvals ----------
function showApproval(a) {
  state.approvalId = a.requestId;
  const p = a.params ?? {};
  const isFile = a.method.includes("fileChange") || a.method.includes("Patch");
  const cmd = p.command || p.call?.command || (p.changes ? p.changes.map((c) => c.path).join("\n") : null) || JSON.stringify(p).slice(0, 500);
  const who = PROVIDER_LABELS[activeProvider()] || "The agent";
  $("apprTitle").textContent = isFile ? `${who} wants to edit files` : `${who} wants to run a command`;
  $("apprBody").textContent = Array.isArray(cmd) ? cmd.join(" ") : cmd;
  $("approval").style.display = "block";
  scrollDown();
}

async function refreshApprovals() {
  const t = state.active;

  if (!t) { return; }

  try {
    const res = await api("/api/approvals?provider=" + encodeURIComponent(activeProvider()));
    const pending = (res.data ?? []).find((a) => a.params?.threadId === t.id || a.params?.threadId === t.draftId);

    if (pending && state.active === t) { showApproval(pending); }
  } catch {}
}

async function answerApproval(decision) {
  if (!state.approvalId) { return; }

  const id = state.approvalId;
  state.approvalId = null;
  $("approval").style.display = "none";

  try { await api("/api/approval", { requestId: id, decision, provider: activeProvider() }); } catch (e) { chip("⚠️", "approval failed: " + e.message); }
}

// ---------- sheets ----------
function openSheet(html) {
  state.sheetReturnFocus = document.activeElement;
  $("sheet").removeAttribute("inert");
  $("app").setAttribute("inert", "");
  $("sheet").classList.remove("new-session-host");
  $("sheetBody").dataset.sheetKind = "";
  $("sheetBody").innerHTML = html;
  const heading = $("sheetBody").querySelector("h2");
  if (heading) { heading.id = "sheetTitle"; }
  $("overlay").classList.add("show");
  $("sheet").classList.add("show");
  $("sheet").setAttribute("aria-hidden", "false");
  requestAnimationFrame(() => $("sheetBody").querySelector("button, input, textarea, select, [tabindex]")?.focus());
}

function closeSheet() {
  // An HTML preview can contain CSS/SVG animation even though script and the
  // network are blocked. Tear it down instead of letting hidden work continue.
  for (const frame of $("sheetBody").querySelectorAll("iframe.html-preview")) {
    frame.srcdoc = "";
    frame.removeAttribute("src");
  }
  for (const card of $("sheetBody").querySelectorAll(".mermaid-card")) {
    mermaidObserver?.unobserve(card);
    observedMermaidCards.delete(card);
  }
  $("overlay").classList.remove("show");
  $("sheet").classList.remove("show");
  $("sheet").setAttribute("aria-hidden", "true");
  $("sheet").setAttribute("inert", "");
  $("app").removeAttribute("inert");
  state.sheetReturnFocus?.focus?.();
  state.sheetReturnFocus = null;
}
$("overlay").onclick = closeSheet;

function openDiffSheet(diff) {
  openSheet(`<h2>Changes</h2><div class="hint">Unified diff</div><div class="block open" style="margin-top:6px"><div class="body"><pre></pre></div></div>`);
  renderDiffInto($("sheetBody").querySelector("pre"), diff);
}

const MD_FILE_RE = /\.(md|markdown|mdx)$/i;
const HTML_FILE_RE = /\.html?$/i;
const MAX_HTML_PREVIEW_CHARS = 750_000;

function isolatedHtmlPreviewDocument(source) {
  if (!window.DOMPurify) {
    return `<!doctype html><pre>${esc(source)}</pre>`;
  }

  const sanitized = window.DOMPurify.sanitize(source, {
    WHOLE_DOCUMENT: true,
    FORBID_TAGS: ["script", "base", "iframe", "object", "embed"],
    FORBID_ATTR: ["srcdoc"],
  });
  const doc = new DOMParser().parseFromString(sanitized, "text/html");
  // Sandbox blocks script/forms/popups, while these removals also prevent a
  // document from navigating its own frame through markup alone.
  for (const meta of doc.querySelectorAll("meta[http-equiv]")) {
    if (meta.getAttribute("http-equiv")?.toLowerCase() === "refresh") { meta.remove(); }
  }
  for (const link of doc.querySelectorAll("a[href], area[href]")) { link.removeAttribute("href"); }
  for (const form of doc.querySelectorAll("form")) { form.removeAttribute("action"); }

  const policy = doc.createElement("meta");
  policy.httpEquiv = "Content-Security-Policy";
  policy.content = "default-src 'none'; img-src data: blob:; style-src 'unsafe-inline'; font-src data:";
  doc.head.prepend(policy);
  return "<!doctype html>" + doc.documentElement.outerHTML;
}

// A link the agent wrote may point at a local file rather than a URL — e.g.
// [notes](/Users/me/proj/notes.md) or [grok.mjs](providers/grok.mjs:812). The
// browser resolves those against our own origin and 404s, so they open in the
// built-in viewer instead. Returns { path, line } or null for real URLs/anchors.
function localFileTarget(raw) {
  if (!raw) { return null; }

  let s = String(raw).trim();

  if (!s || s.startsWith("#") || s.startsWith("//")) { return null; }

  // A real URL scheme is followed by "//" (http://, file://) or is one of the
  // schemeless-authority ones. Without that test, "foo.js:812" would read as a
  // scheme named "foo.js" instead of a file with a line reference.
  const scheme = s.match(/^([a-z][a-z0-9+.-]*):(\/\/)?/i);

  if (scheme && (scheme[2] || /^(mailto|tel|sms|callto|data|javascript|cid|xmpp|about)$/i.test(scheme[1]))) {
    if (scheme[1].toLowerCase() !== "file") { return null; }

    s = s.replace(/^file:\/\/(?:localhost)?/i, "");

    if (!s.startsWith("/")) { return null; }
  }

  // Trailing line references: foo.js:812, foo.js:812:5, foo.js#L812.
  let line = null;
  const at = s.match(/(?::(\d+)(?::\d+)?|#L(\d+))$/i);

  if (at) {
    line = Number(at[1] ?? at[2]);
    s = s.slice(0, at.index);
  }

  s = s.replace(/^\.\//, "");

  if (!s) { return null; }

  try {
    s = decodeURIComponent(s);
  } catch {
    // keep the raw form when percent-decoding fails
  }

  return { path: s, line };
}

// View a file the agent created/edited — rendered markdown or syntax-highlighted
// code, with an optional Diff tab. Content is fetched sandboxed to the thread cwd.
async function openFileSheet(path, diff, line) {
  const name = path.split("/").pop();
  const tabs = diff
    ? `<div class="file-tabs"><button data-tab="file" class="on">File</button><button data-tab="diff">Diff</button></div>`
    : "";
  openSheet(`<h2>${esc(name)}</h2><div class="hint">${esc(path)}${line ? ":" + line : ""}</div>${tabs}<div id="fileBody"><div class="empty">Loading…</div></div>`);

  function bodyEl() { return $("sheetBody").querySelector("#fileBody"); }

  function showDiff() {
    bodyEl().innerHTML = `<div class="block open"><div class="body"><pre></pre></div></div>`;
    renderDiffInto(bodyEl().querySelector("pre"), diff || "No diff available");
  }

  let fileData = null;

  // Cache-first, like threads: paint the saved copy instantly (works offline),
  // then refresh from the network and keep the fresh copy for next time.
  async function showFile() {
    if (fileData) {
      renderFileInto(bodyEl(), name, fileData);
      return;
    }

    const cwd = state.active?.cwd;
    const cached = await idbGet(fileCacheKey(cwd, path));

    if (cached) {
      renderFileInto(bodyEl(), name, cached);
    }

    try {
      const fresh = await api("/api/file?cwd=" + encodeURIComponent(cwd || "") + "&path=" + encodeURIComponent(path));
      fileData = fresh;
      renderFileInto(bodyEl(), name, fresh);
      cacheFile(cwd, path, fresh);
    } catch (e) {
      if (cached) {
        fileData = cached;
        renderFileInto(bodyEl(), name, cached, cached.cachedAt);
        return;
      }

      bodyEl().innerHTML = `<div class="hint">Couldn't open file: ${esc(e.message)}${diff ? " — try the Diff tab." : ""}</div>`;
    }
  }

  if (diff) {
    $("sheetBody").querySelectorAll("[data-tab]").forEach((b) => {
      b.onclick = () => {
        $("sheetBody").querySelectorAll("[data-tab]").forEach((x) => x.classList.toggle("on", x === b));

        if (b.dataset.tab === "diff") { showDiff(); } else { showFile(); }
      };
    });
  }

  showFile();
}

// Docs vs everything else, for the Files sheet filter.
const DOC_FILE_RE = /\.(md|markdown|mdx|html?|txt|rst|adoc)$/i;

async function openFilesSheet() {
  const cwd = state.active?.cwd;
  const files = [...state.threadFiles.values()].sort((a, b) => a.path.localeCompare(b.path));

  openSheet(`<h2>Files</h2>
    <div class="hint">Edited or linked in this session. Saved files open offline.</div>
    <div class="file-tabs" id="fileFilter">
      <button data-f="all" class="on">All</button>
      <button data-f="docs">Docs</button>
      <button data-f="code">Code</button>
    </div>
    <div id="filesList"></div>
    <button class="primary-btn" id="saveFilesBtn" disabled>Select files to save</button>`);

  const cachedPaths = new Set();
  await Promise.all(files.map(async (f) => {
    if (await idbGet(fileCacheKey(cwd, f.path))) { cachedPaths.add(f.path); }
  }));

  const selected = new Set();
  let filter = "all";

  function visible() {
    return files.filter((f) => {
      if (filter === "docs") { return DOC_FILE_RE.test(f.path); }
      if (filter === "code") { return !DOC_FILE_RE.test(f.path); }

      return true;
    });
  }

  function syncSaveBtn() {
    const btn = $("saveFilesBtn");

    if (!btn) { return; }

    btn.disabled = selected.size === 0;
    btn.textContent = selected.size ? `Save ${selected.size} for offline` : "Select files to save";
  }

  function renderList() {
    const list = $("filesList");
    const rows = visible();

    if (!rows.length) {
      list.innerHTML = `<div class="hint">No ${filter === "all" ? "" : filter + " "}files in this session.</div>`;
      return;
    }

    list.innerHTML = rows.map((f) => {
      const name = f.path.split("/").pop();
      const dir = f.path.split("/").slice(0, -1).join("/");
      const badges = (cachedPaths.has(f.path) ? `<span class="fbadge">Saved</span>` : "")
        + (f.edited ? `<span class="fbadge edit">Edited</span>` : "");

      return `<div class="filerow${selected.has(f.path) ? " sel" : ""}" data-path="${esc(f.path)}">
        <div class="cb" data-role="cb"></div>
        <div class="fmeta" data-role="open">
          <div class="fname">${esc(name)}</div>
          <div class="fdir">${esc(dir || ".")}</div>
        </div>${badges}</div>`;
    }).join("");

    list.querySelectorAll(".filerow").forEach((row) => {
      const path = row.dataset.path;

      row.querySelector('[data-role="cb"]').onclick = (e) => {
        e.stopPropagation();

        if (selected.has(path)) { selected.delete(path); } else { selected.add(path); }

        row.classList.toggle("sel", selected.has(path));
        syncSaveBtn();
      };

      row.querySelector('[data-role="open"]').onclick = () => openFileSheet(path, "");
    });
  }

  $("sheetBody").querySelectorAll("#fileFilter button").forEach((b) => {
    b.onclick = () => {
      filter = b.dataset.f;
      $("sheetBody").querySelectorAll("#fileFilter button").forEach((x) => x.classList.toggle("on", x === b));
      renderList();
    };
  });

  $("saveFilesBtn").onclick = async () => {
    const btn = $("saveFilesBtn");
    const targets = [...selected];
    let done = 0;
    let failed = 0;
    btn.disabled = true;

    for (const p of targets) {
      btn.textContent = `Saving ${done + 1}/${targets.length}…`;

      try {
        const data = await api("/api/file?cwd=" + encodeURIComponent(cwd || "") + "&path=" + encodeURIComponent(p));
        await cacheFile(cwd, p, data);
        cachedPaths.add(p);
        done++;
      } catch {
        failed++;
      }
    }

    selected.clear();
    renderList();
    btn.textContent = failed ? `Saved ${done}, ${failed} failed` : `Saved ${done} for offline`;
    setTimeout(syncSaveBtn, 2200);
  };

  renderList();
  syncSaveBtn();
}

function renderFileInto(el, name, d, staleAt) {
  if (d.binary) {
    el.innerHTML = `<div class="hint">Binary file (${fmtBytes(d.size)}) — not viewable.</div>`;
    return;
  }

  let note = d.truncated ? `<div class="hint">Showing the first 2 MB of ${fmtBytes(d.size)}.</div>` : "";

  if (staleAt) { note = `<div class="hint">Offline copy · saved ${relTime(Math.floor(staleAt / 1000))}</div>` + note; }

  if (MD_FILE_RE.test(name)) {
    el.innerHTML = note + `<div class="md filebody">${renderMarkdown(d.content)}</div>`;
    const markdown = el.querySelector(".md.filebody");
    decorateCodeBlocks(markdown);
    scheduleMermaidBlocks(markdown);
    return;
  }

  if (HTML_FILE_RE.test(name)) {
    const previewable = d.content.length <= MAX_HTML_PREVIEW_CHARS;
    el.innerHTML = note + `<div class="file-tabs" data-html-tabs>
      <button type="button" data-view="preview"${previewable ? ' class="on"' : ""}${previewable ? "" : " disabled"}>Preview</button>
      <button type="button" data-view="source"${previewable ? "" : ' class="on"'}>Source</button>
    </div>
    <div class="html-preview-note">Isolated preview · scripts, forms, and network requests are disabled.</div>
    <iframe class="html-preview" title="HTML preview" sandbox=""${previewable ? "" : " hidden"}></iframe>
    <pre class="filecode html-source"${previewable ? " hidden" : ""}><code></code></pre>`;
    const frame = el.querySelector(".html-preview");
    const source = el.querySelector(".html-source");
    const code = source.querySelector("code");
    code.textContent = d.content;
    code.className = "language-html";
    if (window.hljs && d.content.length <= MAX_CODE_HIGHLIGHT_CHARS) {
      try { hljs.highlightElement(code); } catch { /* leave as plain HTML */ }
    }
    if (previewable) {
      // The iframe gets a unique opaque origin (no allow-same-origin) and its
      // own deny-by-default CSP. Raw project HTML never enters the app DOM.
      frame.srcdoc = isolatedHtmlPreviewDocument(d.content);
    }
    el.querySelectorAll("[data-html-tabs] button").forEach((button) => {
      button.onclick = () => {
        if (button.disabled) { return; }
        const showPreview = button.dataset.view === "preview";
        frame.hidden = !showPreview;
        source.hidden = showPreview;
        el.querySelectorAll("[data-html-tabs] button").forEach((candidate) => candidate.classList.toggle("on", candidate === button));
      };
    });
    return;
  }

  el.innerHTML = note + `<pre class="filecode"><code></code></pre>`;
  const code = el.querySelector("code");
  code.textContent = d.content;

  if (window.hljs) {
    try { hljs.highlightElement(code); } catch { /* leave as plain text */ }
  }
}

function currentModel() { return state.models.find((m) => m.id === state.model); }

function setSettingsTruth(next) {
  state.settingsTruth = { ...state.settingsTruth, ...next };
  syncControls();
}

function dispatchReadiness() {
  const mode = currentMode();
  const model = currentModel();
  const efforts = model?.supportedReasoningEfforts ?? [];

  if (state.turnOwnership === "checking") { return { ready: false, reason: "Confirming who owns the running turn" }; }
  if (state.settingsTruth.state === "loading") { return { ready: false, reason: "Thread settings are still loading" }; }
  if (state.settingsTruth.state === "error") { return { ready: false, reason: state.settingsTruth.message || "Thread settings could not be verified" }; }
  if (state.modelsProvider !== activeProvider()) { return { ready: false, reason: "Loading this provider's settings" }; }
  if (!state.model || !model) { return { ready: false, reason: "No exact model is selected" }; }
  if (!state.effort) { return { ready: false, reason: "No reasoning effort is selected" }; }
  if (efforts.length && !efforts.some((candidate) => candidate.reasoningEffort === state.effort)) {
    return { ready: false, reason: `${state.effort} is not supported by ${state.model}` };
  }
  if (mode.unknown || !mode.key) { return { ready: false, reason: "Choose a known permission mode" }; }
  return { ready: true, reason: "" };
}

function settingsSourceMessage(settings) {
  const values = [settings?.sources?.model, settings?.sources?.effort, settings?.sources?.mode];
  const acceptedCount = values.filter((source) => source === "provider_accept").length;
  const providerCount = values.filter((source) => source && source !== "provider_accept" && !source.startsWith("bridge_")).length;
  const savedCount = values.filter((source) => source?.startsWith("bridge_")).length;
  const missingCount = values.filter((source) => !source).length;
  if (acceptedCount) { return "Requested settings accepted · awaiting recorded confirmation"; }
  if (providerCount && savedCount) { return "Provider-confirmed · saved overrides"; }
  if (providerCount && missingCount) { return "Provider-confirmed · defaults for missing fields"; }
  if (providerCount) { return `Confirmed from ${PROVIDER_LABELS[activeProvider()] || "provider"}`; }
  if (missingCount === values.length) { return "Settings not recorded"; }
  return "Saved exact settings";
}

function setLockStatus(lock) {
  state.lock = { ...state.lock, ...lock };
  syncLockControl();
}

function openLockContent(html) {
  openSheet(html);
  $("sheetBody").dataset.sheetKind = "lock";
}

function isLockSheetOpen() {
  return $("sheet").classList.contains("show") && $("sheetBody").dataset.sheetKind === "lock";
}

function syncLockControl() {
  const codexThread = state.active && activeProvider() === "codex" && !state.active.draft;
  $("lockCtl").style.display = codexThread ? "flex" : "none";
  $("lockName").textContent = state.lock.label || "Checking…";
}

async function refreshLockStatus() {
  const t = state.active;

  if (!t || activeProvider() !== "codex" || t.draft) { return null; }

  const threadId = t.id;

  try {
    const lock = await api(`/api/thread/lock?provider=codex&threadId=${encodeURIComponent(threadId)}`);

    if (state.active?.id === threadId) { setLockStatus(lock); }

    return lock;
  } catch {
    if (state.active?.id === threadId) {
      setLockStatus({ state: "unknown", label: "Check failed" });
    }

    return null;
  }
}

function renderLockSheet() {
  const lock = state.lock;

  if (lock.state === "unknown") {
    openLockContent(`<h2>Write access</h2>
      <div class="hint">The bridge could not check this thread's lock state. You can safely try again.</div>
      <button class="primary-btn" id="retryLockBtn">Check again</button>`);
    $("retryLockBtn").onclick = openLockSheet;
    return;
  }

  if (lock.state === "held") {
    const busy = state.busy;
    openLockContent(`<h2>You have it</h2>
      <div class="hint">This bridge has the thread loaded, so other Codex clients cannot write to it.</div>
      ${busy ? '<div class="hint">Release is unavailable while the agent is working. It will never interrupt a running turn.</div>' : ""}
      <button class="primary-btn" id="releaseLockBtn" ${busy ? "disabled" : ""}>Release</button>`);
    const btn = $("releaseLockBtn");

    btn.onclick = async () => {
      btn.disabled = true;
      btn.textContent = "Releasing…";

      try {
        const next = await api("/api/thread/lock/release", { provider: "codex", threadId: state.active.id });
        setLockStatus(next);
        renderLockSheet();
      } catch (e) {
        btn.textContent = e.code === "turn_in_progress" ? "Wait for the turn to finish" : "Release failed — tap to retry";
        btn.disabled = e.code === "turn_in_progress";
      }
    };
    return;
  }

  if (lock.state === "elsewhere") {
    openLockContent(`<h2>Open elsewhere</h2>
      <div class="hint">Another Codex client currently has write access. Close it there, then try again here. This app will only acquire the lock after Codex confirms it is free; it never forces a takeover.</div>
      <button class="primary-btn" id="retryTakeLockBtn">Try again</button>
      <button type="button" class="opt opt-button" id="escapeLockBtn" style="width:100%;margin-top:8px">Start another session</button>`);
    $("retryTakeLockBtn").onclick = () => tryTakeLock($("retryTakeLockBtn"));
    $("escapeLockBtn").onclick = () => { closeSheet(); openNewSheet(); };
    return;
  }

  openLockContent(`<h2>Not held here</h2>
    <div class="hint">This app is not holding the thread. Codex will grant write access only if no other client owns it; this never forces a takeover.</div>
    <button class="primary-btn" id="takeLockBtn">Try to get write access</button>`);
  $("takeLockBtn").onclick = () => tryTakeLock($("takeLockBtn"));
}

async function tryTakeLock(btn) {
  const t = state.active;

  if (!t || activeProvider() !== "codex" || t.draft) { return; }

  const threadId = t.id;
  const mode = currentMode();
  btn.disabled = true;
  btn.textContent = "Checking write access…";

  try {
    const next = await api("/api/thread/lock/warm", {
      provider: "codex",
      threadId,
      approvalPolicy: mode.approvalPolicy,
      sandbox: mode.sandbox,
    });

    if (state.active?.id !== threadId || activeProvider() !== "codex") { return; }

    setLockStatus(next);
    if (isLockSheetOpen()) { renderLockSheet(); }
  } catch (e) {
    if (state.active?.id !== threadId || activeProvider() !== "codex") { return; }

    if (e.code === "thread_locked_elsewhere") {
      setLockStatus({ state: "elsewhere", label: "Open elsewhere" });
      if (isLockSheetOpen()) { renderLockSheet(); }
    } else {
      btn.disabled = false;
      btn.textContent = "Try again";
    }
  }
}

async function openLockSheet() {
  openLockContent(`<h2>Write access</h2><div class="hint">Checking this thread…</div>`);
  await refreshLockStatus();

  if (state.active && activeProvider() === "codex" && isLockSheetOpen()) { renderLockSheet(); }
}

function openModelSheet() {
  const html = state.models.filter((m) => !m.hidden).map((m) => `
    <button type="button" class="opt opt-button ${m.id === state.model ? "sel" : ""}" data-model="${m.id}">
      <div class="radio"></div>
      <div><div class="on">${esc(m.displayName || m.id)}</div><div class="od">${esc(m.description || "")}</div></div>
    </button>`).join("");
  openSheet(`<h2>Model</h2><div class="hint">Which model runs your next message.</div>${html}`);
  $("sheetBody").querySelectorAll("[data-model]").forEach((el) => {
    el.onclick = () => { setModel(el.dataset.model); closeSheet(); };
  });
}

function openEffortSheet() {
  const m = currentModel();
  const efforts = [...(m?.supportedReasoningEfforts ?? [])];

  if (state.effort && !efforts.some((e) => e.reasoningEffort === state.effort)) {
    efforts.unshift({
      reasoningEffort: state.effort,
      description: "Current thread effort. It is not listed for the currently advertised model.",
    });
  }

  const html = efforts.map((e) => `
    <button type="button" class="opt opt-button ${e.reasoningEffort === state.effort ? "sel" : ""}" data-effort="${e.reasoningEffort}">
      <div class="radio"></div>
      <div><div class="on">${esc(e.reasoningEffort)}</div><div class="od">${esc(e.description || "")}</div></div>
    </button>`).join("");
  openSheet(`<h2>Reasoning effort</h2><div class="hint">Higher effort thinks longer and uses more of your quota.</div>${html}`);
  $("sheetBody").querySelectorAll("[data-effort]").forEach((el) => {
    el.onclick = () => {
      state.effort = el.dataset.effort;
      setSettingsTruth({ state: "override", message: "Exact override for next turn" });
      persistPrefs();
      saveThreadSettings().catch((e) => chip("⚠️", "Could not save thread settings: " + e.message));
      syncControls();
      closeSheet();
    };
  });
}

function openModeSheet() {
  const provider = activeProvider();
  const set = modeSetFor(provider);
  const cur = currentMode().key;
  const who = PROVIDER_LABELS[provider] || "the agent";
  const unknown = currentMode().providerExact
    ? `<div class="hint">This thread uses an exact provider-managed policy. Leave it unchanged, or choose a preset below to replace it for the next turn.</div>`
    : (currentMode().unknown
      ? `<div class="hint">${esc(currentMode().desc)} The existing policy will not be approximated silently.</div>`
      : "");
  const providerPolicy = state.threadApprovalPolicy || state.threadSandboxPolicy
    ? `<button type="button" class="opt opt-button ${currentMode().providerExact ? "sel" : ""}" data-provider-policy="true">
        <div class="radio"></div><div><div class="on">Keep provider-managed policy</div><div class="od">Use the exact policy Codex records for this thread.</div></div>
      </button>`
    : "";
  const html = Object.entries(set).map(([k, v]) => `
    <button type="button" class="opt opt-button ${k === cur ? "sel" : ""}" data-mode="${k}">
      <div class="radio"></div>
      <div><div class="on">${esc(v.name)}</div><div class="od">${esc(v.desc)}</div></div>
    </button>`).join("");
  openSheet(`<h2>Permissions</h2><div class="hint">How much ${esc(who)} can do before asking you.</div>${unknown}${providerPolicy}${html}`);
  $("sheetBody").querySelector("[data-provider-policy]")?.addEventListener("click", async () => {
    const active = state.active;
    setSettingsTruth({ state: "loading", message: "Restoring provider-managed policy…" });
    try {
      await saveThreadSettings({ mode: null });
      if (state.active === active) { await loadThreadSettings(active); }
      closeSheet();
    } catch (error) {
      setSettingsTruth({ state: "error", message: "Could not restore provider policy" });
      chip("⚠️", "Could not restore provider policy: " + error.message);
    }
  });
  $("sheetBody").querySelectorAll("[data-mode]").forEach((el) => {
    el.onclick = () => {
      if (state.active) {
        state.threadMode = el.dataset.mode;
        state.threadModeUnknown = false;
        setSettingsTruth({ state: "override", message: "Exact override for next turn" });
        saveThreadSettings().catch((e) => chip("⚠️", "Could not save thread settings: " + e.message));
      } else {
        state.modeByProvider[provider] = el.dataset.mode;
      }

      persistPrefs();
      syncControls();
      closeSheet();
    };
  });
}

function openSendModeSheet() {
  const modes = sendModesFor(activeProvider());
  const html = Object.entries(modes).map(([k, v]) => `
    <button type="button" class="opt opt-button ${k === state.sendMode ? "sel" : ""}" data-send="${k}">

  $("sheetBody").querySelectorAll("[data-send]").forEach((el) => {

function setModel(id) {
  state.model = id;
  const m = currentModel();
  const efforts = (m?.supportedReasoningEfforts ?? []).map((e) => e.reasoningEffort);

  if (!efforts.includes(state.effort)) { state.effort = m?.defaultReasoningEffort ?? efforts[0] ?? null; }

  setSettingsTruth({ state: "override", message: "Exact override for next turn" });

  persistPrefs();
  saveThreadSettings().catch((e) => chip("⚠️", "Could not save thread settings: " + e.message));
  syncControls();
}

function syncControls() {
  const m = currentModel();
  const readiness = dispatchReadiness();
  const truth = state.settingsTruth;
  $("modelName").textContent = m?.displayName || state.model || "—";
  $("effortName").textContent = state.effort === "provider-default" ? "Provider default" : state.effort || "—";
  $("modelLabel").textContent = truth.sources?.model === "bridge_override" ? "Next model" : "Model";
  $("effortLabel").textContent = truth.sources?.effort === "bridge_override" ? "Next effort" : "Effort";
  $("modeName").textContent = currentMode().name;
  const sendBehavior = effectiveSendBehavior();
  $("steerName").textContent = sendBehavior.name;
  $("steerCtl").title = sendBehavior.desc;
  const imagesSupported = supportsInput("image");
  $("attachBtn").disabled = !imagesSupported || state.uploadingAttachments > 0;
  $("attachBtn").title = imagesSupported ? "Attach images" : `${providerLabel()} does not advertise image prompt support`;
  $("modelCtl").title = state.model === "provider-default" ? "Let the provider select its current default model" : (state.model ? `Exact provider model ID: ${state.model}` : readiness.reason);
  $("effortCtl").title = state.effort === "provider-default" ? "Let the provider select its current default effort" : (state.effort ? `Exact reasoning effort: ${state.effort}` : readiness.reason);
  $("modeCtl").title = currentMode().unknown
    ? readiness.reason
    : (currentMode().providerExact ? currentMode().desc : `Exact permission preset: ${currentMode().key}`);
  $("settingsTruth").dataset.state = truth.state;
  $("settingsTruth").textContent = truth.message;
  $("settingsTruth").title = `Model: ${state.model || "unavailable"} · Effort: ${state.effort || "unavailable"} · Mode: ${currentMode().key || "unavailable"}`;
  $("sendBtn").disabled = state.uploadingAttachments > 0 || !readiness.ready;
  $("sendBtn").title = readiness.ready ? "Send with the exact settings shown" : readiness.reason;
  syncLockControl();
}

function threadSettingsBody() {
  const t = state.active;
  if (!t?.id || state.modelsProvider !== (t.provider || state.provider)) { return null; }
  const mode = currentMode();
  const body = {
    provider: t.provider || state.provider,
    threadId: t.id,
    model: state.model,
    effort: state.effort,
  };
  if (!mode.unknown && !mode.providerExact) { body.mode = mode.key; }
  return body;
}

function saveThreadSettings(patch = null, { pending = true } = {}) {
  const current = threadSettingsBody();
  if (!current) { return Promise.resolve(); }
  const body = patch
    ? { provider: current.provider, threadId: current.threadId, ...patch }
    : current;
  body.pending = pending;
  const job = state.settingsSave.catch(() => {}).then(() => api("/api/thread/settings", body));
  state.settingsSave = job;
  return job;
}

function addCurrentThreadModel(model, effort, availability) {
  if (!model || state.models.some((item) => item.id === model)) { return; }
  state.models.unshift({
    id: model,
    displayName: model,
    description: availability === "unlisted"
      ? "Current thread model. It is not in the provider's current list; the next send will request this exact ID and the provider may reject it."
      : "Current thread model.",
    threadOnly: true,
    supportedReasoningEfforts: effort ? [{ reasoningEffort: effort, description: "Current thread effort." }] : [],
  });
}

// BEGIN thread-settings-selection (kept pure so the real browser decision is unit tested)
function selectThreadSettingsPair(settings, models, fallback) {
  const supports = (model, effort) => {
    if (!model || !effort) { return false; }
    const efforts = model.supportedReasoningEfforts ?? [];
    return !efforts.length || efforts.some((candidate) => candidate.reasoningEffort === effort);
  };
  const advertised = models.find((model) => model.id === settings?.model);
  if (advertised && supports(advertised, settings?.effort)) {
    return { model: advertised.id, effort: settings.effort, recovery: false, threadOnly: false };
  }

  const confirmed = settings?.providerConfirmed;
  const confirmedModel = models.find((model) => model.id === confirmed?.model);
  if (confirmedModel && supports(confirmedModel, confirmed?.effort)) {
    return {
      model: confirmedModel.id,
      effort: confirmed.effort,
      recovery: confirmed.model !== settings?.model || confirmed.effort !== settings?.effort,
      threadOnly: false,
    };
  }

  // A provider transcript can name a historical model that is no longer in
  // today's picker. Preserve that exact provider-owned pair as thread-only;
  // arbitrary bridge-only IDs never reach this branch.
  if (confirmed?.model && confirmed?.effort && !confirmedModel) {
    return {
      model: confirmed.model,
      effort: confirmed.effort,
      recovery: confirmed.model !== settings?.model || confirmed.effort !== settings?.effort,
      threadOnly: true,
    };
  }

  // New threads and provider records that contain only policy facts have no
  // saved pair to recover. Use the already-loaded provider default instead of
  // treating the absence of an override as corrupt settings.
  const fallbackModel = models.find((model) => model.id === fallback?.model);
  if (!settings?.model && !settings?.effort && fallbackModel && supports(fallbackModel, fallback?.effort)) {
    return { model: fallbackModel.id, effort: fallback.effort, recovery: false, threadOnly: false };
  }

  // Providers may persist effort independently of model. Pair that effort only
  // with the loaded provider default when it explicitly supports the value.
  if (!settings?.model && settings?.effort && fallbackModel && supports(fallbackModel, settings.effort)) {
    return { model: fallbackModel.id, effort: settings.effort, recovery: false, threadOnly: false };
  }

  // Some provider records name the model but omit effort. Select that model's
  // advertised default coherently, never an effort inherited from another model.
  if (advertised && !settings?.effort) {
    const efforts = advertised.supportedReasoningEfforts ?? [];
    const effort = fallback?.model === advertised.id && supports(advertised, fallback.effort)
      ? fallback.effort
      : advertised.defaultReasoningEffort ?? efforts[0]?.reasoningEffort ?? null;
    if (effort && supports(advertised, effort)) {
      return { model: advertised.id, effort, recovery: false, threadOnly: false };
    }
  }
  return null;
}
// END thread-settings-selection

async function loadThreadSettings(t, { flush = true } = {}) {
  setSettingsTruth({ state: "loading", sources: {}, message: "Checking settings…" });
  state.models = state.models.filter((model) => !model.threadOnly);
  const prefs = loadPrefs();
  const def = state.models.find((model) => model.isDefault) || state.models[0];
  state.model = prefs.model && state.models.some((model) => model.id === prefs.model) ? prefs.model : def?.id ?? null;
  const baseModel = currentModel();
  const efforts = (baseModel?.supportedReasoningEfforts ?? []).map((effort) => effort.reasoningEffort);
  state.effort = prefs.effort && efforts.includes(prefs.effort)
    ? prefs.effort
    : baseModel?.defaultReasoningEffort ?? efforts[0] ?? null;

  try {
    const settings = await api(`/api/thread/settings?provider=${encodeURIComponent(t.provider || state.provider)}&threadId=${encodeURIComponent(t.id)}`);
    if (state.active !== t) { return; }
    const selection = selectThreadSettingsPair(settings, state.models, { model: state.model, effort: state.effort });
    const recoverPair = selection?.recovery ? { model: selection.model, effort: selection.effort } : null;
    const displayedModel = selection?.model ?? settings.model;
    const displayedEffort = selection?.effort ?? settings.effort;
    const providerRecordedSelection = settings.providerConfirmed?.model === displayedModel
      && settings.providerConfirmed?.effort === displayedEffort;
    const availability = displayedModel && state.models.length
      ? (state.models.some((model) => model.id === displayedModel) ? "listed" : "unlisted")
      : settings.modelAvailability;
    if (providerRecordedSelection || selection?.threadOnly) { addCurrentThreadModel(displayedModel, displayedEffort, availability); }
    if (displayedModel) { state.model = displayedModel; }
    if (displayedEffort) { state.effort = displayedEffort; }
    state.threadMode = settings.mode || null;
    state.threadModeUnknown = settings.modeKnown === false;
    state.threadApprovalPolicy = settings.approvalPolicy ?? null;
    state.threadSandboxPolicy = settings.sandboxPolicy ?? null;
    const sourceValues = [settings.sources?.model, settings.sources?.effort, settings.sources?.mode];
    const providerConfirmed = sourceValues.every((source) => source && !source.startsWith("bridge_"));
    state.settingsTruth = {
      state: providerConfirmed ? "confirmed" : "override",
      sources: settings.sources ?? {},
      message: recoverPair
        ? `Recovered model and effort from ${PROVIDER_LABELS[activeProvider()] || "provider"}`
        : settingsSourceMessage(settings),
    };
    if (!state.modelsReady) {
      state.settingsTruth = { state: "error", sources: settings.sources ?? {}, message: "Models unavailable · send blocked" };
    } else if (!selection || !currentModel() || !state.effort) {
      state.settingsTruth = { state: "error", sources: settings.sources ?? {}, message: "Saved settings unavailable · choose model and effort" };
    }

    // Repair only an exact provider-recorded pair. Current models must pass the
    // loaded catalog; historical unlisted models must come from provider truth.
    // Never independently mix one model's effort with another model.
    if (recoverPair) {
      saveThreadSettings(recoverPair, { pending: false }).catch((e) => chip("⚠️", "Could not repair thread settings: " + e.message));
    }

    // Materialize only missing facts so another browser sees the same fallback.
    // Provider-owned values stay provider-owned and are not copied as a cache.
    if (selection) {
      const missing = {};
      if (!settings.sources?.model && state.model) { missing.model = state.model; }
      if (!settings.sources?.effort && state.effort) { missing.effort = state.effort; }
      const materializedMode = currentMode();
      if (!settings.sources?.mode && !materializedMode.unknown && !materializedMode.providerExact) {
        missing.mode = materializedMode.key;
      }
      if (Object.keys(missing).length) {
        saveThreadSettings(missing, { pending: false }).catch((e) => chip("⚠️", "Could not save thread settings: " + e.message));
      }
    }
    syncControls();
    if (flush) { flushPending(); }
  } catch (e) {
    state.settingsTruth = { state: "error", sources: {}, message: "Settings unavailable · send blocked" };
    syncControls();
    chip("⚠️", "Could not load this thread's settings: " + e.message);
  }
}

function persistPrefs() {
  const previous = loadPrefs();
  const saveComposerDefaults = !state.active;
  localStorage.setItem("cxp_prefs", JSON.stringify({
    provider: state.provider,
    listView: state.listView,
    model: saveComposerDefaults ? state.model : previous.model,
    effort: saveComposerDefaults ? state.effort : previous.effort,
    modeByProvider: state.modeByProvider,
    sendMode: state.sendMode,
    sidebarCollapsed: state.sidebarCollapsed,
  }));
}

function loadPrefs() {
  try { return JSON.parse(localStorage.getItem("cxp_prefs")) || {}; } catch { return {}; }
}

let lastUsageBar = null;
let lastUsageProvider = null;

function updateUsageLive(rl, provider = activeProvider()) {
  if (lastUsageBar && provider === lastUsageProvider && rl?.primary && typeof rl.primary.usedPercent === "number") {
    const pct = rl.primary.usedPercent;
    lastUsageBar.style.width = pct + "%";
    lastUsageBar.parentElement.classList.toggle("hot", pct >= 80);
  }
}

function gaugeHtml(p) {
  const mins = Number(p.windowDurationMins ?? 0);
  const win = mins >= 1440 ? `${Math.round(mins / 1440)}d` : mins >= 60 ? `${Math.round(mins / 60)}h` : `${mins}m`;
  const hasPct = typeof p.usedPercent === "number" && Number.isFinite(p.usedPercent);
  const pct = hasPct ? Math.max(0, Math.min(100, p.usedPercent)) : null;
  const label = `${win} usage limit`;
  let html = `<div class="gauge"><div class="top"><span class="name">${label}</span>`;

  if (hasPct) {
    html += `<span class="pct">${Math.round(pct * 10) / 10}%</span></div><div class="bar ${pct >= 80 ? "hot" : ""}"><span style="width:${pct}%"></span></div>`;
  } else {
    html += `<span class="pct" style="font-size:14px">${esc(p.status || "active")}</span></div>`;
  }

  if (p.resetsAt) { html += `<div class="reset">resets ${relFuture(p.resetsAt)}</div>`; }

  html += `</div>`;
  return html;
}

// ---------- notifications (Web Push) ----------
//
// iOS delivers Web Push only to a Home-Screen install, via Apple's own push
// service — so this needs no native app and no third-party service. The bridge
// pushes when a turn finishes, with the thread title and a slice of the reply.

const PUSH_SUPPORTED = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
let deferredInstallPrompt = null;

function isStandalone() {
  return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
}

function isIOS() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent);
}

function urlB64ToUint8Array(base64) {
  const padding = "=".repeat((4 - (base64.length % 4)) % 4);
  const raw = atob((base64 + padding).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
}

function notificationsSectionHtml() {
  return `<div class="seclabel">Notifications</div>
    <div class="hint" id="pushHint">Checking…</div>
    <button class="primary-btn" id="pushBtn" style="margin-top:6px" disabled>…</button>`;
}

async function currentPushSub() {
  const reg = await navigator.serviceWorker?.getRegistration();
  return reg ? reg.pushManager.getSubscription() : null;
}

async function ensurePushSubscription() {
  if (!PUSH_SUPPORTED) { throw new Error("this browser can't receive push notifications"); }
  if (isIOS() && !isStandalone()) { throw new Error("add this app to the Home Screen first"); }
  if (Notification.permission === "denied") { throw new Error("notifications are blocked in browser settings"); }

  const existing = await currentPushSub();
  if (existing) {
    // Browser state can outlive a restored bridge data directory. This POST is
    // idempotent and repairs the server side automatically.
    await api("/api/push/subscribe", { subscription: existing.toJSON() });
    return existing;
  }

  const permission = await Notification.requestPermission();
  if (permission !== "granted") { throw new Error("notification permission wasn't granted"); }

  const { key } = await api("/api/push/key");
  if (!key) { throw new Error("the bridge has no push key"); }

  const reg = await navigator.serviceWorker.ready;
  const fresh = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToUint8Array(key) });
  await api("/api/push/subscribe", { subscription: fresh.toJSON() });
  return fresh;
}

async function loadNotificationRules() {
  state.notificationRules.clear();
  if (!PUSH_SUPPORTED) { return; }

  try {
    const sub = await currentPushSub();
    if (!sub) { return; }
    const status = await api("/api/thread/notifications/status", { endpoint: sub.endpoint });

    for (const rule of status.rules ?? []) {
      state.notificationRules.set(threadRuleKey(rule.provider, rule.threadId), rule.mode);
    }
  } catch {
    // The session list remains usable offline; subscription state refreshes on
    // the next foreground sync or bell interaction.
  }

  syncNotifyButton();
  if (!state.active && state.threads.length) { renderRows(false); }
}

async function setTaskNotification(thread, mode) {
  const target = notificationTarget(thread);
  const sub = mode === "off" ? await currentPushSub() : await ensurePushSubscription();

  if (!sub) {
    if (mode === "off") { return; }
    throw new Error("notifications are not enabled on this device");
  }

  await api("/api/thread/notifications", {
    endpoint: sub.endpoint,
    provider: target.provider || "codex",
    threadId: target.id,
    mode,
  });

  const k = threadRuleKey(target.provider, target.id);
  if (mode === "off") { state.notificationRules.delete(k); } else { state.notificationRules.set(k, mode); }
  renderRows(false);
  syncNotifyButton();
}

async function openTaskNotificationSheet(thread) {
  const target = notificationTarget(thread);
  const k = threadRuleKey(target.provider, target.id);
  const current = state.notificationRules.get(k) || "off";
  const isChild = thread?.parentThreadId && thread.id !== target.id;
  const title = target.name || target.preview || "this task";

  openSheet(`<h2>Task notifications</h2>
    <div class="hint">${isChild ? "This subagent is grouped under " : "Choose how this device follows "}<b>${esc(title)}</b>. You will be notified for exact completed or failed turns started on the Mac or phone.</div>
    <button type="button" class="opt opt-button ${current === "once" ? "sel" : ""}" data-notify-mode="once"><div class="radio"></div><div><div class="on">Notify once</div><div class="od">Notify for the next confirmed completion, then turn this off.</div></div></button>
    <button type="button" class="opt opt-button ${current === "follow" ? "sel" : ""}" data-notify-mode="follow"><div class="radio"></div><div><div class="on">Follow this task</div><div class="od">Notify after every future confirmed turn until you turn it off.</div></div></button>
    <button type="button" class="opt opt-button ${current === "off" ? "sel" : ""}" data-notify-mode="off"><div class="radio"></div><div><div class="on">Off</div><div class="od">Do not watch externally-started turns for this task.</div></div></button>
    <div class="hint" id="taskNotifyHint">Subagent work stays grouped: following the parent does not send a separate alert for each child.</div>`);

  $("sheetBody").querySelectorAll("[data-notify-mode]").forEach((option) => {
    option.onclick = async () => {
      const hint = $("taskNotifyHint");
      const mode = option.dataset.notifyMode;
      $("sheetBody").querySelectorAll("[data-notify-mode]").forEach((item) => item.style.pointerEvents = "none");
      hint.textContent = mode === "off" ? "Turning off…" : "Enabling notifications…";

      try {
        await setTaskNotification(target, mode);
        closeSheet();
      } catch (error) {
        hint.textContent = "Couldn't update: " + (error.message || error);
        $("sheetBody").querySelectorAll("[data-notify-mode]").forEach((item) => item.style.pointerEvents = "");
      }
    };
  });
}

async function wireNotifications() {
  const btn = $("pushBtn");
  const hint = $("pushHint");

  if (!btn || !hint) { return; }

  function show(text, label, enabled) {
    hint.textContent = text;
    btn.textContent = label;
    btn.disabled = !enabled;
  }

  if (!PUSH_SUPPORTED) {
    show("This browser can't receive push notifications.", "Unavailable", false);
    return;
  }

  if (isIOS() && !isStandalone()) {
    show("On iPhone these only work from the Home Screen app — tap Share → Add to Home Screen, then open it from there.", "Add to Home Screen first", false);
    return;
  }

  if (Notification.permission === "denied") {
    show("Notifications are blocked for this app in your browser settings.", "Blocked", false);
    return;
  }

  const sub = await currentPushSub();

  if (sub) {
    show("On. Bells on individual tasks also follow turns started directly on your Mac.", "Turn off notifications", true);

    btn.onclick = async () => {
      btn.disabled = true;

      try {
        await api("/api/push/unsubscribe", { endpoint: sub.endpoint });
        await sub.unsubscribe();
      } catch {
        // already gone — fall through and re-read the state
      }

      state.notificationRules.clear();
      renderRows(false);
      syncNotifyButton();
      wireNotifications();
    };

    return;
  }

  show("Off. Enable this device, then use a task bell to follow work started on your Mac too.", "Enable notifications", true);

  btn.onclick = async () => {
    btn.disabled = true;
    hint.textContent = "Requesting permission…";

    try {
      await ensurePushSubscription();
      await loadNotificationRules();
      wireNotifications();
    } catch (e) {
      show("Couldn't enable notifications: " + (e.message || e), "Try again", true);
    }
  };
}

function wireInstallOnboarding() {
  const panel = $("installOnboarding");

  if (!panel) { return; }

  const hide = () => {
    panel.classList.remove("install-ready");
    panel.hidden = true;
  };

  if (isStandalone() || localStorage.getItem("remote_agents_install_dismissed") === "1") {
    hide();
    return;
  }

  $("dismissInstallBtn").onclick = () => {
    localStorage.setItem("remote_agents_install_dismissed", "1");
    hide();
  };

  const installBtn = $("installPwaBtn");

  window.addEventListener("beforeinstallprompt", (event) => {
    event.preventDefault();
    deferredInstallPrompt = event;

    if (installBtn) {
      installBtn.disabled = false;
      installBtn.textContent = "Install app";
      $("installPwaHint").textContent = "Chrome is ready to install Remote Agents.";
    }
  });

  if (installBtn) {
    installBtn.onclick = async () => {
      if (!deferredInstallPrompt) { return; }
      installBtn.disabled = true;
      await deferredInstallPrompt.prompt();
      const choice = await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;

      if (choice.outcome === "accepted") {
        hide();
      } else {
        installBtn.disabled = false;
        installBtn.textContent = "Install app";
      }
    };
  }

  window.addEventListener("appinstalled", hide);
  // The server keeps this hidden to prevent a first-paint flash in an already
  // installed PWA. Reveal it only after standalone detection has completed.
  panel.hidden = false;
  panel.classList.add("install-ready");
}

function wireNotificationOnboarding() {
  const panel = $("notificationOnboarding");

  if (!panel || !isStandalone() || !PUSH_SUPPORTED || Notification.permission === "denied" || localStorage.getItem("remote_agents_push_dismissed") === "1") {
    return;
  }

  currentPushSub().then((sub) => {
    if (sub) { return; }
    panel.hidden = false;

    $("dismissPushOnboardingBtn").onclick = () => {
      localStorage.setItem("remote_agents_push_dismissed", "1");
      panel.hidden = true;
    };

    $("enablePushOnboardingBtn").onclick = async () => {
      const btn = $("enablePushOnboardingBtn");
      const hint = $("pushOnboardingHint");
      btn.disabled = true;
      hint.textContent = "Requesting permission…";

      try {
        await ensurePushSubscription();
        panel.hidden = true;
      } catch (e) {
        hint.textContent = "Couldn't enable notifications: " + (e.message || e);
        btn.disabled = false;
      }
    };
  }).catch(() => {});
}

// Tell the bridge what is on screen, so a turn you are watching finish does not
// also arrive as a notification. Reports go stale server-side after ~75s, so a
// closed or backgrounded app stops suppressing on its own.
function clientId() {
  let id = localStorage.getItem("cxp_client_id");

  if (!id) {
    id = Math.random().toString(36).slice(2) + Date.now().toString(36);
    localStorage.setItem("cxp_client_id", id);
  }

  return id;
}

function sendPresence() {
  const ids = [state.active?.id, state.active?.draftId].filter(Boolean);

  api("/api/presence", {
    clientId: clientId(),
    provider: state.provider,
    ids,
    visible: !document.hidden && ids.length > 0,
  }).catch(() => {});
}

// Opened from a notification: jump straight to that thread.
async function openLinkedThread() {
  const q = new URLSearchParams(location.search);
  const id = q.get("thread");

  if (!id) { return; }

  const prov = q.get("provider");
  history.replaceState(null, "", "/");

  if (prov && PROVIDER_LABELS[prov] && prov !== state.provider) {
    await switchProvider(prov);
  }

  const found = state.threads.flatMap((t) => [t, ...(t.subagents ?? []).map((child) => ({ ...child, parentThreadId: t.id }))]).find((t) => t.id === id);
  openThread(found || { id, provider: prov || state.provider, cwd: null, name: null, preview: "Session" });
}

let usageSheetRequestSeq = 0;

function usageTabsHtml(provider) {

function usageUnavailableText(provider) {
  if (provider === "grok") { return "Grok’s native billing endpoint did not return a current account usage window. Retry, or run /usage in Grok to verify the account."; }
  if (provider === "claude") { return "Claude account limits are unavailable. This app reads the same active-account status as cswap status; verify that cswap is installed and the account is managed."; }
  return "Codex did not return account-limit data. Tap Retry; the last successful snapshot is kept instead of being erased by a transient failure.";
}

function renderUsageSheet(provider, d, error = null) {
  const body = $("sheetBody");

  if (error) {
    body.innerHTML = `<h2>Usage & limits</h2>${usageTabsHtml(provider)}<div class="usage-note">Could not refresh ${esc(PROVIDER_LABELS[provider])}: ${esc(error.message)}</div><button class="primary" data-usage-retry>Retry</button>`;
    wireUsageSheet(provider);
    return;
  }

  const acc = d.account || {};
  const limitsEnvelope = d.rateLimits?.rateLimits ? d.rateLimits : (d.rateLimits ? { rateLimits: d.rateLimits } : null);
  const now = Date.now() / 1000;
  let rl = limitsEnvelope?.rateLimits;
  const credits = limitsEnvelope?.rateLimitResetCredits ?? limitsEnvelope?.credits;
  const billing = limitsEnvelope?.billing;
  const rateSource = d._meta?.sources?.rateLimits;
  if (rl) {
    rl = {
      primary: !rl.primary?.resetsAt || rl.primary.resetsAt > now ? rl.primary : null,
      secondary: !rl.secondary?.resetsAt || rl.secondary.resetsAt > now ? rl.secondary : null,
    };
  }

  const planText = acc.planType ? esc(acc.planType.toUpperCase()) + " plan" : "";
  let html = `<h2>Usage & limits</h2>${usageTabsHtml(provider)}<div class="hint">${esc(acc.accountLabel || acc.email || PROVIDER_LABELS[provider] || "Agent")}${acc.accountLabel && acc.email ? " · " + esc(acc.email) : ""}${planText ? " · " + planText : ""}</div>`;

  if (rateSource === "last-known" && rl) {
    const observed = d._meta?.observedAt?.rateLimits;
    html += `<div class="usage-note">Showing the last successful quota check${observed ? ` from ${relTime(Math.floor(observed / 1000))}` : ""}; the latest refresh ${d._meta?.refreshError ? "failed" : "did not return this field"}.</div>`;
  }

  if (limitsEnvelope?.fetchedAt && rateSource !== "last-known") {
    html += `<div class="hint" style="margin:6px 0 10px">Updated ${relTime(limitsEnvelope.fetchedAt)}</div>`;
  }

  if (rl?.primary) { html += gaugeHtml(rl.primary); }

  if (rl?.secondary) { html += gaugeHtml(rl.secondary); }

  if (!rl?.primary && !rl?.secondary) {
    html += `<div class="usage-note">${esc(usageUnavailableText(provider))}</div>`;
  }

  if (credits?.availableCount > 0 || (credits?.hasCredits && Number(credits?.balance) > 0)) {
    html += `<div class="credit">🎟️ <span>${esc(String(credits.availableCount ?? credits.balance))} credit${Number(credits.availableCount ?? credits.balance) === 1 ? "" : "s"} available</span></div>`;
  }

  if (billing && (billing.prepaidBalanceUSD > 0 || billing.onDemandCapUSD > 0 || billing.onDemandUsedUSD > 0)) {
    html += `<div class="seclabel">Credits</div><div class="stat-grid">
      <div class="stat"><div class="v">$${Number(billing.prepaidBalanceUSD || 0).toFixed(2)}</div><div class="k">prepaid balance</div></div>
      <div class="stat"><div class="v">$${Number(billing.onDemandUsedUSD || 0).toFixed(2)}</div><div class="k">on-demand used</div></div>
    </div>`;
  }

  html += notificationsSectionHtml();
  body.innerHTML = html;
  body.querySelector("h2").id = "sheetTitle";
  lastUsageBar = body.querySelector(".bar > span");
  lastUsageProvider = provider;
  wireUsageSheet(provider);
  wireNotifications();
}

async function loadUsageSheet(provider) {
  if (!PROVIDER_LABELS[provider]) { return; }
  const requestSeq = ++usageSheetRequestSeq;
  $("sheetBody").dataset.sheetKind = "usage";
  $("sheetBody").innerHTML = `<h2>Usage & limits</h2>${usageTabsHtml(provider)}<div class="hint">Refreshing ${esc(PROVIDER_LABELS[provider])}…</div>`;
  wireUsageSheet(provider);

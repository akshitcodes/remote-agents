function renderUsageSheet(provider, d, error = null, { refreshing = false } = {}) {
  const body = $("sheetBody");

  if (error) {
    body.innerHTML = `${usageTitleHtml(false)}${usageTabsHtml(provider)}<div class="usage-note">Could not refresh ${esc(PROVIDER_LABELS[provider])}: ${esc(error.message)}</div><button class="primary" data-usage-retry>Retry</button>`;
    wireUsageSheet(provider);
    return;
  }

  const acc = d.account || {};
  const limitsEnvelope = d.rateLimits?.rateLimits ? d.rateLimits : (d.rateLimits ? { rateLimits: d.rateLimits } : null);
  const now = Date.now() / 1000;
  let rl = limitsEnvelope?.rateLimits;
  const credits = limitsEnvelope?.rateLimitResetCredits ?? limitsEnvelope?.credits;
  const billing = limitsEnvelope?.billing;
  const rateSource = d._meta?.sources?.rateLimits;
  if (rl) {
    rl = {
      primary: !rl.primary?.resetsAt || rl.primary.resetsAt > now ? rl.primary : null,
      secondary: !rl.secondary?.resetsAt || rl.secondary.resetsAt > now ? rl.secondary : null,
    };
  }

  const planText = acc.planType ? esc(acc.planType.toUpperCase()) + " plan" : "";
  let html = `${usageTitleHtml(refreshing)}${usageTabsHtml(provider)}<div class="hint">${esc(acc.accountLabel || acc.email || PROVIDER_LABELS[provider] || "Agent")}${acc.accountLabel && acc.email ? " · " + esc(acc.email) : ""}${planText ? " · " + planText : ""}</div>`;

  if ((rateSource === "last-known" || d._meta?.refreshError) && rl) {
    const observed = d._meta?.observedAt?.rateLimits;
    html += `<div class="usage-note">Showing the last successful quota check${observed ? ` from ${relTime(Math.floor(observed / 1000))}` : ""}; the latest refresh ${d._meta?.refreshError ? "failed" : "did not return this field"}.</div>`;
  }

  if (limitsEnvelope?.fetchedAt && rateSource !== "last-known" && !d._meta?.refreshError) {
    html += `<div class="hint" style="margin:6px 0 10px">Updated ${relTime(limitsEnvelope.fetchedAt)}</div>`;
  }

  if (rl?.primary) { html += gaugeHtml(rl.primary); }

  if (rl?.secondary) { html += gaugeHtml(rl.secondary); }

  if (!rl?.primary && !rl?.secondary) {
    html += `<div class="usage-note">${esc(usageUnavailableText(provider))}</div>`;
  }

  if (credits?.availableCount > 0 || (credits?.hasCredits && Number(credits?.balance) > 0)) {
    html += `<div class="credit">🎟️ <span>${esc(String(credits.availableCount ?? credits.balance))} credit${Number(credits.availableCount ?? credits.balance) === 1 ? "" : "s"} available</span></div>`;
  }

  if (billing && (billing.prepaidBalanceUSD > 0 || billing.onDemandCapUSD > 0 || billing.onDemandUsedUSD > 0)) {
    html += `<div class="seclabel">Credits</div><div class="stat-grid">
      <div class="stat"><div class="v">$${Number(billing.prepaidBalanceUSD || 0).toFixed(2)}</div><div class="k">prepaid balance</div></div>
      <div class="stat"><div class="v">$${Number(billing.onDemandUsedUSD || 0).toFixed(2)}</div><div class="k">on-demand used</div></div>
    </div>`;
  }

  html += notificationsSectionHtml();
  body.innerHTML = html;
  body.querySelector("h2").id = "sheetTitle";
  lastUsageBar = body.querySelector(".bar > span");
  lastUsageProvider = provider;
  wireUsageSheet(provider);
  wireNotifications();
}

async function usageRequest(path, timeoutMs) {
  const controller = new AbortController();
  let timedOut = false;
  const timer = setTimeout(() => { timedOut = true; controller.abort(); }, timeoutMs);

  try {
    return await api(`${path}&_=${Date.now()}`, undefined, { signal: controller.signal, cache: "no-store" });
  } catch (error) {
    if (timedOut) { throw Object.assign(new Error("Usage refresh timed out"), { code: "usage_refresh_timeout" }); }
    throw error;
  } finally {
    clearTimeout(timer);
  }
}

function usageSheetStillCurrent(requestSeq) {
  return requestSeq === usageSheetRequestSeq && $("sheet").classList.contains("show") && $("sheetBody").dataset.sheetKind === "usage";
}

async function showUsageProvider(provider) {
  if (!PROVIDER_LABELS[provider]) { return; }
  const requestSeq = ++usageSheetRequestSeq;
  const cached = usageSheetCache.get(provider);
  $("sheetBody").dataset.sheetKind = "usage";

  if (cached) {
    renderUsageSheet(provider, cached.data);
    return;
  }

  $("sheetBody").innerHTML = `${usageTitleHtml(false)}${usageTabsHtml(provider)}<div class="hint">Loading saved ${esc(PROVIDER_LABELS[provider])} usage…</div>`;
  wireUsageSheet(provider);

  try {
    const data = await usageRequest(`/api/usage/snapshot?provider=${encodeURIComponent(provider)}`, 3000);
    usageSheetCache.set(provider, { data, cachedAt: Date.now() });
    if (usageSheetStillCurrent(requestSeq)) { renderUsageSheet(provider, data); }
  } catch (error) {
    if (usageSheetStillCurrent(requestSeq)) { renderUsageSheet(provider, null, error); }
  }
}

async function refreshUsageProvider(provider) {
  if (!PROVIDER_LABELS[provider]) { return; }
  const requestSeq = ++usageSheetRequestSeq;
  const cached = usageSheetCache.get(provider);
  $("sheetBody").dataset.sheetKind = "usage";

  if (cached) { renderUsageSheet(provider, cached.data, null, { refreshing: true }); }
  else {
    $("sheetBody").innerHTML = `${usageTitleHtml(true)}${usageTabsHtml(provider)}<div class="hint">Refreshing ${esc(PROVIDER_LABELS[provider])}…</div>`;
    wireUsageSheet(provider);
  }

  try {
    const data = await usageRequest(`/api/usage?refresh=1&provider=${encodeURIComponent(provider)}`, 10000);
    usageSheetCache.set(provider, { data, cachedAt: Date.now() });
    if (usageSheetStillCurrent(requestSeq)) { renderUsageSheet(provider, data); }
  } catch (error) {
    if (cached) {
      const fallback = { ...cached.data, _meta: { ...(cached.data._meta ?? {}), refreshError: true } };
      usageSheetCache.set(provider, { data: fallback, cachedAt: cached.cachedAt });
      if (usageSheetStillCurrent(requestSeq)) { renderUsageSheet(provider, fallback); }
    } else {
      try {
        const snapshot = await usageRequest(`/api/usage/snapshot?provider=${encodeURIComponent(provider)}`, 3000);
        const fallback = { ...snapshot, _meta: { ...(snapshot._meta ?? {}), refreshError: true } };
        usageSheetCache.set(provider, { data: fallback, cachedAt: Date.now() });
        if (usageSheetStillCurrent(requestSeq)) { renderUsageSheet(provider, fallback); }
      } catch {
        if (usageSheetStillCurrent(requestSeq)) { renderUsageSheet(provider, null, error); }
      }
    }
  }
}

function openUsageSheet() {
  const provider = activeProvider();
  openSheet(`${usageTitleHtml(true)}${usageTabsHtml(provider)}<div class="hint">Refreshing ${esc(PROVIDER_LABELS[provider])}…</div>`);
  $("sheetBody").dataset.sheetKind = "usage";
  wireUsageSheet(provider);
  refreshUsageProvider(provider);
}

// ---------- running-thread tracking ----------
// Re-reading the whole thread is how an external turn "streams", so it has to be
// throttled — an agent mid-turn rewrites its log many times a second.
const EXTERNAL_REFRESH_MS = 1500;
let externalRefreshAt = 0;
let externalRefreshTimer = null;

function scheduleExternalRefresh() {
  if (externalRefreshTimer) { return; }

  const wait = Math.max(0, EXTERNAL_REFRESH_MS - (Date.now() - externalRefreshAt));

  externalRefreshTimer = setTimeout(() => {
    externalRefreshTimer = null;
    externalRefreshAt = Date.now();
    resyncOpenThread();
  }, wait);
}

function runKey(provider, tid) { return (provider || "codex") + ":" + tid; }

function isRunning(provider, tid) { return state.running.has(runKey(provider, tid)); }

function isThreadRunning(thread, runningKeys = state.running) {
  if (!thread) { return false; }

  const provider = thread.provider || "codex";

  return runningKeys.has(runKey(provider, thread.id)) || (thread.subagents ?? []).some((child) =>
    runningKeys.has(runKey(child.provider || provider, child.id))
  );
}

// Starred sessions pin above every view, but active work still wins inside the
// pinned block: a running favourite outranks an idle one. Self-contained, and
// takes its ranker as an argument, so it can be extracted and tested the same
// way rankLiveThreads is.
function partitionStarredThreads(threads, starKeys, rank = (rows) => rows) {
  const starred = [];
  const rest = [];

  for (const thread of threads ?? []) {
    const key = (thread?.provider || "codex") + ":" + thread?.id;
    (starKeys?.has(key) ? starred : rest).push(thread);
  }

  return { starred: rank(starred), rest };
}

// Pure ordering used by the live UI and exercised directly in tests. The
// server remains canonical, but a start event must promote the task before a
// network round-trip; a running subagent promotes its parent task as well.
function rankLiveThreads(threads, runningKeys) {
  const key = (provider, tid) => (provider || "codex") + ":" + tid;
  const active = (thread) => {
    const provider = thread?.provider || "codex";

    return !!thread && (runningKeys.has(key(provider, thread.id)) || (thread.subagents ?? []).some((child) =>
      runningKeys.has(key(child.provider || provider, child.id))
    ));
  };

  return [...(threads ?? [])].sort((a, b) => {
    const running = Number(active(b)) - Number(active(a));

    if (running) { return running; }

    const updated = Number(b?.updatedAt ?? 0) - Number(a?.updatedAt ?? 0);

    if (updated) { return updated; }

    return `${a?.provider ?? ""}:${a?.id ?? ""}`.localeCompare(`${b?.provider ?? ""}:${b?.id ?? ""}`);
  });
}

const LIST_RECONCILE_MS = 600;
let listReconcileTimer = null;

function scheduleListReconcile() {
  if (listReconcileTimer) { clearTimeout(listReconcileTimer); }

  listReconcileTimer = setTimeout(() => {
    listReconcileTimer = null;

    loadThreads(false).catch(() => {});
  }, LIST_RECONCILE_MS);
}

function touchLiveThread(provider, tid) {
  const now = Math.floor(Date.now() / 1000);
  const affected = new Set();

  for (const thread of state.threads) {
    const threadProvider = thread.provider || "codex";

    if (thread.id === tid && threadProvider === (provider || "codex")) {
      thread.updatedAt = Math.max(Number(thread.updatedAt ?? 0), now);
      affected.add(thread.id);
    }

    for (const child of thread.subagents ?? []) {
      if (child.id !== tid || (child.provider || threadProvider) !== (provider || "codex")) { continue; }

      child.updatedAt = Math.max(Number(child.updatedAt ?? 0), now);
      thread.updatedAt = Math.max(Number(thread.updatedAt ?? 0), now);
      affected.add(thread.id);
      affected.add(child.id);
    }
  }

  return affected;
}

function rerankVisibleRows({ revealRunning = false } = {}) {
  if (!state.threads.length) { return; }

  const scrollTop = $("listView").scrollTop;
  if (state.listView === "projects") { rebuildProjectGroups(); }
  else { state.threads = rankLiveThreads(state.threads, state.running); }
  renderRows(false);
  // Starting work is the highest-signal list transition: reveal its promoted
  // row immediately. Completion keeps the reader's position stable.
  $("listView").scrollTop = revealRunning ? 0 : scrollTop;
}

function markRunning(provider, tid, on, { confidence = "unknown", live = true } = {}) {
  if (!tid) { return; }

  const k = runKey(provider, tid);
  const had = state.running.has(k);
  const previousConfidence = state.runConfidence.get(k);
  state.runConfidence.set(k, confidence);

  if (on) { state.running.add(k); } else { state.running.delete(k); }

  if (had !== on && live) {
    touchLiveThread(provider, tid);

    rerankVisibleRows({ revealRunning: on });

    scheduleListReconcile();
  } else if (live && previousConfidence !== confidence) {
    updateRowRunning(provider, tid, on, confidence);
  }

  // Keep the open thread's composer state honest if its run-state changed
  // elsewhere — and deliver anything queued behind that turn.
  //
  // A turn driven from the Mac or another device ends by file observation:
  // there is no turn/completed notification for it, because we are not the one
  // running it. That made this the only code that could release the composer,
  // and it used to refuse to whenever something was queued — so a message typed
  // during such a turn stayed pending forever, was never sent, and vanished on
  // reload. Our own turns still end via turn/completed, which flushes there.
  const ownTurnRunning = state.busy && !state.externalTurn;

  const confirmedEnd = confidence === "provider" || confidence === "bridge" || confidence === "marker";
  const abnormalEnd = confidence === "stale_timeout";
  const activeMatch = state.active && provider === activeProvider() && (tid === state.active.id || tid === state.active.draftId);

  if (activeMatch && !on && !ownTurnRunning && confirmedEnd) {
    setBusy(false);
    flushPending();
  } else if (activeMatch && !on && !ownTurnRunning && abnormalEnd) {
    state.activeTurnId = null;
    setBusy(false);
    showTurnFailure(
      "No provider activity was recorded for 10 minutes. The agent may have exited without reporting a final result. Check the latest messages before retrying or sending again.",
      `stale-timeout:${provider}:${tid}`,
    );
  }

  if (activeMatch && !on && state.pending.length && !confirmedEnd) {
    queueMicrotask(async () => {
      await reconcilePendingDeliveryProof();
      if (!state.active || provider !== activeProvider() || (tid !== state.active.id && tid !== state.active.draftId) || isRunning(provider, tid)) { return; }
      for (const entry of state.pending) {
        if (entry.deliveryProofChecked || entry.retryRequired || entry.mayHaveDispatched) { continue; }
        const label = entry.chip?.querySelector("span");

        if (label) { label.textContent = "Turn state could not be confirmed — this message remains unsent"; }
        entry.retryRequired = true;
        markSendFailed(entry.bubble, () => retryPendingEntry(entry), {
          onDismiss: () => removePendingEntry(entry, { allowUncertain: true }),
        });
      }

      savePending();
    });
  }
}

function updateRowRunning(provider, tid, on, confidence) {
  const escaped = window.CSS?.escape ? CSS.escape(tid) : tid;
  const presentation = runPresentation(on, confidence);

  document.querySelectorAll('#rows [data-tid="' + escaped + '"]').forEach((row) => {
    if ((row.dataset.provider || "codex") !== (provider || "codex")) { return; }
    const badge = row.querySelector(":scope > .run-badge, :scope > .row-head .run-badge");
    if (badge) {
      badge.style.display = presentation.visible ? "inline-flex" : "none";
      badge.classList.toggle("stalled", presentation.className === "stalled");
      badge.classList.toggle("abnormal", presentation.className === "abnormal");
      const label = badge.querySelector(".run-label");
      if (label) { label.textContent = presentation.label; }
    }
    const ready = row.querySelector(":scope > .row-head .ready-badge");
    if (ready) { ready.style.display = !on && presentation.className !== "abnormal" && state.listView === "recent" ? "inline-flex" : "none"; }
  });
}

// ---------- auto-sync (focus / reconnect / online) ----------
// Re-fetch whatever's on screen so a backgrounded PWA shows the truth on return
// and recovers any events missed while the stream was dropped.
function resyncView({ force = false } = {}) {
  if (state.active && !state.active.draft) {
    resyncOpenThread({ force });
  } else if (!state.active) {
    loadThreads(false).catch(() => {});
  }
}

async function reconcileOpenRuntime(thread = state.active) {
  if (!thread || thread.draft) { return null; }
  const provider = thread.provider || "codex";
  const result = await api(`/api/thread/runtime?provider=${encodeURIComponent(provider)}&threadId=${encodeURIComponent(thread.id)}`);
  if (state.active !== thread || !result.runtime) { return result.runtime ?? null; }

  const runtime = result.runtime;
  markRunning(provider, thread.id, !!runtime.running, { confidence: runtime.confidence });
  updateResumeButton(runtime);
  showRuntimeRecovery(runtime);
  if (runtime.running) {
    const external = runtime.source !== "bridge";
    state.activeTurnId = external ? null : (runtime.turnId ?? state.activeTurnId);
    setBusy(true, { external });
    setLivePill(true, liveRunText(runtime.confidence), { stalled: runtime.confidence === "stalled" });
  } else {
    state.activeTurnId = null;
    setBusy(false);
    setLivePill(false);
  }
  return runtime;
}

async function resyncOpenThread({ force = false } = {}) {
  const t = state.active;

  if (!t || t.draft || state.resyncing) { return; }

  // Never introduce a second producer while this bridge is already streaming
  // the turn. A focus/online "force" refresh used to replay Claude's session
  // file alongside its live deltas, drawing every assistant message twice.
  // The provider terminal schedules one canonical refresh immediately after
  // ownership ends, which also recovers anything missed during a disconnect.
  if (state.busy && !state.externalTurn) {
    if (!force) { return; }
    try {
      const probe = await api(`/api/thread/runtime?provider=${encodeURIComponent(t.provider || "codex")}&threadId=${encodeURIComponent(t.id)}`);
      if (probe.runtime?.running && probe.runtime?.source === "bridge") { return; }
    } catch { return; }
  }

  // Following along at the bottom should keep following; someone reading back
  // through the transcript should stay where they are.
  const b = box();
  const wasAtBottom = atBottom();
  const prevTop = b.scrollTop;

  state.resyncing = true;
  state.fetching = true;

  // Say what's happening while the fetch is in flight — a thread being followed
  // from elsewhere would otherwise just sit there looking stuck.
  if (state.externalTurn) { setLivePill(true, "Loading new messages…", { stalled: false }); }

  try {
    const res = await api("/api/thread?id=" + encodeURIComponent(t.id) + "&provider=" + encodeURIComponent(t.provider || "codex"));
    state.items = new Map();
    renderHistory(res.thread, res.itemWindow);
    // renderHistory replaces the transcript DOM, including status chips that
    // are not provider messages. Restore the durable server-side retry state so
    // its minute-check status and controls cannot disappear after a refresh.
    renderOpenUsageRetryState();
    state.threadUserProgress = res.userProgress ?? state.threadUserProgress;
    state.fetching = false;
    setCursor(res);
    reconcileNativeCodexQueue(t);
    if (res.runtime) {
      markRunning(t.provider, t.id, !!res.runtime.running, { confidence: res.runtime.confidence });
      updateResumeButton(res.runtime);
      showRuntimeRecovery(res.runtime);
    }

    if (wasAtBottom) { scrollDown({ force: true }); } else { b.scrollTop = prevTop; syncStick(); }

    if (isRunning(t.provider, t.id)) {
      state.activeTurnId = res.runtime?.source === "bridge" ? (res.runtime?.turnId ?? state.activeTurnId) : null;
      setBusy(true, { external: res.runtime?.source !== "bridge" });
      setLivePill(true, liveRunText(res.runtime?.confidence), { stalled: res.runtime?.confidence === "stalled" });
    } else if (res.runtime && ["provider", "bridge", "marker"].includes(res.runtime.confidence)) {
      state.activeTurnId = null;
      setBusy(false);
      flushPending();
    }
  } catch (e) {
    // Unreachable or transient — keep whatever's on screen, but say why it's stale.
    if (e.reach) { setOfflineNote(true, e.reach); }
  } finally {
    state.resyncing = false;
    state.fetching = false;
  }
}

// ---------- events ----------
// EventSource only retries by itself when the *connection* drops. If the server
// answers at all with the wrong status or MIME type — a proxy's 530 error page
// while the Mac is down — the spec calls that a fatal failure: the browser
// closes the stream for good and live updates never return without a reload. So
// we reconnect ourselves, backing off to a minute while the outage lasts.
const SSE_RETRY_MIN_MS = 3000;
const SSE_RETRY_MAX_MS = 60000;
let sseRetryMs = SSE_RETRY_MIN_MS;
let sseRetryTimer = null;
let sse = null;

// Bringing the app forward, or the phone regaining network, is a much better
// hint than the backoff clock — retry at once instead of waiting it out.
function reconnectNow() {
  if (sse && sse.readyState !== EventSource.CLOSED) { return; }

  clearTimeout(sseRetryTimer);
  sseRetryTimer = null;
  sseRetryMs = SSE_RETRY_MIN_MS;
  connectEvents();
}

function scheduleReconnect() {
  if (sseRetryTimer) { return; }

  sseRetryTimer = setTimeout(() => {
    sseRetryTimer = null;
    connectEvents();
  }, sseRetryMs);

  sseRetryMs = Math.min(sseRetryMs * 2, SSE_RETRY_MAX_MS);
}

function connectEvents() {
  const es = new EventSource("/api/events");
  sse = es;
  es.onopen = () => {
    sseRetryMs = SSE_RETRY_MIN_MS;
    $("connDot").classList.add("on");

    // The stream only opens if the Mac is answering, so this is the earliest
    // and most reliable signal that an outage is over.
    setOfflineNote(false);
    restartAutomaticDeliveryChecks();

    // Reconnected after a drop (e.g. resumed from background) — catch up.
    if (state.sseErrored) {
      state.sseErrored = false;
      resyncView({ force: true });
    }

    refreshApprovals();
    refreshLockStatus();
  };
  es.onerror = () => {
    $("connDot").classList.remove("on");
    state.sseErrored = true;

    // CLOSED means the browser has given up; anything else it retries itself.
    if (es.readyState === EventSource.CLOSED) {
      setOfflineNote(true, navigator.onLine ? "host" : "phone");
      scheduleReconnect();
    }
  };
  es.addEventListener("approval", (e) => {
    const a = JSON.parse(e.data);

    if (a.provider && a.provider !== activeProvider()) { return; }

    if (state.active && (a.params?.threadId === state.active.id || a.params?.threadId === state.active.draftId)) { showApproval(a); }
  });
  es.addEventListener("notify", (e) => { const { method, params, provider } = JSON.parse(e.data); onNotify(method, params, provider); });
  es.addEventListener("send-stage", (e) => {
    const frame = JSON.parse(e.data);

    if (["turn_started", "provider_accepted"].includes(frame.stage)) { confirmProviderAcceptedInUi(frame); }
    if (frame.provider === activeProvider()) { updateSendProgress(frame); }
  });
  es.addEventListener("usage-retry", (e) => updateUsageRetry(JSON.parse(e.data).entry));
  es.addEventListener("lock", (e) => {
    const frame = JSON.parse(e.data);
    const open = state.active && frame.provider === "codex" && frame.threadId === state.active.id;

    if (!open) { return; }

    const labels = { held: "You have it", elsewhere: "Open elsewhere", free: "Not held here" };
    setLockStatus({ ...frame, label: labels[frame.state] || "Checking…" });
  });

  // A turn this bridge never started — begun in a terminal, an IDE, or on
  // another device. The server watches the CLI's own session file and tells us
  // when it moves; re-reading the thread *is* the stream for those turns.
  es.addEventListener("external", (e) => {
    const { provider, threadId, running, runConfidence, result, ops } = JSON.parse(e.data);
    const open = state.active && (threadId === state.active.id || threadId === state.active.draftId);

    // A turn we started here is the authority on its own state. The session file
    // lags it — at the start of a turn it still holds the *previous* turn's end
    // marker — and acting on that would tear down the live UI mid-stream.
    if (open && state.busy && !state.externalTurn) {
      // The browser may remember ownership across a bridge restart while the
      // new bridge correctly has no such in-memory turn. Verify with the new
      // bridge before suppressing the file event. This keeps the duplicate
      // renderer guard for a genuinely live bridge turn, but immediately turns
      // a provider-confirmed interruption into the shared Resume action.
      reconcileOpenRuntime(state.active).then((runtime) => {
        if (runtime && !runtime.running) { resyncOpenThread({ force: true }); }
      }).catch(() => {});
      return;
    }

    markRunning(provider, threadId, running, { confidence: runConfidence });

    if (!open) { return; }

    if (running) {
      setBusy(true, { external: true });
      setLivePill(true, liveRunText(runConfidence), { stalled: runConfidence === "stalled" });
    }

    // The server says explicitly what happened, rather than leaving us to infer
    // it from a missing field — an inference that was quietly doing nothing.
    applyExternalFrame(JSON.parse(e.data));
  });
}

// ---------- init ----------
async function refreshModelsAfterAccountChange(provider) {
  const thread = state.active && (state.active.provider || state.provider) === provider ? state.active : null;
  if (!thread) { return initModels(provider); }

  const previousSelection = { model: state.model, effort: state.effort };
  state.settingsTruth = { state: "loading", sources: {}, message: "Account changed · restoring this thread's settings…" };
  syncControls();
  const ready = await initModels(provider, thread.id, { deferSync: true });
  if (state.active !== thread) { return ready; }
  state.model = previousSelection.model;
  state.effort = previousSelection.effort;
  await loadThreadSettings(thread, { flush: false });
  return ready;
}

async function initModels(provider = state.provider, threadId = null, { deferSync = false } = {}) {
  const requestSeq = ++state.modelRequestSeq;

  try {
    const res = await api("/api/models?provider=" + encodeURIComponent(provider)
      + (threadId ? "&threadId=" + encodeURIComponent(threadId) : ""));
    if (requestSeq !== state.modelRequestSeq) { return false; }
    state.models = res.data ?? [];
    state.capabilitiesByProvider.set(provider, res.capabilities ?? null);
    state.modelsReady = state.models.length > 0;
    state.modelsProvider = provider;
    const prefs = loadPrefs();
    const def = state.models.find((m) => m.isDefault) || state.models[0];
    state.model = prefs.model && state.models.some((m) => m.id === prefs.model) ? prefs.model : def?.id ?? null;
    const m = currentModel();
    const efforts = (m?.supportedReasoningEfforts ?? []).map((e) => e.reasoningEffort);
    state.effort = prefs.effort && efforts.includes(prefs.effort) ? prefs.effort : m?.defaultReasoningEffort ?? efforts[0] ?? null;

    if (prefs.modeByProvider) { state.modeByProvider = { ...state.modeByProvider, ...prefs.modeByProvider }; }

    if (!deferSync) { syncControls(); }
    return state.modelsReady;
  } catch (error) {
    if (requestSeq !== state.modelRequestSeq) { return false; }
    state.models = [];
    state.modelsReady = false;
    state.modelsProvider = null;
    state.model = null;
    state.effort = null;
    state.settingsTruth = { state: "error", sources: {}, message: "Models unavailable · send blocked" };
    if (!deferSync) { syncControls(); }
    return false;
  }
}

// wiring
$("backBtn").onclick = backToList;
$("sidebarToggleBtn").onclick = () => toggleSidebar();
$("loadMore").onclick = () => loadThreads(true);
let sendHoldTimer = null;
let suppressSendClickUntil = 0;
function openSendActionsMenu() {
  const hasMessage = !!$('input').value.trim() || state.composerAttachments.length > 0;
  const canSend = hasMessage && !$('sendBtn').disabled;
  openControlPopover($("sendBtn"), `<div class="control-menu-title">Message action</div>
    <button type="button" class="control-menu-row" id="steerActionMobile"${canSend ? "" : " disabled"}><span class="menu-label">Steer</span></button>
    <button type="button" class="control-menu-row" id="queueActionMobile"${canSend ? "" : " disabled"}><span class="menu-label">Queue</span></button>
    <button type="button" class="control-menu-row" id="saveActionDraft"${hasMessage ? "" : " disabled"}><span class="menu-label">Save as draft</span></button>`, "send-actions");
  $('steerActionMobile').onclick = () => { closeControlPopover(); send("steer"); };
  $('queueActionMobile').onclick = () => { closeControlPopover(); send("queue"); };
  $('saveActionDraft').onclick = () => { if (saveCurrentAsDraft()) { closeControlPopover(); } };
}
$("sendBtn").onclick = () => {
  if (Date.now() < suppressSendClickUntil) { return; }
  send();
};
$("sendActions").addEventListener("pointerdown", (event) => {
  if (event.pointerType === "mouse") { return; }
  clearTimeout(sendHoldTimer);
  sendHoldTimer = setTimeout(() => {
    suppressSendClickUntil = Date.now() + 1000;
    navigator.vibrate?.(15);
    openSendActionsMenu();
  }, 500);
});
for (const eventName of ["pointerup", "pointercancel", "pointerleave"]) {
  $("sendActions").addEventListener(eventName, () => { clearTimeout(sendHoldTimer); sendHoldTimer = null; });
}
$("steerAction").onclick = () => send("steer");
$("queueAction").onclick = () => send("queue");
$("saveDraftAction").onclick = () => saveCurrentAsDraft();
$("resumeBtn").onclick = () => resumeInterruptedTurn();
$("attachBtn").onclick = () => {
  if (!supportsInput("image")) { chip("⚠️", `${providerLabel()} does not advertise image prompt support`); return; }
  $("imageInput").click();
};
$("draftStrip").onclick = openDraftsSheet;
$("agentToggleInput").onchange = () => setShowAgentSessions($("agentToggleInput").checked);
$("usageFootBtn").onclick = openUsageSheet;
$("appSettingsBtn").onclick = () => openSettingsWindow();
$("imageInput").onchange = () => uploadImages($("imageInput").files);
let composerDragDepth = 0;
const composerWrap = $("composerWrap");
const containsDraggedFiles = (event) => [...(event.dataTransfer?.types ?? [])].includes("Files") || !!event.dataTransfer?.files?.length;

composerWrap.addEventListener("dragenter", (event) => {
  if (!containsDraggedFiles(event)) { return; }
  event.preventDefault();
  composerDragDepth++;
  composerWrap.classList.add("dragover");
});
composerWrap.addEventListener("dragover", (event) => {
  if (!containsDraggedFiles(event)) { return; }
  event.preventDefault();
  event.dataTransfer.dropEffect = "copy";
});
composerWrap.addEventListener("dragleave", (event) => {
  if (!composerDragDepth) { return; }
  composerDragDepth = Math.max(0, composerDragDepth - 1);
  if (!composerDragDepth) { composerWrap.classList.remove("dragover"); }
});
composerWrap.addEventListener("drop", (event) => {
  if (!containsDraggedFiles(event)) { return; }
  event.preventDefault();
  composerDragDepth = 0;
  composerWrap.classList.remove("dragover");
  const images = [...(event.dataTransfer?.files ?? [])].filter((file) => file.type.startsWith("image/"));

  if (!images.length) { chip("⚠️", "Drop PNG, JPEG, GIF, or WebP images here"); return; }
  uploadImages(images);
});
// Never let a browser navigate away from the running agent because a file was
// dropped a few pixels outside the composer.
document.addEventListener("dragover", (event) => {
  if (containsDraggedFiles(event)) { event.preventDefault(); }
});
document.addEventListener("drop", (event) => {
  if (containsDraggedFiles(event)) { event.preventDefault(); }
});
$("input").addEventListener("paste", (event) => {
  const images = [...(event.clipboardData?.files ?? [])].filter((file) => file.type.startsWith("image/"));

  if (images.length) {
    event.preventDefault();
    uploadImages(images);
  }
});
// Right-click on desktop, long-press on touch: one place for per-session
// actions. Delegated to the list container because rows are rebuilt from
// scratch on every refresh.
let rowHoldTimer = null;
let rowHoldOrigin = null;
let suppressRowClick = false;

function threadFromRowEvent(event) {
  const row = event.target?.closest?.(".row");

  if (!row) { return null; }

  const key = threadRuleKey(row.dataset.provider, row.dataset.tid);
  return listedThreads().find((thread) => threadRuleKey(thread.provider, thread.id) === key) ?? null;
}

function cancelRowHold() {
  clearTimeout(rowHoldTimer);
  rowHoldTimer = null;
  rowHoldOrigin = null;
}

$("listView").addEventListener("contextmenu", (event) => {
  const thread = threadFromRowEvent(event);

  if (!thread) { return; }

  event.preventDefault();
  cancelRowHold();
  // iOS raises contextmenu for the same long press the timer below already
  // handled, which would reposition the menu that is already open.
  if (controlPopoverPoint) { return; }

  openRowMenu(thread, { x: event.clientX, y: event.clientY });
});

$("listView").addEventListener("pointerdown", (event) => {
  // Cleared per gesture rather than on a timer, so the flag can never outlive
  // the press that set it and eat a later tap.
  suppressRowClick = false;
  cancelRowHold();

  if (event.pointerType === "mouse") { return; }
  if (event.target?.closest?.(".row-action, .subagent-row")) { return; }

  const thread = threadFromRowEvent(event);

  if (!thread) { return; }

  rowHoldOrigin = { x: event.clientX, y: event.clientY };
  rowHoldTimer = setTimeout(() => {
    rowHoldTimer = null;
    suppressRowClick = true;
    navigator.vibrate?.(15);
    openRowMenu(thread, rowHoldOrigin);
  }, 500);
});

// A drag that starts on a row is the list scrolling, not a press.
$("listView").addEventListener("pointermove", (event) => {
  if (!rowHoldTimer || !rowHoldOrigin) { return; }
  if (Math.abs(event.clientX - rowHoldOrigin.x) > 10 || Math.abs(event.clientY - rowHoldOrigin.y) > 10) { cancelRowHold(); }
});

for (const eventName of ["pointerup", "pointercancel", "pointerleave"]) {
  $("listView").addEventListener(eventName, cancelRowHold);
}

// The menu is pinned to a viewport point, so scrolling the rows out from under
// it would leave it pointing at nothing. Only point-anchored menus care.
$("listView").addEventListener("scroll", () => {
  if (controlPopoverPoint) { closeControlPopover(); }
}, { passive: true });

// Capture phase, so a long press cannot also run the row's own open handler.
$("listView").addEventListener("click", (event) => {
  if (!suppressRowClick) { return; }
  suppressRowClick = false;
  event.stopPropagation();
  event.preventDefault();
}, true);

$("imageViewer").onclick = closeAttachmentViewer;
$("stopBtn").onclick = stopAgent;
$("okBtn").onclick = () => answerApproval("approve");
$("sessBtn").onclick = () => answerApproval("session");
$("noBtn").onclick = () => answerApproval("deny");
$("modelEffortCtl").onclick = () => toggleControlPopover($("modelEffortCtl"), openModelEffortSheet);
$("modeCtl").onclick = () => toggleControlPopover($("modeCtl"), openModeSheet);
$("lockCtl").onclick = () => toggleControlPopover($("lockCtl"), openLockSheet);
$("newBtn").onclick = openNewSession;
$("usageBtn").onclick = openUsageSheet;
$("notifyBtn").onclick = () => state.active && openTaskNotificationSheet(state.active);
$("settingsBtn").onclick = openTaskSettingsSheet;
$("diffBtn").onclick = () => openDiffSheet(state.lastDiff || "No diff");
$("filesBtn").onclick = openFilesSheet;
$("terminalBtn").onclick = openNativeTerminal;
$("terminalPanelClose").onclick = closeTerminalPanel;
$("terminalOpenTab").onclick = openTerminalInNewTab;
$("terminalDockBottom").onclick = () => applyTerminalDock("bottom");
$("terminalDockRight").onclick = () => applyTerminalDock("right");
$("terminalPanelResize").addEventListener("pointerdown", resizeTerminalPanel);
$("providerSeg").querySelectorAll("[data-provider]").forEach((b) => {
  b.onclick = () => switchProvider(b.dataset.provider);
});
$("viewSeg").querySelectorAll("[data-view]").forEach((b) => {
  b.onclick = () => switchListView(b.dataset.view);
});

// The only place stickiness is decided. Scrolling away turns auto-follow off;
// scrolling back to the bottom turns it on again.
$("messages").addEventListener("scroll", () => {
  stickToBottom = atBottom();
  updateJumpBtn();
}, { passive: true });

// Code cards also appear in rendered Markdown files inside the sheet. Identity
// checks in copyCodeBlock mean a sanitized agent-authored lookalike is inert.
document.addEventListener("click", (event) => {
  const copy = event.target.closest?.(".code-copy");
  if (copy) { copyCodeBlock(copy); }
});

$("jumpBtn").onclick = () => scrollDown({ force: true });

$("input").addEventListener("input", function () {
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 120) + "px";
  scheduleComposerDraftSave();
  syncComposerPrimaryAction();
});
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !("ontouchstart" in window)) { e.preventDefault(); send(); }
});
$("search").addEventListener("input", () => {
  clearTimeout(state.searchTimer);
  state.searchTimer = setTimeout(() => loadThreads(false), 350);
});
window.addEventListener("pagehide", saveComposerDraft);

// Desktop-native navigation: jump to the persistent sidebar without reaching
// for the pointer, and dismiss centered dialogs with the conventional key.
document.addEventListener("keydown", (event) => {
  if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") {
    event.preventDefault();
    if (state.active && state.sidebarCollapsed) { toggleSidebar(true); }
    $("search").focus();
    $("search").select();
  } else if (event.key === "Escape" && !$("settingsWindow").hidden) {
    closeSettingsWindow();
  } else if (event.key === "Escape" && $("imageViewer").classList.contains("show")) {
    closeAttachmentViewer();
  } else if (event.key === "Escape" && $("controlPopover").classList.contains("show")) {
    closeControlPopover({ restoreFocus: true });
  } else if (event.key === "Escape" && $("sheet").classList.contains("show")) {
    closeSheet();
  }
});

document.addEventListener("pointerdown", (event) => {
  const popover = $("controlPopover");
  if (!popover.classList.contains("show")) { return; }
  if (popover.contains(event.target) || controlPopoverAnchor?.contains(event.target)) { return; }
  closeControlPopover();
});
window.addEventListener("resize", positionControlPopover);

// Local-path links (see localFileTarget) open in the file viewer instead of
// navigating the browser to a path this server does not serve.
document.addEventListener("click", (e) => {
  const a = e.target.closest?.("a");

  if (!a) { return; }

  const target = localFileTarget(a.getAttribute("href"));

  if (!target) { return; }

  e.preventDefault();
  openFileSheet(target.path, "", target.line);
});

// iOS ignores user-scalable=no, so block the pinch gestures directly: a zoomed
// page lays out wider than the screen and clips the right edge of the chat.
["gesturestart", "gesturechange", "gestureend"].forEach((evt) => {
  document.addEventListener(evt, (e) => e.preventDefault(), { passive: false });
});

document.addEventListener("touchmove", (e) => {
  if (e.touches.length > 1) { e.preventDefault(); }
}, { passive: false });

// Auto-sync: when the app returns to the foreground (or the network comes back),
// re-fetch what's on screen so a home-screen PWA never shows stale state.
document.addEventListener("visibilitychange", () => {
  sendPresence();

  if (!document.hidden) {
    restartAutomaticDeliveryChecks();
    reconnectNow();
    loadNotificationRules().then(() => { if (!state.active) { renderRows(false); } });
    // A healthy stream already carries a bridge-owned turn. If it had dropped,
    // connectEvents.onopen performs the forced canonical catch-up.
    resyncView();
  }
});

// Heartbeat so a long read keeps suppressing, and the report expires if we die.
setInterval(() => {
  if (!document.hidden && state.active) { sendPresence(); }
}, 30000);
window.addEventListener("online", () => { setOfflineNote(false); reconnectNow(); restartAutomaticDeliveryChecks(); resyncView({ force: true }); });
window.addEventListener("offline", () => setOfflineNote(true, "phone"));

function initProvider() {
  const prefs = loadPrefs();

  state.provider = AVAILABLE_PROVIDER_NAMES[0] || null;
  if (prefs.provider && PROVIDER_LABELS[prefs.provider]) { state.provider = prefs.provider; }
  state.providerScope = prefs.providerScope === "all" || PROVIDER_LABELS[prefs.providerScope]
    ? prefs.providerScope
    : prefs.listView === "provider" && PROVIDER_LABELS[prefs.provider] ? prefs.provider : "all";
  if (["recent", "projects"].includes(prefs.listView)) { state.listView = prefs.listView; }
  state.sidebarCollapsed = prefs.sidebarCollapsed === true;
  state.showAgentSessions = prefs.showAgentSessions === true;

  $("providerSeg").querySelectorAll("[data-provider]").forEach((button) => {
    button.style.display = button.dataset.provider === "all" || PROVIDER_LABELS[button.dataset.provider] ? "" : "none";
  });
  $("newBtn").disabled = !AVAILABLE_PROVIDER_NAMES.length;
  $("newBtn").title = AVAILABLE_PROVIDER_NAMES.length ? "New chat" : "No signed-in provider is available";

  syncProviderSeg();
  syncSidebarToggle();
  updateListChrome();
}

function applyAvailableProviders(names) {
  const next = [...new Set(Array.isArray(names) ? names : [])].filter((name) => ALL_PROVIDER_LABELS[name]);
  AVAILABLE_PROVIDER_NAMES = next;
  PROVIDER_LABELS = Object.fromEntries(next.map((name) => [name, ALL_PROVIDER_LABELS[name]]));

  if (!state.provider || !PROVIDER_LABELS[state.provider]) { state.provider = next[0] || null; }
  if (state.providerScope !== "all" && !PROVIDER_LABELS[state.providerScope]) { state.providerScope = "all"; }

  $("providerSeg").querySelectorAll("[data-provider]").forEach((button) => {
    button.style.display = button.dataset.provider === "all" || PROVIDER_LABELS[button.dataset.provider] ? "" : "none";
  });
  $("newBtn").disabled = !next.length;
  $("newBtn").title = next.length ? "New chat" : "No installed provider is available";
  syncProviderSeg();
  updateListChrome();
}

async function refreshAvailableProviders() {
  try {
    const result = await api("/api/providers");
    applyAvailableProviders(result.providers);
  } catch {
    // The cached shell is still useful offline. A successful reconnect/reload
    // will replace this fallback with the bridge's current provider inventory.
  }
}

// Register the service worker for instant launch + offline app shell.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch(() => {});
  });
}

wireInstallOnboarding();
wireNotificationOnboarding();
// The old per-device thread cache is intentionally retired. Provider state and
// the bridge's atomic server-side store are the only thread authorities now.
try { localStorage.removeItem("cxp_thread_prefs"); } catch {}
initProvider();
state.failedSends = loadFailedSends();
connectEvents();
refreshAvailableProviders().then(() => {
  if (state.provider) { initModels(); }
  return Promise.all([loadNotificationRules(), Promise.all([loadThreadStars(), loadHiddenThreads(), loadManualOrigins()]).then(() => loadThreads(false))]);
}).then(() => openLinkedThread().catch(() => {}));
</script>
</body>

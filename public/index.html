    const data = await api("/api/usage?refresh=1&provider=" + encodeURIComponent(provider));
    if (requestSeq === usageSheetRequestSeq && $("sheet").classList.contains("show") && $("sheetBody").dataset.sheetKind === "usage") { renderUsageSheet(provider, data); }
  } catch (error) {
    if (requestSeq === usageSheetRequestSeq && $("sheet").classList.contains("show") && $("sheetBody").dataset.sheetKind === "usage") { renderUsageSheet(provider, null, error); }
  }
}

function openUsageSheet() {
  const provider = activeProvider();
  openSheet(`<h2>Usage & limits</h2>${usageTabsHtml(provider)}<div class="hint">Refreshing ${esc(PROVIDER_LABELS[provider])}…</div>`);
  wireUsageSheet(provider);
  loadUsageSheet(provider);
}

// ---------- running-thread tracking ----------
// Re-reading the whole thread is how an external turn "streams", so it has to be
// throttled — an agent mid-turn rewrites its log many times a second.
const EXTERNAL_REFRESH_MS = 1500;
let externalRefreshAt = 0;
let externalRefreshTimer = null;

function scheduleExternalRefresh() {
  if (externalRefreshTimer) { return; }

  const wait = Math.max(0, EXTERNAL_REFRESH_MS - (Date.now() - externalRefreshAt));

  externalRefreshTimer = setTimeout(() => {
    externalRefreshTimer = null;
    externalRefreshAt = Date.now();
    resyncOpenThread();
  }, wait);
}

function runKey(provider, tid) { return (provider || "codex") + ":" + tid; }

function isRunning(provider, tid) { return state.running.has(runKey(provider, tid)); }

function isThreadRunning(thread, runningKeys = state.running) {
  if (!thread) { return false; }

  const provider = thread.provider || "codex";

  return runningKeys.has(runKey(provider, thread.id)) || (thread.subagents ?? []).some((child) =>
    runningKeys.has(runKey(child.provider || provider, child.id))
  );
}

// Pure ordering used by the live UI and exercised directly in tests. The
// server remains canonical, but a start event must promote the task before a
// network round-trip; a running subagent promotes its parent task as well.
function rankLiveThreads(threads, runningKeys) {
  const key = (provider, tid) => (provider || "codex") + ":" + tid;
  const active = (thread) => {
    const provider = thread?.provider || "codex";

    return !!thread && (runningKeys.has(key(provider, thread.id)) || (thread.subagents ?? []).some((child) =>
      runningKeys.has(key(child.provider || provider, child.id))
    ));
  };

  return [...(threads ?? [])].sort((a, b) => {
    const running = Number(active(b)) - Number(active(a));

    if (running) { return running; }

    const updated = Number(b?.updatedAt ?? 0) - Number(a?.updatedAt ?? 0);

    if (updated) { return updated; }

    return `${a?.provider ?? ""}:${a?.id ?? ""}`.localeCompare(`${b?.provider ?? ""}:${b?.id ?? ""}`);
  });
}

const LIST_RECONCILE_MS = 600;
let listReconcileTimer = null;

function scheduleListReconcile() {
  if (listReconcileTimer) { clearTimeout(listReconcileTimer); }

  listReconcileTimer = setTimeout(() => {
    listReconcileTimer = null;

    loadThreads(false).catch(() => {});
  }, LIST_RECONCILE_MS);
}

function touchLiveThread(provider, tid) {
  const now = Math.floor(Date.now() / 1000);
  const affected = new Set();

  for (const thread of state.threads) {
    const threadProvider = thread.provider || "codex";

    if (thread.id === tid && threadProvider === (provider || "codex")) {
      thread.updatedAt = Math.max(Number(thread.updatedAt ?? 0), now);
      affected.add(thread.id);
    }

    for (const child of thread.subagents ?? []) {
      if (child.id !== tid || (child.provider || threadProvider) !== (provider || "codex")) { continue; }

      child.updatedAt = Math.max(Number(child.updatedAt ?? 0), now);
      thread.updatedAt = Math.max(Number(thread.updatedAt ?? 0), now);
      affected.add(thread.id);
      affected.add(child.id);
    }
  }

  return affected;
}

function rerankVisibleRows({ revealRunning = false } = {}) {
  if (!state.threads.length) { return; }

  const scrollTop = $("listView").scrollTop;
  state.threads = rankLiveThreads(state.threads, state.running);
  renderRows(false);
  // Starting work is the highest-signal list transition: reveal its promoted
  // row immediately. Completion keeps the reader's position stable.
  $("listView").scrollTop = revealRunning ? 0 : scrollTop;
}

function markRunning(provider, tid, on, { confidence = "unknown", live = true } = {}) {
  if (!tid) { return; }

  const k = runKey(provider, tid);
  const had = state.running.has(k);
  const previousConfidence = state.runConfidence.get(k);
  state.runConfidence.set(k, confidence);

  if (on) { state.running.add(k); } else { state.running.delete(k); }

  if (had !== on && live) {
    touchLiveThread(provider, tid);

    rerankVisibleRows({ revealRunning: on });

    scheduleListReconcile();
  } else if (live && previousConfidence !== confidence) {
    updateRowRunning(provider, tid, on, confidence);
  }

  // Keep the open thread's composer state honest if its run-state changed
  // elsewhere — and deliver anything queued behind that turn.
  //
  // A turn driven from the Mac or another device ends by file observation:
  // there is no turn/completed notification for it, because we are not the one
  // running it. That made this the only code that could release the composer,
  // and it used to refuse to whenever something was queued — so a message typed
  // during such a turn stayed pending forever, was never sent, and vanished on
  // reload. Our own turns still end via turn/completed, which flushes there.
  const ownTurnRunning = state.busy && !state.externalTurn;

  const confirmedEnd = confidence === "provider" || confidence === "bridge" || confidence === "marker";
  const abnormalEnd = confidence === "stale_timeout";
  const activeMatch = state.active && provider === activeProvider() && (tid === state.active.id || tid === state.active.draftId);

  if (activeMatch && !on && !ownTurnRunning && confirmedEnd) {
    setBusy(false);
    flushPending();
  } else if (activeMatch && !on && !ownTurnRunning && abnormalEnd) {
    state.activeTurnId = null;
    setBusy(false);
    showTurnFailure(
      "No provider activity was recorded for 10 minutes. The agent may have exited without reporting a final result. Check the latest messages before retrying or sending again.",
      `stale-timeout:${provider}:${tid}`,
    );
  }

  if (activeMatch && !on && state.pending.length && !confirmedEnd) {
    for (const entry of state.pending) {
      const label = entry.chip?.querySelector("span");

      if (label) { label.textContent = "Completion could not be confirmed — check the thread, then tap Retry to try now"; }
      entry.retryRequired = true;
      markSendFailed(entry.bubble, () => retryPendingEntry(entry), {
        onDismiss: () => removePendingEntry(entry, { allowUncertain: true }),
      });
    }

    savePending();
  }
}

function updateRowRunning(provider, tid, on, confidence) {
  const escaped = window.CSS?.escape ? CSS.escape(tid) : tid;
  const presentation = runPresentation(on, confidence);

  document.querySelectorAll('#rows [data-tid="' + escaped + '"]').forEach((row) => {
    if ((row.dataset.provider || "codex") !== (provider || "codex")) { return; }
    const badge = row.querySelector(":scope > .run-badge, :scope > .row-head .run-badge");
    if (badge) {
      badge.style.display = presentation.visible ? "inline-flex" : "none";
      badge.classList.toggle("stalled", presentation.className === "stalled");
      badge.classList.toggle("abnormal", presentation.className === "abnormal");
      const label = badge.querySelector(".run-label");
      if (label) { label.textContent = presentation.label; }
    }
    const ready = row.querySelector(":scope > .row-head .ready-badge");
    if (ready) { ready.style.display = !on && presentation.className !== "abnormal" && state.listView === "recent" ? "inline-flex" : "none"; }
  });
}

// ---------- auto-sync (focus / reconnect / online) ----------
// Re-fetch whatever's on screen so a backgrounded PWA shows the truth on return
// and recovers any events missed while the stream was dropped.
function resyncView({ force = false } = {}) {
  if (state.active && !state.active.draft) {
    resyncOpenThread({ force });
  } else if (!state.active) {
    loadThreads(false).catch(() => {});
  }
}

async function resyncOpenThread({ force = false } = {}) {
  const t = state.active;

  if (!t || t.draft || state.resyncing) { return; }

  // Never introduce a second producer while this bridge is already streaming
  // the turn. A focus/online "force" refresh used to replay Claude's session
  // file alongside its live deltas, drawing every assistant message twice.
  // The provider terminal schedules one canonical refresh immediately after
  // ownership ends, which also recovers anything missed during a disconnect.
  if (state.busy && !state.externalTurn) { return; }

  // Following along at the bottom should keep following; someone reading back
  // through the transcript should stay where they are.
  const b = box();
  const wasAtBottom = atBottom();
  const prevTop = b.scrollTop;

  state.resyncing = true;
  state.fetching = true;

  // Say what's happening while the fetch is in flight — a thread being followed
  // from elsewhere would otherwise just sit there looking stuck.
  if (state.externalTurn) { setLivePill(true, "Loading new messages…", { stalled: false }); }

  try {
    const res = await api("/api/thread?id=" + encodeURIComponent(t.id) + "&provider=" + encodeURIComponent(t.provider || "codex"));
    state.items = new Map();
    renderHistory(res.thread, res.itemWindow);
    state.fetching = false;
    setCursor(res);
    reconcileNativeCodexQueue(t);
    if (res.runtime) {
      markRunning(t.provider, t.id, !!res.runtime.running, { confidence: res.runtime.confidence });
    }

    if (wasAtBottom) { scrollDown({ force: true }); } else { b.scrollTop = prevTop; syncStick(); }

    if (isRunning(t.provider, t.id)) {
      state.activeTurnId = res.runtime?.source === "bridge" ? (res.runtime?.turnId ?? state.activeTurnId) : null;
      setBusy(true, { external: res.runtime?.source !== "bridge" });
      setLivePill(true, liveRunText(res.runtime?.confidence), { stalled: res.runtime?.confidence === "stalled" });
    } else if (res.runtime && ["provider", "bridge", "marker"].includes(res.runtime.confidence)) {
      state.activeTurnId = null;
      setBusy(false);
      flushPending();
    }
  } catch (e) {
    // Unreachable or transient — keep whatever's on screen, but say why it's stale.
    if (e.reach) { setOfflineNote(true, e.reach); }
  } finally {
    state.resyncing = false;
    state.fetching = false;
  }
}

// ---------- events ----------
// EventSource only retries by itself when the *connection* drops. If the server
// answers at all with the wrong status or MIME type — a proxy's 530 error page
// while the Mac is down — the spec calls that a fatal failure: the browser
// closes the stream for good and live updates never return without a reload. So
// we reconnect ourselves, backing off to a minute while the outage lasts.
const SSE_RETRY_MIN_MS = 3000;
const SSE_RETRY_MAX_MS = 60000;
let sseRetryMs = SSE_RETRY_MIN_MS;
let sseRetryTimer = null;
let sse = null;

// Bringing the app forward, or the phone regaining network, is a much better
// hint than the backoff clock — retry at once instead of waiting it out.
function reconnectNow() {
  if (sse && sse.readyState !== EventSource.CLOSED) { return; }

  clearTimeout(sseRetryTimer);
  sseRetryTimer = null;
  sseRetryMs = SSE_RETRY_MIN_MS;
  connectEvents();
}

function scheduleReconnect() {
  if (sseRetryTimer) { return; }

  sseRetryTimer = setTimeout(() => {
    sseRetryTimer = null;
    connectEvents();
  }, sseRetryMs);

  sseRetryMs = Math.min(sseRetryMs * 2, SSE_RETRY_MAX_MS);
}

function connectEvents() {
  const es = new EventSource("/api/events");
  sse = es;
  es.onopen = () => {
    sseRetryMs = SSE_RETRY_MIN_MS;
    $("connDot").classList.add("on");

    // The stream only opens if the Mac is answering, so this is the earliest
    // and most reliable signal that an outage is over.
    setOfflineNote(false);

    // Reconnected after a drop (e.g. resumed from background) — catch up.
    if (state.sseErrored) {
      state.sseErrored = false;
      resyncView({ force: true });
    }

    refreshApprovals();
    refreshLockStatus();
  };
  es.onerror = () => {
    $("connDot").classList.remove("on");
    state.sseErrored = true;

    // CLOSED means the browser has given up; anything else it retries itself.
    if (es.readyState === EventSource.CLOSED) {
      setOfflineNote(true, navigator.onLine ? "host" : "phone");
      scheduleReconnect();
    }
  };
  es.addEventListener("approval", (e) => {
    const a = JSON.parse(e.data);

    if (a.provider && a.provider !== activeProvider()) { return; }

    if (state.active && (a.params?.threadId === state.active.id || a.params?.threadId === state.active.draftId)) { showApproval(a); }
  });
  es.addEventListener("notify", (e) => { const { method, params, provider } = JSON.parse(e.data); onNotify(method, params, provider); });
  es.addEventListener("send-stage", (e) => {
    const frame = JSON.parse(e.data);

    if (frame.provider === activeProvider()) { updateSendProgress(frame); }
  });
  es.addEventListener("lock", (e) => {
    const frame = JSON.parse(e.data);
    const open = state.active && frame.provider === "codex" && frame.threadId === state.active.id;

    if (!open) { return; }

    const labels = { held: "You have it", elsewhere: "Open elsewhere", free: "Not held here" };
    setLockStatus({ ...frame, label: labels[frame.state] || "Checking…" });
  });

  // A turn this bridge never started — begun in a terminal, an IDE, or on
  // another device. The server watches the CLI's own session file and tells us
  // when it moves; re-reading the thread *is* the stream for those turns.
  es.addEventListener("external", (e) => {
    const { provider, threadId, running, runConfidence, result, ops } = JSON.parse(e.data);
    const open = state.active && (threadId === state.active.id || threadId === state.active.draftId);

    // A turn we started here is the authority on its own state. The session file
    // lags it — at the start of a turn it still holds the *previous* turn's end
    // marker — and acting on that would tear down the live UI mid-stream.
    if (open && state.busy && !state.externalTurn) { return; }

    markRunning(provider, threadId, running, { confidence: runConfidence });

    if (!open) { return; }

    if (running) {
      setBusy(true, { external: true });
      setLivePill(true, liveRunText(runConfidence), { stalled: runConfidence === "stalled" });
    }

    // The server says explicitly what happened, rather than leaving us to infer
    // it from a missing field — an inference that was quietly doing nothing.
    applyExternalFrame(JSON.parse(e.data));
  });
}

// ---------- init ----------
async function initModels(provider = state.provider) {
  const requestSeq = ++state.modelRequestSeq;

  try {
    const res = await api("/api/models?provider=" + encodeURIComponent(provider));
    if (requestSeq !== state.modelRequestSeq) { return false; }
    state.models = res.data ?? [];
    state.capabilitiesByProvider.set(provider, res.capabilities ?? null);
    state.modelsReady = state.models.length > 0;
    state.modelsProvider = provider;
    const prefs = loadPrefs();
    const def = state.models.find((m) => m.isDefault) || state.models[0];
    state.model = prefs.model && state.models.some((m) => m.id === prefs.model) ? prefs.model : def?.id ?? null;
    const m = currentModel();
    const efforts = (m?.supportedReasoningEfforts ?? []).map((e) => e.reasoningEffort);
    state.effort = prefs.effort && efforts.includes(prefs.effort) ? prefs.effort : m?.defaultReasoningEffort ?? efforts[0] ?? null;

    if (prefs.modeByProvider) { state.modeByProvider = { ...state.modeByProvider, ...prefs.modeByProvider }; }

    if (prefs.sendMode && SEND_MODES[prefs.sendMode]) { state.sendMode = prefs.sendMode; }

    syncControls();
    return state.modelsReady;
  } catch (error) {
    if (requestSeq !== state.modelRequestSeq) { return false; }
    state.models = [];
    state.modelsReady = false;
    state.modelsProvider = null;
    state.model = null;
    state.effort = null;
    state.settingsTruth = { state: "error", sources: {}, message: "Models unavailable · send blocked" };
    syncControls();
    return false;
  }
}

$("imageInput").onchange = () => uploadImages($("imageInput").files);
let composerDragDepth = 0;
const composerWrap = $("composerWrap");
const containsDraggedFiles = (event) => [...(event.dataTransfer?.types ?? [])].includes("Files") || !!event.dataTransfer?.files?.length;

composerWrap.addEventListener("dragenter", (event) => {
  if (!containsDraggedFiles(event)) { return; }
  event.preventDefault();
  composerDragDepth++;
  composerWrap.classList.add("dragover");
});
composerWrap.addEventListener("dragover", (event) => {
  if (!containsDraggedFiles(event)) { return; }
  event.preventDefault();
  event.dataTransfer.dropEffect = "copy";
});
composerWrap.addEventListener("dragleave", (event) => {
  if (!composerDragDepth) { return; }
  composerDragDepth = Math.max(0, composerDragDepth - 1);
  if (!composerDragDepth) { composerWrap.classList.remove("dragover"); }
});
composerWrap.addEventListener("drop", (event) => {
  if (!containsDraggedFiles(event)) { return; }
  event.preventDefault();
  composerDragDepth = 0;
  composerWrap.classList.remove("dragover");
  const images = [...(event.dataTransfer?.files ?? [])].filter((file) => file.type.startsWith("image/"));

  if (!images.length) { chip("⚠️", "Drop PNG, JPEG, GIF, or WebP images here"); return; }
  uploadImages(images);
});
// Never let a browser navigate away from the running agent because a file was
// dropped a few pixels outside the composer.
document.addEventListener("dragover", (event) => {
  if (containsDraggedFiles(event)) { event.preventDefault(); }
});
document.addEventListener("drop", (event) => {
  if (containsDraggedFiles(event)) { event.preventDefault(); }
});
$("input").addEventListener("paste", (event) => {

  if (images.length) {

    uploadImages(images);
  }
});

$("stopBtn").onclick = stopAgent;
$("okBtn").onclick = () => answerApproval("approve");
$("sessBtn").onclick = () => answerApproval("session");
$("noBtn").onclick = () => answerApproval("deny");
$("modelCtl").onclick = openModelSheet;
$("effortCtl").onclick = openEffortSheet;
$("modeCtl").onclick = openModeSheet;
$("steerCtl").onclick = openSendModeSheet;
$("lockCtl").onclick = openLockSheet;
$("newBtn").onclick = openNewSession;
$("usageBtn").onclick = openUsageSheet;
$("notifyBtn").onclick = () => state.active && openTaskNotificationSheet(state.active);
$("diffBtn").onclick = () => openDiffSheet(state.lastDiff || "No diff");
$("filesBtn").onclick = openFilesSheet;
$("providerSeg").querySelectorAll("[data-provider]").forEach((b) => {
  b.onclick = () => switchProvider(b.dataset.provider);
});
$("viewSeg").querySelectorAll("[data-view]").forEach((b) => {
  b.onclick = () => switchListView(b.dataset.view);
});

// The only place stickiness is decided. Scrolling away turns auto-follow off;
// scrolling back to the bottom turns it on again.
$("messages").addEventListener("scroll", () => {
  stickToBottom = atBottom();
  updateJumpBtn();
}, { passive: true });

// Code cards also appear in rendered Markdown files inside the sheet. Identity
// checks in copyCodeBlock mean a sanitized agent-authored lookalike is inert.
document.addEventListener("click", (event) => {
  const copy = event.target.closest?.(".code-copy");
  if (copy) { copyCodeBlock(copy); }
});

$("jumpBtn").onclick = () => scrollDown({ force: true });

$("input").addEventListener("input", function () {
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 120) + "px";
});
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !("ontouchstart" in window)) { e.preventDefault(); send(); }
});
$("search").addEventListener("input", () => {
  clearTimeout(state.searchTimer);
  state.searchTimer = setTimeout(() => loadThreads(false), 350);
});

// Desktop-native navigation: jump to the persistent sidebar without reaching
// for the pointer, and dismiss centered dialogs with the conventional key.
document.addEventListener("keydown", (event) => {
  if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") {
    event.preventDefault();
    if (state.active && state.sidebarCollapsed) { toggleSidebar(true); }
    $("search").focus();
    $("search").select();
  } else if (event.key === "Escape" && $("imageViewer").classList.contains("show")) {
    closeAttachmentViewer();
  } else if (event.key === "Escape" && $("sheet").classList.contains("show")) {
    closeSheet();
  }
});

// Local-path links (see localFileTarget) open in the file viewer instead of
// navigating the browser to a path this server does not serve.
document.addEventListener("click", (e) => {
  const a = e.target.closest?.("a");

  if (!a) { return; }

  const target = localFileTarget(a.getAttribute("href"));

  if (!target) { return; }

  e.preventDefault();
  openFileSheet(target.path, "", target.line);
});

// iOS ignores user-scalable=no, so block the pinch gestures directly: a zoomed
// page lays out wider than the screen and clips the right edge of the chat.
["gesturestart", "gesturechange", "gestureend"].forEach((evt) => {
  document.addEventListener(evt, (e) => e.preventDefault(), { passive: false });
});

document.addEventListener("touchmove", (e) => {
  if (e.touches.length > 1) { e.preventDefault(); }
}, { passive: false });

// Auto-sync: when the app returns to the foreground (or the network comes back),
// re-fetch what's on screen so a home-screen PWA never shows stale state.
document.addEventListener("visibilitychange", () => {
  sendPresence();

  if (!document.hidden) {
    reconnectNow();
    loadNotificationRules().then(() => { if (!state.active) { renderRows(false); } });
    // A healthy stream already carries a bridge-owned turn. If it had dropped,
    // connectEvents.onopen performs the forced canonical catch-up.
    resyncView();
  }
});

// Heartbeat so a long read keeps suppressing, and the report expires if we die.
setInterval(() => {
  if (!document.hidden && state.active) { sendPresence(); }
}, 30000);
window.addEventListener("online", () => { setOfflineNote(false); reconnectNow(); resyncView({ force: true }); });
window.addEventListener("offline", () => setOfflineNote(true, "phone"));

function initProvider() {
  const prefs = loadPrefs();

  state.provider = AVAILABLE_PROVIDER_NAMES[0] || null;
  if (prefs.provider && PROVIDER_LABELS[prefs.provider]) { state.provider = prefs.provider; }
  if (["recent", "provider"].includes(prefs.listView)) { state.listView = prefs.listView; }
  state.sidebarCollapsed = prefs.sidebarCollapsed === true;

  $("providerSeg").querySelectorAll("[data-provider]").forEach((button) => {
    button.style.display = PROVIDER_LABELS[button.dataset.provider] ? "" : "none";
  });
  $("newBtn").disabled = !AVAILABLE_PROVIDER_NAMES.length;
  $("newBtn").title = AVAILABLE_PROVIDER_NAMES.length ? "New session" : "No signed-in provider is available";

  syncProviderSeg();
  syncSidebarToggle();
  updateListChrome();
}

// Register the service worker for instant launch + offline app shell.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch(() => {});
  });
}

wireInstallOnboarding();
wireNotificationOnboarding();
// The old per-device thread cache is intentionally retired. Provider state and
// the bridge's atomic server-side store are the only thread authorities now.
try { localStorage.removeItem("cxp_thread_prefs"); } catch {}
initProvider();
state.failedSends = loadFailedSends();
connectEvents();
if (state.provider) { initModels(); }
Promise.all([loadNotificationRules(), loadThreads(false)]).then(() => {
  openLinkedThread().catch(() => {});
});
</script>
</body>
</html>

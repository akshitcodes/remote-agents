    html += `<div class="seclabel">Daily tokens (recent)</div><div class="spark">` +
      recent.map((b) => `<div style="height:${Math.max(4, (b.tokens / max) * 100)}%" title="${b.startDate}: ${fmtTokens(b.tokens)}"></div>`).join("") + `</div>`;
  }

  // Claude-style usage: session cost + last-turn tokens + per-model breakdown.
  if (usage && usage.sessionCostUSD != null) {
    html += `<div class="seclabel">This session</div><div class="stat-grid">
      <div class="stat"><div class="v">$${usage.sessionCostUSD.toFixed(2)}</div><div class="k">spend this session</div></div>`;

    if (usage.lastInputTokens != null) {
      html += `<div class="stat"><div class="v">${fmtTokens(usage.lastInputTokens)}</div><div class="k">last input tokens</div></div>`;
    }

    if (usage.lastOutputTokens != null) {
      html += `<div class="stat"><div class="v">${fmtTokens(usage.lastOutputTokens)}</div><div class="k">last output tokens</div></div>`;
    }

    html += `</div>`;

    if (usage.models?.length) {
      html += `<div class="seclabel">Models used (last turn)</div>` +
        usage.models.map((m) => `<div class="credit" style="background:var(--bg3);border-color:var(--border)"><span>${esc(m.model)} · ${fmtTokens(m.tokens)} tok${m.costUSD != null ? " · $" + m.costUSD.toFixed(3) : ""}</span></div>`).join("");
    }
  }

  html += notificationsSectionHtml();
  openSheet(html);
  lastUsageBar = $("sheetBody").querySelector(".bar > span");
  wireNotifications();
}

// ---------- running-thread tracking ----------
// Re-reading the whole thread is how an external turn "streams", so it has to be
// throttled — an agent mid-turn rewrites its log many times a second.
const EXTERNAL_REFRESH_MS = 1500;
let externalRefreshAt = 0;
let externalRefreshTimer = null;

function scheduleExternalRefresh() {
  if (externalRefreshTimer) { return; }

  const wait = Math.max(0, EXTERNAL_REFRESH_MS - (Date.now() - externalRefreshAt));

  externalRefreshTimer = setTimeout(() => {
    externalRefreshTimer = null;
    externalRefreshAt = Date.now();
    resyncOpenThread();
  }, wait);
}

function runKey(provider, tid) { return (provider || "codex") + ":" + tid; }

function isRunning(provider, tid) { return state.running.has(runKey(provider, tid)); }

function markRunning(provider, tid, on) {
  if (!tid) { return; }

  const k = runKey(provider, tid);
  const had = state.running.has(k);

  if (on) { state.running.add(k); } else { state.running.delete(k); }

  if (had !== on) { updateRowRunning(tid, on); }

  // Keep the open thread's composer state honest if its run-state changed elsewhere.
  if (state.active && (tid === state.active.id || tid === state.active.draftId) && !on && !state.pending.length) {
    setBusy(false);
  }
}

function updateRowRunning(tid, on) {
  const badge = document.querySelector('#rows .row[data-tid="' + (window.CSS?.escape ? CSS.escape(tid) : tid) + '"] .run-badge');

  if (badge) { badge.style.display = on ? "inline-flex" : "none"; }
}

// ---------- auto-sync (focus / reconnect / online) ----------
// Re-fetch whatever's on screen so a backgrounded PWA shows the truth on return
// and recovers any events missed while the stream was dropped.
function resyncView() {
  if (state.active && !state.active.draft) {
    resyncOpenThread();
  } else if (!state.active) {
    loadThreads(false).catch(() => {});
  }
}

async function resyncOpenThread() {
  const t = state.active;

  if (!t || t.draft || state.resyncing) { return; }

  // Don't clobber a turn we're streaming ourselves — its live deltas are truth.
  // An external turn is the opposite case: re-reading is the only way to see it.
  if (state.busy && !state.externalTurn) {
    return;
  }

  // Following along at the bottom should keep following; someone reading back
  // through the transcript should stay where they are.
  const b = box();
  const wasAtBottom = b.scrollHeight - b.scrollTop - b.clientHeight < 120;
  const prevTop = b.scrollTop;

  state.resyncing = true;
  state.fetching = true;

  // Say what's happening while the fetch is in flight — a thread being followed
  // from elsewhere would otherwise just sit there looking stuck.
  if (state.externalTurn) { setLivePill(true, "Loading new messages…"); }

  try {
    const res = await api("/api/thread?id=" + encodeURIComponent(t.id) + "&provider=" + encodeURIComponent(t.provider || "codex"));
    state.items = new Map();
    renderHistory(res.thread, res.itemWindow);
    state.fetching = false;
    setCursor(res);

    if (wasAtBottom) { scrollDown(); } else { b.scrollTop = prevTop; }

    if (isRunning(t.provider, t.id)) {
      setBusy(true, { external: state.externalTurn });
      setLivePill(true, "Running — following live");
    }
  } catch (e) {
    // Unreachable or transient — keep whatever's on screen, but say why it's stale.
    if (e.reach) { setOfflineNote(true, e.reach); }
  } finally {
    state.resyncing = false;
    state.fetching = false;
  }
}

// ---------- events ----------
// EventSource only retries by itself when the *connection* drops. If the server
// answers at all with the wrong status or MIME type — a proxy's 530 error page
// while the Mac is down — the spec calls that a fatal failure: the browser
// closes the stream for good and live updates never return without a reload. So
// we reconnect ourselves, backing off to a minute while the outage lasts.
const SSE_RETRY_MIN_MS = 3000;
const SSE_RETRY_MAX_MS = 60000;
let sseRetryMs = SSE_RETRY_MIN_MS;
let sseRetryTimer = null;
let sse = null;

// Bringing the app forward, or the phone regaining network, is a much better
// hint than the backoff clock — retry at once instead of waiting it out.
function reconnectNow() {
  if (sse && sse.readyState !== EventSource.CLOSED) { return; }

  clearTimeout(sseRetryTimer);
  sseRetryTimer = null;
  sseRetryMs = SSE_RETRY_MIN_MS;
  connectEvents();
}

function scheduleReconnect() {
  if (sseRetryTimer) { return; }

  sseRetryTimer = setTimeout(() => {
    sseRetryTimer = null;
    connectEvents();
  }, sseRetryMs);

  sseRetryMs = Math.min(sseRetryMs * 2, SSE_RETRY_MAX_MS);
}

function connectEvents() {
  const es = new EventSource("/api/events");
  sse = es;
  es.onopen = () => {
    sseRetryMs = SSE_RETRY_MIN_MS;
    $("connDot").classList.add("on");

    // The stream only opens if the Mac is answering, so this is the earliest
    // and most reliable signal that an outage is over.
    setOfflineNote(false);

    // Reconnected after a drop (e.g. resumed from background) — catch up.
    if (state.sseErrored) {
      state.sseErrored = false;
      resyncView();
    }
  };
  es.onerror = () => {
    $("connDot").classList.remove("on");
    state.sseErrored = true;

    // CLOSED means the browser has given up; anything else it retries itself.
    if (es.readyState === EventSource.CLOSED) {
      setOfflineNote(true, navigator.onLine ? "host" : "phone");
      scheduleReconnect();
    }
  };
  es.addEventListener("approval", (e) => {
    const a = JSON.parse(e.data);

    if (a.provider && a.provider !== activeProvider()) { return; }

    if (!a.params?.threadId || (state.active && a.params.threadId === state.active.id)) { showApproval(a); }
  });
  es.addEventListener("notify", (e) => { const { method, params, provider } = JSON.parse(e.data); onNotify(method, params, provider); });

  // A turn this bridge never started — begun in a terminal, an IDE, or on
  // another device. The server watches the CLI's own session file and tells us
  // when it moves; re-reading the thread *is* the stream for those turns.
  es.addEventListener("external", (e) => {
    const { provider, threadId, running, result, ops } = JSON.parse(e.data);
    const open = state.active && (threadId === state.active.id || threadId === state.active.draftId);

    // A turn we started here is the authority on its own state. The session file
    // lags it — at the start of a turn it still holds the *previous* turn's end
    // marker — and acting on that would tear down the live UI mid-stream.
    if (open && state.busy && !state.externalTurn) { return; }

    markRunning(provider, threadId, running);

    if (!open) { return; }

    if (running) { setBusy(true, { external: true }); }

    // The server says explicitly what happened, rather than leaving us to infer
    // it from a missing field — an inference that was quietly doing nothing.
    applyExternalFrame(JSON.parse(e.data));
  });
}

// ---------- init ----------
async function initModels() {
  try {
    const res = await api("/api/models?provider=" + encodeURIComponent(state.provider));
    state.models = res.data ?? [];
    const prefs = loadPrefs();
    const def = state.models.find((m) => m.isDefault) || state.models[0];
    state.model = prefs.model && state.models.some((m) => m.id === prefs.model) ? prefs.model : def?.id ?? null;
    const m = currentModel();
    const efforts = (m?.supportedReasoningEfforts ?? []).map((e) => e.reasoningEffort);
    state.effort = prefs.effort && efforts.includes(prefs.effort) ? prefs.effort : m?.defaultReasoningEffort ?? efforts[0] ?? null;

    if (prefs.modeByProvider) { state.modeByProvider = { ...state.modeByProvider, ...prefs.modeByProvider }; }

    if (prefs.sendMode && SEND_MODES[prefs.sendMode]) { state.sendMode = prefs.sendMode; }

    syncControls();
  } catch {}
}

// wiring
$("backBtn").onclick = backToList;
$("loadMore").onclick = () => loadThreads(true);
$("sendBtn").onclick = send;
$("stopBtn").onclick = stopAgent;
$("okBtn").onclick = () => answerApproval("approve");
$("sessBtn").onclick = () => answerApproval("session");
$("noBtn").onclick = () => answerApproval("deny");
$("modelCtl").onclick = openModelSheet;
$("effortCtl").onclick = openEffortSheet;
$("modeCtl").onclick = openModeSheet;
$("steerCtl").onclick = openSendModeSheet;
$("newBtn").onclick = openNewSheet;
$("usageBtn").onclick = openUsageSheet;
$("diffBtn").onclick = () => openDiffSheet(state.lastDiff || "No diff");
$("filesBtn").onclick = openFilesSheet;
$("providerSeg").querySelectorAll("[data-provider]").forEach((b) => {
  b.onclick = () => switchProvider(b.dataset.provider);
});

$("input").addEventListener("input", function () {
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 120) + "px";
});
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !("ontouchstart" in window)) { e.preventDefault(); send(); }
});
$("search").addEventListener("input", () => {
  clearTimeout(state.searchTimer);
  state.searchTimer = setTimeout(() => loadThreads(false), 350);
});

// Local-path links (see localFileTarget) open in the file viewer instead of
// navigating the browser to a path this server does not serve.
document.addEventListener("click", (e) => {
  const a = e.target.closest?.("a");

  if (!a) { return; }

  const target = localFileTarget(a.getAttribute("href"));

  if (!target) { return; }

  e.preventDefault();
  openFileSheet(target.path, "", target.line);
});

// iOS ignores user-scalable=no, so block the pinch gestures directly: a zoomed
// page lays out wider than the screen and clips the right edge of the chat.
["gesturestart", "gesturechange", "gestureend"].forEach((evt) => {
  document.addEventListener(evt, (e) => e.preventDefault(), { passive: false });
});

document.addEventListener("touchmove", (e) => {
  if (e.touches.length > 1) { e.preventDefault(); }
}, { passive: false });

// Auto-sync: when the app returns to the foreground (or the network comes back),
// re-fetch what's on screen so a home-screen PWA never shows stale state.
document.addEventListener("visibilitychange", () => {
  sendPresence();

  if (!document.hidden) { reconnectNow(); resyncView(); }
});

// Heartbeat so a long read keeps suppressing, and the report expires if we die.
setInterval(() => {
  if (!document.hidden && state.active) { sendPresence(); }
}, 30000);
window.addEventListener("online", () => { setOfflineNote(false); reconnectNow(); resyncView(); });
window.addEventListener("offline", () => setOfflineNote(true, "phone"));

function initProvider() {
  const prefs = loadPrefs();

  if (prefs.provider && PROVIDER_LABELS[prefs.provider]) { state.provider = prefs.provider; }

  $("providerSeg").querySelectorAll("[data-provider]").forEach((b) => b.classList.toggle("on", b.dataset.provider === state.provider));
  $("hTitle").textContent = providerLabel() + " Sessions";
}

// Register the service worker for instant launch + offline app shell.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch(() => {});
  });
}

initProvider();
connectEvents();
initModels();
loadThreads(false).then(() => openLinkedThread().catch(() => {}));
</script>
</body>
